# Dormant source definition for a separately reviewed ordinary-worker enablement.
# The deployed compose invocation does not include this file.
services:
  launchplane-ordinary-agent-workers:
    image: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
    pull_policy: always
    restart: unless-stopped
    profiles:
      - ordinary-agent-workers
    depends_on:
      launchplane:
        condition: service_healthy
    env_file:
      - .env
    command:
      - /app/scripts/start-launchplane-ordinary-agent-workers.sh
    environment:
      DOCKER_IMAGE_REFERENCE: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
      LAUNCHPLANE_STATE_DIR: /app/runtime
    volumes:
      - launchplane-runtime:/app/runtime
    networks:
      - default
      - launchplane-external-network

