services:
  launchplane:
    image: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      launchplane-browser:
        condition: service_healthy
    # LAUNCHPLANE_DATABASE_URL reaches startup through .env, never command arguments.
    env_file:
      - .env
    command:
      - /app/scripts/start-launchplane-service.sh
    environment:
      DOCKER_IMAGE_REFERENCE: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
      LAUNCHPLANE_SERVICE_AUDIENCE: ${LAUNCHPLANE_SERVICE_AUDIENCE:-localhost}
      LAUNCHPLANE_SERVICE_HOST: 0.0.0.0
      LAUNCHPLANE_SERVICE_PORT: 8080
      LAUNCHPLANE_STATE_DIR: /app/runtime
      LAUNCHPLANE_BROWSER_WS_ENDPOINT: ws://launchplane-browser:3000/
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import os
          import urllib.request

          port = os.environ.get("LAUNCHPLANE_SERVICE_PORT", "8080")
          with urllib.request.urlopen(f"http://127.0.0.1:{port}/v1/health", timeout=5) as response:
              payload = json.load(response)
          raise SystemExit(0 if payload.get("status") == "ok" else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - launchplane-runtime:/app/runtime
    networks:
      - default
      - launchplane-external-network
      - launchplane-browser-network

  launchplane-browser:
    image: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: launchplane-browser
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # No env_file, credential source, runtime volume, host socket or published port.
    environment:
      HOME: /tmp
    command:
      - /app/.venv/bin/playwright
      - run-server
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import socket; socket.create_connection(("127.0.0.1", 3000), timeout=3).close()'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - launchplane-browser-network

  launchplane-odoo-workers:
    image: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
    pull_policy: always
    restart: unless-stopped
    labels:
      launchplane.release-worker: "true"
    depends_on:
      launchplane:
        condition: service_healthy
    env_file:
      - .env
    command:
      - /app/scripts/start-launchplane-odoo-workers.sh
    environment:
      DOCKER_IMAGE_REFERENCE: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
      LAUNCHPLANE_STATE_DIR: /app/runtime
    volumes:
      - launchplane-runtime:/app/runtime
    networks:
      - default
      - launchplane-external-network

  launchplane-verireel-workers:
    image: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
    pull_policy: always
    restart: unless-stopped
    # Shared production captures may run for two hours; SIGTERM drains the admitted capture.
    stop_grace_period: 125m
    labels:
      launchplane.release-worker: "true"
    depends_on:
      launchplane:
        condition: service_healthy
    env_file:
      - .env
    command:
      - /app/scripts/start-launchplane-verireel-workers.sh
    environment:
      DOCKER_IMAGE_REFERENCE: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
      LAUNCHPLANE_STATE_DIR: /app/runtime
    volumes:
      - launchplane-runtime:/app/runtime
    networks:
      - default
      - launchplane-external-network

  launchplane-merge-train-workers:
    image: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
    pull_policy: always
    restart: unless-stopped
    # A stop finishes the target in progress; killing a landing midway wedges the train.
    stop_grace_period: 5m
    depends_on:
      launchplane:
        condition: service_healthy
    env_file:
      - .env
    command:
      - /app/scripts/start-launchplane-merge-train-workers.sh
    environment:
      DOCKER_IMAGE_REFERENCE: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
      LAUNCHPLANE_STATE_DIR: /app/runtime
    volumes:
      - launchplane-runtime:/app/runtime
    networks:
      - default
      - launchplane-external-network

  launchplane-privileged-operation-workers:
    image: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      launchplane:
        condition: service_healthy
    env_file:
      - .env
    command:
      - /app/scripts/start-launchplane-privileged-operation-workers.sh
    environment:
      DOCKER_IMAGE_REFERENCE: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
      LAUNCHPLANE_STATE_DIR: /app/runtime
    volumes:
      - launchplane-runtime:/app/runtime
    networks:
      - default
      - launchplane-external-network

  launchplane-ordinary-agent-workers:
    image: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 5m
    deploy:
      replicas: ${LAUNCHPLANE_ORDINARY_AGENT_WORKER_REPLICAS:-0}
    depends_on:
      launchplane:
        condition: service_healthy
    env_file:
      - .env
    command:
      - /app/scripts/start-launchplane-ordinary-agent-workers.sh
    environment:
      DOCKER_IMAGE_REFERENCE: ${DOCKER_IMAGE_REFERENCE:-launchplane:local}
      LAUNCHPLANE_STATE_DIR: /app/runtime
    volumes:
      - launchplane-runtime:/app/runtime
    networks:
      - default
      - launchplane-external-network

networks:
  launchplane-browser-network: {}
  launchplane-external-network:
    name: ${LAUNCHPLANE_COMPOSE_EXTERNAL_NETWORK:?Missing LAUNCHPLANE_COMPOSE_EXTERNAL_NETWORK}
    external: true

volumes:
  launchplane-runtime: {}
