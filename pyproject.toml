[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "launchplane"
version = "0.1.0"
description = "Launchplane control-plane contracts and workflows for deployment truth and promotion"
requires-python = ">=3.13"
dependencies = [
    "Authlib>=1.7.2",
    "click>=8.4.2",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.13.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
    "alembic>=1.19.1",
]

[project.optional-dependencies]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx2>=2.10.0",
    "mypy>=2.3.0",
    "ruff>=0.16.2",
]

[project.scripts]
launchplane = "control_plane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true
