---
name: Odoo Driver Route Smoke

"on":
  workflow_call:
    inputs:
      product:
        description: Launchplane product profile key to smoke.
        required: true
        type: string
      context:
        description: Launchplane Odoo context to smoke.
        required: true
        type: string
      instance:
        description: Odoo instance whose publish inputs should resolve.
        required: true
        type: string
      source_git_ref:
        description: Source ref attached to the smoke request.
        required: true
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      product:
        description: Launchplane product profile key to smoke.
        required: true
        type: string
      context:
        description: Launchplane Odoo context to smoke.
        required: true
        type: string
      instance:
        description: Odoo instance whose publish inputs should resolve.
        required: true
        type: string
      source_git_ref:
        description: Source ref attached to the smoke request.
        required: true
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    launchplane-odoo-driver-route-smoke-${{ inputs.product }}-${{
    inputs.context }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  route-smoke:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      LAUNCHPLANE_URL: >-
        ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_AUDIENCE: ${{ inputs.launchplane_audience }}
      PRODUCT: ${{ inputs.product }}
      CONTEXT_NAME: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      SOURCE_GIT_REF: ${{ inputs.source_git_ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Check public route registration
        env:
          ROUTE_PATHS: >-
            /v1/drivers/odoo/artifact-publish-inputs
            /v1/drivers/odoo/preview-apply-inputs
            /v1/drivers/odoo/preview-apply
            /v1/previews/pr-feedback
        run: |
          set -euo pipefail
          if [ -z "$LAUNCHPLANE_URL" ]; then
            echo "LAUNCHPLANE_PUBLIC_URL or launchplane_url is required." >&2
            exit 1
          fi

          registration_results_file="odoo-driver-route-smoke-registration.jsonl"
          : > "$registration_results_file"
          for route_path in $ROUTE_PATHS; do
            route_slug="${route_path//\//-}"
            response_file="$RUNNER_TEMP/route-smoke-${GITHUB_RUN_ID}"
            response_file="${response_file}-${GITHUB_RUN_ATTEMPT}-${route_slug}.json"
            status_code="$(curl -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H 'content-type: application/json' \
              --data '{"schema_version":1}' \
              "${LAUNCHPLANE_URL%/}${route_path}" || true)"
            if [ -z "$status_code" ] || [ "$status_code" = "000" ]; then
              status_code="curl_failed"
            fi
            echo "${route_path} returned HTTP ${status_code}"
            error_code="$(jq -r '.error.code // ""' "$response_file" 2>/dev/null || true)"
            trace_id="$(jq -r '.trace_id // ""' "$response_file" 2>/dev/null || true)"
            ok="true"
            if [ "$status_code" = "curl_failed" ] \
              || [ "$status_code" = "404" ] \
              || { [ "$status_code" != "curl_failed" ] && [ "$status_code" -ge 500 ]; }; then
              ok="false"
            fi
            jq -cn \
              --arg route_path "$route_path" \
              --arg status_code "$status_code" \
              --arg error_code "$error_code" \
              --arg trace_id "$trace_id" \
              --arg ok "$ok" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              '{
                route_path: $route_path,
                method: "POST",
                caller: "public-registration-probe",
                http_status: $status_code,
                error_code: $error_code,
                trace_id: $trace_id,
                expected: "not 404 and not 5xx",
                ok: ($ok == "true"),
                run_id: $run_id,
                run_attempt: $run_attempt
              }' | tee -a "$registration_results_file"
            if [ "$status_code" = "curl_failed" ]; then
              echo "${route_path} could not be reached on Launchplane." >&2
              exit 1
            fi
            if [ "$status_code" = "404" ]; then
              echo "${route_path} is not registered on Launchplane." >&2
              cat "$response_file" >&2
              exit 1
            fi
            if [ "$status_code" -ge 500 ]; then
              echo "${route_path} returned a Launchplane service error." >&2
              cat "$response_file" >&2
              exit 1
            fi
          done

      - name: Resolve Odoo artifact publish inputs through GitHub OIDC
        id: publish_inputs
        uses: ./.github/actions/launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ env.LAUNCHPLANE_AUDIENCE }}
          route-path: /v1/drivers/odoo/artifact-publish-inputs
          payload: >-
            {"schema_version":1,"inputs":{"schema_version":1}}
          payload-fields: |-
            product=${{ env.PRODUCT }}
            inputs.context=${{ env.CONTEXT_NAME }}
            inputs.instance=${{ env.INSTANCE }}
            inputs.source_git_ref=${{ env.SOURCE_GIT_REF }}
          idempotency-key: >-
            odoo-driver-route-smoke:${{ env.PRODUCT }}:${{
            env.CONTEXT_NAME }}:${{ env.INSTANCE }}:run-${{
            github.run_id }}-attempt-${{ github.run_attempt }}
          timeout-ms: "600000"
          output-paths: >-
            trace_id=trace_id,
            preview_slug=result.preview_slug,
            source_repository=result.repository,
            image_repository=result.image_repository,
            image_tag=result.image_tag,
            error_message=result.error_message

      - name: Render authenticated Odoo route probe payloads
        id: route_probes
        shell: bash
        env:
          PRODUCT_REPOSITORY: ${{ steps.publish_inputs.outputs.source_repository }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCT_REPOSITORY" ]; then
            echo "Artifact publish inputs did not include the product repository." >&2
            exit 1
          fi

          probe_dir="$RUNNER_TEMP/odoo-driver-route-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$probe_dir"

          preview_apply_inputs_payload="$probe_dir/preview-apply-inputs-payload.json"
          preview_apply_payload="$probe_dir/preview-apply-payload.json"
          preview_pr_feedback_payload="$probe_dir/preview-pr-feedback-payload.json"
          preview_apply_inputs_response="$probe_dir/preview-apply-inputs-response.json"
          preview_apply_response="$probe_dir/preview-apply-response.json"
          preview_pr_feedback_response="$probe_dir/preview-pr-feedback-response.json"

          jq -n \
            --arg product "$PRODUCT" \
            --arg source_git_ref "$SOURCE_GIT_REF" \
            '{
              schema_version: 1,
              product: $product,
              inputs: {
                schema_version: 1,
                product: $product,
                operation: "destroy",
                pr_number: 1,
                source_git_ref: $source_git_ref
              }
            }' > "$preview_apply_inputs_payload"
          jq -n \
            --arg product "$PRODUCT" \
            --arg product_repository "$PRODUCT_REPOSITORY" \
            '{
              schema_version: 1,
              product: $product,
              apply: {
                dry_run_plan: {
                  status: "blocked",
                  operation: "destroy",
                  product: $product,
                  repository: $product_repository,
                  preview_slug: "route-smoke",
                  preview_url: "",
                  domain_host: "",
                  compose_ref: "route-smoke",
                  compose_name: "route-smoke",
                  blockers: [
                    {
                      code: "runtime_plan_not_ready",
                      message: "Route smoke intentionally blocks apply."
                    }
                  ],
                  summary: "route smoke only"
                },
                wait_for_deploy: false,
                smoke_check: false
              }
            }' > "$preview_apply_payload"
          jq -n \
            --arg product "$PRODUCT" \
            --arg context_name "$CONTEXT_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{
              schema_version: 1,
              product: $product,
              context: $context_name,
              source: "odoo-driver-route-smoke",
              repository: $repository,
              anchor_repo: $repository,
              anchor_pr_number: 1,
              anchor_pr_url: ("https://github.com/" + $repository + "/pull/1"),
              status: "unsupported",
              failure_summary: "route smoke only",
              dry_run: true
            }' > "$preview_pr_feedback_payload"

          {
            echo "preview_apply_inputs_payload=$preview_apply_inputs_payload"
            echo "preview_apply_payload=$preview_apply_payload"
            echo "preview_pr_feedback_payload=$preview_pr_feedback_payload"
            echo "preview_apply_inputs_response=$preview_apply_inputs_response"
            echo "preview_apply_response=$preview_apply_response"
            echo "preview_pr_feedback_response=$preview_pr_feedback_response"
          } >> "$GITHUB_OUTPUT"

      - name: Probe Odoo preview apply inputs route
        id: preview_apply_inputs_probe
        continue-on-error: true
        uses: ./.github/actions/launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ env.LAUNCHPLANE_AUDIENCE }}
          route-path: /v1/drivers/odoo/preview-apply-inputs
          payload-file: ${{ steps.route_probes.outputs.preview_apply_inputs_payload }}
          idempotency-key: >-
            odoo-driver-route-smoke:preview-apply-inputs:${{
            github.run_id }}:${{ github.run_attempt }}
          expected-status: 202,403,503
          timeout-ms: "30000"
          response-output-file: ${{ steps.route_probes.outputs.preview_apply_inputs_response }}
          log-response-body: "false"

      - name: Probe Odoo preview apply route
        id: preview_apply_probe
        continue-on-error: true
        uses: ./.github/actions/launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ env.LAUNCHPLANE_AUDIENCE }}
          route-path: /v1/drivers/odoo/preview-apply
          payload-file: ${{ steps.route_probes.outputs.preview_apply_payload }}
          idempotency-key: >-
            odoo-driver-route-smoke:preview-apply:${{
            github.run_id }}:${{ github.run_attempt }}
          expected-status: 202,403,503
          timeout-ms: "30000"
          response-output-file: ${{ steps.route_probes.outputs.preview_apply_response }}
          log-response-body: "false"

      - name: Probe preview PR feedback route
        id: preview_pr_feedback_probe
        continue-on-error: true
        uses: ./.github/actions/launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ env.LAUNCHPLANE_AUDIENCE }}
          route-path: /v1/previews/pr-feedback
          payload-file: ${{ steps.route_probes.outputs.preview_pr_feedback_payload }}
          idempotency-key: >-
            odoo-driver-route-smoke:preview-pr-feedback:${{
            github.run_id }}:${{ github.run_attempt }}
          expected-status: "202"
          timeout-ms: "30000"
          response-output-file: ${{ steps.route_probes.outputs.preview_pr_feedback_response }}
          log-response-body: "false"

      - name: Classify authenticated Odoo route responses
        if: always()
        shell: bash
        env:
          PREVIEW_APPLY_INPUTS_STATUS: ${{ steps.preview_apply_inputs_probe.outputs.status-code }}
          PREVIEW_APPLY_INPUTS_RESPONSE: ${{ steps.route_probes.outputs.preview_apply_inputs_response }}
          PREVIEW_APPLY_INPUTS_OUTCOME: ${{ steps.preview_apply_inputs_probe.outcome }}
          PREVIEW_APPLY_STATUS: ${{ steps.preview_apply_probe.outputs.status-code }}
          PREVIEW_APPLY_RESPONSE: ${{ steps.route_probes.outputs.preview_apply_response }}
          PREVIEW_APPLY_OUTCOME: ${{ steps.preview_apply_probe.outcome }}
          PREVIEW_PR_FEEDBACK_STATUS: ${{ steps.preview_pr_feedback_probe.outputs.status-code }}
          PREVIEW_PR_FEEDBACK_RESPONSE: ${{ steps.route_probes.outputs.preview_pr_feedback_response }}
          PREVIEW_PR_FEEDBACK_OUTCOME: ${{ steps.preview_pr_feedback_probe.outcome }}
        run: |
          set -euo pipefail

          results_file="odoo-driver-route-smoke-results.jsonl"
          : > "$results_file"

          append_result() {
            local route_path="$1"
            local classification="$2"
            local status_code="$3"
            local response_file="$4"
            local error_code trace_id

            if [ -z "$status_code" ]; then
              status_code="action_failed"
            fi
            if [ -n "$response_file" ] && [ -f "$response_file" ]; then
              error_code="$(jq -r '.error.code // ""' "$response_file" 2>/dev/null || true)"
              trace_id="$(jq -r '.trace_id // ""' "$response_file" 2>/dev/null || true)"
            else
              error_code=""
              trace_id=""
            fi
            jq -n \
              --arg route_path "$route_path" \
              --arg classification "$classification" \
              --arg status_code "$status_code" \
              --arg error_code "$error_code" \
              --arg trace_id "$trace_id" \
              '{route_path:$route_path, classification:$classification, http_status:$status_code, error_code:$error_code, trace_id:$trace_id}' \
              | tee -a "$results_file"
          }

          append_result \
            /v1/drivers/odoo/preview-apply-inputs \
            preview-apply-inputs \
            "$PREVIEW_APPLY_INPUTS_STATUS" \
            "$PREVIEW_APPLY_INPUTS_RESPONSE"
          append_result \
            /v1/drivers/odoo/preview-apply \
            preview-apply \
            "$PREVIEW_APPLY_STATUS" \
            "$PREVIEW_APPLY_RESPONSE"
          append_result \
            /v1/previews/pr-feedback \
            preview-pr-feedback \
            "$PREVIEW_PR_FEEDBACK_STATUS" \
            "$PREVIEW_PR_FEEDBACK_RESPONSE"

          probe_failed="false"
          if [ "${PREVIEW_APPLY_INPUTS_OUTCOME:-failure}" != "success" ] \
            || [ "${PREVIEW_APPLY_OUTCOME:-failure}" != "success" ] \
            || [ "${PREVIEW_PR_FEEDBACK_OUTCOME:-failure}" != "success" ]; then
            probe_failed="true"
          fi

          if [ "$PREVIEW_APPLY_STATUS" = "202" ] \
            && [ -f "$PREVIEW_APPLY_RESPONSE" ] \
            && [ "$(jq -r '.result.status // ""' "$PREVIEW_APPLY_RESPONSE" 2>/dev/null || true)" != "blocked" ]; then
            echo "/v1/drivers/odoo/preview-apply accepted a non-blocked apply probe." >&2
            cat "$PREVIEW_APPLY_RESPONSE" >&2
            exit 1
          fi
          if [ "$PREVIEW_PR_FEEDBACK_STATUS" = "202" ] \
            && [ -f "$PREVIEW_PR_FEEDBACK_RESPONSE" ] \
            && { [ "$(jq -r '.result.dry_run // false' "$PREVIEW_PR_FEEDBACK_RESPONSE" 2>/dev/null || true)" != "true" ] \
              || [ "$(jq -r '.result.preview_pr_feedback // ""' "$PREVIEW_PR_FEEDBACK_RESPONSE" 2>/dev/null || true)" != "authorized" ]; }; then
            echo "/v1/previews/pr-feedback accepted a non-dry-run feedback probe." >&2
            cat "$PREVIEW_PR_FEEDBACK_RESPONSE" >&2
            exit 1
          fi
          if [ "$probe_failed" = "true" ]; then
            echo "One or more authenticated Odoo route probes failed; preserved structured evidence in ${results_file}." >&2
            exit 1
          fi

      - name: Report route smoke
        env:
          TRACE_ID: ${{ steps.publish_inputs.outputs.trace_id }}
          PREVIEW_SLUG: ${{ steps.publish_inputs.outputs.preview_slug }}
          SOURCE_REPOSITORY: ${{ steps.publish_inputs.outputs.source_repository }}
          IMAGE_REPOSITORY: ${{ steps.publish_inputs.outputs.image_repository }}
          IMAGE_TAG: ${{ steps.publish_inputs.outputs.image_tag }}
          ERROR_MESSAGE: ${{ steps.publish_inputs.outputs.error_message }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_REPOSITORY" ] || [ -z "$IMAGE_TAG" ]; then
            echo "Publish inputs did not include image outputs." >&2
            if [ -n "$ERROR_MESSAGE" ]; then
              echo "$ERROR_MESSAGE" >&2
            fi
            exit 1
          fi
          echo "trace_id=$TRACE_ID"
          echo "preview_slug=$PREVIEW_SLUG"
          echo "source_repository=$SOURCE_REPOSITORY"
          echo "image_repository=$IMAGE_REPOSITORY"
          echo "image_tag=$IMAGE_TAG"
          if [ -f odoo-driver-route-smoke-results.jsonl ]; then
            cat odoo-driver-route-smoke-results.jsonl
          fi
          if [ -f odoo-driver-route-smoke-registration.jsonl ]; then
            cat odoo-driver-route-smoke-registration.jsonl
          fi

      - name: Upload route smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            odoo-driver-route-smoke-${{ inputs.product }}-${{
            inputs.context }}-${{ inputs.instance }}
          path: |
            odoo-driver-route-smoke-registration.jsonl
            odoo-driver-route-smoke-results.jsonl
          if-no-files-found: error

      - name: Summarize route smoke evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Odoo driver route smoke"
            echo
            echo "- Product: $PRODUCT"
            echo "- Context: $CONTEXT_NAME"
            echo "- Instance: $INSTANCE"
            echo "- Evidence artifact: odoo-driver-route-smoke-${PRODUCT}-${CONTEXT_NAME}-${INSTANCE}"
            echo
            if [ -f odoo-driver-route-smoke-registration.jsonl ]; then
              echo "### Public registration probes"
              jq -r '"- \(.method) \(.route_path): HTTP \(.http_status) ok=\(.ok) trace=\(.trace_id)"' \
                odoo-driver-route-smoke-registration.jsonl
              echo
            fi
            if [ -f odoo-driver-route-smoke-results.jsonl ]; then
              echo "### Authenticated route probes"
              jq -r '"- \(.classification) \(.route_path): HTTP \(.http_status) error=\(.error_code) trace=\(.trace_id)"' \
                odoo-driver-route-smoke-results.jsonl
            fi
          } >> "$GITHUB_STEP_SUMMARY"
