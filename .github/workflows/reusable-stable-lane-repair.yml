---
name: Reusable Stable Lane Repair

"on":
  workflow_call:
    inputs:
      mode:
        description: Review (dry-run) or apply the stable-lane repair.
        required: true
        type: string
      product:
        description: Existing generic-web product profile key.
        required: true
        type: string
      context:
        description: Existing stable context owned by another lane of the product.
        required: true
        type: string
      instance:
        description: Missing stable lane instance to restore.
        required: true
        type: string
      base_url:
        description: HTTPS origin selected from the tracked Dokploy target domains.
        required: true
        type: string
      reviewed_plan_sha256:
        description: Reviewed dry-run plan SHA-256; required for apply.
        required: false
        default: ""
        type: string
      confirmation:
        description: Exact phrase APPLY PRODUCT STABLE LANE REPAIR; required for apply.
        required: false
        default: ""
        type: string
      reason:
        description: Operator reason recorded with the request.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: launchplane-authz-admin
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      MODE: ${{ inputs.mode }}
      PRODUCT: ${{ inputs.product }}
      CONTEXT: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      BASE_URL: ${{ inputs.base_url }}
      REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Validate stable-lane repair request
        shell: bash
        run: |
          set -euo pipefail
          for required in PRODUCT CONTEXT INSTANCE BASE_URL REASON; do
            if [[ -z "${!required//[[:space:]]/}" ]]; then
              echo "${required} is required for stable-lane repair." >&2
              exit 1
            fi
          done
          case "$MODE" in
            dry-run)
              if [[ -n "${REVIEWED_PLAN_SHA256//[[:space:]]/}" ]]; then
                echo "reviewed_plan_sha256 must be empty for dry-run." >&2
                exit 1
              fi
              ;;
            apply)
              if [ "$CONFIRMATION" != "APPLY PRODUCT STABLE LANE REPAIR" ]; then
                echo "Type APPLY PRODUCT STABLE LANE REPAIR for apply mode." >&2
                exit 1
              fi
              if ! [[ "$REVIEWED_PLAN_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
                echo "apply requires the reviewed dry-run plan SHA-256." >&2
                exit 1
              fi
              ;;
            *)
              echo "mode must be dry-run or apply." >&2
              exit 1
              ;;
          esac

      - name: Build stable-lane repair request
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          request_file="${RUNNER_TEMP}/stable-lane-repair-request.json"
          jq -n \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT" \
            --arg instance "$INSTANCE" \
            --arg base_url "$BASE_URL" \
            --arg mode "$MODE" \
            --arg reason "$REASON" \
            --arg reviewed_plan_sha256 "$REVIEWED_PLAN_SHA256" \
            '{
              schema_version: 1,
              product: $product,
              context: $context,
              instance: $instance,
              base_url: $base_url,
              mode: $mode,
              reason: $reason,
              reviewed_plan_sha256: $reviewed_plan_sha256
            }' > "$request_file"
          idempotency_key=""
          if [ "$MODE" = "apply" ]; then
            idempotency_key="product-stable-lane-repair:${PRODUCT}:${CONTEXT}:${INSTANCE}:${REVIEWED_PLAN_SHA256}"
          fi
          {
            echo "idempotency_key=$idempotency_key"
            echo "request_file=$request_file"
          } >> "$GITHUB_OUTPUT"

      - name: Request stable-lane repair
        id: repair_request
        uses: cbusillo/launchplane/.github/actions/launchplane-request@ba9180e88cc58794e28c8b5243acc5d8a049951e # launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/product-profiles/stable-lane-repair/apply
          payload-file: ${{ steps.repair.outputs.request_file }}
          idempotency-key: ${{ steps.repair.outputs.idempotency_key }}
          fail-result-paths: ""
          response-output-file: stable-lane-repair.json
          log-response-body: "false"

      - name: Check stable-lane repair response
        shell: bash
        env:
          STATUS_CODE: ${{ steps.repair_request.outputs.status-code }}
        run: |
          set -euo pipefail
          if [ "$STATUS_CODE" != "202" ]; then
            jq '{status, trace_id, error}' stable-lane-repair.json >&2 || true
            echo "Stable-lane repair failed with HTTP ${STATUS_CODE}." >&2
            exit 1
          fi
          jq . stable-lane-repair.json

      - name: Upload stable-lane repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-lane-repair-result
          path: stable-lane-repair.json
          if-no-files-found: warn

      - name: Summarize stable-lane repair
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Stable-lane repair"
            echo
            echo "- Mode: ${MODE}"
            echo "- Product: ${PRODUCT}"
            echo "- Lane: ${CONTEXT}/${INSTANCE}"
            echo "- Evidence artifact: stable-lane-repair-result"
            if [ -f stable-lane-repair.json ]; then
              echo "- Status: $(jq -r '.status // "unknown"' stable-lane-repair.json)"
              echo "- Trace: $(jq -r '.trace_id // ""' stable-lane-repair.json)"
              echo "- Changed: $(jq -r '.result.changed // false' stable-lane-repair.json)"
              echo "- Applied: $(jq -r '.result.applied // false' stable-lane-repair.json)"
              echo "- Plan SHA-256: $(jq -r '.result.plan_sha256 // ""' stable-lane-repair.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
