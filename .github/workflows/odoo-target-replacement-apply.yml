---
name: Odoo Target Replacement Apply

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      instance:
        description: Stable Odoo instance to recreate in place.
        required: true
        default: testing
        type: choice
        options:
          - testing
          - prod
      strategy:
        description: Replacement strategy to apply.
        required: true
        default: recreate-in-place
        type: choice
        options:
          - recreate-in-place
      artifact_id:
        description: >-
          Optional stored Launchplane artifact ID to deploy instead of the
          current inventory artifact.
        required: false
        default: ""
        type: string
      source_git_ref:
        description: >-
          Required when artifact_id is set; must match the stored artifact
          manifest source commit.
        required: false
        default: ""
        type: string
      allow_empty_data:
        description: >-
          Allow missing volume env keys for intentionally empty targets.
        required: true
        default: false
        type: boolean
      data_source_mode:
        description: Prelaunch rebuild data authority for resettable targets.
        required: true
        default: existing
        type: choice
        options:
          - existing
          - empty
          - upstream_restore
      confirmation:
        description: Confirmation phrase for lane prelaunch rebuild policy.
        required: false
        default: ""
        type: string
      verify_health:
        description: Verify the Odoo health endpoint after deploy.
        required: true
        default: true
        type: boolean
      verify_canonical:
        description: Verify the stable URL canonical page after deploy.
        required: true
        default: true
        type: boolean
      verify_logo:
        description: Verify the Odoo logo route after deploy.
        required: true
        default: true
        type: boolean
      no_cache:
        description: Ask Dokploy to rebuild without cache.
        required: true
        default: false
        type: boolean
      timeout_seconds:
        description: Optional Dokploy deploy timeout override in seconds.
        required: false
        default: ""
        type: string
      health_timeout_seconds:
        description: Optional health/canonical/logo timeout override in seconds.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    odoo-target-replacement-apply-${{ inputs.product }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      PRODUCT: ${{ inputs.product }}
      INSTANCE: ${{ inputs.instance }}
      STRATEGY: ${{ inputs.strategy }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      SOURCE_GIT_REF: ${{ inputs.source_git_ref }}
      ALLOW_EMPTY_DATA: ${{ inputs.allow_empty_data }}
      DATA_SOURCE_MODE: ${{ inputs.data_source_mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      VERIFY_HEALTH: ${{ inputs.verify_health }}
      VERIFY_CANONICAL: ${{ inputs.verify_canonical }}
      VERIFY_LOGO: ${{ inputs.verify_logo }}
      NO_CACHE: ${{ inputs.no_cache }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      HEALTH_TIMEOUT_SECONDS: ${{ inputs.health_timeout_seconds }}
      LAUNCHPLANE_SERVICE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_SERVICE_AUDIENCE: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
      POLL_INTERVAL_SECONDS: "15"
      POLL_TIMEOUT_SECONDS: "3600"
    steps:
      - name: Validate runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${INSTANCE:?Missing instance input}"
          : "${STRATEGY:?Missing strategy input}"
          if [ "$STRATEGY" != "recreate-in-place" ]; then
            echo 'Only recreate-in-place is currently supported.' >&2
            exit 1
          fi
          for value in \
            "$ALLOW_EMPTY_DATA" \
            "$VERIFY_HEALTH" \
            "$VERIFY_CANONICAL" \
            "$VERIFY_LOGO" \
            "$NO_CACHE"; do
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "Boolean input resolved to invalid value: ${value}" >&2
              exit 1
            fi
          done
          if [ -z "${LAUNCHPLANE_SERVICE_URL:-}" ]; then
            echo \
              'Missing Launchplane service URL variable.' \
              >&2
            exit 1
          fi
          if [ -z "${LAUNCHPLANE_SERVICE_AUDIENCE:-}" ]; then
            LAUNCHPLANE_SERVICE_AUDIENCE="$({
              python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["LAUNCHPLANE_SERVICE_URL"].strip())
          if not parsed.hostname:
              raise SystemExit("LAUNCHPLANE_SERVICE_URL must include a hostname.")
          print(parsed.hostname)
          PY
            })"
          fi
          echo "LAUNCHPLANE_SERVICE_AUDIENCE=${LAUNCHPLANE_SERVICE_AUDIENCE}" >>"$GITHUB_ENV"

      - name: Create and poll replacement operation
        shell: bash
        run: |
          set -euo pipefail
          launchplane_oidc_token() {
            token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${token_url}&audience=${LAUNCHPLANE_SERVICE_AUDIENCE}" \
            | jq -r '.value'
          }
          payload="$({
            jq -n \
              --arg product "$PRODUCT" \
              --arg instance "$INSTANCE" \
              --arg strategy "$STRATEGY" \
              --arg artifact_id "$ARTIFACT_ID" \
              --arg source_git_ref "$SOURCE_GIT_REF" \
              --arg data_source_mode "$DATA_SOURCE_MODE" \
              --arg confirmation "$CONFIRMATION" \
              --argjson allow_empty_data "$ALLOW_EMPTY_DATA" \
              --argjson verify_health "$VERIFY_HEALTH" \
              --argjson verify_canonical "$VERIFY_CANONICAL" \
              --argjson verify_logo "$VERIFY_LOGO" \
              --argjson no_cache "$NO_CACHE" \
              '{
                schema_version: 1,
                product: $product,
                replacement: {
                  schema_version: 1,
                  product: $product,
                  instance: $instance,
                  strategy: $strategy,
                  artifact_id: $artifact_id,
                  source_git_ref: $source_git_ref,
                  allow_empty_data: $allow_empty_data,
                  data_source_mode: $data_source_mode,
                  confirmation: $confirmation,
                  verify_health: $verify_health,
                  verify_canonical: $verify_canonical,
                  verify_logo: $verify_logo,
                  no_cache: $no_cache
                }
              }'
          })"
          if [ -n "${TIMEOUT_SECONDS:-}" ]; then
            payload="$({
              jq \
                --argjson timeout_seconds "$TIMEOUT_SECONDS" \
                '.replacement.timeout_seconds = $timeout_seconds' \
                <<<"$payload"
            })"
          fi
          if [ -n "${HEALTH_TIMEOUT_SECONDS:-}" ]; then
            payload="$({
              filter='.replacement.health_timeout_seconds = '
              filter="${filter}\$health_timeout_seconds"
              jq \
                --argjson health_timeout_seconds "$HEALTH_TIMEOUT_SECONDS" \
                "$filter" \
                <<<"$payload"
            })"
          fi
          idempotency_key="$({
            printf '%s' \
              "odoo-target-replacement-apply:${PRODUCT}:${INSTANCE}:" \
              "${STRATEGY}:${ARTIFACT_ID}:${SOURCE_GIT_REF}:" \
              "${ALLOW_EMPTY_DATA}:${DATA_SOURCE_MODE}:${CONFIRMATION}:" \
              "${VERIFY_HEALTH}:${VERIFY_CANONICAL}:${VERIFY_LOGO}:" \
              "${NO_CACHE}:${GITHUB_RUN_ID}:" \
              "${GITHUB_RUN_ATTEMPT}"
          })"
          route="${LAUNCHPLANE_SERVICE_URL}/v1/drivers/odoo"
          oidc_token="$(launchplane_oidc_token)"
          status_code="$({
            curl -sS \
              -o odoo-target-replacement-apply.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: ${idempotency_key}" \
              --data "$payload" \
              "${route}/target-replacement-apply"
          })"
          if [ "$status_code" != "202" ]; then
            echo 'Odoo target replacement operation create failed:' \
              "${status_code}." >&2
            cat odoo-target-replacement-apply.json >&2
            exit 1
          fi
          jq . odoo-target-replacement-apply.json
          poll_url="$(
            jq -r \
              '.result.poll_url // empty' \
              odoo-target-replacement-apply.json
          )"
          operation_id="$({
            jq -r \
              '.records.odoo_stable_target_replacement_operation_id //
               .result.operation_id //
               empty' \
              odoo-target-replacement-apply.json
          })"
          if [ -z "$poll_url" ] || [ -z "$operation_id" ]; then
            echo 'Odoo target replacement response missing poll metadata.' >&2
            jq . odoo-target-replacement-apply.json >&2
            exit 1
          fi
          deadline=$((SECONDS + POLL_TIMEOUT_SECONDS))
          parsed_response="$(mktemp)"
          while true; do
            oidc_token="$(launchplane_oidc_token)"
            status_code="$({
              curl -sS \
                -o odoo-target-replacement-apply.json \
                -w '%{http_code}' \
                -H "Authorization: Bearer ${oidc_token}" \
                "${LAUNCHPLANE_SERVICE_URL}${poll_url}"
            })"
            if [ "$status_code" != "200" ]; then
              echo 'Odoo target replacement operation poll failed:' \
                "${status_code}." >&2
              cat odoo-target-replacement-apply.json >&2
              exit 1
            fi
            jq . odoo-target-replacement-apply.json > "$parsed_response"
            operation_status="$(
              jq -r \
                '.operation.status // empty' \
                "$parsed_response"
            )"
            operation_phase="$(
              jq -r \
                '.operation.phase // empty' \
                "$parsed_response"
            )"
            echo 'Odoo target replacement operation:' \
              "status=${operation_status} phase=${operation_phase}"
            if [ "$operation_status" = "pass" ] || \
              [ "$operation_status" = "fail" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'Launchplane Odoo target replacement operation' \
                "${operation_id} timed out while polling." >&2
              jq . odoo-target-replacement-apply.json >&2
              exit 1
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          mv "$parsed_response" odoo-target-replacement-apply.json
          jq . odoo-target-replacement-apply.json
          operation_status="$(
            jq -r '.operation.status // ""' odoo-target-replacement-apply.json
          )"
          deploy_status="$(
            jq -r \
              '.operation.result.deploy_status //
               .result.deploy_status //
               ""' \
              odoo-target-replacement-apply.json
          )"
          post_deploy_status="$(
            jq -r \
              '.operation.result.post_deploy_status //
               .result.post_deploy_status //
               ""' \
              odoo-target-replacement-apply.json
          )"
          if [ "$operation_status" != "pass" ]; then
            echo 'Odoo target replacement operation did not pass:' \
              "status=${operation_status}." >&2
            jq -r \
              '.operation.error_message // .result.error_message // ""' \
              odoo-target-replacement-apply.json >&2
            exit 1
          fi
          if [ "$deploy_status" != "pass" ] || \
            [ "$post_deploy_status" != "pass" ]; then
            echo 'Odoo target replacement apply did not pass:' \
              "deploy=${deploy_status}" \
              "post_deploy=${post_deploy_status}." >&2
            jq -r \
              '.operation.result.error_message //
               .result.error_message //
               ""' \
              odoo-target-replacement-apply.json >&2
            exit 1
          fi

      - name: Upload replacement apply result
        uses: actions/upload-artifact@v7
        with:
          name: odoo-target-replacement-apply
          path: odoo-target-replacement-apply.json
