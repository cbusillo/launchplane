---
name: Reusable Tracked Target Logs

"on":
  workflow_call:
    inputs:
      context:
        description: Launchplane runtime context.
        required: true
        type: string
      instance:
        description: Launchplane runtime instance.
        required: true
        type: string
      lines:
        description: Number of log lines to request.
        required: true
        type: string
      source:
        description: Read current runtime logs or the latest deployment logs.
        required: true
        type: string
      since:
        description: Runtime log window; deployment mode always uses all.
        required: true
        type: string
      search:
        description: Optional Dokploy log search text.
        required: false
        default: ""
        type: string
      service:
        description: Optional exact Dokploy Compose service for runtime logs.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  read:
    permissions:
      contents: read
      id-token: write
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      LAUNCHPLANE_SERVICE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_SERVICE_AUDIENCE: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
      CONTEXT: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      LINES: ${{ inputs.lines }}
      SOURCE: ${{ inputs.source }}
      SINCE: ${{ inputs.since }}
      SEARCH: ${{ inputs.search }}
      SERVICE: ${{ inputs.service }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${CONTEXT:?Missing context input}"
          : "${INSTANCE:?Missing instance input}"
          if ! [[ "$LINES" =~ ^[0-9]+$ ]]; then
            echo 'lines must be a positive integer.' >&2
            exit 1
          fi
          if [ "$LINES" -lt 1 ] || [ "$LINES" -gt 1000 ]; then
            echo 'lines must be between 1 and 1000.' >&2
            exit 1
          fi
          if ! [[ "$SINCE" =~ ^(all|[0-9]+[smhd])$ ]]; then
            echo "since must be 'all' or a duration like 5m, 2h, or 1d." >&2
            exit 1
          fi
          if [ "$SOURCE" != "runtime" ] && [ "$SOURCE" != "deployment" ]; then
            echo "source must be runtime or deployment." >&2
            exit 1
          fi
          if [ "$SOURCE" = "deployment" ] && [ -n "$SEARCH" ]; then
            echo "deployment logs do not support search." >&2
            exit 1
          fi
          if [ "$SOURCE" = "deployment" ] && [ -n "$SERVICE" ]; then
            echo "deployment logs do not support compose service selection." >&2
            exit 1
          fi
          if ! [[ "$SEARCH" =~ ^[a-zA-Z0-9\ ._-]{0,500}$ ]]; then
            echo 'search may contain only safe plain-text characters.' >&2
            exit 1
          fi
          if ! [[ "$SERVICE" =~ ^$|^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo 'service must be an exact lowercase Compose service name.' >&2
            exit 1
          fi

      - name: Build artifact name
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_slug() {
            local value="$1"
            local slug
            slug="$(
              printf '%s' "$value" |
                LC_ALL=C sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//' |
                cut -c1-80
            )"
            if [ -z "$slug" ]; then
              slug="target"
            fi
            printf '%s' "$slug"
          }
          printf 'name=tracked-target-logs-%s-%s-%s\n' \
            "$(artifact_slug "$CONTEXT")" \
            "$(artifact_slug "$INSTANCE")" \
            "$(artifact_slug "$SOURCE")" \
            >>"$GITHUB_OUTPUT"

      - name: Build logs route
        id: route
        shell: bash
        run: |
          set -euo pipefail
          effective_since="$SINCE"
          if [ "$SOURCE" = "deployment" ]; then
            effective_since="all"
          fi
          jq -n \
            --arg context "$CONTEXT" \
            --arg instance "$INSTANCE" \
            --arg lines "$LINES" \
            --arg source "$SOURCE" \
            --arg since "$effective_since" \
            --arg search "$SEARCH" \
            --arg service "$SERVICE" \
            '{
              context: $context,
              instance: $instance,
              lines: $lines,
              source: $source,
              since: $since,
              search: $search,
              service: $service
            }' \
            > tracked-target-logs-request.json
          route_path="$({
            jq -r \
              '"/v1/contexts/\(.context | @uri)" +
               "/instances/\(.instance | @uri)/logs" +
               "?lines=\(.lines | @uri)&source=\(.source | @uri)" +
               "&since=\(.since | @uri)" +
               "&search=\(.search | @uri)" +
               "&service=\(.service | @uri)"' \
              tracked-target-logs-request.json
          })"
          echo "route_path=${route_path}" >>"$GITHUB_OUTPUT"

      - name: Read tracked target logs
        id: request
        continue-on-error: true
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_SERVICE_URL }}
          route-path: ${{ steps.route.outputs.route_path }}
          method: GET
          audience: ${{ env.LAUNCHPLANE_SERVICE_AUDIENCE }}
          response-output-file: tracked-target-logs.json
          log-response-body: false
          output-paths: >-
            trace_id=trace_id

      - name: Show redacted log summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tracked-target-logs.json ]; then
            echo 'Tracked target log response file was not created.'
            exit 0
          fi
          jq '
            if .status == "ok" then
              {
                status,
                trace_id,
                context,
                instance,
                target,
                request,
                deployment,
                logs: {
                  line_count: .logs.line_count,
                  redacted: .logs.redacted
                }
              }
            else
              {status, trace_id, error}
            end
          ' tracked-target-logs.json

      - name: Upload tracked target logs
        if: ${{ always() && steps.route.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            ${{ steps.artifact.outputs.name }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: |
            tracked-target-logs-request.json
            tracked-target-logs.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail when tracked target log read failed
        if: ${{ steps.request.outcome == 'failure' }}
        shell: bash
        run: |
          echo 'Tracked target log request failed;' \
            'inspect the uploaded redacted response.' >&2
          exit 1
