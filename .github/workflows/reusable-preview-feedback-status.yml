---
name: Reusable Preview Feedback Status

"on":
  workflow_call:
    inputs:
      product:
        description: >-
          Launchplane product key. Defaults to the caller repository name.
        required: false
        default: ""
        type: string
      context:
        description: >-
          Optional Launchplane preview context. When omitted, Launchplane derives
          it from the product profile.
        required: false
        default: ""
        type: string
      mode:
        description: >-
          Preview feedback status mode: refresh or cleanup.
        required: true
        type: string
      anchor_pr_number:
        description: Pull request number that owns the preview feedback.
        required: true
        type: string
      anchor_pr_url:
        description: Pull request URL attached to preview feedback evidence.
        required: true
        type: string
      publish_result:
        description: Upstream preview image publish job result for refresh mode.
        required: false
        default: ""
        type: string
      provision_result:
        description: Upstream Launchplane preview lifecycle job result for refresh mode.
        required: false
        default: ""
        type: string
      verification_result:
        description: Upstream product preview verification job result for refresh mode.
        required: false
        default: ""
        type: string
      cleanup_result:
        description: Upstream Launchplane preview cleanup job result for cleanup mode.
        required: false
        default: ""
        type: string
      publish_failure_summary:
        description: Optional product-owned publish failure summary.
        required: false
        default: ""
        type: string
      provision_failure_summary:
        description: Optional Launchplane lifecycle failure summary.
        required: false
        default: ""
        type: string
      verification_failure_summary:
        description: Optional product-owned verification failure summary.
        required: false
        default: ""
        type: string
      cleanup_failure_summary:
        description: Optional Launchplane cleanup failure summary.
        required: false
        default: ""
        type: string
      preview_url:
        description: Ready preview URL, when available.
        required: false
        default: ""
        type: string
      immutable_image_reference:
        description: Immutable image or artifact reference, when available.
        required: false
        default: ""
        type: string
      refresh_image_reference:
        description: Floating refresh image or artifact reference, when available.
        required: false
        default: ""
        type: string
      revision:
        description: Source revision attached to preview evidence.
        required: false
        default: ""
        type: string
      run_url:
        description: Workflow run URL to show in feedback.
        required: false
        default: ""
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "300000"
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
    outputs:
      feedback_status:
        description: Preview feedback status returned by Launchplane.
        value: ${{ jobs.feedback.outputs.feedback_status }}
      error_message:
        description: Launchplane feedback error message, when present.
        value: ${{ jobs.feedback.outputs.error_message }}
      status:
        description: Canonical preview feedback status sent to Launchplane.
        value: ${{ jobs.resolve.outputs.status }}
      failure_summary:
        description: Canonical failure summary sent to Launchplane.
        value: ${{ jobs.resolve.outputs.failure_summary }}

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    outputs:
      failure_summary: ${{ steps.status.outputs.failure_summary }}
      status: ${{ steps.status.outputs.status }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve preview feedback status
        id: status
        env:
          CLEANUP_FAILURE_SUMMARY: ${{ inputs.cleanup_failure_summary }}
          CLEANUP_RESULT: ${{ inputs.cleanup_result }}
          MODE: ${{ inputs.mode }}
          PROVISION_FAILURE_SUMMARY: ${{ inputs.provision_failure_summary }}
          PROVISION_RESULT: ${{ inputs.provision_result }}
          PUBLISH_FAILURE_SUMMARY: ${{ inputs.publish_failure_summary }}
          PUBLISH_RESULT: ${{ inputs.publish_result }}
          VERIFICATION_FAILURE_SUMMARY: ${{ inputs.verification_failure_summary }}
          VERIFICATION_RESULT: ${{ inputs.verification_result }}
        run: |
          set -euo pipefail

          normalize_result() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr '-' '_'
          }

          require_result() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "$name result is required." >&2
              exit 1
            fi
            case "$value" in
              success|failure|cancelled|skipped)
                ;;
              *)
                echo "$name result must be a GitHub Actions terminal result." >&2
                exit 1
                ;;
            esac
          }

          single_line_output() {
            local value="$1"
            value="${value//$'\r'/ }"
            value="${value//$'\n'/ }"
            printf '%s' "$value"
          }

          first_summary() {
            for value in "$@"; do
              if [ -n "$value" ]; then
                printf '%s' "$value"
                return 0
              fi
            done
          }

          mode="$(normalize_result "$MODE")"
          status=''
          failure_summary=''

          case "$mode" in
            refresh)
              publish_result="$(normalize_result "$PUBLISH_RESULT")"
              provision_result="$(normalize_result "$PROVISION_RESULT")"
              verification_result="$(normalize_result "$VERIFICATION_RESULT")"
              require_result "publish" "$publish_result"
              require_result "provision" "$provision_result"
              require_result "verification" "$verification_result"
              if [ "$publish_result" != 'success' ]; then
                status='failed'
                failure_summary="$(first_summary "$PUBLISH_FAILURE_SUMMARY" 'PR preview image publish failed.')"
              elif [ "$provision_result" != 'success' ]; then
                status='failed'
                failure_summary="$(first_summary "$PROVISION_FAILURE_SUMMARY" 'Preview provisioning or verification failed.')"
              elif [ "$verification_result" != 'success' ]; then
                status='failed'
                failure_summary="$(first_summary "$VERIFICATION_FAILURE_SUMMARY" 'Preview browser verification failed.')"
              else
                status='ready'
              fi
              ;;
            cleanup)
              cleanup_result="$(normalize_result "$CLEANUP_RESULT")"
              require_result "cleanup" "$cleanup_result"
              if [ "$cleanup_result" = 'success' ]; then
                status='destroyed'
              else
                status='cleanup_failed'
                failure_summary="$(first_summary "$CLEANUP_FAILURE_SUMMARY" 'Preview cleanup failed.')"
              fi
              ;;
            *)
              echo "mode must be refresh or cleanup." >&2
              exit 1
              ;;
          esac

          {
            echo "failure_summary=$(single_line_output "$failure_summary")"
            echo "status=$status"
          } >>"$GITHUB_OUTPUT"

  feedback:
    needs:
      - resolve
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-preview-pr-feedback.yml
    with:
      product: ${{ inputs.product }}
      context: ${{ inputs.context }}
      anchor_pr_number: ${{ inputs.anchor_pr_number }}
      anchor_pr_url: ${{ inputs.anchor_pr_url }}
      status: ${{ needs.resolve.outputs.status }}
      preview_url: ${{ inputs.preview_url }}
      immutable_image_reference: ${{ inputs.immutable_image_reference }}
      refresh_image_reference: ${{ inputs.refresh_image_reference }}
      revision: ${{ inputs.revision }}
      run_url: ${{ inputs.run_url }}
      failure_summary: ${{ needs.resolve.outputs.failure_summary }}
      timeout-ms: ${{ inputs['timeout-ms'] }}
      launchplane_url: ${{ inputs.launchplane_url }}
      launchplane_audience: ${{ inputs.launchplane_audience }}
