name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
      - "launchplane/train/**"
  schedule:
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push' &&
    !(startsWith(github.ref, 'refs/heads/launchplane/train/') &&
    !github.event.created && !github.event.forced) && github.sha ||
    (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' || (startsWith(github.ref, 'refs/heads/launchplane/train/') && !github.event.created && !github.event.forced) }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
