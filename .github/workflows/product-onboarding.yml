---
name: Product Onboarding

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Recovery only. New products use native target and record operations.
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply
      product:
        description: Stable lowercase product key.
        required: true
        type: string
      display_name:
        description: Human-readable product name.
        required: false
        type: string
      repository:
        description: Product repository in owner/name form.
        required: false
        type: string
      image_repository:
        description: Immutable image repository, without a tag or digest.
        required: false
        type: string
      runtime_port:
        description: Application runtime port.
        required: false
        type: string
      health_path:
        description: Application health endpoint path.
        required: true
        default: /healthz
        type: string
      testing_context:
        description: Optional new-product testing context; defaults to <product>-testing.
        required: false
        default: ""
        type: string
      preview_context:
        description: Optional preview context; defaults to <product>-preview.
        required: false
        default: ""
        type: string
      preview_base_url:
        description: Root URL whose subdomains host previews, for example https://product-preview.example.com.
        required: false
        type: string
      target_name:
        description: Application intent label; ordinary allocations use service-generated names.
        required: false
        default: ""
        type: string
      project_name:
        description: Project intent label; ordinary allocations use service-generated names.
        required: false
        default: ""
        type: string
      environment_name:
        description: Non-production Dokploy environment.
        required: true
        default: testing
        type: choice
        options:
          - testing
      server_id:
        description: Optional Dokploy server id.
        required: false
        default: ""
        type: string
      domain_certificate_type:
        description: Preview TLS owner.
        required: false
        default: none
        type: choice
        options:
          - none
          - letsencrypt
      allocation_control:
        description: >-
          Allocation JSON: optional original idempotency_key; mode readback or
          apply selects recovery only. Retention also needs retain_allocation
          and expected_allocation_custody_sha256 from reviewed readback.
        required: false
        default: ""
        type: string
      confirmation:
        description: Type APPLY GENERIC WEB ONBOARDING when mode=apply.
        required: false
        default: ""
        type: string
      reason:
        description: Single-line operator reason.
        required: true
        type: string
      related_issue:
        description: Single-line issue or change reference.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: product-onboarding
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.inputs.outputs.product }}
      recovery: ${{ steps.inputs.outputs.recovery }}
      testing_context: ${{ steps.inputs.outputs.testing_context }}
      target_plan_sha256: ${{ steps.plan.outputs.target_plan_sha256 }}
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      MODE: ${{ inputs.mode }}
      ALLOCATION_CONTROL: ${{ inputs.allocation_control }}
      PRODUCT: ${{ inputs.product }}
      HEALTH_PATH: ${{ inputs.health_path }}
      TESTING_CONTEXT: ${{ inputs.testing_context }}
      TARGET_NAME: ${{ inputs.target_name }}
      PROJECT_NAME: ${{ inputs.project_name }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      SERVER_ID: ${{ inputs.server_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Validate and normalize typed inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          def required(name: str, maximum: int = 300) -> str:
              value = os.environ[name].strip()
              if not value:
                  raise SystemExit(f"{name.lower()} is required.")
              if len(value) > maximum or any(ord(char) < 32 or ord(char) == 127 for char in value):
                  raise SystemExit(f"{name.lower()} must be one printable line.")
              return value

          def optional(name: str, maximum: int = 300) -> str:
              value = os.environ[name].strip()
              if len(value) > maximum or any(ord(char) < 32 or ord(char) == 127 for char in value):
                  raise SystemExit(f"{name.lower()} must be one printable line.")
              return value

          mode = required("MODE")
          if mode not in {"dry_run", "apply"}:
              raise SystemExit("mode must be dry_run or apply.")
          if mode == "apply" and os.environ["CONFIRMATION"].strip() != "APPLY GENERIC WEB ONBOARDING":
              raise SystemExit("apply requires exact confirmation text.")
          if mode == "dry_run" and os.environ["CONFIRMATION"].strip():
              raise SystemExit("dry_run rejects confirmation text.")
          control_text = os.environ["ALLOCATION_CONTROL"]
          control = json.loads(control_text) if control_text else {}
          if not isinstance(control, dict):
              raise SystemExit("allocation_control must be a JSON object.")
          allowed_controls = {"mode", "idempotency_key", "retain_allocation", "expected_allocation_custody_sha256"}
          if control.keys() - allowed_controls:
              raise SystemExit("allocation_control contains an unsupported field.")
          if "idempotency_key" in control:
              key = control["idempotency_key"]
              if not isinstance(key, str) or not key or any(ord(char) < 32 or ord(char) == 127 for char in key):
                  raise SystemExit("allocation_control idempotency_key must be one nonempty printable line.")
          retain = control.get("retain_allocation", False)
          custody = control.get("expected_allocation_custody_sha256", "")
          if not isinstance(retain, bool) or not isinstance(custody, str):
              raise SystemExit("allocation_control retention requires a boolean and string digest.")
          recovery = "mode" in control
          if not recovery:
              raise SystemExit(
                  "New products use native target allocation and product-record apply. "
                  "See docs/operations.md#native-target-allocation. "
                  "This workflow only recovers existing allocations."
              )
          if recovery and control["mode"] not in {"readback", "apply"}:
              raise SystemExit("allocation_control mode must be readback or apply.")
          if retain:
              if control.get("mode") != "apply" or re.fullmatch(r"[a-f0-9]{64}", custody) is None:
                  raise SystemExit("retention requires recovery apply and the reviewed custody digest.")
          elif custody:
              raise SystemExit("a custody digest requires retain_allocation.")
          if recovery and control["mode"] == "apply" and mode != "apply":
              raise SystemExit("allocation recovery apply requires mode=apply and confirmation.")
          product = required("PRODUCT", 63).lower()
          if re.fullmatch(r"[a-z0-9][a-z0-9-]{0,62}", product) is None:
              raise SystemExit("product must use lowercase letters, numbers, and hyphens.")
          health_path = required("HEALTH_PATH")
          if not health_path.startswith("/"):
              raise SystemExit("health_path must start with '/'.")
          required("REASON")
          if required("ENVIRONMENT_NAME") != "testing":
              raise SystemExit("environment_name must be testing.")
          testing_context = optional("TESTING_CONTEXT") or f"{product}-testing"
          target_name = optional("TARGET_NAME") or f"{product}-testing"
          project_name = optional("PROJECT_NAME") or product
          optional("SERVER_ID")
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"product={product}\n")
              handle.write(f"recovery={str(recovery).lower()}\n")
              handle.write(f"testing_context={testing_context}\n")
              handle.write(f"target_name={target_name}\n")
              handle.write(f"project_name={project_name}\n")
          PY

      - name: Render plan requests
        shell: bash
        env:
          NORMALIZED_TESTING_CONTEXT: ${{ steps.inputs.outputs.testing_context }}
          NORMALIZED_TARGET_NAME: ${{ steps.inputs.outputs.target_name }}
          NORMALIZED_PROJECT_NAME: ${{ steps.inputs.outputs.project_name }}
        run: |
          set -euo pipefail
          jq -n \
            --arg context "$NORMALIZED_TESTING_CONTEXT" \
            --arg target_name "$NORMALIZED_TARGET_NAME" \
            --arg project_name "$NORMALIZED_PROJECT_NAME" \
            --arg environment_name "$ENVIRONMENT_NAME" \
            --arg server_id "$SERVER_ID" \
            --arg healthcheck_path "$HEALTH_PATH" \
            '{schema_version:1, mode:"dry-run", operation:"create-application",
              product:"launchplane", context:$context, instance:"testing",
              target_name:$target_name, project_name:$project_name,
              environment_name:$environment_name, server_id:$server_id,
              healthcheck_path:$healthcheck_path}' \
            > target-plan-request.json

      - name: Finalize onboarding plan
        id: plan
        shell: bash
        env:
          NORMALIZED_PRODUCT: ${{ steps.inputs.outputs.product }}
          NORMALIZED_TESTING_CONTEXT: ${{ steps.inputs.outputs.testing_context }}
        run: |
          set -euo pipefail
          target_plan_sha256="$(sha256sum target-plan-request.json | awk '{print $1}')"
          echo "target_plan_sha256=$target_plan_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "## Generic-web allocation recovery"
            echo
            echo "- Product: $NORMALIZED_PRODUCT"
            echo "- Testing context: $NORMALIZED_TESTING_CONTEXT"
            echo "- Original target request: \`$target_plan_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload onboarding plan evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generic-web-onboarding-plan
          path: target-plan-request.json
          if-no-files-found: error
          retention-days: 14

  apply:
    if: needs.plan.outputs.recovery == 'true'
    needs: plan
    uses: cbusillo/launchplane/.github/workflows/reusable-generic-web-onboarding-apply.yml@a3fbd1c47912b0b0975978a7cd8d18e040e28b2e # main
    with:
      allocation_control: ${{ inputs.allocation_control }}
      product: ${{ needs.plan.outputs.product }}
      testing_context: ${{ needs.plan.outputs.testing_context }}
      target_plan_sha256: ${{ needs.plan.outputs.target_plan_sha256 }}
      reason: ${{ inputs.reason }}
    secrets: inherit
