---
name: Ingress Route Canary Apply

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Launchplane product key authorized for the canary apply.
        required: true
        type: string
      context:
        description: Launchplane context authorized for the canary apply.
        required: true
        type: string
      canary_key:
        description: Launchplane ingress canary route key to apply.
        required: true
        type: string
      reason:
        description: Operator reason recorded with the Launchplane request.
        required: true
        type: string
      idempotency_key:
        description: Unique idempotency key for this canary apply attempt.
        required: true
        type: string
      confirmation:
        description: Type apply ingress canary to confirm the mutation path.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: launchplane-ingress-route-canary-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      PRODUCT: ${{ inputs.product }}
      CONTEXT: ${{ inputs.context }}
      CANARY_KEY: ${{ inputs.canary_key }}
    steps:
      - name: Validate canary apply confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "apply ingress canary" ]; then
            echo "confirmation must be exactly: apply ingress canary" >&2
            exit 1
          fi
          if [ -z "${IDEMPOTENCY_KEY// }" ]; then
            echo "idempotency_key is required." >&2
            exit 1
          fi

      - name: Build ingress route canary apply payload
        id: payload
        shell: bash
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing canary product}"
          : "${CONTEXT:?Missing canary context}"
          : "${CANARY_KEY:?Missing canary route key}"

          payload_file="$RUNNER_TEMP/ingress-route-canary-apply-request.json"
          jq -n \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT" \
            --arg canary_key "$CANARY_KEY" \
            --arg reason "$REASON" \
            '{
              schema_version: 1,
              product: $product,
              context: $context,
              canary_key: $canary_key,
              reason: $reason
            }' >"$payload_file"
          echo "payload_file=$payload_file" >>"$GITHUB_OUTPUT"

      - name: Request ingress route canary apply
        id: launchplane
        uses: cbusillo/launchplane/.github/actions/launchplane-request@main
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          method: POST
          route-path: /v1/ingress/canary-routes/apply
          payload-file: ${{ steps.payload.outputs.payload_file }}
          idempotency-key: ${{ inputs.idempotency_key }}
          timeout-ms: "30000"
          fail-result-paths: result.status
          response-output-file: ingress-route-canary-apply.json

      - name: Summarize canary apply
        shell: bash
        run: |
          set -euo pipefail
          result_file="ingress-route-canary-apply.json"
          jq . "$result_file"
          {
            echo '## Ingress route canary apply'
            echo
            echo "- Product: $PRODUCT"
            echo "- Context: $CONTEXT"
            echo "- Canary route: $CANARY_KEY"
            echo "- Status: $(jq -r '.result.status' "$result_file")"
            echo "- Dry run: $(jq -r '.result.dry_run' "$result_file")"
            echo
            echo '### Operations'
            jq -r '
              .result.operations[]?
              | (.change_categories // [] | if length == 0 then "none" else join(",") end) as $categories
              | "- \(.action) host=\(.host_id // "new") requires_apply=\(.requires_apply) categories=\($categories)"
            ' "$result_file"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload canary apply response
        uses: actions/upload-artifact@v7
        with:
          name: ingress-route-canary-apply
          path: ingress-route-canary-apply.json
          if-no-files-found: error
