---
name: Reusable Product Driver Testing Deploy

"on":
  workflow_call:
    inputs:
      product:
        description: Launchplane product key.
        required: true
        type: string
      driver:
        description: Product driver id.
        required: true
        type: string
      context:
        description: Runtime context.
        required: true
        type: string
      artifact_id:
        description: Stored Launchplane artifact ID to deploy to testing.
        required: true
        type: string
      source_git_ref:
        description: Source git ref attached to deployment evidence.
        required: true
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "2700000"
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
    outputs:
      operation_id:
        description: Launchplane target replacement operation ID.
        value: ${{ jobs.odoo_testing_deploy.outputs.operation_id }}
      deployment_record_id:
        description: Launchplane deployment record ID.
        value: ${{ jobs.odoo_testing_deploy.outputs.deployment_record_id }}
      release_tuple_id:
        description: Minted testing release tuple ID.
        value: ${{ jobs.odoo_testing_deploy.outputs.release_tuple_id }}
      deployment_status:
        description: Target replacement deploy status.
        value: ${{ jobs.odoo_testing_deploy.outputs.deployment_status }}
      post_deploy_status:
        description: Driver post-deploy status.
        value: ${{ jobs.odoo_testing_deploy.outputs.post_deploy_status }}
      destination_health_status:
        description: Stable destination health status.
        value: ${{ jobs.odoo_testing_deploy.outputs.destination_health_status }}
      canonical_status:
        description: Stable canonical URL verification status.
        value: ${{ jobs.odoo_testing_deploy.outputs.canonical_status }}
      logo_status:
        description: Stable logo verification status.
        value: ${{ jobs.odoo_testing_deploy.outputs.logo_status }}
      error_message:
        description: Launchplane driver error message, when present.
        value: ${{ jobs.odoo_testing_deploy.outputs.error_message }}

permissions:
  contents: read

jobs:
  resolve:
    outputs:
      artifact_id: ${{ steps.request.outputs.artifact_id }}
      context: ${{ steps.request.outputs.context }}
      driver: ${{ steps.request.outputs.driver }}
      product: ${{ steps.request.outputs.product }}
      source_git_ref: ${{ steps.request.outputs.source_git_ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve product-driver testing deploy request
        id: request
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          CONTEXT: ${{ inputs.context }}
          DRIVER: ${{ inputs.driver }}
          PRODUCT: ${{ inputs.product }}
          SOURCE_GIT_REF: ${{ inputs.source_git_ref }}
        run: |
          set -euo pipefail
          for required in PRODUCT DRIVER CONTEXT ARTIFACT_ID SOURCE_GIT_REF; do
            if [ -z "${!required}" ]; then
              echo "${required} is required." >&2
              exit 1
            fi
          done
          write_output() {
            name="$1"
            value="$2"
            delimiter="launchplane_output_$(uuidgen | tr '[:upper:]' '[:lower:]')"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >>"$GITHUB_OUTPUT"
          }
          write_output artifact_id "$ARTIFACT_ID"
          write_output context "$CONTEXT"
          write_output driver "$DRIVER"
          write_output product "$PRODUCT"
          write_output source_git_ref "$SOURCE_GIT_REF"

  unsupported_driver:
    needs: resolve
    if: ${{ needs.resolve.outputs.driver != 'odoo' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported product driver
        env:
          DRIVER: ${{ needs.resolve.outputs.driver }}
        run: |
          set -euo pipefail
          echo "Unsupported product driver for testing deploy: ${DRIVER}" >&2
          exit 1

  odoo_testing_deploy:
    needs: resolve
    if: ${{ needs.resolve.outputs.driver == 'odoo' }}
    outputs:
      operation_id: ${{ steps.poll.outputs.operation_id }}
      deployment_record_id: ${{ steps.poll.outputs.deployment_record_id }}
      release_tuple_id: ${{ steps.poll.outputs.release_tuple_id }}
      deployment_status: ${{ steps.poll.outputs.deployment_status }}
      post_deploy_status: ${{ steps.poll.outputs.post_deploy_status }}
      destination_health_status: >-
        ${{ steps.poll.outputs.destination_health_status }}
      canonical_status: ${{ steps.poll.outputs.canonical_status }}
      logo_status: ${{ steps.poll.outputs.logo_status }}
      error_message: ${{ steps.poll.outputs.error_message }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Launchplane Odoo testing deploy request
        id: request
        env:
          ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
          PRODUCT: ${{ needs.resolve.outputs.product }}
        run: |
          set -euo pipefail
          for required in PRODUCT ARTIFACT_ID; do
            if [ -z "${!required}" ]; then
              echo "${required} is required." >&2
              exit 1
            fi
          done
          run_scope="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          write_output() {
            name="$1"
            value="$2"
            delimiter="launchplane_output_$(uuidgen | tr '[:upper:]' '[:lower:]')"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >>"$GITHUB_OUTPUT"
          }
          write_output product "$PRODUCT"
          write_output idempotency_key \
            "odoo-target-replacement-apply:${PRODUCT}:testing:reusable-testing:${ARTIFACT_ID}:${run_scope}"

      - name: Request Launchplane Odoo target replacement apply
        id: lp
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: /v1/drivers/odoo/target-replacement-apply
          payload: |-
            {
              "schema_version": 1,
              "replacement": {
                "schema_version": 1,
                "instance": "testing",
                "strategy": "recreate-in-place",
                "allow_empty_data": true,
                "data_source_mode": "existing",
                "verify_health": true,
                "verify_canonical": true,
                "verify_logo": true,
                "no_cache": false
              }
            }
          payload-fields: |-
            product=${{ steps.request.outputs.product }}
            replacement.product=${{ steps.request.outputs.product }}
            replacement.artifact_id=${{ needs.resolve.outputs.artifact_id }}
            replacement.source_git_ref=${{ needs.resolve.outputs.source_git_ref }}
          idempotency-key: >-
            ${{ steps.request.outputs.idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: result.status
          output-paths: >-
            trace_id=trace_id,
            operation_id=records.odoo_stable_target_replacement_operation_id,
            poll_url=result.poll_url

      - name: Poll target replacement operation
        id: poll_operation
        env:
          OPERATION_ID: ${{ steps.lp.outputs.operation_id }}
          POLL_URL: ${{ steps.lp.outputs.poll_url }}
        run: |
          set -euo pipefail
          if [ -z "$OPERATION_ID" ] || [ -z "$POLL_URL" ]; then
            echo 'Target replacement response missing operation metadata.' >&2
            exit 1
          fi
          if [[ "$POLL_URL" == *\\* ]]; then
            echo 'Target replacement poll URL must be a local Launchplane route path.' >&2
            exit 1
          fi
          case "$POLL_URL" in
            *$'\n'* | *$'\r'*)
              echo 'Target replacement poll URL must be a single-line value.' >&2
              exit 1
              ;;
            *://* | //* | *'//'* | *'?'* | *'#'* | *'%'*)
              echo 'Target replacement poll URL must be a local Launchplane route path.' >&2
              exit 1
              ;;
            /v1/drivers/odoo/target-replacement/operations/*) ;;
            *)
              echo "Target replacement poll URL is not an Odoo operation path: ${POLL_URL}" >&2
              exit 1
              ;;
          esac
          operation_path_id="${POLL_URL#/v1/drivers/odoo/target-replacement/operations/}"
          case "$operation_path_id" in
            "" | */* | *.*)
              echo 'Target replacement poll URL operation ID must be a single path segment.' >&2
              exit 1
              ;;
          esac

      - name: Poll target replacement operation result
        id: poll_result
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          method: GET
          route-path: ${{ steps.lp.outputs.poll_url }}
          poll-result-path: operation.status
          poll-result-statuses: pending,running
          poll-interval-ms: 15000
          poll-timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: ""
          response-output-file: odoo-testing-target-replacement.json

      - name: Read target replacement operation result
        id: poll
        env:
          OPERATION_ID: ${{ steps.lp.outputs.operation_id }}
          POLL_STATUS_CODE: ${{ steps.poll_result.outputs.status-code }}
        run: |
          set -euo pipefail
          write_output() {
            file="$1"
            name="$2"
            value="$3"
            delimiter="launchplane_output_$(uuidgen | tr '[:upper:]' '[:lower:]')"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >>"$file"
          }
          if [ "$POLL_STATUS_CODE" != "200" ]; then
            echo "Target replacement poll failed with HTTP ${POLL_STATUS_CODE}." >&2
            jq . odoo-testing-target-replacement.json >&2
            exit 1
          fi
          operation_status="$(jq -r '.operation.status // empty' odoo-testing-target-replacement.json)"
          result='.operation.result'
          deployment_status="$(jq -r "${result}.deploy_status // \"\"" odoo-testing-target-replacement.json)"
          post_deploy_status="$(jq -r "${result}.post_deploy_status // \"\"" odoo-testing-target-replacement.json)"
          health_status="$(jq -r "${result}.health_status // \"\"" odoo-testing-target-replacement.json)"
          canonical_status="$(jq -r "${result}.canonical_status // \"\"" odoo-testing-target-replacement.json)"
          logo_status="$(jq -r "${result}.logo_status // \"\"" odoo-testing-target-replacement.json)"
          error_message="$(jq -r '.operation.error_message // .operation.result.error_message // ""' odoo-testing-target-replacement.json)"
          write_output "$GITHUB_OUTPUT" operation_id "$OPERATION_ID"
          write_output "$GITHUB_OUTPUT" deployment_record_id \
            "$(jq -r "${result}.deployment_record_id // \"\"" odoo-testing-target-replacement.json)"
          write_output "$GITHUB_OUTPUT" release_tuple_id \
            "$(jq -r "${result}.release_tuple_id // \"\"" odoo-testing-target-replacement.json)"
          write_output "$GITHUB_OUTPUT" deployment_status "$deployment_status"
          write_output "$GITHUB_OUTPUT" post_deploy_status "$post_deploy_status"
          write_output "$GITHUB_OUTPUT" destination_health_status "$health_status"
          write_output "$GITHUB_OUTPUT" canonical_status "$canonical_status"
          write_output "$GITHUB_OUTPUT" logo_status "$logo_status"
          write_output "$GITHUB_OUTPUT" error_message "$error_message"
          if [ "$operation_status" != "pass" ] || \
             [ "$deployment_status" != "pass" ] || \
             [ "$post_deploy_status" != "pass" ] || \
             [ "$health_status" != "pass" ] || \
             [ "$canonical_status" != "pass" ] || \
             [ "$logo_status" != "pass" ]; then
            echo 'Odoo testing target replacement did not pass.' >&2
            jq . odoo-testing-target-replacement.json >&2
            exit 1
          fi

      - name: Report result
        env:
          DEPLOYMENT_RECORD_ID: ${{ steps.poll.outputs.deployment_record_id }}
          RELEASE_TUPLE_ID: ${{ steps.poll.outputs.release_tuple_id }}
          DESTINATION_HEALTH_STATUS: >-
            ${{ steps.poll.outputs.destination_health_status }}
          POST_DEPLOY_STATUS: ${{ steps.poll.outputs.post_deploy_status }}
        run: |
          echo "deployment_record_id=$DEPLOYMENT_RECORD_ID"
          echo "release_tuple_id=$RELEASE_TUPLE_ID"
          echo "post_deploy_status=$POST_DEPLOY_STATUS"
          echo "destination_health_status=$DESTINATION_HEALTH_STATUS"
