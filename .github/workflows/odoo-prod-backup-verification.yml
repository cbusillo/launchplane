---
name: Odoo Prod Backup Verification

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      context:
        description: Launchplane production context.
        required: true
        type: string
      instance:
        description: Production lane instance.
        required: true
        default: prod
        type: string
      backup_record_id:
        description: Exact passing Odoo backup-gate record id to verify.
        required: true
        type: string
      timeout_seconds:
        description: Optional Dokploy verification timeout override in seconds.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    odoo-prod-backup-verification-${{ inputs.product }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ inputs.product }}
      CONTEXT: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      BACKUP_RECORD_ID: ${{ inputs.backup_record_id }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    steps:
      - name: Validate verification inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${CONTEXT:?Missing context input}"
          : "${INSTANCE:?Missing instance input}"
          : "${BACKUP_RECORD_ID:?Missing backup record id input}"
          if [ "$INSTANCE" != "prod" ]; then
            echo 'Odoo prod backup verification requires instance=prod.' >&2
            exit 1
          fi
          for scalar in \
            PRODUCT CONTEXT INSTANCE BACKUP_RECORD_ID TIMEOUT_SECONDS
          do
            case "${!scalar}" in
              *$'\n'*)
                echo "${scalar} must be a single-line value." >&2
                exit 1
                ;;
            esac
          done
          if [ -n "$TIMEOUT_SECONDS" ]; then
            case "$TIMEOUT_SECONDS" in
              *[!0-9]*)
                echo 'TIMEOUT_SECONDS must be a positive integer.' >&2
                exit 1
                ;;
            esac
            if [ "$TIMEOUT_SECONDS" -lt 1 ]; then
              echo 'TIMEOUT_SECONDS must be a positive integer.' >&2
              exit 1
            fi
          fi

      - name: Write backup verification request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .launchplane
          payload_file=.launchplane/backup-verification-payload.json
          jq -n \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT" \
            --arg instance "$INSTANCE" \
            --arg backup_record_id "$BACKUP_RECORD_ID" \
            '{
              schema_version: 1,
              product: $product,
              backup_verification: {
                schema_version: 1,
                context: $context,
                instance: $instance,
                backup_record_id: $backup_record_id
              }
            }' > "$payload_file"
          if [ -n "$TIMEOUT_SECONDS" ]; then
            tmp_payload="$(mktemp)"
            jq \
              --argjson timeout_seconds "$TIMEOUT_SECONDS" \
              '.backup_verification.timeout_seconds = $timeout_seconds' \
              "$payload_file" > "$tmp_payload"
            mv "$tmp_payload" "$payload_file"
          fi
          idempotency_key="odoo-prod-backup-verification:${PRODUCT}:${CONTEXT}"
          idempotency_key="${idempotency_key}:${INSTANCE}:${BACKUP_RECORD_ID}"
          idempotency_key="${idempotency_key}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          printf 'idempotency_key=%s\n' \
            "$idempotency_key" \
            >>"$GITHUB_OUTPUT"

      - name: Request Launchplane backup verification
        id: launchplane
        # yamllint disable-line rule:line-length
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850  # main
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/drivers/odoo/prod-backup-verification
          payload-file: .launchplane/backup-verification-payload.json
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          timeout-ms: "2700000"
          output-paths: >-
            verification_status=result.verification_status,
            manifest_status=result.manifest_status,
            sha256_status=result.sha256_status,
            pg_restore_status=result.pg_restore_status,
            tar_status=result.tar_status,
            staging_space_status=result.staging_space_status,
            database_dump_sha256=result.database_dump_sha256,
            filestore_archive_sha256=result.filestore_archive_sha256,
            database_dump_size=result.database_dump_size,
            filestore_archive_size=result.filestore_archive_size,
            pg_restore_entry_count=result.pg_restore_entry_count,
            filestore_member_count=result.filestore_member_count,
            filestore_unpacked_size=result.filestore_unpacked_size,
            data_volume_free_bytes=result.data_volume_free_bytes,
            staging_required_bytes=result.staging_required_bytes,
            failure_code=result.failure_code
          response-output-file: odoo-prod-backup-verification.json

      - name: Verify bounded backup evidence
        env:
          VERIFICATION_STATUS: >-
            ${{ steps.launchplane.outputs.verification_status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.launchplane.outputs.status-code }}" != "202" ]; then
            echo 'Launchplane Odoo prod backup verification request failed.' >&2
            exit 1
          fi
          if jq -e '
            .. | objects |
            has("backup_root") or
            has("backup_dir") or
            has("database_dump_path") or
            has("filestore_archive_path") or
            has("manifest_path") or
            has("error_message")
          ' odoo-prod-backup-verification.json >/dev/null; then
            echo 'Backup verification response exposed unbounded evidence.' >&2
            exit 1
          fi
          if [ "$VERIFICATION_STATUS" != "pass" ]; then
            echo 'Odoo prod backup verification did not pass.' >&2
            jq '{
              status: .result.verification_status,
              failure_code: .result.failure_code
            }' odoo-prod-backup-verification.json >&2
            exit 1
          fi
          jq '{
            backup_record_id: .records.backup_record_id,
            verification_status: .result.verification_status,
            manifest_status: .result.manifest_status,
            sha256_status: .result.sha256_status,
            pg_restore_status: .result.pg_restore_status,
            tar_status: .result.tar_status,
            staging_space_status: .result.staging_space_status,
            database_dump_sha256: .result.database_dump_sha256,
            filestore_archive_sha256: .result.filestore_archive_sha256,
            database_dump_size: .result.database_dump_size,
            filestore_archive_size: .result.filestore_archive_size,
            pg_restore_entry_count: .result.pg_restore_entry_count,
            filestore_member_count: .result.filestore_member_count,
            filestore_unpacked_size: .result.filestore_unpacked_size,
            data_volume_free_bytes: .result.data_volume_free_bytes,
            staging_required_bytes: .result.staging_required_bytes
          }' odoo-prod-backup-verification.json >>"$GITHUB_STEP_SUMMARY"

      - name: Upload backup verification evidence
        if: ${{ always() }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backup-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: odoo-prod-backup-verification.json
          if-no-files-found: error
          retention-days: 14
