---
name: Launchplane Seed Import

"on":
  workflow_dispatch:
    inputs:
      import_kind:
        description: Seed import kind to process.
        required: false
        default: all
        type: choice
        options:
          - all
          - product_onboarding
          - runtime_key_safety_policy
      import_id:
        description: Optional exact import id from import-material/launchplane/seed-imports/catalog.json.
        required: false
        type: string
      apply:
        description: Apply imports after validation. Leave false for evidence-only dry-run.
        required: false
        default: false
        type: boolean
      confirmation:
        description: Type APPLY LAUNCHPLANE SEED IMPORTS when apply is true.
        required: false
        type: string
      reason:
        description: Operator reason for applying seed imports.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: launchplane-seed-import
  cancel-in-progress: false

jobs:
  import:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      IMPORT_KIND: ${{ inputs.import_kind }}
      IMPORT_ID: ${{ inputs.import_id }}
      APPLY_IMPORTS: ${{ inputs.apply && 'true' || 'false' }}
      CONFIRMATION: ${{ inputs.confirmation }}
      IMPORT_REASON: ${{ inputs.reason }}
      DISCORD_BLUE_DOKPLOY_TARGET_ID: ${{ vars.DISCORD_BLUE_DOKPLOY_TARGET_ID }}
      ODOO_CM_TESTING_DOKPLOY_TARGET_ID: ${{ vars.ODOO_CM_TESTING_DOKPLOY_TARGET_ID }}
      ODOO_CM_PROD_DOKPLOY_TARGET_ID: ${{ vars.ODOO_CM_PROD_DOKPLOY_TARGET_ID }}
      ODOO_CM_WEBSITE_TESTING_DOKPLOY_TARGET_ID: ${{ vars.ODOO_CM_WEBSITE_TESTING_DOKPLOY_TARGET_ID }}
      ODOO_OPW_TESTING_DOKPLOY_TARGET_ID: ${{ vars.ODOO_OPW_TESTING_DOKPLOY_TARGET_ID }}
      ODOO_OPW_PROD_DOKPLOY_TARGET_ID: ${{ vars.ODOO_OPW_PROD_DOKPLOY_TARGET_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Resolve service endpoint
        id: service
        shell: bash
        run: |
          set -euo pipefail
          : "${LAUNCHPLANE_URL:?Missing LAUNCHPLANE_PUBLIC_URL variable}"

          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["LAUNCHPLANE_URL"].strip())
          if not parsed.scheme or not parsed.netloc or not parsed.hostname:
              raise SystemExit("LAUNCHPLANE_URL must be an absolute URL.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"origin={parsed.scheme}://{parsed.netloc}\n")
              handle.write(f"audience={parsed.hostname}\n")
          PY

      - name: Validate apply guard
        if: env.APPLY_IMPORTS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY LAUNCHPLANE SEED IMPORTS" ]; then
            echo "Applying seed imports requires exact confirmation text." >&2
            exit 1
          fi
          if [ -z "$(printf '%s' "$IMPORT_REASON" | xargs)" ]; then
            echo "reason is required when apply is true." >&2
            exit 1
          fi

      - name: Run seed import
        shell: bash
        env:
          SERVICE_ORIGIN: ${{ steps.service.outputs.origin }}
          SERVICE_AUDIENCE: ${{ steps.service.outputs.audience }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/launchplane-seed-import"
          mkdir -p "$output_dir"
          args=(
            --catalog import-material/launchplane/seed-imports/catalog.json
            --output-dir "$output_dir"
            --kind "$IMPORT_KIND"
            --reason "$IMPORT_REASON"
          )
          if [ -n "$(printf '%s' "$IMPORT_ID" | xargs)" ]; then
            args+=(--import-id "$IMPORT_ID")
          fi
          if [ "$APPLY_IMPORTS" = "true" ]; then
            oidc_token="$({
              curl -fsSL \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${SERVICE_AUDIENCE}" \
              | jq -r '.value'
            })"
            args+=(--service-url "$SERVICE_ORIGIN" --bearer-token "$oidc_token" --apply)
          fi
          uv run python scripts/deploy/apply-launchplane-seed-imports.py "${args[@]}" \
            | tee launchplane-seed-import-summary.json

          {
            echo "## Launchplane seed import"
            echo
            echo "- Kind: $IMPORT_KIND"
            echo "- Import id: ${IMPORT_ID:-all}"
            echo "- Applied: $APPLY_IMPORTS"
            echo "- Evidence artifact: launchplane-seed-import"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload seed import evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launchplane-seed-import
          path: |
            launchplane-seed-import-summary.json
            ${{ runner.temp }}/launchplane-seed-import/*.json
          if-no-files-found: error
