---
name: Reusable Generic Web Stable Verification

"on":
  workflow_call:
    inputs:
      product:
        description: >-
          Launchplane product key. Defaults to the caller repository name.
        required: false
        default: ""
        type: string
      context:
        description: Stable Launchplane lane context.
        required: true
        type: string
      instance:
        description: Stable Launchplane lane instance. Defaults to testing.
        required: false
        default: testing
        type: string
      deployment_record_id:
        description: Launchplane deployment record ID to update.
        required: true
        type: string
      promotion_record_id:
        description: Optional Launchplane promotion record ID to update.
        required: false
        default: ""
        type: string
      verification_status:
        description: Product smoke verification status.
        required: true
        type: string
      verified_at:
        description: RFC3339 timestamp for the verification result.
        required: true
        type: string
      checked_urls:
        description: Optional JSON array of URLs checked by product smoke.
        required: false
        default: "[]"
        type: string
      timeout-seconds:
        description: Timeout used for checked URLs, when supplied.
        required: false
        default: "null"
        type: string
      health_payload:
        description: Optional JSON health payload captured by product smoke.
        required: false
        default: "null"
        type: string
      failure_summary:
        description: Short failure summary for failed verification states.
        required: false
        default: ""
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "300000"
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
    outputs:
      deployment_record_id:
        description: Launchplane deployment record ID.
        value: ${{ jobs.stable-verification.outputs.deployment_record_id }}
      inventory_record_id:
        description: Launchplane inventory record ID, when updated.
        value: ${{ jobs.stable-verification.outputs.inventory_record_id }}
      promotion_record_id:
        description: Launchplane promotion record ID, when updated.
        value: ${{ jobs.stable-verification.outputs.promotion_record_id }}
      deployment_health_status:
        description: Deployment health evidence status.
        value: ${{ jobs.stable-verification.outputs.deployment_health_status }}
      promotion_health_status:
        description: Promotion health evidence status, when updated.
        value: ${{ jobs.stable-verification.outputs.promotion_health_status }}
      error_message:
        description: Launchplane verification error message, when present.
        value: ${{ jobs.stable-verification.outputs.error_message }}

permissions:
  contents: read
  id-token: write

jobs:
  stable-verification:
    outputs:
      deployment_record_id: ${{ steps.lp.outputs.deployment_record_id }}
      inventory_record_id: ${{ steps.lp.outputs.inventory_record_id }}
      promotion_record_id: ${{ steps.lp.outputs.promotion_record_id }}
      deployment_health_status: ${{ steps.lp.outputs.deployment_health_status }}
      promotion_health_status: ${{ steps.lp.outputs.promotion_health_status }}
      error_message: ${{ steps.lp.outputs.error_message }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Launchplane stable verification request
        id: request
        env:
          CONTEXT: ${{ inputs.context }}
          DEPLOYMENT_RECORD_ID: ${{ inputs.deployment_record_id }}
          INSTANCE: ${{ inputs.instance }}
          PRODUCT: ${{ inputs.product }}
          PROMOTION_RECORD_ID: ${{ inputs.promotion_record_id }}
          VERIFICATION_STATUS: ${{ inputs.verification_status }}
          VERIFIED_AT: ${{ inputs.verified_at }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCT" ]; then
            PRODUCT="${GITHUB_REPOSITORY#*/}"
          fi
          if [ -z "$INSTANCE" ]; then
            INSTANCE="testing"
          fi
          VERIFICATION_STATUS="$(printf '%s' "$VERIFICATION_STATUS" | tr '[:upper:]' '[:lower:]' | tr '-' '_')"
          case "$VERIFICATION_STATUS" in
            success|passed|pass)
              VERIFICATION_STATUS=pass
              ;;
            failure|failed|fail|cancelled|canceled|timed_out|skipped|neutral)
              VERIFICATION_STATUS=fail
              ;;
            *)
              echo "verification_status must be success/pass or failure/fail." >&2
              exit 1
              ;;
          esac
          for required in PRODUCT CONTEXT INSTANCE DEPLOYMENT_RECORD_ID VERIFIED_AT; do
            if [ -z "${!required}" ]; then
              echo "${required} is required." >&2
              exit 1
            fi
          done
          run_scope="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          {
            echo "context=$CONTEXT"
            echo "deployment_record_id=$DEPLOYMENT_RECORD_ID"
            echo "instance=$INSTANCE"
            echo "product=$PRODUCT"
            echo "promotion_record_id=$PROMOTION_RECORD_ID"
            echo "verification_status=$VERIFICATION_STATUS"
            echo "verified_at=$VERIFIED_AT"
            printf '%s=%s:%s:%s:%s:%s:%s\n' \
              idempotency_key \
              generic-web-stable-verification \
              "$PRODUCT" \
              "$CONTEXT" \
              "$INSTANCE" \
              "$DEPLOYMENT_RECORD_ID" \
              "$run_scope"
          } >>"$GITHUB_OUTPUT"

      - name: Write Launchplane generic-web stable verification payload
        env:
          CHECKED_URLS: ${{ inputs.checked_urls }}
          CONTEXT: ${{ steps.request.outputs.context }}
          DEPLOYMENT_RECORD_ID: ${{ steps.request.outputs.deployment_record_id }}
          FAILURE_SUMMARY: ${{ inputs.failure_summary }}
          HEALTH_PAYLOAD: ${{ inputs.health_payload }}
          INSTANCE: ${{ steps.request.outputs.instance }}
          PRODUCT: ${{ steps.request.outputs.product }}
          PROMOTION_RECORD_ID: ${{ steps.request.outputs.promotion_record_id }}
          TIMEOUT_SECONDS: ${{ inputs['timeout-seconds'] }}
          VERIFICATION_STATUS: ${{ steps.request.outputs.verification_status }}
          VERIFIED_AT: ${{ steps.request.outputs.verified_at }}
        run: |
          set -euo pipefail
          mkdir -p .launchplane
          node <<'NODE'
          const fs = require('node:fs');

          function optionalIntegerInput(name) {
            const value = String(process.env[name] ?? '').trim();
            if (!value || value.toLowerCase() === 'null') return null;
            const parsed = Number(value);
            if (!Number.isInteger(parsed) || parsed < 1) {
              throw new Error(`${name} must be a positive integer or null.`);
            }
            return parsed;
          }

          function jsonInput(name, fallback) {
            const value = String(process.env[name] ?? '').trim();
            if (!value) return fallback;
            try {
              return JSON.parse(value);
            } catch (error) {
              throw new Error(`${name} must be valid JSON: ${error.message}`);
            }
          }

          const payload = {
            schema_version: 1,
            product: process.env.PRODUCT,
            verification: {
              schema_version: 1,
              context: process.env.CONTEXT,
              instance: process.env.INSTANCE,
              deployment_record_id: process.env.DEPLOYMENT_RECORD_ID,
              promotion_record_id: process.env.PROMOTION_RECORD_ID ?? '',
              verification_status: process.env.VERIFICATION_STATUS,
              verified_at: process.env.VERIFIED_AT,
              checked_urls: jsonInput('CHECKED_URLS', []),
              timeout_seconds: optionalIntegerInput('TIMEOUT_SECONDS'),
              health_payload: jsonInput('HEALTH_PAYLOAD', null),
              failure_summary: process.env.FAILURE_SUMMARY ?? '',
            },
          };
          fs.writeFileSync(
            '.launchplane/generic-web-stable-verification-payload.json',
            `${JSON.stringify(payload)}\n`,
            'utf8',
          );
          NODE

      - name: Request Launchplane generic-web stable verification
        id: lp
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: /v1/drivers/generic-web/stable-verification
          payload-file: .launchplane/generic-web-stable-verification-payload.json
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: >-
            result.deployment_health_status,result.promotion_health_status
          output-paths: >-
            trace_id=trace_id,
            deployment_record_id=records.deployment_record_id,
            inventory_record_id=records.inventory_record_id,
            promotion_record_id=records.promotion_record_id,
            deployment_health_status=result.deployment_health_status,
            promotion_health_status=result.promotion_health_status,
            error_message=result.error_message

      - name: Report verification result
        env:
          DEPLOYMENT_HEALTH_STATUS: ${{ steps.lp.outputs.deployment_health_status }}
          DEPLOYMENT_RECORD_ID: ${{ steps.lp.outputs.deployment_record_id }}
          INVENTORY_RECORD_ID: ${{ steps.lp.outputs.inventory_record_id }}
          PROMOTION_HEALTH_STATUS: ${{ steps.lp.outputs.promotion_health_status }}
          PROMOTION_RECORD_ID: ${{ steps.lp.outputs.promotion_record_id }}
        run: |
          echo "deployment_record_id=$DEPLOYMENT_RECORD_ID"
          echo "inventory_record_id=$INVENTORY_RECORD_ID"
          echo "promotion_record_id=$PROMOTION_RECORD_ID"
          echo "deployment_health_status=$DEPLOYMENT_HEALTH_STATUS"
          echo "promotion_health_status=$PROMOTION_HEALTH_STATUS"
