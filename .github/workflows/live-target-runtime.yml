name: Live Target Runtime

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product profile key
        required: true
        type: string
      context:
        description: Runtime context
        required: true
        type: string
      instance:
        description: Runtime instance
        required: true
        type: string
      mode:
        description: Plan or apply the live runtime sync
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      deploy:
        description: Trigger a deploy after applying env changes
        required: true
        default: false
        type: boolean
      no_cache:
        description: Use no-cache when deploy is requested
        required: true
        default: false
        type: boolean
      deploy_timeout_seconds:
        description: Optional deploy wait timeout in seconds
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  live-target-runtime:
    name: ${{ inputs.mode }} ${{ inputs.context }}/${{ inputs.instance }}
    runs-on: ubuntu-latest
    steps:
      - name: Request live target runtime sync
        id: request
        env:
          PRODUCT: ${{ inputs.product }}
          CONTEXT: ${{ inputs.context }}
          INSTANCE: ${{ inputs.instance }}
          MODE: ${{ inputs.mode }}
          DEPLOY: ${{ inputs.deploy }}
          NO_CACHE: ${{ inputs.no_cache }}
          DEPLOY_TIMEOUT_SECONDS: ${{ inputs.deploy_timeout_seconds }}
        run: |
          set -euo pipefail

          if [ "$MODE" = "dry-run" ]; then
            if [ "$DEPLOY" = "true" ] || [ "$NO_CACHE" = "true" ] || [ -n "$DEPLOY_TIMEOUT_SECONDS" ]; then
              echo "Deploy options require mode=apply." >&2
              exit 1
            fi
          fi

          payload="$(jq -n \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT" \
            --arg instance "$INSTANCE" \
            --arg mode "$MODE" \
            --argjson deploy "$DEPLOY" \
            --argjson no_cache "$NO_CACHE" \
            --arg deploy_timeout_seconds "$DEPLOY_TIMEOUT_SECONDS" \
            '{
              schema_version: 1,
              product: $product,
              context: $context,
              instance: $instance,
              mode: $mode,
              deploy: $deploy,
              no_cache: $no_cache
            }
            | if $deploy_timeout_seconds != "" then
                . + {deploy_timeout_seconds: ($deploy_timeout_seconds | tonumber)}
              else
                .
              end')"

          response_file="live-target-runtime-response.json"
          payload_file="live-target-runtime-request.json"
          jq . <<<"$payload" > "$payload_file"
          idempotency_key="live-target-runtime:${MODE}:${CONTEXT}:${INSTANCE}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          {
            echo "payload_file=${payload_file}"
            echo "response_file=${response_file}"
            echo "idempotency_key=${idempotency_key}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply live target runtime sync
        id: live_target_runtime_request
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/live-target-runtime/apply
          payload-file: ${{ steps.request.outputs.payload_file }}
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          fail-result-paths: ""
          response-output-file: ${{ steps.request.outputs.response_file }}
          log-response-body: "false"

      - name: Summarize live target runtime sync
        env:
          MODE: ${{ inputs.mode }}
          RESPONSE_FILE: ${{ steps.request.outputs.response_file }}
          STATUS_CODE: ${{ steps.live_target_runtime_request.outputs.status-code }}
        run: |
          set -euo pipefail
          if [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
            echo "Launchplane live target runtime request failed with HTTP ${STATUS_CODE}." >&2
            exit 1
          fi

          {
            echo "## Live Target Runtime ${MODE}"
            echo
            jq -r '
              .result as $result
              | "- Context: \($result.context)/\($result.instance)",
                "- Target: \($result.tracked_target.target_name) (\($result.tracked_target.target_type))",
                "- Changed keys: \(($result.runtime_environment.changed_keys // []) | join(", "))",
                "- Runtime key-safety: \($result.runtime_key_safety.status)",
                "- Env updated: \($result.apply.env_updated)",
                "- Deploy triggered: \($result.deploy.triggered)"
            ' "$RESPONSE_FILE"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload response artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-target-runtime-response
          path: |
            live-target-runtime-request.json
            live-target-runtime-response.json
          if-no-files-found: warn
