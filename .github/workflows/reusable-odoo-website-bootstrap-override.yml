---
name: Reusable Odoo Website Bootstrap Override

"on":
  workflow_call:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      instance:
        description: Stable Odoo instance to update.
        required: true
        type: string
      website_bootstrap_payload:
        description: Website bootstrap JSON object with local Odoo route paths.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: odoo-website-bootstrap-override-${{ inputs.product }}-${{ inputs.context }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  write:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      LAUNCHPLANE_SERVICE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_SERVICE_AUDIENCE: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
      PRODUCT: ${{ inputs.product }}
      CONTEXT_NAME: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      WEBSITE_BOOTSTRAP_PAYLOAD: ${{ inputs.website_bootstrap_payload }}
    steps:
      - name: Validate runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${CONTEXT_NAME:?Missing context input}"
          : "${INSTANCE:?Missing instance input}"
          : "${WEBSITE_BOOTSTRAP_PAYLOAD:?Missing website bootstrap payload input}"
          for scalar in PRODUCT CONTEXT_NAME INSTANCE; do
            case "${!scalar}" in
              *$'\n'*)
                echo "${scalar} must be a single-line value." >&2
                exit 1
                ;;
            esac
          done
          for scalar in PRODUCT CONTEXT_NAME; do
            if ! [[ "${!scalar}" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
              echo "${scalar} must be a canonical lowercase identifier." >&2
              exit 1
            fi
          done
          case "$INSTANCE" in
            testing | prod)
              ;;
            *)
              echo "instance must be 'testing' or 'prod'." >&2
              exit 1
              ;;
          esac
          if ! jq -e 'type == "object"' <<< "$WEBSITE_BOOTSTRAP_PAYLOAD" >/dev/null; then
            echo 'website_bootstrap_payload must be a JSON object.' >&2
            exit 1
          fi
          if ! jq -e '
            def local_route_path:
              type == "string" and
              (. == "" or (startswith("/") and (startswith("//") | not)));
            (.homepage_url // "") | local_route_path
          ' <<< "$WEBSITE_BOOTSTRAP_PAYLOAD" >/dev/null; then
            echo 'website_bootstrap.homepage_url must be empty or a local Odoo route path.' >&2
            exit 1
          fi
          if ! jq -e '
            def local_route_path:
              type == "string" and
              (. == "" or (startswith("/") and (startswith("//") | not)));
            all((.routes // [])[]?; (.url // "") | local_route_path)
          ' <<< "$WEBSITE_BOOTSTRAP_PAYLOAD" >/dev/null; then
            echo 'website_bootstrap.routes[].url values must be empty or local Odoo route paths.' >&2
            exit 1
          fi

      - name: Build artifact name
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_slug() {
            local value="$1"
            local slug
            slug="$(
              printf '%s' "$value" |
                LC_ALL=C sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//' |
                cut -c1-80
            )"
            if [ -z "$slug" ]; then
              slug="target"
            fi
            printf '%s' "$slug"
          }
          printf 'name=odoo-website-bootstrap-override-%s-%s-%s\n' \
            "$(artifact_slug "$PRODUCT")" \
            "$(artifact_slug "$CONTEXT_NAME")" \
            "$(artifact_slug "$INSTANCE")" \
            >>"$GITHUB_OUTPUT"

      - name: Write website bootstrap override payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .launchplane
          website_bootstrap="$({
            jq -c . <<< "$WEBSITE_BOOTSTRAP_PAYLOAD"
          })"
          jq -n \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT_NAME" \
            --arg instance "$INSTANCE" \
            --argjson website_bootstrap "$website_bootstrap" \
            '{
              schema_version: 1,
              product: $product,
              override: {
                schema_version: 1,
                product: $product,
                context: $context,
                instance: $instance,
                website_bootstrap: $website_bootstrap,
                source_label: "github-actions:odoo-website-bootstrap-override"
              }
            }' > .launchplane/odoo-website-bootstrap-override-payload.json

          printf 'idempotency_key=%s\n' \
            "odoo-website-bootstrap-override:${PRODUCT}:${CONTEXT_NAME}:${INSTANCE}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            >>"$GITHUB_OUTPUT"

      - name: Write redacted request evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            schema_version,
            product_configured: (
              (.product | type) == "string" and (.product | length) > 0
            ),
            override: {
              schema_version: .override.schema_version,
              context_configured: (
                (.override.context | type) == "string" and
                (.override.context | length) > 0
              ),
              instance: .override.instance,
              website_bootstrap: {
                key_count: (.override.website_bootstrap | keys | length),
                route_count: (.override.website_bootstrap.routes // [] | length),
                homepage_configured: (
                  (.override.website_bootstrap.homepage_url // "") != ""
                )
              },
              source_label: .override.source_label
            }
          }' \
            .launchplane/odoo-website-bootstrap-override-payload.json \
            > .launchplane/odoo-website-bootstrap-override-evidence.json

      - name: Write website bootstrap override
        id: launchplane
        continue-on-error: true
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_SERVICE_URL }}
          audience: ${{ env.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/drivers/odoo/website-bootstrap-override
          payload-file: .launchplane/odoo-website-bootstrap-override-payload.json
          idempotency-key: ${{ steps.payload.outputs.idempotency_key }}
          response-output-file: odoo-website-bootstrap-override.json
          log-response-body: false

      - name: Verify website bootstrap override response
        if: ${{ steps.launchplane.outcome == 'success' }}
        env:
          STATUS_CODE: ${{ steps.launchplane.outputs.status-code }}
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            status,
            trace_id,
            result: {
              website_bootstrap: (.result.website_bootstrap // false)
            },
            error: (
              if .error then
                {code: .error.code, message: .error.message}
              else
                null
              end
            )
          }' odoo-website-bootstrap-override.json
          if [ "$STATUS_CODE" != "202" ]; then
            echo \
              "Launchplane Odoo website-bootstrap override failed with HTTP ${STATUS_CODE}." \
              >&2
            exit 1
          fi
          if [ "$(jq -r '.status' odoo-website-bootstrap-override.json)" != "accepted" ]; then
            echo 'Launchplane Odoo website-bootstrap override was not accepted.' >&2
            exit 1
          fi
          if [ "$(jq -r '.result.website_bootstrap // false' \
            odoo-website-bootstrap-override.json)" != "true" ]; then
            echo 'Launchplane did not persist website-bootstrap intent.' >&2
            exit 1
          fi

      - name: Upload override result
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            ${{ steps.artifact.outputs.name }}-${{ github.run_id }}-${{
            github.run_attempt }}
          path: |
            .launchplane/odoo-website-bootstrap-override-evidence.json
            odoo-website-bootstrap-override.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail when website bootstrap override request failed
        if: ${{ steps.launchplane.outcome == 'failure' }}
        shell: bash
        run: |
          echo 'Website bootstrap override request failed;' \
            'inspect the uploaded redacted evidence and response.' >&2
          exit 1
