---
name: Reusable Product Driver Prod Rollback

"on":
  workflow_call:
    inputs:
      product:
        description: Launchplane product key. Defaults to the caller repository name.
        required: false
        default: ""
        type: string
      context:
        description: Production context. Defaults to the product key.
        required: false
        default: ""
        type: string
      instance:
        description: Production lane instance.
        required: false
        default: prod
        type: string
      promotion_record_id:
        description: Promotion record id for the failed prod-changing action.
        required: true
        type: string
      backup_record_id:
        description: Backup gate record id used to authorize rollback.
        required: true
        type: string
      snapshot_name:
        description: Backup snapshot name, when available.
        required: false
        default: ""
        type: string
      expected_build_revision:
        description: Expected runtime build revision after rollback, when known.
        required: false
        default: ""
        type: string
      expected_build_tag:
        description: Expected runtime build tag after rollback, when known.
        required: false
        default: ""
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "1800000"
        type: string
      launchplane_url:
        description: Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
    outputs:
      promotion_record_id:
        description: Launchplane promotion record ID.
        value: ${{ jobs.prod-rollback.outputs.promotion_record_id }}
      backup_record_id:
        description: Backup gate record ID used by the rollback.
        value: ${{ jobs.prod-rollback.outputs.backup_record_id }}
      snapshot_name:
        description: Snapshot name used by the rollback.
        value: ${{ jobs.prod-rollback.outputs.snapshot_name }}
      rollback_status:
        description: Rollback execution status.
        value: ${{ jobs.prod-rollback.outputs.rollback_status }}
      rollback_health_status:
        description: Rollback health verification status.
        value: ${{ jobs.prod-rollback.outputs.rollback_health_status }}
      rollback_started_at:
        description: Rollback start timestamp.
        value: ${{ jobs.prod-rollback.outputs.rollback_started_at }}
      rollback_finished_at:
        description: Rollback finish timestamp.
        value: ${{ jobs.prod-rollback.outputs.rollback_finished_at }}
      error_message:
        description: Rollback error message, when present.
        value: ${{ jobs.prod-rollback.outputs.error_message }}
      trace_id:
        description: Launchplane trace id for request debugging.
        value: ${{ jobs.prod-rollback.outputs.trace_id }}

permissions:
  contents: read
  id-token: write

jobs:
  prod-rollback:
    outputs:
      promotion_record_id: ${{ steps.lp.outputs.promotion_record_id }}
      backup_record_id: ${{ steps.lp.outputs.backup_record_id }}
      snapshot_name: ${{ steps.lp.outputs.snapshot_name }}
      rollback_status: ${{ steps.lp.outputs.rollback_status }}
      rollback_health_status: ${{ steps.lp.outputs.rollback_health_status }}
      rollback_started_at: ${{ steps.lp.outputs.rollback_started_at }}
      rollback_finished_at: ${{ steps.lp.outputs.rollback_finished_at }}
      error_message: ${{ steps.lp.outputs.error_message }}
      trace_id: ${{ steps.lp.outputs.trace_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Launchplane prod rollback request
        id: request
        env:
          BACKUP_RECORD_ID: ${{ inputs.backup_record_id }}
          CONTEXT: ${{ inputs.context }}
          INSTANCE: ${{ inputs.instance }}
          PRODUCT: ${{ inputs.product }}
          PROMOTION_RECORD_ID: ${{ inputs.promotion_record_id }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCT" ]; then
            PRODUCT="${GITHUB_REPOSITORY#*/}"
          fi
          if [ -z "$CONTEXT" ]; then
            CONTEXT="$PRODUCT"
          fi
          if [ -z "$INSTANCE" ]; then
            INSTANCE="prod"
          fi
          for required in PRODUCT CONTEXT INSTANCE PROMOTION_RECORD_ID BACKUP_RECORD_ID; do
            if [ -z "${!required}" ]; then
              echo "${required} is required." >&2
              exit 1
            fi
          done
          run_scope="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          {
            echo "context=$CONTEXT"
            printf '%s=%s:%s:%s:%s:%s:%s:%s\n' \
              idempotency_key \
              product-driver-prod-rollback \
              "$PRODUCT" \
              "$CONTEXT" \
              "$INSTANCE" \
              "$PROMOTION_RECORD_ID" \
              "$BACKUP_RECORD_ID" \
              "$run_scope"
            echo "instance=$INSTANCE"
            echo "product=$PRODUCT"
            echo "route_path=/v1/drivers/verireel/prod-rollback"
          } >>"$GITHUB_OUTPUT"

      - name: Request Launchplane prod rollback
        id: lp
        uses: cbusillo/launchplane/.github/actions/launchplane-request@main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: ${{ steps.request.outputs.route_path }}
          payload: |-
            {
              "schema_version": 1,
              "rollback": {
                "schema_version": 1
              }
            }
          payload-fields: |-
            product=${{ steps.request.outputs.product }}
            rollback.context=${{ steps.request.outputs.context }}
            rollback.instance=${{ steps.request.outputs.instance }}
            rollback.promotion_record_id=${{ inputs.promotion_record_id }}
            rollback.backup_record_id=${{ inputs.backup_record_id }}
            rollback.snapshot_name=${{ inputs.snapshot_name }}
            rollback.expected_build_revision=${{ inputs.expected_build_revision }}
            rollback.expected_build_tag=${{ inputs.expected_build_tag }}
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: result.rollback_status,result.rollback_health_status
          output-paths: >-
            trace_id=trace_id,
            promotion_record_id=result.promotion_record_id,
            backup_record_id=result.backup_record_id,
            snapshot_name=result.snapshot_name,
            rollback_status=result.rollback_status,
            rollback_health_status=result.rollback_health_status,
            rollback_started_at=result.rollback_started_at,
            rollback_finished_at=result.rollback_finished_at,
            error_message=result.error_message
