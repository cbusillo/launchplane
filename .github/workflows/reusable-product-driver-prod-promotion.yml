---
name: Reusable Product Driver Prod Promotion

"on":
  workflow_call:
    inputs:
      product:
        description: Launchplane product key. Defaults to the caller repository name.
        required: false
        default: ""
        type: string
      context:
        description: Production context. Defaults to the product key.
        required: false
        default: ""
        type: string
      driver:
        description: Product driver id. Defaults to verireel for compatibility.
        required: false
        default: verireel
        type: string
      artifact_id:
        description: Immutable image or Launchplane-resolvable artifact identity.
        required: false
        default: ""
        type: string
      deploy_reference:
        description: Optional provider-facing immutable image tag for digest identities.
        required: false
        default: ""
        type: string
      source_git_ref:
        description: Source git ref attached to promotion evidence.
        required: false
        default: ""
        type: string
      backup_record_id:
        description: Backup gate record id required by the promotion.
        required: false
        default: ""
        type: string
      promotion_record_id:
        description: Promotion record id for this prod promotion.
        required: false
        default: ""
        type: string
      source_health_status:
        description: Source lane health status proven by product-owned checks.
        required: false
        default: skipped
        type: string
      expected_build_revision:
        description: Expected runtime build revision, when known.
        required: false
        default: ""
        type: string
      expected_build_tag:
        description: Expected runtime build tag, when known.
        required: false
        default: ""
        type: string
      from_instance:
        description: Source stable lane instance.
        required: false
        default: testing
        type: string
      to_instance:
        description: Destination stable lane instance.
        required: false
        default: prod
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "2700000"
        type: string
      launchplane_url:
        description: Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
    outputs:
      promotion_record_id:
        description: Launchplane promotion record ID.
        value: ${{ jobs.prod-promotion.outputs.promotion_record_id }}
      deployment_record_id:
        description: Launchplane deployment record ID.
        value: ${{ jobs.prod-promotion.outputs.deployment_record_id }}
      backup_record_id:
        description: Backup gate record ID used by the promotion.
        value: ${{ jobs.prod-promotion.outputs.backup_record_id }}
      deploy_status:
        description: Production deploy status.
        value: ${{ jobs.prod-promotion.outputs.deploy_status }}
      rollout_status:
        description: Production rollout status.
        value: ${{ jobs.prod-promotion.outputs.rollout_status }}
      migration_status:
        description: Production migration status.
        value: ${{ jobs.prod-promotion.outputs.migration_status }}
      health_status:
        description: Production health status.
        value: ${{ jobs.prod-promotion.outputs.health_status }}
      deploy_started_at:
        description: Deployment start timestamp.
        value: ${{ jobs.prod-promotion.outputs.deploy_started_at }}
      deploy_finished_at:
        description: Deployment finish timestamp.
        value: ${{ jobs.prod-promotion.outputs.deploy_finished_at }}
      target_name:
        description: Resolved target name.
        value: ${{ jobs.prod-promotion.outputs.target_name }}
      target_category:
        description: Resolved target category.
        value: ${{ jobs.prod-promotion.outputs.target_category }}
      target_id:
        description: Resolved target id.
        value: ${{ jobs.prod-promotion.outputs.target_id }}
      error_message:
        description: Promotion error message, when present.
        value: ${{ jobs.prod-promotion.outputs.error_message }}
      trace_id:
        description: Launchplane trace id for request debugging.
        value: ${{ jobs.prod-promotion.outputs.trace_id }}
      release_tuple_id:
        description: Release tuple ID for drivers that write one.
        value: ${{ jobs.prod-promotion.outputs.release_tuple_id }}
      backup_status:
        description: Backup gate status for drivers that return one.
        value: ${{ jobs.prod-promotion.outputs.backup_status }}
      promotion_status:
        description: Promotion status for drivers that return one.
        value: ${{ jobs.prod-promotion.outputs.promotion_status }}
      deployment_status:
        description: Deployment status for drivers that return one.
        value: ${{ jobs.prod-promotion.outputs.deployment_status }}
      post_deploy_status:
        description: Post-deploy status for drivers that run post-deploy after promotion.
        value: ${{ jobs.prod-promotion.outputs.post_deploy_status }}
      destination_health_status:
        description: Destination health status for drivers that return one.
        value: ${{ jobs.prod-promotion.outputs.destination_health_status }}

permissions:
  contents: read
  id-token: write

jobs:
  prod-promotion:
    outputs:
      promotion_record_id: ${{ steps.lp_verireel.outputs.promotion_record_id || steps.lp_odoo.outputs.promotion_record_id }}
      deployment_record_id: ${{ steps.lp_verireel.outputs.deployment_record_id || steps.lp_odoo.outputs.deployment_record_id }}
      backup_record_id: ${{ steps.lp_verireel.outputs.backup_record_id || steps.lp_odoo.outputs.backup_record_id }}
      deploy_status: ${{ steps.lp_verireel.outputs.deploy_status }}
      rollout_status: ${{ steps.lp_verireel.outputs.rollout_status }}
      migration_status: ${{ steps.lp_verireel.outputs.migration_status }}
      health_status: ${{ steps.lp_verireel.outputs.health_status }}
      deploy_started_at: ${{ steps.lp_verireel.outputs.deploy_started_at }}
      deploy_finished_at: ${{ steps.lp_verireel.outputs.deploy_finished_at }}
      target_name: ${{ steps.lp_verireel.outputs.target_name }}
      target_category: ${{ steps.lp_verireel.outputs.target_category }}
      target_id: ${{ steps.lp_verireel.outputs.target_id }}
      error_message: ${{ steps.lp_verireel.outputs.error_message || steps.lp_odoo.outputs.error_message }}
      trace_id: ${{ steps.lp_verireel.outputs.trace_id || steps.lp_odoo.outputs.trace_id }}
      release_tuple_id: ${{ steps.lp_odoo.outputs.release_tuple_id }}
      backup_status: ${{ steps.lp_odoo.outputs.backup_status }}
      promotion_status: ${{ steps.lp_odoo.outputs.promotion_status }}
      deployment_status: ${{ steps.lp_odoo.outputs.deployment_status }}
      post_deploy_status: ${{ steps.lp_odoo.outputs.post_deploy_status }}
      destination_health_status: ${{ steps.lp_odoo.outputs.destination_health_status }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Launchplane prod promotion request
        id: request
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          BACKUP_RECORD_ID: ${{ inputs.backup_record_id }}
          CONTEXT: ${{ inputs.context }}
          DEPLOY_REFERENCE: ${{ inputs.deploy_reference }}
          DRIVER: ${{ inputs.driver }}
          FROM_INSTANCE: ${{ inputs.from_instance }}
          PRODUCT: ${{ inputs.product }}
          PROMOTION_RECORD_ID: ${{ inputs.promotion_record_id }}
          SOURCE_GIT_REF: ${{ inputs.source_git_ref }}
          TO_INSTANCE: ${{ inputs.to_instance }}
        run: |
          set -euo pipefail
          DRIVER="${DRIVER,,}"
          if [ "$DRIVER" = "verireel" ]; then
            if [ -z "$PRODUCT" ]; then
              PRODUCT="${GITHUB_REPOSITORY#*/}"
            fi
            if [ -z "$CONTEXT" ]; then
              CONTEXT="$PRODUCT"
            fi
            required_inputs="PRODUCT CONTEXT FROM_INSTANCE TO_INSTANCE ARTIFACT_ID SOURCE_GIT_REF BACKUP_RECORD_ID PROMOTION_RECORD_ID"
            route_path="/v1/drivers/verireel/prod-promotion"
          elif [ "$DRIVER" = "odoo" ]; then
            required_inputs="PRODUCT CONTEXT FROM_INSTANCE TO_INSTANCE"
            route_path="/v1/drivers/odoo/prod-promotion-run"
            if [ "$FROM_INSTANCE" != "testing" ] || [ "$TO_INSTANCE" != "prod" ]; then
              echo "Odoo prod promotion requires testing -> prod." >&2
              exit 1
            fi
          else
            echo "Unsupported driver: $DRIVER" >&2
            exit 1
          fi
          for required in $required_inputs; do
            if [ -z "${!required}" ]; then
              echo "${required} is required." >&2
              exit 1
            fi
          done
          run_scope="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          if [ "$DRIVER" = "odoo" ]; then
            idempotency_key="opp:$CONTEXT:$run_scope"
          else
            idempotency_key="product-driver-prod-promotion:$PRODUCT:$CONTEXT:$FROM_INSTANCE:$TO_INSTANCE:$PROMOTION_RECORD_ID:$DEPLOY_REFERENCE:$run_scope"
          fi
          {
            echo "context=$CONTEXT"
            echo "driver=$DRIVER"
            echo "idempotency_key=$idempotency_key"
            echo "from_instance=$FROM_INSTANCE"
            echo "product=$PRODUCT"
            echo "request_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "route_path=$route_path"
            echo "to_instance=$TO_INSTANCE"
          } >>"$GITHUB_OUTPUT"

      - name: Request Launchplane VeriReel prod promotion
        id: lp_verireel
        if: ${{ steps.request.outputs.driver == 'verireel' }}
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: ${{ steps.request.outputs.route_path }}
          payload: |-
            {
              "schema_version": 1,
              "promotion": {
                "schema_version": 1
              }
            }
          payload-fields: |-
            product=${{ steps.request.outputs.product }}
            promotion.context=${{ steps.request.outputs.context }}
            promotion.from_instance=${{ steps.request.outputs.from_instance }}
            promotion.to_instance=${{ steps.request.outputs.to_instance }}
            promotion.artifact_id=${{ inputs.artifact_id }}
            promotion.deploy_reference=${{ inputs.deploy_reference }}
            promotion.source_git_ref=${{ inputs.source_git_ref }}
            promotion.backup_record_id=${{ inputs.backup_record_id }}
            promotion.promotion_record_id=${{ inputs.promotion_record_id }}
            promotion.source_health_status=${{ inputs.source_health_status }}
            promotion.expected_build_revision=${{ inputs.expected_build_revision }}
            promotion.expected_build_tag=${{ inputs.expected_build_tag }}
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: >-
            result.deploy_status,result.rollout_status,
            result.migration_status,result.health_status
          output-paths: >-
            trace_id=trace_id,
            promotion_record_id=result.promotion_record_id,
            deployment_record_id=result.deployment_record_id,
            backup_record_id=result.backup_record_id,
            deploy_status=result.deploy_status,
            deploy_started_at=result.deploy_started_at,
            deploy_finished_at=result.deploy_finished_at,
            rollout_status=result.rollout_status,
            migration_status=result.migration_status,
            health_status=result.health_status,
            target_name=result.target_name,
            target_category=result.target_category,
            target_id=result.target_id,
            error_message=result.error_message

      - name: Request Launchplane Odoo prod promotion
        id: lp_odoo
        if: ${{ steps.request.outputs.driver == 'odoo' }}
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: ${{ steps.request.outputs.route_path }}
          payload: >-
            {"schema_version":1,"run":{"schema_version":1}}
          payload-fields: |-
            product=${{ steps.request.outputs.product }}
            run.context=${{ steps.request.outputs.context }}
            run.request_id=${{ steps.request.outputs.request_id }}
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: >-
            result.run_status,result.promotion_status,
            result.deployment_status,result.post_deploy_status,
            result.destination_health_status
          output-paths: >-
            trace_id=trace_id,
            backup_record_id=result.backup_record_id,
            backup_status=result.backup_status,
            promotion_record_id=result.promotion_record_id,
            deployment_record_id=result.deployment_record_id,
            release_tuple_id=result.release_tuple_id,
            promotion_status=result.promotion_status,
            deployment_status=result.deployment_status,
            post_deploy_status=result.post_deploy_status,
            destination_health_status=result.destination_health_status,
            error_message=result.error_message
