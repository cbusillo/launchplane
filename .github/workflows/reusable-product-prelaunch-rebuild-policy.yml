---
name: Reusable Product Prelaunch Rebuild Policy

"on":
  workflow_call:
    inputs:
      mode:
        description: Plan the change or apply a reviewed plan.
        required: true
        type: string
      product:
        description: Existing Launchplane product profile key.
        required: true
        type: string
      context:
        description: Exact DB-backed stable lane context.
        required: true
        type: string
      instance:
        description: Exact DB-backed stable lane instance.
        required: true
        type: string
      enabled:
        description: Whether the lane prelaunch rebuild policy is enabled.
        required: true
        type: boolean
      approval_issue_url:
        description: Issue-backed approval URL required when enabled.
        required: false
        default: ""
        type: string
      data_source_mode:
        description: Empty or upstream-restore rebuild source.
        required: true
        type: string
      policy_confirmation:
        description: Confirmation phrase required by target replacement.
        required: false
        default: ""
        type: string
      expected_target_name:
        description: Exact DB-backed target name proof required when enabled.
        required: false
        default: ""
        type: string
      expected_domains_json:
        description: JSON array of expected domain proofs required when enabled.
        required: false
        default: "[]"
        type: string
      reviewed_plan_sha256:
        description: Plan SHA-256 from the reviewed dry run; required for apply.
        required: false
        default: ""
        type: string
      reason:
        description: Operator reason recorded with the request.
        required: true
        type: string
      idempotency_key:
        description: Unique idempotency key required for apply mode.
        required: false
        default: ""
        type: string
      confirmation:
        description: Exact workflow confirmation required for apply mode.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    launchplane-product-prelaunch-rebuild-policy-${{ inputs.product }}-${{
    inputs.context }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      MODE: ${{ inputs.mode }}
      PRODUCT: ${{ inputs.product }}
      CONTEXT: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      ENABLED: ${{ inputs.enabled }}
      APPROVAL_ISSUE_URL: ${{ inputs.approval_issue_url }}
      DATA_SOURCE_MODE: ${{ inputs.data_source_mode }}
      POLICY_CONFIRMATION: ${{ inputs.policy_confirmation }}
      EXPECTED_TARGET_NAME: ${{ inputs.expected_target_name }}
      EXPECTED_DOMAINS_JSON: ${{ inputs.expected_domains_json }}
      REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
      REASON: ${{ inputs.reason }}
      IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate product prelaunch rebuild policy request
        shell: bash
        run: |
          set -euo pipefail
          for required in PRODUCT CONTEXT INSTANCE REASON; do
            if [[ -z "${!required//[[:space:]]/}" ]]; then
              echo "${required} is required." >&2
              exit 1
            fi
            case "${!required}" in
              *$'\n'*)
                echo "${required} must be a single-line value." >&2
                exit 1
                ;;
            esac
          done
          case "$DATA_SOURCE_MODE" in
            empty|upstream_restore) ;;
            *)
              echo "data_source_mode must be empty or upstream_restore." >&2
              exit 1
              ;;
          esac
          if ! jq -e 'type == "array" and all(.[]; type == "string")' \
            <<<"$EXPECTED_DOMAINS_JSON" >/dev/null; then
            echo "expected_domains_json must be a JSON array of strings." >&2
            exit 1
          fi
          if [ "$ENABLED" = "true" ]; then
            for required in APPROVAL_ISSUE_URL POLICY_CONFIRMATION EXPECTED_TARGET_NAME; do
              if [[ -z "${!required//[[:space:]]/}" ]]; then
                echo "${required} is required when enabled is true." >&2
                exit 1
              fi
              case "${!required}" in
                *$'\n'*)
                  echo "${required} must be a single-line value." >&2
                  exit 1
                  ;;
              esac
            done
            if ! jq -e '
              length > 0 and
              all(.[]; (gsub("^[[:space:]]+|[[:space:]]+$"; "") | length) > 0)
            ' <<<"$EXPECTED_DOMAINS_JSON" >/dev/null; then
              echo "expected_domains_json must contain non-empty strings when enabled." >&2
              exit 1
            fi
          else
            if [[ -n "${APPROVAL_ISSUE_URL//[[:space:]]/}" ]] ||
              [[ -n "${POLICY_CONFIRMATION//[[:space:]]/}" ]] ||
              [[ -n "${EXPECTED_TARGET_NAME//[[:space:]]/}" ]] ||
              [ "$(jq 'length' <<<"$EXPECTED_DOMAINS_JSON")" != "0" ]; then
              echo "Disabled policy requests must clear all destructive proof fields." >&2
              exit 1
            fi
          fi
          case "$MODE" in
            dry-run)
              if [[ -n "${REVIEWED_PLAN_SHA256//[[:space:]]/}" ]]; then
                echo "reviewed_plan_sha256 must be empty for dry-run." >&2
                exit 1
              fi
              if [[ -n "${IDEMPOTENCY_KEY//[[:space:]]/}" ]]; then
                echo "idempotency_key must be empty for dry-run." >&2
                exit 1
              fi
              if [[ -n "${CONFIRMATION//[[:space:]]/}" ]]; then
                echo "confirmation must be empty for dry-run." >&2
                exit 1
              fi
              ;;
            apply)
              if [ "$CONFIRMATION" != "APPLY PRODUCT PRELAUNCH REBUILD POLICY" ]; then
                echo "Exact confirmation text is required for apply." >&2
                exit 1
              fi
              if ! [[ "$REVIEWED_PLAN_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
                echo "apply requires the reviewed dry-run plan SHA-256." >&2
                exit 1
              fi
              if [[ -z "${IDEMPOTENCY_KEY//[[:space:]]/}" ]]; then
                echo "idempotency_key is required for apply." >&2
                exit 1
              fi
              ;;
            *)
              echo "mode must be dry-run or apply." >&2
              exit 1
              ;;
          esac

      - name: Build product prelaunch rebuild policy request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file="$RUNNER_TEMP/product-prelaunch-rebuild-policy-request.json"
          jq -n \
            --arg mode "$MODE" \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT" \
            --arg instance "$INSTANCE" \
            --argjson enabled "$ENABLED" \
            --arg approval_issue_url "$APPROVAL_ISSUE_URL" \
            --arg data_source_mode "$DATA_SOURCE_MODE" \
            --arg policy_confirmation "$POLICY_CONFIRMATION" \
            --arg expected_target_name "$EXPECTED_TARGET_NAME" \
            --argjson expected_domains "$EXPECTED_DOMAINS_JSON" \
            --arg reviewed_plan_sha256 "$REVIEWED_PLAN_SHA256" \
            --arg reason "$REASON" \
            '{
              schema_version: 1,
              mode: $mode,
              product: $product,
              context: $context,
              instance: $instance,
              enabled: $enabled,
              approval_issue_url: $approval_issue_url,
              data_source_mode: $data_source_mode,
              confirmation: $policy_confirmation,
              expected_target_name: $expected_target_name,
              expected_domains: $expected_domains,
              reviewed_plan_sha256: $reviewed_plan_sha256,
              reason: $reason
            }' >"$request_file"
          echo "request_file=$request_file" >>"$GITHUB_OUTPUT"

      - name: Request product prelaunch rebuild policy operation
        id: prelaunch_rebuild_policy_request
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/product-profiles/prelaunch-rebuild/apply
          payload-file: ${{ steps.request.outputs.request_file }}
          idempotency-key: ${{ inputs.idempotency_key }}
          fail-result-paths: ""
          log-response-body: "false"
          response-output-file: product-prelaunch-rebuild-policy.json

      - name: Check product prelaunch rebuild policy response
        shell: bash
        env:
          STATUS_CODE: ${{ steps.prelaunch_rebuild_policy_request.outputs.status-code }}
        run: |
          set -euo pipefail
          if [ "$STATUS_CODE" != "202" ]; then
            jq '{status, trace_id, error}' product-prelaunch-rebuild-policy.json >&2 || true
            echo "Product prelaunch rebuild policy request failed with HTTP ${STATUS_CODE}." >&2
            exit 1
          fi
          if [ "$(jq -r '.status // ""' product-prelaunch-rebuild-policy.json)" != "accepted" ]; then
            jq '{status, trace_id, error}' product-prelaunch-rebuild-policy.json >&2 || true
            echo "Product prelaunch rebuild policy request was not accepted." >&2
            exit 1
          fi

      - name: Upload product prelaunch rebuild policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-prelaunch-rebuild-policy-result
          path: product-prelaunch-rebuild-policy.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize product prelaunch rebuild policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          domain_count="$(jq 'length' <<<"$EXPECTED_DOMAINS_JSON")"
          {
            echo "## Product prelaunch rebuild policy"
            echo
            echo "- Product: ${PRODUCT}"
            echo "- Lane: ${CONTEXT}/${INSTANCE}"
            echo "- Operation mode: ${MODE}"
            echo "- Enabled: ${ENABLED}"
            echo "- Data source mode: ${DATA_SOURCE_MODE}"
            echo "- Expected domain count: ${domain_count}"
            echo "- Evidence artifact: product-prelaunch-rebuild-policy-result"
            if [ -f product-prelaunch-rebuild-policy.json ]; then
              echo "- Status: $(jq -r '.status // "unknown"' product-prelaunch-rebuild-policy.json)"
              echo "- Operation: $(jq -r '.result.operation // "none"' product-prelaunch-rebuild-policy.json)"
              echo "- Changed: $(jq -r '.result.changed // false' product-prelaunch-rebuild-policy.json)"
              echo "- Applied: $(jq -r '.result.applied // false' product-prelaunch-rebuild-policy.json)"
              echo "- Data authority: $(jq -r '.result.data_authority // "unknown"' product-prelaunch-rebuild-policy.json)"
              echo "- Monitoring intent: $(jq -r '.result.monitoring_intent // "unknown"' product-prelaunch-rebuild-policy.json)"
              echo "- Plan SHA-256: $(jq -r '.result.plan_sha256 // ""' product-prelaunch-rebuild-policy.json)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
