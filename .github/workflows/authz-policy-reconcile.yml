---
name: Manage Launchplane Authorization

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Review or apply the protected operator-managed desired rule set.
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply
      managed_set:
        description: Protected operator-managed desired rule set to reconcile.
        required: true
        default: primary
        type: choice
        options:
          - primary
          - authz-policy-reconcile
          - generic-web-onboarding
          - manager-preview-approval
          - owner-acceptance
          - product-owner-policy-admin
          - product-health-monitoring
          - product-retirement
          - detached-application-retirement
          - preview-feedback-remediation
          - generic-web-route-binding
          - odoo-route-binding
          - odoo-external-route-binding
          - odoo-testing-ingress-route
          - odoo-testing-route-binding-refresh
          - odoo-testing-target-replacement
          - odoo-opw-preview-feedback
          - odoo-opw-production-enrollment
          - odoo-production-enrollment
          - odoo-production-operation-read
          - odoo-production-backup-restore
      reviewed_plan_sha256:
        description: Plan SHA-256 returned by the reviewed dry run; required for apply.
        required: false
        type: string
      reason:
        description: Single-line operator reason bound into the reviewed plan.
        required: true
        type: string
      related_issue:
        description: Single-line issue or change reference bound into the reviewed plan.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  reconcile-primary:
    if: ${{ inputs.managed_set == 'primary' }}
    uses: cbusillo/launchplane/.github/workflows/reusable-authz-policy-reconcile.yml@39aecc250d6dee91204e24673725bd1ea1ca6bda # main
    with:
      mode: ${{ inputs.mode }}
      reviewed_plan_sha256: ${{ inputs.reviewed_plan_sha256 }}
      reason: ${{ inputs.reason }}
      related_issue: ${{ inputs.related_issue }}
    secrets:
      managed_set_json: ${{ secrets.LAUNCHPLANE_AUTHZ_MANAGED_SET_JSON }}

  reconcile-authz-policy-reconcile:
    if: ${{ inputs.managed_set == 'authz-policy-reconcile' }}
    uses: cbusillo/launchplane/.github/workflows/reusable-authz-policy-reconcile.yml@39aecc250d6dee91204e24673725bd1ea1ca6bda # main
    with:
      mode: ${{ inputs.mode }}
      expected_managed_set_id: operator.authz-policy-reconcile
      reviewed_plan_sha256: ${{ inputs.reviewed_plan_sha256 }}
      reason: ${{ inputs.reason }}
      related_issue: ${{ inputs.related_issue }}
    secrets:
      managed_set_json: ${{ secrets.LAUNCHPLANE_AUTHZ_POLICY_RECONCILE_MANAGED_SET_JSON }}

  reconcile-manager-preview-approval:
