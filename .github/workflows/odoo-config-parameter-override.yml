---
name: Odoo Config Parameter Override

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      instance:
        description: Stable Odoo instance to update.
        required: true
        type: choice
        options:
          - testing
          - prod
      key:
        description: Odoo config parameter key.
        required: true
        type: choice
        options:
          - web.base.url
      value:
        description: Non-secret config parameter value.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: odoo-config-parameter-override-${{ inputs.product }}-${{ inputs.context }}-${{ inputs.instance }}-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ inputs.product }}
      CONTEXT_NAME: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      KEY_NAME: ${{ inputs.key }}
      VALUE: ${{ inputs.value }}
    steps:
      - name: Validate runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${CONTEXT_NAME:?Missing context input}"
          : "${INSTANCE:?Missing instance input}"
          : "${KEY_NAME:?Missing key input}"
          : "${VALUE:?Missing value input}"
          if [ "$KEY_NAME" != "web.base.url" ]; then
            echo 'Only web.base.url is currently service-writable.' >&2
            exit 1
          fi
          for scalar in PRODUCT CONTEXT_NAME INSTANCE KEY_NAME VALUE; do
            case "${!scalar}" in
              *$'\n'*)
                echo "${scalar} must be a single-line value." >&2
                exit 1
                ;;
            esac
          done

      - name: Write config parameter override payload
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .launchplane
          jq -n \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT_NAME" \
            --arg instance "$INSTANCE" \
            --arg key "$KEY_NAME" \
            --arg value "$VALUE" \
            '{
              schema_version: 1,
              product: $product,
              override: {
                schema_version: 1,
                product: $product,
                context: $context,
                instance: $instance,
                key: $key,
                value: $value,
                source_label: "github-actions:odoo-config-parameter-override"
              }
            }' > .launchplane/odoo-config-parameter-override-payload.json

          printf 'idempotency_key=%s\n' \
            "odoo-config-parameter-override:${PRODUCT}:${CONTEXT_NAME}:${INSTANCE}:${KEY_NAME}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            >>"$GITHUB_OUTPUT"

      - name: Write config parameter override
        id: launchplane
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/drivers/odoo/config-parameter-override
          payload-file: .launchplane/odoo-config-parameter-override-payload.json
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          response-output-file: odoo-config-parameter-override.json

      - name: Verify config parameter override response
        shell: bash
        run: |
          set -euo pipefail
          jq . odoo-config-parameter-override.json
          if [ "${{ steps.launchplane.outputs.status-code }}" != "202" ]; then
            echo \
              "Launchplane Odoo config-parameter override failed with HTTP ${{ steps.launchplane.outputs.status-code }}." \
              >&2
            exit 1
          fi
          if [ "$(jq -r '.status' odoo-config-parameter-override.json)" != "accepted" ]; then
            echo 'Launchplane Odoo config-parameter override was not accepted.' >&2
            exit 1
          fi

      - name: Upload override result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odoo-config-parameter-override-${{ inputs.product }}-${{ inputs.context }}-${{ inputs.instance }}
          path: odoo-config-parameter-override.json
