---
name: Odoo Config Parameter Override

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        default: odoo-tenant-cm
        type: string
      context:
        description: Launchplane Odoo context.
        required: true
        default: cm
        type: choice
        options:
          - cm
      instance:
        description: Stable Odoo instance to update.
        required: true
        default: testing
        type: choice
        options:
          - testing
      key:
        description: Odoo config parameter key.
        required: true
        default: web.base.url
        type: choice
        options:
          - web.base.url
      value:
        description: Non-secret config parameter value.
        required: true
        default: https://cm-testing.shinycomputers.com
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: odoo-config-parameter-override-${{ inputs.product }}-${{ inputs.context }}-${{ inputs.instance }}-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  write:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      PRODUCT: ${{ inputs.product }}
      CONTEXT_NAME: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      KEY_NAME: ${{ inputs.key }}
      VALUE: ${{ inputs.value }}
      LAUNCHPLANE_SERVICE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_SERVICE_AUDIENCE: launchplane.shinycomputers.com
    steps:
      - name: Validate runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${CONTEXT_NAME:?Missing context input}"
          : "${INSTANCE:?Missing instance input}"
          : "${KEY_NAME:?Missing key input}"
          : "${VALUE:?Missing value input}"
          if [ "$CONTEXT_NAME" != "cm" ] || [ "$INSTANCE" != "testing" ]; then
            echo 'This workflow currently writes only cm/testing Odoo overrides.' >&2
            exit 1
          fi
          if [ "$KEY_NAME" != "web.base.url" ]; then
            echo 'Only web.base.url is currently service-writable.' >&2
            exit 1
          fi
          if [ -z "${LAUNCHPLANE_SERVICE_URL:-}" ] || [ -z "${LAUNCHPLANE_SERVICE_AUDIENCE:-}" ]; then
            echo 'Missing Launchplane service URL or OIDC audience repository variable.' >&2
            exit 1
          fi

      - name: Write config parameter override
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$({
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${LAUNCHPLANE_SERVICE_AUDIENCE}" \
            | jq -r '.value'
          })"
          payload="$({
            jq -n \
              --arg product "$PRODUCT" \
              --arg context "$CONTEXT_NAME" \
              --arg instance "$INSTANCE" \
              --arg key "$KEY_NAME" \
              --arg value "$VALUE" \
              '{
                schema_version: 1,
                product: $product,
                override: {
                  schema_version: 1,
                  product: $product,
                  context: $context,
                  instance: $instance,
                  key: $key,
                  value: $value,
                  source_label: "github-actions:odoo-config-parameter-override"
                }
              }'
          })"
          status_code="$({
            curl -sS \
              -o odoo-config-parameter-override.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: odoo-config-parameter-override:${PRODUCT}:${CONTEXT_NAME}:${INSTANCE}:${KEY_NAME}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" \
              "${LAUNCHPLANE_SERVICE_URL}/v1/drivers/odoo/config-parameter-override"
          })"
          jq . odoo-config-parameter-override.json
          if [ "$status_code" != "202" ]; then
            echo "Launchplane Odoo config-parameter override failed with HTTP ${status_code}." >&2
            exit 1
          fi

      - name: Upload override result
        uses: actions/upload-artifact@v7
        with:
          name: odoo-config-parameter-override-${{ inputs.product }}-${{ inputs.context }}-${{ inputs.instance }}
          path: odoo-config-parameter-override.json
