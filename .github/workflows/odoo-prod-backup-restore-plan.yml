---
name: Odoo Prod Backup Restore Plan

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Exact Launchplane Odoo product key.
        required: true
        type: string
      context:
        description: Exact Launchplane production context.
        required: true
        type: string
      backup_record_id:
        description: Exact passing Odoo backup-gate record ID.
        required: true
        type: string
      verification_record_id:
        description: Exact passing durable backup-verification record ID.
        required: true
        type: string
      expected_current_artifact_id:
        description: Exact current production artifact ID.
        required: true
        type: string
      expected_old_db_volume:
        description: Exact current corrupt DB volume to preserve.
        required: true
        type: string
      expected_new_db_volume:
        description: >-
          Exact fresh DB volume already recorded in runtime authority.
        required: true
        type: string
      expected_data_volume:
        description: Exact unchanged Odoo data volume.
        required: true
        type: string
      expected_log_volume:
        description: Exact unchanged Odoo log volume.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    odoo-prod-backup-restore-plan-${{ inputs.product }}-${{ inputs.context }}
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-odoo-prod-backup-restore-plan.yml
    with:
      product: ${{ inputs.product }}
      context: ${{ inputs.context }}
      backup_record_id: ${{ inputs.backup_record_id }}
      verification_record_id: ${{ inputs.verification_record_id }}
      expected_current_artifact_id: ${{ inputs.expected_current_artifact_id }}
      expected_old_db_volume: ${{ inputs.expected_old_db_volume }}
      expected_new_db_volume: ${{ inputs.expected_new_db_volume }}
      expected_data_volume: ${{ inputs.expected_data_volume }}
      expected_log_volume: ${{ inputs.expected_log_volume }}
