name: Deploy Launchplane

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build when deploying a new Launchplane image.
        required: false
        type: string
      image_reference:
        description: Exact image reference to deploy instead of building a new one.
        required: false
        type: string
      omit_every_code_env:
        description: Temporarily omit Every Code env for one compatibility deploy.
        required: false
        default: false
        type: boolean
      omit_terminal_agent_env:
        description: Temporarily omit terminal-agent env for one compatibility deploy.
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: launchplane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      LAUNCHPLANE_DOKPLOY_TARGET_ID: ${{ vars.LAUNCHPLANE_DOKPLOY_TARGET_ID }}
      LAUNCHPLANE_DOKPLOY_TARGET_TYPE: ${{ vars.LAUNCHPLANE_DOKPLOY_TARGET_TYPE }}
      LAUNCHPLANE_DEPLOY_HEALTH_URLS: ${{ vars.LAUNCHPLANE_DEPLOY_HEALTH_URLS }}
      LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS: ${{ vars.LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS }}
      LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS: ${{ vars.LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS }}
      LAUNCHPLANE_IMAGE_REPOSITORY: ${{ vars.LAUNCHPLANE_IMAGE_REPOSITORY }}
      LAUNCHPLANE_GITHUB_CLIENT_ID: ${{ vars.LAUNCHPLANE_GITHUB_CLIENT_ID }}
      LAUNCHPLANE_PUBLIC_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_COOKIE_SECURE: ${{ vars.LAUNCHPLANE_COOKIE_SECURE }}
      LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS: ${{ vars.LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT }}
      LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_REPOSITORIES: ${{ vars.LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_REPOSITORIES }}
      LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_LIMIT: ${{ vars.LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_LIMIT }}
      LAUNCHPLANE_WORK_GRAPH_GH_BINARY: ${{ vars.LAUNCHPLANE_WORK_GRAPH_GH_BINARY }}
      LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS: ${{ vars.LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS }}
      DISCORD_BLUE_DOKPLOY_TARGET_ID: ${{ vars.DISCORD_BLUE_DOKPLOY_TARGET_ID }}
      LAUNCHPLANE_GITHUB_CLIENT_SECRET: ${{ secrets.LAUNCHPLANE_GITHUB_CLIENT_SECRET }}
      LAUNCHPLANE_SESSION_SECRET: ${{ secrets.LAUNCHPLANE_SESSION_SECRET }}
      LAUNCHPLANE_WORK_GRAPH_GH_TOKEN: ${{ secrets.LAUNCHPLANE_WORK_GRAPH_GH_TOKEN }}
      LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN: ${{ secrets.LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN }}
      LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET: ${{ secrets.LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET }}
      LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN: ${{ secrets.LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN }}
      LAUNCHPLANE_TERMINAL_AGENT_SUBJECT: ${{ vars.LAUNCHPLANE_TERMINAL_AGENT_SUBJECT }}
      LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL: ${{ vars.LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL }}
      LAUNCHPLANE_LOCAL_OPERATOR_TOKEN: ${{ secrets.LAUNCHPLANE_LOCAL_OPERATOR_TOKEN }}
      LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT: ${{ vars.LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT }}
      LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL: ${{ vars.LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL }}
      LAUNCHPLANE_PRODUCT_CONFIG_OPERATOR_LOGINS: ${{ vars.LAUNCHPLANE_PRODUCT_CONFIG_OPERATOR_LOGINS }}
      LAUNCHPLANE_PRODUCT_CONFIG_OPERATOR_PRODUCTS: ${{ vars.LAUNCHPLANE_PRODUCT_CONFIG_OPERATOR_PRODUCTS }}
      LAUNCHPLANE_PRODUCT_CONFIG_OPERATOR_CONTEXTS: ${{ vars.LAUNCHPLANE_PRODUCT_CONFIG_OPERATOR_CONTEXTS }}
      ODOO_CM_TESTING_DOKPLOY_TARGET_ID: ${{ vars.ODOO_CM_TESTING_DOKPLOY_TARGET_ID }}
      ODOO_CM_PROD_DOKPLOY_TARGET_ID: ${{ vars.ODOO_CM_PROD_DOKPLOY_TARGET_ID }}
      ODOO_OPW_TESTING_DOKPLOY_TARGET_ID: ${{ vars.ODOO_OPW_TESTING_DOKPLOY_TARGET_ID }}
      ODOO_OPW_PROD_DOKPLOY_TARGET_ID: ${{ vars.ODOO_OPW_PROD_DOKPLOY_TARGET_ID }}
      LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST: ${{ secrets.LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST }}
      LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN: ${{ secrets.LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN }}
    steps:
      - name: Resolve deploy inputs
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            checkout_ref="${{ github.event.workflow_run.head_sha }}"
          elif [ -n "${{ inputs.git_ref }}" ]; then
            checkout_ref="${{ inputs.git_ref }}"
          else
            checkout_ref="${{ github.sha }}"
          fi

          image_repository="${LAUNCHPLANE_IMAGE_REPOSITORY}"
          if [ -z "$image_repository" ]; then
            image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi

          deploy_image_reference="${{ inputs.image_reference }}"
          if [ -n "$deploy_image_reference" ]; then
            should_build="false"
          else
            should_build="true"
          fi

          {
            echo "checkout_ref=$checkout_ref"
            echo "image_repository=$image_repository"
            echo "should_build=$should_build"
            echo "deploy_image_reference=$deploy_image_reference"
          } >> "$GITHUB_OUTPUT"

      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${LAUNCHPLANE_DOKPLOY_TARGET_TYPE:?Missing LAUNCHPLANE_DOKPLOY_TARGET_TYPE variable}"
          : "${LAUNCHPLANE_DOKPLOY_TARGET_ID:?Missing LAUNCHPLANE_DOKPLOY_TARGET_ID variable}"
          : "${LAUNCHPLANE_DEPLOY_HEALTH_URLS:?Missing LAUNCHPLANE_DEPLOY_HEALTH_URLS variable}"

      - name: Resolve Launchplane service endpoint
        id: service
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw_urls = [value.strip() for value in os.environ["LAUNCHPLANE_DEPLOY_HEALTH_URLS"].split(",") if value.strip()]
          if not raw_urls:
              raise SystemExit("Missing Launchplane deploy health URL.")
          parsed = urlsplit(raw_urls[0])
          if not parsed.scheme or not parsed.netloc or not parsed.hostname:
              raise SystemExit(f"Could not derive Launchplane service endpoint from {raw_urls[0]!r}.")
          service_url = f"{parsed.scheme}://{parsed.netloc}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"service_url={service_url}\n")
              handle.write(f"service_audience={parsed.hostname}\n")
          PY

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.prep.outputs.checkout_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Set up Docker Buildx
        if: steps.prep.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.prep.outputs.should_build == 'true'
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          registry_username="${GHCR_USERNAME:-${GITHUB_ACTOR}}"
          registry_password="${GHCR_TOKEN:-${DEFAULT_GITHUB_TOKEN}}"

          if [ -z "$registry_password" ]; then
            echo "Missing GHCR_TOKEN secret and GitHub token fallback." >&2
            exit 1
          fi

          printf '%s' "$registry_password" | docker login ghcr.io --username "$registry_username" --password-stdin

      - name: Build and push Launchplane image
        if: steps.prep.outputs.should_build == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ${{ steps.prep.outputs.image_repository }}:main
            ${{ steps.prep.outputs.image_repository }}:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.image_repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.prep.outputs.image_repository }}:buildcache,mode=max

      - name: Resolve image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_reference="${{ steps.prep.outputs.deploy_image_reference }}"
          if [ -z "$image_reference" ]; then
            image_reference="${{ steps.prep.outputs.image_repository }}@${{ steps.build.outputs.digest }}"
          fi
          echo "image_reference=$image_reference" >> "$GITHUB_OUTPUT"

      - name: Request Launchplane self deploy
        id: self_deploy
        shell: bash
        run: |
          set -euo pipefail

          request_deploy() {
            local response_file="$1"
            local request_payload=""
            local idempotency_key=""
            local service_env_json=""
            local oidc_token=""

            oidc_token="$({
              curl -fsSL \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
              | jq -r '.value'
            })"

            previous_runtime_payload="$(curl -fsSL \
              -H "Authorization: Bearer ${oidc_token}" \
              "${{ steps.service.outputs.service_url }}/v1/service/runtime" 2>/dev/null || true)"
            previous_image_reference="$(printf '%s' "$previous_runtime_payload" | jq -r '.runtime.docker_image_reference // empty' 2>/dev/null || true)"
            echo "previous_image_reference=$previous_image_reference" >> "$GITHUB_OUTPUT"

            service_env_json="$({
              jq -n \
                --arg github_client_id "${LAUNCHPLANE_GITHUB_CLIENT_ID:-}" \
                --arg github_client_secret "${LAUNCHPLANE_GITHUB_CLIENT_SECRET:-}" \
                --arg public_url "${LAUNCHPLANE_PUBLIC_URL:-}" \
                --arg session_secret "${LAUNCHPLANE_SESSION_SECRET:-}" \
                --arg cookie_secure "${LAUNCHPLANE_COOKIE_SECURE:-}" \
                --arg bootstrap_admin_emails "${LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS:-}" \
                --arg work_graph_project_owner "${LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER:-}" \
                --arg work_graph_project_number "${LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER:-}" \
                --arg work_graph_project_limit "${LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT:-}" \
                --arg work_graph_project_signal_limit "${LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT:-}" \
                --arg work_graph_issue_inbox_repositories "${LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_REPOSITORIES:-}" \
                --arg work_graph_issue_inbox_limit "${LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_LIMIT:-}" \
                --arg work_graph_gh_binary "${LAUNCHPLANE_WORK_GRAPH_GH_BINARY:-}" \
                --arg work_graph_gh_token "${LAUNCHPLANE_WORK_GRAPH_GH_TOKEN:-}" \
                --arg enable_every_code_runtime_secrets "${LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS:-}" \
                --arg every_code_worker_token "${LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN:-}" \
                --arg every_code_webhook_secret "${LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET:-}" \
                --arg terminal_agent_read_token "${LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN:-}" \
                --arg terminal_agent_subject "${LAUNCHPLANE_TERMINAL_AGENT_SUBJECT:-}" \
                --arg terminal_agent_token_label "${LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL:-}" \
                --arg local_operator_token "${LAUNCHPLANE_LOCAL_OPERATOR_TOKEN:-}" \
                --arg local_operator_subject "${LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT:-}" \
                --arg local_operator_token_label "${LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL:-}" \
                --argjson omit_every_code_env '${{ inputs.omit_every_code_env || false }}' \
                --argjson omit_terminal_agent_env '${{ inputs.omit_terminal_agent_env != false }}' \
                '(
                  {
                  LAUNCHPLANE_GITHUB_CLIENT_ID: $github_client_id,
                  LAUNCHPLANE_GITHUB_CLIENT_SECRET: $github_client_secret,
                  LAUNCHPLANE_PUBLIC_URL: $public_url,
                  LAUNCHPLANE_SESSION_SECRET: $session_secret,
                  LAUNCHPLANE_COOKIE_SECURE: $cookie_secure,
                  LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS: $bootstrap_admin_emails
                  }
                  + (
                    if ($omit_terminal_agent_env | not) then
                      {
                        LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN: $terminal_agent_read_token,
                        LAUNCHPLANE_TERMINAL_AGENT_SUBJECT: $terminal_agent_subject,
                        LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL: $terminal_agent_token_label,
                        LAUNCHPLANE_LOCAL_OPERATOR_TOKEN: $local_operator_token,
                        LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT: $local_operator_subject,
                        LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL: $local_operator_token_label
                      }
                    else
                      {}
                    end
                  )
                  + (
                    if (($omit_every_code_env | not)
                      and (($enable_every_code_runtime_secrets | ascii_downcase) == "true")) then
                      {
                        LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN: $every_code_worker_token,
                        LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET: $every_code_webhook_secret
                      }
                    else
                      {}
                    end
                  )
                  + (
                    if $work_graph_gh_token != "" then
                      {
                        LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER: $work_graph_project_owner,
                        LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER: $work_graph_project_number,
                        LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT: $work_graph_project_limit,
                        LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT: $work_graph_project_signal_limit,
                        LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_REPOSITORIES: $work_graph_issue_inbox_repositories,
                        LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_LIMIT: $work_graph_issue_inbox_limit,
                        LAUNCHPLANE_WORK_GRAPH_GH_BINARY: $work_graph_gh_binary,
                        GH_TOKEN: $work_graph_gh_token
                      }
                    else
                      {}
                    end
                  )
                ) | with_entries(select(.value != ""))'
            })"
            request_payload="$({
              jq -n \
                --arg target_type "$LAUNCHPLANE_DOKPLOY_TARGET_TYPE" \
                --arg target_id "$LAUNCHPLANE_DOKPLOY_TARGET_ID" \
                --arg image_reference "${{ steps.image.outputs.image_reference }}" \
                --argjson service_env "$service_env_json" \
                '{schema_version: 1, product: "launchplane", deploy: ({target_type: $target_type, target_id: $target_id, image_reference: $image_reference} + (if ($service_env | length) > 0 then {oauth_env: $service_env} else {} end))}'
            })"
            idempotency_key="launchplane-self-deploy:${{ steps.image.outputs.image_reference }}:${{ github.run_id }}:${{ github.run_attempt }}:db-authz"

            curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: ${idempotency_key}" \
              --data "$request_payload" \
              "${{ steps.service.outputs.service_url }}/v1/drivers/launchplane/self-deploy"
          }

          response_file="$(mktemp)"
          status_code="$(request_deploy "$response_file")"
          if [ "$status_code" = "200" ] || [ "$status_code" = "202" ]; then
            cat "$response_file"
            exit 0
          fi

          cat "$response_file" >&2
          echo "Launchplane self deploy request failed with HTTP ${status_code}." >&2
          exit 1

      - name: Wait for deployed Launchplane image
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + ${LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS:-600} + ${LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS:-180}))
          expected_image_reference="${{ steps.image.outputs.image_reference }}"
          last_report_seconds=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            all_healthy=1
            health_report=""
            while IFS= read -r raw_url; do
              health_url="$(printf '%s' "$raw_url" | xargs)"
              if [ -z "$health_url" ]; then
                continue
              fi
              health_response_file="$(mktemp)"
              health_status_code="$(curl -sSL -o "$health_response_file" -w '%{http_code}' "$health_url" 2>/dev/null || true)"
              health_status_value="$(jq -r '.status // empty' "$health_response_file" 2>/dev/null || true)"
              if [ -z "$health_report" ]; then
                health_report="${health_url}=${health_status_code:-curl_failed}:${health_status_value:-unknown}"
              else
                health_report="$health_report,${health_url}=${health_status_code:-curl_failed}:${health_status_value:-unknown}"
              fi
              if [ "$health_status_code" != "200" ] || [ "$health_status_value" != "ok" ]; then
                all_healthy=0
                rm -f "$health_response_file"
                break
              fi
              rm -f "$health_response_file"
            done < <(printf '%s\n' "$LAUNCHPLANE_DEPLOY_HEALTH_URLS" | tr ',' '\n')

            oidc_token="$({
              curl -fsSL \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
              | jq -r '.value'
            })"

            runtime_response_file="$(mktemp)"
            runtime_status_code="$(curl -sS \
              -o "$runtime_response_file" \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${{ steps.service.outputs.service_url }}/v1/service/runtime" 2>/dev/null || true)"
            actual_image_reference="$(jq -r '.runtime.docker_image_reference // empty' "$runtime_response_file" 2>/dev/null || true)"
            runtime_error_code="$(jq -r '.error.code // empty' "$runtime_response_file" 2>/dev/null || true)"

            if [ "$all_healthy" -eq 1 ] && [ "$runtime_status_code" = "200" ] && [ "$actual_image_reference" = "$expected_image_reference" ]; then
              rm -f "$runtime_response_file"
              exit 0
            fi
            if [ "$((SECONDS - last_report_seconds))" -ge 30 ]; then
              echo "Waiting for Launchplane image. health=${health_report:-none} runtime_http=${runtime_status_code:-curl_failed} runtime_image=${actual_image_reference:-none} runtime_error=${runtime_error_code:-none}"
              last_report_seconds=$SECONDS
            fi
            rm -f "$runtime_response_file"
            sleep 5
          done

          echo "Timed out waiting for Launchplane image '$expected_image_reference' to become live and healthy." >&2
          exit 1

      - name: Capture failed Launchplane deploy diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST:-}" ] || [ -z "${LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN:-}" ]; then
            echo "Skipping Dokploy diagnostics because emergency Dokploy credentials are unavailable."
            exit 0
          fi

          uv run python - <<'PY' || true
          import json
          import os
          import re
          from typing import Any
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen


          SECRET_VALUE_PATTERN = re.compile(
              r"(?i)(\b[A-Z0-9_]*(?:PASSWORD|PASS|TOKEN|SECRET|API_KEY|ACCESS_KEY|PRIVATE_KEY)[A-Z0-9_]*\s*[=:]\s*)([^\s,;]+)"
          )
          BEARER_PATTERN = re.compile(r"(?i)(bearer\s+)[A-Za-z0-9._~+/=-]+")


          def required_env(key: str) -> str:
              value = os.environ.get(key, "").strip()
              if not value:
                  raise RuntimeError(f"Missing required environment variable: {key}")
              return value


          def redact(value: str) -> str:
              value = SECRET_VALUE_PATTERN.sub(r"\1[redacted]", value)
              return BEARER_PATTERN.sub(r"\1[redacted]", value)


          def request_json(
              *,
              host: str,
              token: str,
              path: str,
              query: dict[str, str | int] | None = None,
          ) -> Any:
              url = f"{host.rstrip('/')}{path}"
              if query:
                  url = f"{url}?{urlencode(query)}"
              request = Request(url, headers={"x-api-key": token})
              try:
                  with urlopen(request, timeout=30) as response:
                      raw = response.read()
              except HTTPError as error:
                  body = error.read().decode(errors="replace")
                  return {"error": f"HTTP {error.code}", "body": redact(body)[:2000]}
              except URLError as error:
                  return {"error": str(error.reason)}
              if not raw:
                  return {}
              try:
                  return json.loads(raw)
              except json.JSONDecodeError:
                  return {"raw": redact(raw.decode(errors="replace"))[:4000]}


          host = required_env("LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST")
          token = required_env("LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN")
          target_type = required_env("LAUNCHPLANE_DOKPLOY_TARGET_TYPE")
          target_id = required_env("LAUNCHPLANE_DOKPLOY_TARGET_ID")
          expected_image = required_env("LAUNCHPLANE_EXPECTED_IMAGE_REFERENCE")

          if target_type != "compose":
              print(f"Dokploy diagnostics currently support compose targets only; target_type={target_type}.")
              raise SystemExit(0)

          target_payload = request_json(
              host=host,
              token=token,
              path="/api/compose.one",
              query={"composeId": target_id},
          )
          if not isinstance(target_payload, dict):
              print("Dokploy compose.one returned a non-object payload.")
              raise SystemExit(0)

          raw_env = str(target_payload.get("env") or "")
          env_keys: list[str] = []
          docker_image_reference = ""
          for line in raw_env.splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#") or "=" not in stripped:
                  continue
              key, value = stripped.split("=", 1)
              env_key = key.strip()
              env_keys.append(env_key)
              if env_key == "DOCKER_IMAGE_REFERENCE":
                  docker_image_reference = value.strip()

          domains = [
              {
                  "host": domain.get("host"),
                  "port": domain.get("port"),
                  "path": domain.get("path"),
                  "serviceName": domain.get("serviceName"),
              }
              for domain in target_payload.get("domains") or []
              if isinstance(domain, dict)
          ]
          deployments = [
              {
                  "deploymentId": deployment.get("deploymentId"),
                  "status": deployment.get("status"),
                  "title": deployment.get("title"),
                  "createdAt": deployment.get("createdAt"),
              }
              for deployment in target_payload.get("deployments") or []
              if isinstance(deployment, dict)
          ][-8:]
          print(
              json.dumps(
                  {
                      "diagnostic": "dokploy-target",
                      "target_type": target_type,
                      "target_id": target_id,
                      "appName": target_payload.get("appName"),
                      "composeStatus": target_payload.get("composeStatus"),
                      "domains": domains,
                      "env_keys": sorted(env_keys),
                      "docker_image_matches_expected": docker_image_reference == expected_image,
                      "deployments": deployments,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )

          containers_payload = request_json(host=host, token=token, path="/api/docker.getContainers")
          containers = containers_payload if isinstance(containers_payload, list) else []
          app_name = str(target_payload.get("appName") or "")
          target_containers: list[dict[str, Any]] = []
          for container in containers:
              if not isinstance(container, dict):
                  continue
              container_name = str(container.get("name") or "")
              if app_name and app_name not in container_name:
                  continue
              target_containers.append(
                  {
                      "containerId": container.get("containerId") or container.get("id") or container.get("Id"),
                      "name": container_name,
                      "image": container.get("image") or container.get("Image"),
                      "state": container.get("state") or container.get("State"),
                      "status": container.get("status") or container.get("Status"),
                      "ports": container.get("ports") or container.get("Ports"),
                  }
              )
          print(
              json.dumps(
                  {"diagnostic": "dokploy-containers", "containers": target_containers},
                  indent=2,
                  sort_keys=True,
              )
          )

          for container in target_containers:
              container_id = str(container.get("containerId") or "").strip()
              if not container_id:
                  continue
              log_payload = request_json(
                  host=host,
                  token=token,
                  path="/api/compose.readLogs",
                  query={"composeId": target_id, "containerId": container_id, "tail": 300, "since": "1h"},
              )
              log_text = log_payload if isinstance(log_payload, str) else json.dumps(log_payload)
              print(f"--- Dokploy logs for {container.get('name')} ({container_id}) ---")
              for line in log_text.splitlines()[-120:]:
                  print(redact(line)[:1200])
          PY
        env:
          LAUNCHPLANE_EXPECTED_IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}

      - name: Roll back failed Launchplane deploy
        if: failure() && steps.self_deploy.outputs.previous_image_reference != ''
        shell: bash
        run: |
          set -euo pipefail

          previous_image_reference="${{ steps.self_deploy.outputs.previous_image_reference }}"
          if [ -z "$previous_image_reference" ] || [ "$previous_image_reference" = "${{ steps.image.outputs.image_reference }}" ]; then
            echo "No distinct previous Launchplane image reference is available for rollback."
            exit 0
          fi

          oidc_token="$({
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
            | jq -r '.value'
          })"

          rollback_payload="$({
            jq -n \
              --arg target_type "$LAUNCHPLANE_DOKPLOY_TARGET_TYPE" \
              --arg target_id "$LAUNCHPLANE_DOKPLOY_TARGET_ID" \
              --arg image_reference "$previous_image_reference" \
              '{schema_version: 1, product: "launchplane", deploy: {target_type: $target_type, target_id: $target_id, image_reference: $image_reference, no_cache: true}}'
          })"
          rollback_response_file="$(mktemp)"
          rollback_status="$(curl -sS \
            -o "$rollback_response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: launchplane-self-deploy-rollback:${previous_image_reference}:${{ github.run_id }}:${{ github.run_attempt }}" \
            --data "$rollback_payload" \
            "${{ steps.service.outputs.service_url }}/v1/drivers/launchplane/self-deploy" || true)"
          if [ "$rollback_status" != "200" ] && [ "$rollback_status" != "202" ]; then
            cat "$rollback_response_file" >&2
            echo "Launchplane rollback request failed with HTTP ${rollback_status}; trying direct Dokploy fallback." >&2

            if [ -z "${LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST:-}" ] || [ -z "${LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN:-}" ]; then
              echo "Direct Dokploy rollback fallback requires LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST and LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN secrets." >&2
              exit 1
            fi

          LAUNCHPLANE_ROLLBACK_IMAGE_REFERENCE="$previous_image_reference" uv run python - <<'PY'
          import json
          import os

          from control_plane import dokploy as control_plane_dokploy


          def _required_env(key: str) -> str:
              value = os.environ.get(key, "").strip()
              if not value:
                  raise SystemExit(f"Missing required environment variable: {key}")
              return value


          host = _required_env("LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST")
          token = _required_env("LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN")
          target_type = _required_env("LAUNCHPLANE_DOKPLOY_TARGET_TYPE")
          target_id = _required_env("LAUNCHPLANE_DOKPLOY_TARGET_ID")
          image_reference = _required_env("LAUNCHPLANE_ROLLBACK_IMAGE_REFERENCE")
          deploy_timeout_seconds = int(
              os.environ.get("LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS") or "600"
          )

          target_payload = control_plane_dokploy.fetch_dokploy_target_payload(
              host=host,
              token=token,
              target_type=target_type,
              target_id=target_id,
          )
          raw_env_text = str(target_payload.get("env") or "")
          updated_env_text = control_plane_dokploy.render_dokploy_env_text_with_overrides(
              raw_env_text,
              updates={"DOCKER_IMAGE_REFERENCE": image_reference},
          )
          if updated_env_text != raw_env_text:
              control_plane_dokploy.update_dokploy_target_env(
                  host=host,
                  token=token,
                  target_type=target_type,
                  target_id=target_id,
                  target_payload=target_payload,
                  env_text=updated_env_text,
              )
          latest_before = control_plane_dokploy.latest_deployment_for_target(
              host=host,
              token=token,
              target_type=target_type,
              target_id=target_id,
          )
          control_plane_dokploy.trigger_deployment(
              host=host,
              token=token,
              target_type=target_type,
              target_id=target_id,
              no_cache=True,
          )
          deployment_result = control_plane_dokploy.wait_for_target_deployment(
              host=host,
              token=token,
              target_type=target_type,
              target_id=target_id,
              before_key=control_plane_dokploy.deployment_key(latest_before),
              timeout_seconds=deploy_timeout_seconds,
          )
          print(
              json.dumps(
                  {
                      "status": "accepted",
                      "target_type": target_type,
                      "target_id": target_id,
                      "image_reference": image_reference,
                      "image_reference_changed": updated_env_text != raw_env_text,
                      "deployment_result": deployment_result,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
          else
            cat "$rollback_response_file"
          fi

          deadline=$((SECONDS + ${LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS:-600} + ${LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS:-180}))
          last_report_seconds=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            all_healthy=1
            health_report=""
            while IFS= read -r raw_url; do
              health_url="$(printf '%s' "$raw_url" | xargs)"
              if [ -z "$health_url" ]; then
                continue
              fi
              health_response_file="$(mktemp)"
              health_status_code="$(curl -sSL -o "$health_response_file" -w '%{http_code}' "$health_url" 2>/dev/null || true)"
              health_status_value="$(jq -r '.status // empty' "$health_response_file" 2>/dev/null || true)"
              if [ -z "$health_report" ]; then
                health_report="${health_url}=${health_status_code:-curl_failed}:${health_status_value:-unknown}"
              else
                health_report="$health_report,${health_url}=${health_status_code:-curl_failed}:${health_status_value:-unknown}"
              fi
              if [ "$health_status_code" != "200" ] || [ "$health_status_value" != "ok" ]; then
                all_healthy=0
                rm -f "$health_response_file"
                break
              fi
              rm -f "$health_response_file"
            done < <(printf '%s\n' "$LAUNCHPLANE_DEPLOY_HEALTH_URLS" | tr ',' '\n')

            oidc_token="$({
              curl -fsSL \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
              | jq -r '.value'
            })"

            runtime_response_file="$(mktemp)"
            runtime_status_code="$(curl -sS \
              -o "$runtime_response_file" \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${oidc_token}" \
              "${{ steps.service.outputs.service_url }}/v1/service/runtime" 2>/dev/null || true)"
            actual_image_reference="$(jq -r '.runtime.docker_image_reference // empty' "$runtime_response_file" 2>/dev/null || true)"
            runtime_error_code="$(jq -r '.error.code // empty' "$runtime_response_file" 2>/dev/null || true)"

            if [ "$all_healthy" -eq 1 ] && [ "$runtime_status_code" = "200" ] && [ "$actual_image_reference" = "$previous_image_reference" ]; then
              echo "Rolled Launchplane back to $previous_image_reference."
              rm -f "$runtime_response_file"
              exit 0
            fi
            if [ "$((SECONDS - last_report_seconds))" -ge 30 ]; then
              echo "Waiting for Launchplane rollback image. health=${health_report:-none} runtime_http=${runtime_status_code:-curl_failed} runtime_image=${actual_image_reference:-none} runtime_error=${runtime_error_code:-none}"
              last_report_seconds=$SECONDS
            fi
            rm -f "$runtime_response_file"
            sleep 5
          done

          echo "Timed out waiting for Launchplane rollback image '$previous_image_reference' to become live and healthy." >&2
          exit 1

      - name: Ensure product context workflow authz grants
        shell: bash
        env:
          LAUNCHPLANE_SERVICE_AUDIENCE: ${{ steps.service.outputs.service_audience }}
          LAUNCHPLANE_SERVICE_URL: ${{ steps.service.outputs.service_url }}
        run: bash scripts/deploy/ensure-authz-grants.sh
