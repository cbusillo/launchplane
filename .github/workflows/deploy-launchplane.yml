name: Deploy Launchplane

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build when deploying a new Launchplane image.
        required: false
        type: string
      image_reference:
        description: Exact image reference to deploy instead of building a new one.
        required: false
        type: string
      omit_every_code_env:
        description: Temporarily omit Every Code env for one compatibility deploy.
        required: false
        default: false
        type: boolean
      omit_terminal_agent_env:
        description: Temporarily omit terminal-agent env for one compatibility deploy.
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: launchplane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      LAUNCHPLANE_DOKPLOY_TARGET_ID: ${{ vars.LAUNCHPLANE_DOKPLOY_TARGET_ID }}
      LAUNCHPLANE_DOKPLOY_TARGET_TYPE: ${{ vars.LAUNCHPLANE_DOKPLOY_TARGET_TYPE }}
      LAUNCHPLANE_DEPLOY_HEALTH_URLS: ${{ vars.LAUNCHPLANE_DEPLOY_HEALTH_URLS }}
      LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS: ${{ vars.LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS }}
      LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS: ${{ vars.LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS }}
      LAUNCHPLANE_IMAGE_REPOSITORY: ${{ vars.LAUNCHPLANE_IMAGE_REPOSITORY }}
      LAUNCHPLANE_GITHUB_CLIENT_ID: ${{ vars.LAUNCHPLANE_GITHUB_CLIENT_ID }}
      LAUNCHPLANE_PUBLIC_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_COOKIE_SECURE: ${{ vars.LAUNCHPLANE_COOKIE_SECURE }}
      LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS: ${{ vars.LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT }}
      LAUNCHPLANE_WORK_GRAPH_GH_BINARY: ${{ vars.LAUNCHPLANE_WORK_GRAPH_GH_BINARY }}
      LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS: ${{ vars.LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS }}
      DISCORD_BLUE_DOKPLOY_TARGET_ID: ${{ vars.DISCORD_BLUE_DOKPLOY_TARGET_ID }}
      LAUNCHPLANE_GITHUB_CLIENT_SECRET: ${{ secrets.LAUNCHPLANE_GITHUB_CLIENT_SECRET }}
      LAUNCHPLANE_SESSION_SECRET: ${{ secrets.LAUNCHPLANE_SESSION_SECRET }}
      LAUNCHPLANE_WORK_GRAPH_GH_TOKEN: ${{ secrets.LAUNCHPLANE_WORK_GRAPH_GH_TOKEN }}
      LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN: ${{ secrets.LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN }}
      LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET: ${{ secrets.LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET }}
      LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN: ${{ secrets.LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN }}
      LAUNCHPLANE_TERMINAL_AGENT_SUBJECT: ${{ vars.LAUNCHPLANE_TERMINAL_AGENT_SUBJECT }}
      LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL: ${{ vars.LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL }}
      LAUNCHPLANE_LOCAL_OPERATOR_TOKEN: ${{ secrets.LAUNCHPLANE_LOCAL_OPERATOR_TOKEN }}
      LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT: ${{ vars.LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT }}
      LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL: ${{ vars.LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL }}
      ODOO_CM_TESTING_DOKPLOY_TARGET_ID: ${{ vars.ODOO_CM_TESTING_DOKPLOY_TARGET_ID }}
      LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST: ${{ secrets.LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST }}
      LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN: ${{ secrets.LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN }}
    steps:
      - name: Resolve deploy inputs
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            checkout_ref="${{ github.event.workflow_run.head_sha }}"
          elif [ -n "${{ inputs.git_ref }}" ]; then
            checkout_ref="${{ inputs.git_ref }}"
          else
            checkout_ref="${{ github.sha }}"
          fi

          image_repository="${LAUNCHPLANE_IMAGE_REPOSITORY}"
          if [ -z "$image_repository" ]; then
            image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi

          deploy_image_reference="${{ inputs.image_reference }}"
          if [ -n "$deploy_image_reference" ]; then
            should_build="false"
          else
            should_build="true"
          fi

          {
            echo "checkout_ref=$checkout_ref"
            echo "image_repository=$image_repository"
            echo "should_build=$should_build"
            echo "deploy_image_reference=$deploy_image_reference"
          } >> "$GITHUB_OUTPUT"

      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${LAUNCHPLANE_DOKPLOY_TARGET_TYPE:?Missing LAUNCHPLANE_DOKPLOY_TARGET_TYPE variable}"
          : "${LAUNCHPLANE_DOKPLOY_TARGET_ID:?Missing LAUNCHPLANE_DOKPLOY_TARGET_ID variable}"
          : "${LAUNCHPLANE_DEPLOY_HEALTH_URLS:?Missing LAUNCHPLANE_DEPLOY_HEALTH_URLS variable}"

      - name: Resolve Launchplane service endpoint
        id: service
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw_urls = [value.strip() for value in os.environ["LAUNCHPLANE_DEPLOY_HEALTH_URLS"].split(",") if value.strip()]
          if not raw_urls:
              raise SystemExit("Missing Launchplane deploy health URL.")
          parsed = urlsplit(raw_urls[0])
          if not parsed.scheme or not parsed.netloc or not parsed.hostname:
              raise SystemExit(f"Could not derive Launchplane service endpoint from {raw_urls[0]!r}.")
          service_url = f"{parsed.scheme}://{parsed.netloc}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"service_url={service_url}\n")
              handle.write(f"service_audience={parsed.hostname}\n")
          PY

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.prep.outputs.checkout_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Set up Docker Buildx
        if: steps.prep.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.prep.outputs.should_build == 'true'
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          registry_username="${GHCR_USERNAME:-${GITHUB_ACTOR}}"
          registry_password="${GHCR_TOKEN:-${DEFAULT_GITHUB_TOKEN}}"

          if [ -z "$registry_password" ]; then
            echo "Missing GHCR_TOKEN secret and GitHub token fallback." >&2
            exit 1
          fi

          printf '%s' "$registry_password" | docker login ghcr.io --username "$registry_username" --password-stdin

      - name: Build and push Launchplane image
        if: steps.prep.outputs.should_build == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ${{ steps.prep.outputs.image_repository }}:main
            ${{ steps.prep.outputs.image_repository }}:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.image_repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.prep.outputs.image_repository }}:buildcache,mode=max

      - name: Resolve image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_reference="${{ steps.prep.outputs.deploy_image_reference }}"
          if [ -z "$image_reference" ]; then
            image_reference="${{ steps.prep.outputs.image_repository }}@${{ steps.build.outputs.digest }}"
          fi
          echo "image_reference=$image_reference" >> "$GITHUB_OUTPUT"

      - name: Request Launchplane self deploy
        id: self_deploy
        shell: bash
        run: |
          set -euo pipefail

          request_deploy() {
            local response_file="$1"
            local request_payload=""
            local idempotency_key=""
            local service_env_json=""
            local oidc_token=""

            oidc_token="$({
              curl -fsSL \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
              | jq -r '.value'
            })"

            previous_runtime_payload="$(curl -fsSL \
              -H "Authorization: Bearer ${oidc_token}" \
              "${{ steps.service.outputs.service_url }}/v1/service/runtime" 2>/dev/null || true)"
            previous_image_reference="$(printf '%s' "$previous_runtime_payload" | jq -r '.runtime.docker_image_reference // empty' 2>/dev/null || true)"
            echo "previous_image_reference=$previous_image_reference" >> "$GITHUB_OUTPUT"

            service_env_json="$({
              jq -n \
                --arg github_client_id "${LAUNCHPLANE_GITHUB_CLIENT_ID:-}" \
                --arg github_client_secret "${LAUNCHPLANE_GITHUB_CLIENT_SECRET:-}" \
                --arg public_url "${LAUNCHPLANE_PUBLIC_URL:-}" \
                --arg session_secret "${LAUNCHPLANE_SESSION_SECRET:-}" \
                --arg cookie_secure "${LAUNCHPLANE_COOKIE_SECURE:-}" \
                --arg bootstrap_admin_emails "${LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS:-}" \
                --arg work_graph_project_owner "${LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER:-}" \
                --arg work_graph_project_number "${LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER:-}" \
                --arg work_graph_project_limit "${LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT:-}" \
                --arg work_graph_project_signal_limit "${LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT:-}" \
                --arg work_graph_gh_binary "${LAUNCHPLANE_WORK_GRAPH_GH_BINARY:-}" \
                --arg work_graph_gh_token "${LAUNCHPLANE_WORK_GRAPH_GH_TOKEN:-}" \
                --arg enable_every_code_runtime_secrets "${LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS:-}" \
                --arg every_code_worker_token "${LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN:-}" \
                --arg every_code_webhook_secret "${LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET:-}" \
                --arg terminal_agent_read_token "${LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN:-}" \
                --arg terminal_agent_subject "${LAUNCHPLANE_TERMINAL_AGENT_SUBJECT:-}" \
                --arg terminal_agent_token_label "${LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL:-}" \
                --arg local_operator_token "${LAUNCHPLANE_LOCAL_OPERATOR_TOKEN:-}" \
                --arg local_operator_subject "${LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT:-}" \
                --arg local_operator_token_label "${LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL:-}" \
                --argjson omit_every_code_env '${{ inputs.omit_every_code_env || false }}' \
                --argjson omit_terminal_agent_env '${{ inputs.omit_terminal_agent_env != false }}' \
                '(
                  {
                  LAUNCHPLANE_GITHUB_CLIENT_ID: $github_client_id,
                  LAUNCHPLANE_GITHUB_CLIENT_SECRET: $github_client_secret,
                  LAUNCHPLANE_PUBLIC_URL: $public_url,
                  LAUNCHPLANE_SESSION_SECRET: $session_secret,
                  LAUNCHPLANE_COOKIE_SECURE: $cookie_secure,
                  LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS: $bootstrap_admin_emails
                  }
                  + (
                    if ($omit_terminal_agent_env | not) then
                      {
                        LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN: $terminal_agent_read_token,
                        LAUNCHPLANE_TERMINAL_AGENT_SUBJECT: $terminal_agent_subject,
                        LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL: $terminal_agent_token_label,
                        LAUNCHPLANE_LOCAL_OPERATOR_TOKEN: $local_operator_token,
                        LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT: $local_operator_subject,
                        LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL: $local_operator_token_label
                      }
                    else
                      {}
                    end
                  )
                  + (
                    if (($omit_every_code_env | not)
                      and (($enable_every_code_runtime_secrets | ascii_downcase) == "true")) then
                      {
                        LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN: $every_code_worker_token,
                        LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET: $every_code_webhook_secret
                      }
                    else
                      {}
                    end
                  )
                  + (
                    if $work_graph_gh_token != "" then
                      {
                        LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER: $work_graph_project_owner,
                        LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER: $work_graph_project_number,
                        LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT: $work_graph_project_limit,
                        LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT: $work_graph_project_signal_limit,
                        LAUNCHPLANE_WORK_GRAPH_GH_BINARY: $work_graph_gh_binary,
                        GH_TOKEN: $work_graph_gh_token
                      }
                    else
                      {}
                    end
                  )
                ) | with_entries(select(.value != ""))'
            })"
            request_payload="$({
              jq -n \
                --arg target_type "$LAUNCHPLANE_DOKPLOY_TARGET_TYPE" \
                --arg target_id "$LAUNCHPLANE_DOKPLOY_TARGET_ID" \
                --arg image_reference "${{ steps.image.outputs.image_reference }}" \
                --argjson service_env "$service_env_json" \
                '{schema_version: 1, product: "launchplane", deploy: ({target_type: $target_type, target_id: $target_id, image_reference: $image_reference} + (if ($service_env | length) > 0 then {oauth_env: $service_env} else {} end))}'
            })"
            idempotency_key="launchplane-self-deploy:${{ steps.image.outputs.image_reference }}:${{ github.run_id }}:${{ github.run_attempt }}:db-authz"

            curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: ${idempotency_key}" \
              --data "$request_payload" \
              "${{ steps.service.outputs.service_url }}/v1/drivers/launchplane/self-deploy"
          }

          response_file="$(mktemp)"
          status_code="$(request_deploy "$response_file")"
          if [ "$status_code" = "200" ] || [ "$status_code" = "202" ]; then
            cat "$response_file"
            exit 0
          fi

          cat "$response_file" >&2
          echo "Launchplane self deploy request failed with HTTP ${status_code}." >&2
          exit 1

      - name: Wait for deployed Launchplane image
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + ${LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS:-600} + ${LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS:-180}))
          expected_image_reference="${{ steps.image.outputs.image_reference }}"
          while [ "$SECONDS" -lt "$deadline" ]; do
            all_healthy=1
            while IFS= read -r raw_url; do
              health_url="$(printf '%s' "$raw_url" | xargs)"
              if [ -z "$health_url" ]; then
                continue
              fi
              response_body="$(curl -fsSL "$health_url" 2>/dev/null || true)"
              if [ -z "$response_body" ] || ! printf '%s' "$response_body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
                all_healthy=0
                break
              fi
            done < <(printf '%s\n' "$LAUNCHPLANE_DEPLOY_HEALTH_URLS" | tr ',' '\n')

            oidc_token="$({
              curl -fsSL \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
              | jq -r '.value'
            })"

            runtime_payload="$(curl -fsSL \
              -H "Authorization: Bearer ${oidc_token}" \
              "${{ steps.service.outputs.service_url }}/v1/service/runtime" 2>/dev/null || true)"
            actual_image_reference="$(printf '%s' "$runtime_payload" | jq -r '.runtime.docker_image_reference // empty' 2>/dev/null || true)"

            if [ "$all_healthy" -eq 1 ] && [ "$actual_image_reference" = "$expected_image_reference" ]; then
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for Launchplane image '$expected_image_reference' to become live and healthy." >&2
          exit 1

      - name: Roll back failed Launchplane deploy
        if: failure() && steps.self_deploy.outputs.previous_image_reference != ''
        shell: bash
        run: |
          set -euo pipefail

          previous_image_reference="${{ steps.self_deploy.outputs.previous_image_reference }}"
          if [ -z "$previous_image_reference" ] || [ "$previous_image_reference" = "${{ steps.image.outputs.image_reference }}" ]; then
            echo "No distinct previous Launchplane image reference is available for rollback."
            exit 0
          fi

          oidc_token="$({
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
            | jq -r '.value'
          })"

          rollback_payload="$({
            jq -n \
              --arg target_type "$LAUNCHPLANE_DOKPLOY_TARGET_TYPE" \
              --arg target_id "$LAUNCHPLANE_DOKPLOY_TARGET_ID" \
              --arg image_reference "$previous_image_reference" \
              '{schema_version: 1, product: "launchplane", deploy: {target_type: $target_type, target_id: $target_id, image_reference: $image_reference, no_cache: true}}'
          })"
          rollback_response_file="$(mktemp)"
          rollback_status="$(curl -sS \
            -o "$rollback_response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: launchplane-self-deploy-rollback:${previous_image_reference}:${{ github.run_id }}:${{ github.run_attempt }}" \
            --data "$rollback_payload" \
            "${{ steps.service.outputs.service_url }}/v1/drivers/launchplane/self-deploy" || true)"
          if [ "$rollback_status" != "200" ] && [ "$rollback_status" != "202" ]; then
            cat "$rollback_response_file" >&2
            echo "Launchplane rollback request failed with HTTP ${rollback_status}; trying direct Dokploy fallback." >&2

            if [ -z "${LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST:-}" ] || [ -z "${LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN:-}" ]; then
              echo "Direct Dokploy rollback fallback requires LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST and LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN secrets." >&2
              exit 1
            fi

          LAUNCHPLANE_ROLLBACK_IMAGE_REFERENCE="$previous_image_reference" uv run python - <<'PY'
          import json
          import os

          from control_plane import dokploy as control_plane_dokploy


          def _required_env(key: str) -> str:
              value = os.environ.get(key, "").strip()
              if not value:
                  raise SystemExit(f"Missing required environment variable: {key}")
              return value


          host = _required_env("LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST")
          token = _required_env("LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN")
          target_type = _required_env("LAUNCHPLANE_DOKPLOY_TARGET_TYPE")
          target_id = _required_env("LAUNCHPLANE_DOKPLOY_TARGET_ID")
          image_reference = _required_env("LAUNCHPLANE_ROLLBACK_IMAGE_REFERENCE")
          deploy_timeout_seconds = int(
              os.environ.get("LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS") or "600"
          )

          target_payload = control_plane_dokploy.fetch_dokploy_target_payload(
              host=host,
              token=token,
              target_type=target_type,
              target_id=target_id,
          )
          raw_env_text = str(target_payload.get("env") or "")
          updated_env_text = control_plane_dokploy.render_dokploy_env_text_with_overrides(
              raw_env_text,
              updates={"DOCKER_IMAGE_REFERENCE": image_reference},
          )
          if updated_env_text != raw_env_text:
              control_plane_dokploy.update_dokploy_target_env(
                  host=host,
                  token=token,
                  target_type=target_type,
                  target_id=target_id,
                  target_payload=target_payload,
                  env_text=updated_env_text,
              )
          latest_before = control_plane_dokploy.latest_deployment_for_target(
              host=host,
              token=token,
              target_type=target_type,
              target_id=target_id,
          )
          control_plane_dokploy.trigger_deployment(
              host=host,
              token=token,
              target_type=target_type,
              target_id=target_id,
              no_cache=True,
          )
          deployment_result = control_plane_dokploy.wait_for_target_deployment(
              host=host,
              token=token,
              target_type=target_type,
              target_id=target_id,
              before_key=control_plane_dokploy.deployment_key(latest_before),
              timeout_seconds=deploy_timeout_seconds,
          )
          print(
              json.dumps(
                  {
                      "status": "accepted",
                      "target_type": target_type,
                      "target_id": target_id,
                      "image_reference": image_reference,
                      "image_reference_changed": updated_env_text != raw_env_text,
                      "deployment_result": deployment_result,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
          else
            cat "$rollback_response_file"
          fi

          deadline=$((SECONDS + ${LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS:-600} + ${LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS:-180}))
          while [ "$SECONDS" -lt "$deadline" ]; do
            all_healthy=1
            while IFS= read -r raw_url; do
              health_url="$(printf '%s' "$raw_url" | xargs)"
              if [ -z "$health_url" ]; then
                continue
              fi
              response_body="$(curl -fsSL "$health_url" 2>/dev/null || true)"
              if [ -z "$response_body" ] || ! printf '%s' "$response_body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
                all_healthy=0
                break
              fi
            done < <(printf '%s\n' "$LAUNCHPLANE_DEPLOY_HEALTH_URLS" | tr ',' '\n')

            oidc_token="$({
              curl -fsSL \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
              | jq -r '.value'
            })"

            runtime_payload="$(curl -fsSL \
              -H "Authorization: Bearer ${oidc_token}" \
              "${{ steps.service.outputs.service_url }}/v1/service/runtime" 2>/dev/null || true)"
            actual_image_reference="$(printf '%s' "$runtime_payload" | jq -r '.runtime.docker_image_reference // empty' 2>/dev/null || true)"

            if [ "$all_healthy" -eq 1 ] && [ "$actual_image_reference" = "$previous_image_reference" ]; then
              echo "Rolled Launchplane back to $previous_image_reference."
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for Launchplane rollback image '$previous_image_reference' to become live and healthy." >&2
          exit 1

      - name: Ensure product context workflow authz grants
        shell: bash
        run: |
          set -euo pipefail

          oidc_token="$({
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ steps.service.outputs.service_audience }}" \
            | jq -r '.value'
          })"

          post_grant() {
            local repository="$1"
            local workflow_file="$2"
            local product_name="$3"
            local context_name="$4"
            local action_name="$5"
            local source_label="$6"
            local idempotency_suffix="$7"
            local event_name="${8:-workflow_dispatch}"
            local workflow_ref_suffix="${9:-refs/heads/main}"
            local request_payload response_file status_code

            request_payload="$({
              jq -n \
                --arg repository "$repository" \
                --arg workflow_ref "${repository}/.github/workflows/${workflow_file}@${workflow_ref_suffix}" \
                --arg event_name "$event_name" \
                --arg product_name "$product_name" \
                --arg context_name "$context_name" \
                --arg action_name "$action_name" \
                --arg source_label "$source_label" \
                '{
                  schema_version: 1,
                  product: "launchplane",
                  mode: "apply",
                  reason: ("Deploy workflow ensuring authz grant " + $source_label),
                  related_issue: "cbusillo/launchplane#83",
                  grant: {
                    repository: $repository,
                    workflow_refs: [$workflow_ref],
                    event_names: [$event_name],
                    products: [$product_name],
                    contexts: [$context_name],
                    actions: [$action_name],
                    source_label: $source_label
                  }
                }'
            })"
            response_file="$(mktemp)"
            status_code="$(curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: launchplane-authz-grant:${idempotency_suffix}:${GITHUB_SHA}" \
              --data "$request_payload" \
              "${{ steps.service.outputs.service_url }}/v1/authz-policies/github-actions/grants")"
            if [ "$status_code" = "200" ] || [ "$status_code" = "202" ]; then
              cat "$response_file"
              return 0
            fi
            cat "$response_file" >&2
            echo "Launchplane authz grant request failed with HTTP ${status_code}." >&2
            return 1
          }

          post_terminal_agent_grant() {
            local product_name="$1"
            local context_name="$2"
            local action_name="$3"
            local source_label="$4"
            local idempotency_suffix="$5"
            local request_payload response_file status_code

            request_payload="$({
              jq -n \
                --arg product_name "$product_name" \
                --arg context_name "$context_name" \
                --arg action_name "$action_name" \
                --arg source_label "$source_label" \
                --arg terminal_agent_subject "${LAUNCHPLANE_TERMINAL_AGENT_SUBJECT:-local-owner-agent}" \
                --arg terminal_agent_token_label "${LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL:-local-owner-read}" \
                '{
                  schema_version: 1,
                  product: "launchplane",
                  mode: "apply",
                  reason: ("Deploy workflow ensuring terminal-agent authz grant " + $source_label),
                  related_issue: "cbusillo/launchplane#426",
                  grant: {
                    subjects: [$terminal_agent_subject],
                    token_labels: [$terminal_agent_token_label],
                    products: [$product_name],
                    contexts: [$context_name],
                    actions: [$action_name],
                    source_label: $source_label
                  }
                }'
            })"
            response_file="$(mktemp)"
            status_code="$(curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: launchplane-terminal-agent-authz-grant:${idempotency_suffix}:${GITHUB_SHA}" \
              --data "$request_payload" \
              "${{ steps.service.outputs.service_url }}/v1/authz-policies/terminal-agents/grants")"
            if [ "$status_code" = "200" ] || [ "$status_code" = "202" ]; then
              cat "$response_file"
              return 0
            fi
            cat "$response_file" >&2
            echo "Launchplane terminal-agent authz grant request failed with HTTP ${status_code}." >&2
            return 1
          }

          apply_product_onboarding() {
            local idempotency_suffix="$1"
            local request_payload response_file status_code

            if [ -z "${DISCORD_BLUE_DOKPLOY_TARGET_ID:-}" ]; then
              echo "DISCORD_BLUE_DOKPLOY_TARGET_ID is required before Discord Blue onboarding." >&2
              return 1
            fi
            idempotency_suffix="${idempotency_suffix}:${DISCORD_BLUE_DOKPLOY_TARGET_ID}"

            request_payload="$({
              jq -n \
                --arg target_id "${DISCORD_BLUE_DOKPLOY_TARGET_ID:-}" \
                '{
                  schema_version: 1,
                  product: "launchplane",
                  manifest: {
                    product: "discord-blue",
                    display_name: "Discord Blue",
                    repository: "cbusillo/discord-blue",
                    driver_id: "generic-web",
                    image_repository: "ghcr.io/cbusillo/discord-blue",
                    runtime_port: 8787,
                    health_path: "/health",
                    lanes: [
                      {
                        instance: "prod",
                        context: "discord-blue"
                      }
                    ],
                    dokploy_targets: [
                      {
                        context: "discord-blue",
                        instance: "prod",
                        target_id: $target_id,
                        target_type: "application",
                        target_name: "discord-blue",
                        healthcheck_enabled: false,
                        deploy_timeout_seconds: 600
                      }
                    ],
                    runtime_environments: [
                      {
                        scope: "instance",
                        context: "discord-blue",
                        instance: "prod",
                        env: {
                          DISCORD_BLUE_STATE_DIR: "/var/lib/discord-blue"
                        }
                      }
                    ],
                    secret_bindings: [
                      {
                        binding_key: "DISCORD_TOKEN",
                        context: "discord-blue",
                        instance: "prod"
                      }
                    ],
                    source_label: "deploy:discord-blue-onboarding"
                  }
                }'
            })"
            response_file="$(mktemp)"
            status_code="$(curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: launchplane-product-onboarding:${idempotency_suffix}:${GITHUB_SHA}" \
              --data "$request_payload" \
              "${{ steps.service.outputs.service_url }}/v1/product-onboarding/apply")"
            if [ "$status_code" = "200" ] || [ "$status_code" = "202" ]; then
              cat "$response_file"
              return 0
            fi
            cat "$response_file" >&2
            echo "Launchplane product onboarding request failed with HTTP ${status_code}." >&2
            return 1
          }

          apply_odoo_cm_onboarding() {
            local idempotency_suffix="odoo-cm-preview-profile"
            local request_payload response_file status_code
            local target_id="${ODOO_CM_TESTING_DOKPLOY_TARGET_ID:-}"

            request_payload="$({
              jq -n \
                --arg target_id "$target_id" \
                '{
                  schema_version: 1,
                  product: "launchplane",
                  manifest: {
                    product: "odoo-tenant-cm",
                    display_name: "Odoo CM",
                    repository: "cbusillo/odoo-tenant-cm",
                    driver_id: "odoo",
                    image_repository: "ghcr.io/cbusillo/odoo-tenant-cm",
                    runtime_port: 8069,
                    health_path: "/web/health",
                    lanes: [
                      {
                        instance: "testing",
                        context: "cm"
                      }
                    ],
                    preview: {
                      enabled: true,
                      context: "cm",
                      enable_label: "preview",
                      slug_template: "pr-{number}",
                      app_name_prefix: "cm-odoo-preview",
                      template_instance: "testing",
                      override_env: {
                        ODOO_INSTALL_MODULES: "cm_custom,cm_website"
                      },
                      preview_url_env_keys: ["WEB_BASE_URL"],
                      data_transport_mode: "bootstrap"
                    },
                    dokploy_targets: (
                      if ($target_id | length) > 0 then
                        [
                          {
                            context: "cm",
                            instance: "testing",
                            target_id: $target_id,
                            target_type: "application",
                            target_name: "cm-testing",
                            healthcheck_path: "/web/health",
                            healthcheck_enabled: true,
                            deploy_timeout_seconds: 900
                          }
                        ]
                      else [] end
                    ),
                    source_label: "deploy:odoo-cm-product-onboarding"
                  }
                }'
            })"
            response_file="$(mktemp)"
            status_code="$(curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: launchplane-product-onboarding:${idempotency_suffix}:${target_id}:${GITHUB_SHA}" \
              --data "$request_payload" \
              "${{ steps.service.outputs.service_url }}/v1/product-onboarding/apply")"
            if [ "$status_code" = "200" ] || [ "$status_code" = "202" ]; then
              cat "$response_file"
              return 0
            fi
            cat "$response_file" >&2
            echo "Launchplane Odoo CM product onboarding request failed with HTTP ${status_code}." >&2
            return 1
          }

          apply_runtime_key_safety_policy() {
            local idempotency_suffix="$1"
            local request_payload response_file status_code

            request_payload="$({
              jq -n \
                '{
                  schema_version: 1,
                  product: "launchplane",
                  source_label: "deploy:runtime-key-safety-policy",
                  rules: [
                    {
                      binding_key: "DISCORD_TOKEN",
                      secret_class: "prod_only",
                      allowed_contexts: ["discord-blue"],
                      allowed_instances: ["prod"]
                    },
                    {
                      binding_key: "RESEND_API_KEY",
                      secret_class: "prod_only",
                      allowed_contexts: ["sellyouroutboard"],
                      allowed_instances: ["prod"]
                    },
                    {
                      binding_key: "SMTP_PASSWORD",
                      secret_class: "prod_only",
                      allowed_contexts: ["sellyouroutboard"],
                      allowed_instances: ["prod"]
                    },
                    {
                      binding_key: "META_CONVERSIONS_API_TOKEN",
                      secret_class: "shared_safe",
                      allowed_contexts: ["sellyouroutboard"],
                      allowed_instances: ["testing", "prod"]
                    }
                  ]
                }'
            })"
            response_file="$(mktemp)"
            status_code="$(curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: launchplane-runtime-key-safety-policy:${idempotency_suffix}:${GITHUB_SHA}" \
              --data "$request_payload" \
              "${{ steps.service.outputs.service_url }}/v1/runtime-key-safety/policies/apply")"
            if [ "$status_code" = "200" ] || [ "$status_code" = "202" ]; then
              cat "$response_file"
              return 0
            fi
            cat "$response_file" >&2
            echo "Launchplane runtime key-safety policy request failed with HTTP ${status_code}." >&2
            return 1
          }

          post_launchplane_grant() {
            local workflow_file="$1"
            local action_name="$2"
            local source_label="$3"
            local idempotency_suffix="$4"
            post_grant \
              "$GITHUB_REPOSITORY" \
              "$workflow_file" \
              sellyouroutboard \
              launchplane \
              "$action_name" \
              "$source_label" \
              "$idempotency_suffix"
          }

          post_syo_grant() {
            local workflow_file="$1"
            local product_name="$2"
            local context_name="$3"
            local action_name="$4"
            local source_label="$5"
            local idempotency_suffix="$6"
            local event_name="${7:-workflow_dispatch}"
            local workflow_ref_suffix="${8:-refs/heads/main}"
            post_grant \
              cbusillo/sellyouroutboard \
              "$workflow_file" \
              "$product_name" \
              "$context_name" \
              "$action_name" \
              "$source_label" \
              "$idempotency_suffix" \
              "$event_name" \
              "$workflow_ref_suffix"
          }

          post_syo_product_grant() {
            local action_name="$1"
            local source_label="$2"
            local idempotency_suffix="$3"
            post_syo_grant \
              promote-prod.yml \
              sellyouroutboard \
              sellyouroutboard \
              "$action_name" \
              "$source_label" \
              "$idempotency_suffix"
          }

          post_syo_preview_grants() {
            local context_name="$1"
            local suffix="$2"
            post_syo_grant \
              preview-control-plane.yml \
              sellyouroutboard \
              "$context_name" \
              preview_refresh.execute \
              "deploy:syo-preview-refresh-${suffix}-grant" \
              "syo-preview-refresh-${suffix}" \
              pull_request \
              '*'
            post_syo_grant \
              preview-cleanup.yml \
              sellyouroutboard \
              "$context_name" \
              preview_destroy.execute \
              "deploy:syo-preview-destroy-pr-${suffix}-grant" \
              "syo-preview-destroy-pr-${suffix}" \
              pull_request \
              '*'
            post_syo_grant \
              preview-cleanup.yml \
              sellyouroutboard \
              "$context_name" \
              preview_destroy.execute \
              "deploy:syo-preview-destroy-manual-${suffix}-grant" \
              "syo-preview-destroy-manual-${suffix}"
          }

          post_odoo_cm_preview_grant() {
            local product_name="$1"
            local action_name="$2"
            local source_label="$3"
            local idempotency_suffix="$4"
            local event_name="${5:-pull_request}"
            post_grant \
              cbusillo/odoo-tenant-cm \
              odoo-preview.yml \
              "$product_name" \
              cm \
              "$action_name" \
              "$source_label" \
              "$idempotency_suffix" \
              "$event_name" \
              '*'
          }

          apply_product_onboarding \
            discord-blue
          apply_odoo_cm_onboarding
          post_grant \
            cbusillo/discord-blue \
            main.yml \
            discord-blue \
            discord-blue \
            generic_web_deploy.execute \
            deploy:discord-blue-stable-deploy-grant \
            discord-blue-stable-deploy \
            push \
            refs/heads/main

          post_launchplane_grant \
            product-context-cutover-audit.yml \
            product_profile.read \
            deploy:product-context-cutover-audit-grant \
            product-context-cutover-audit
          post_launchplane_grant \
            product-context-cutover.yml \
            product_profile.write \
            deploy:product-context-cutover-apply-grant \
            product-context-cutover-apply
          post_launchplane_grant \
            product-legacy-context-cleanup.yml \
            product_profile.write \
            deploy:product-legacy-context-cleanup-grant \
            product-legacy-context-cleanup
          post_grant \
            "$GITHUB_REPOSITORY" \
            work-graph-snapshot-validate.yml \
            launchplane \
            launchplane \
            work_graph.rank \
            deploy:work-graph-snapshot-validate-grant \
            work-graph-snapshot-validate
          post_grant \
            "$GITHUB_REPOSITORY" \
            merge-train-runner.yml \
            launchplane \
            launchplane \
            merge_train.run_once \
            deploy:merge-train-runner-grant \
            merge-train-runner
          post_grant \
            "$GITHUB_REPOSITORY" \
            deploy-launchplane.yml \
            launchplane \
            launchplane \
            runtime_key_safety.write \
            deploy:runtime-key-safety-policy-grant \
            runtime-key-safety-policy
          apply_runtime_key_safety_policy \
            launchplane-runtime-secret-classes
          post_syo_grant \
            promote-prod.yml \
            launchplane \
            sellyouroutboard \
            inventory.read \
            deploy:syo-prod-promotion-inventory-read-grant \
            syo-prod-promotion-inventory-read
          post_syo_product_grant \
            generic_web_prod_promotion.execute \
            deploy:syo-prod-promotion-execute-grant \
            syo-prod-promotion-execute
          post_terminal_agent_grant \
            sellyouroutboard \
            sellyouroutboard \
            product_environment.read \
            deploy:syo-terminal-agent-product-environment-read-grant \
            syo-terminal-agent-product-environment-read
          post_terminal_agent_grant \
            launchplane \
            launchplane \
            product_environment.read \
            deploy:terminal-agent-agent-context-product-read-grant \
            terminal-agent-agent-context-product-read
          post_terminal_agent_grant \
            launchplane \
            launchplane \
            work_graph.rank \
            deploy:terminal-agent-agent-context-work-graph-grant \
            terminal-agent-agent-context-work-graph
          post_terminal_agent_grant \
            launchplane \
            launchplane \
            every_code_work_request.read \
            deploy:terminal-agent-agent-context-every-code-grant \
            terminal-agent-agent-context-every-code
          post_terminal_agent_grant \
            launchplane \
            launchplane \
            every_code_preview_gate.read \
            deploy:terminal-agent-agent-context-preview-grant \
            terminal-agent-agent-context-preview
          post_grant \
            "$GITHUB_REPOSITORY" \
            live-target-runtime.yml \
            sellyouroutboard \
            sellyouroutboard \
            live_target_runtime.plan \
            deploy:syo-live-target-runtime-plan-grant \
            syo-live-target-runtime-plan
          post_grant \
            "$GITHUB_REPOSITORY" \
            live-target-runtime.yml \
            sellyouroutboard \
            sellyouroutboard \
            live_target_runtime.apply \
            deploy:syo-live-target-runtime-apply-grant \
            syo-live-target-runtime-apply
          post_grant \
            "$GITHUB_REPOSITORY" \
            odoo-target-replacement-plan.yml \
            odoo-tenant-cm \
            cm \
            odoo_target_replacement_plan.read \
            deploy:odoo-cm-target-replacement-plan-grant \
            odoo-cm-target-replacement-plan
          post_syo_preview_grants \
            sellyouroutboard-testing \
            legacy-context
          post_syo_preview_grants \
            sellyouroutboard \
            canonical-context
          post_odoo_cm_preview_grant \
            odoo \
            odoo_artifact_publish_inputs.read \
            deploy:odoo-cm-preview-artifact-publish-inputs-grant \
            odoo-cm-preview-artifact-publish-inputs
          post_odoo_cm_preview_grant \
            odoo \
            odoo_artifact_publish.write \
            deploy:odoo-cm-preview-artifact-publish-grant \
            odoo-cm-preview-artifact-publish
          post_odoo_cm_preview_grant \
            odoo-tenant-cm \
            preview_refresh.execute \
            deploy:odoo-cm-preview-refresh-grant \
            odoo-cm-preview-refresh
          post_odoo_cm_preview_grant \
            odoo-tenant-cm \
            preview_pr_feedback.write \
            deploy:odoo-cm-preview-pr-feedback-grant \
            odoo-cm-preview-pr-feedback
          post_odoo_cm_preview_grant \
            odoo-tenant-cm \
            preview_pr_feedback.write \
            deploy:odoo-cm-preview-unsupported-feedback-grant \
            odoo-cm-preview-unsupported-feedback \
            pull_request_target
          post_odoo_cm_preview_grant \
            odoo-tenant-cm \
            preview_destroy.execute \
            deploy:odoo-cm-preview-destroy-pr-grant \
            odoo-cm-preview-destroy-pr
          post_odoo_cm_preview_grant \
            odoo-tenant-cm \
            preview_destroy.execute \
            deploy:odoo-cm-preview-destroy-manual-grant \
            odoo-cm-preview-destroy-manual \
            workflow_dispatch
