name: Deploy Launchplane

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_reference:
        description: Exact immutable Launchplane image digest to deploy instead of building a new one.
        required: false
        type: string
      omit_every_code_env:
        description: Temporarily omit Every Code env for one compatibility deploy.
        required: false
        default: false
        type: boolean
      omit_terminal_agent_env:
        description: Temporarily omit terminal-agent env for one compatibility deploy.
        required: false
        default: false
        type: boolean
      omit_owner_agent_env:
        description: Temporarily omit owner-agent env for one compatibility deploy.
        required: false
        default: false
        type: boolean
      omit_npmplus_env:
        description: Temporarily omit NPMplus env for one compatibility deploy.
        required: false
        default: false
        type: boolean
      break_glass_confirm:
        description: Type ROLL BACK LAUNCHPLANE THROUGH DIRECT DOKPLOY to run the manual emergency rollback job.
        required: false
        type: string
      break_glass_image_reference:
        description: Exact previous immutable Launchplane image digest for manual direct Dokploy rollback.
        required: false
        type: string
      break_glass_reason:
        description: Single-line 8-500 character operator reason for manual direct Dokploy rollback.
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: launchplane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_type == 'branch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       inputs.break_glass_confirm == '')
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      LAUNCHPLANE_DOKPLOY_TARGET_ID: ${{ vars.LAUNCHPLANE_DOKPLOY_TARGET_ID }}
      LAUNCHPLANE_DOKPLOY_TARGET_TYPE: ${{ vars.LAUNCHPLANE_DOKPLOY_TARGET_TYPE }}
      LAUNCHPLANE_DEPLOY_HEALTH_URLS: ${{ vars.LAUNCHPLANE_DEPLOY_HEALTH_URLS }}
      LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS: ${{ vars.LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS }}
      LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS: ${{ vars.LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS }}
      LAUNCHPLANE_IMAGE_REPOSITORY: ${{ vars.LAUNCHPLANE_IMAGE_REPOSITORY }}
      LAUNCHPLANE_GITHUB_CLIENT_ID: ${{ vars.LAUNCHPLANE_GITHUB_CLIENT_ID }}
      LAUNCHPLANE_PUBLIC_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_COOKIE_SECURE: ${{ vars.LAUNCHPLANE_COOKIE_SECURE }}
      LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS: ${{ vars.LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT }}
      LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT: ${{ vars.LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT }}
      LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_REPOSITORIES: ${{ vars.LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_REPOSITORIES }}
      LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_LIMIT: ${{ vars.LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_LIMIT }}
      LAUNCHPLANE_WORK_GRAPH_GH_BINARY: ${{ vars.LAUNCHPLANE_WORK_GRAPH_GH_BINARY }}
      LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS: ${{ vars.LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS }}
      LAUNCHPLANE_GITHUB_CLIENT_SECRET: ${{ secrets.LAUNCHPLANE_GITHUB_CLIENT_SECRET }}
      LAUNCHPLANE_SESSION_SECRET: ${{ secrets.LAUNCHPLANE_SESSION_SECRET }}
      LAUNCHPLANE_WORK_GRAPH_GH_TOKEN: ${{ secrets.LAUNCHPLANE_WORK_GRAPH_GH_TOKEN }}
      LAUNCHPLANE_PUBLIC_INGRESS_GITHUB_TOKEN: ${{ secrets.LAUNCHPLANE_PUBLIC_INGRESS_GITHUB_TOKEN }}
      LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN: ${{ secrets.LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN }}
      LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET: ${{ secrets.LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET }}
      LAUNCHPLANE_MANAGER_PREVIEW_GITHUB_WEBHOOK_SECRET: ${{ secrets.LAUNCHPLANE_MANAGER_PREVIEW_GITHUB_WEBHOOK_SECRET }}
      LAUNCHPLANE_EVERY_CODE_GITHUB_TOKEN: ${{ secrets.LAUNCHPLANE_EVERY_CODE_GITHUB_TOKEN }}
      LAUNCHPLANE_EVERY_CODE_GITHUB_ACTOR: ${{ vars.LAUNCHPLANE_EVERY_CODE_GITHUB_ACTOR }}
      LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN: ${{ secrets.LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN }}
      LAUNCHPLANE_TERMINAL_AGENT_SUBJECT: ${{ vars.LAUNCHPLANE_TERMINAL_AGENT_SUBJECT }}
      LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL: ${{ vars.LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL }}
      LAUNCHPLANE_LOCAL_OPERATOR_TOKEN: ${{ secrets.LAUNCHPLANE_LOCAL_OPERATOR_TOKEN }}
      LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT: ${{ vars.LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT }}
      LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL: ${{ vars.LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL }}
      LAUNCHPLANE_LOCAL_ADMIN_TOKEN: ${{ secrets.LAUNCHPLANE_LOCAL_ADMIN_TOKEN }}
      LAUNCHPLANE_LOCAL_ADMIN_SUBJECT: ${{ vars.LAUNCHPLANE_LOCAL_ADMIN_SUBJECT }}
      LAUNCHPLANE_LOCAL_ADMIN_TOKEN_LABEL: ${{ vars.LAUNCHPLANE_LOCAL_ADMIN_TOKEN_LABEL }}
      LAUNCHPLANE_NPMPLUS_BASE_URL: ${{ vars.LAUNCHPLANE_NPMPLUS_BASE_URL }}
      LAUNCHPLANE_NPMPLUS_IDENTITY: ${{ secrets.LAUNCHPLANE_NPMPLUS_IDENTITY }}
      LAUNCHPLANE_NPMPLUS_SECRET: ${{ secrets.LAUNCHPLANE_NPMPLUS_SECRET }}
      LAUNCHPLANE_RUNTIME_KEY_SAFETY_RULES_JSON: ${{ vars.LAUNCHPLANE_RUNTIME_KEY_SAFETY_RULES_JSON }}
      LAUNCHPLANE_COMPOSE_EXTERNAL_NETWORK: ${{ vars.LAUNCHPLANE_COMPOSE_EXTERNAL_NETWORK }}
      OMIT_EVERY_CODE_ENV: ${{ inputs.omit_every_code_env || false }}
      OMIT_TERMINAL_AGENT_ENV: ${{ inputs.omit_terminal_agent_env || false }}
      OMIT_OWNER_AGENT_ENV: ${{ inputs.omit_owner_agent_env || false }}
      OMIT_NPMPLUS_ENV: ${{ inputs.omit_npmplus_env || false }}
    steps:
      - name: Resolve deploy inputs
        id: prep
        shell: bash
        env:
          DISPATCH_IMAGE_REFERENCE: ${{ inputs.image_reference }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          validate_single_line_value() {
            local name="$1"
            local value="$2"
            if [[ "$value" =~ [[:cntrl:]] ]]; then
              echo "${name} must not contain control characters." >&2
              exit 1
            fi
          }

          validate_immutable_image_reference() {
            local image_reference="$1"
            local image_repository="$2"
            local expected_image_prefix="${image_repository}@sha256:"
            local image_digest=""

            if [[ "$image_reference" != "$expected_image_prefix"* ]]; then
              echo "image_reference must use the configured Launchplane image repository and an immutable sha256 digest." >&2
              exit 1
            fi
            image_digest="${image_reference#"$expected_image_prefix"}"
            if [[ ! "$image_digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "image_reference must end with a lowercase sha256 digest." >&2
              exit 1
            fi
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            checkout_ref="$WORKFLOW_RUN_HEAD_SHA"
          else
            checkout_ref="$WORKFLOW_SHA"
          fi
          if [ -z "$checkout_ref" ]; then
            echo "Could not resolve a checkout ref." >&2
            exit 1
          fi
          validate_single_line_value "checkout ref" "$checkout_ref"

          image_repository="${LAUNCHPLANE_IMAGE_REPOSITORY}"
          if [ -z "$image_repository" ]; then
            image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          validate_single_line_value "Launchplane image repository" "$image_repository"

          deploy_image_reference="$DISPATCH_IMAGE_REFERENCE"
          if [ -n "$deploy_image_reference" ]; then
            validate_immutable_image_reference "$deploy_image_reference" "$image_repository"
            should_build="false"
          else
            should_build="true"
          fi

          for omit_environment_variable in \
            OMIT_EVERY_CODE_ENV \
            OMIT_TERMINAL_AGENT_ENV \
            OMIT_OWNER_AGENT_ENV \
            OMIT_NPMPLUS_ENV; do
            omit_environment_value="${!omit_environment_variable}"
            if [ "$omit_environment_value" != "true" ] && [ "$omit_environment_value" != "false" ]; then
              echo "${omit_environment_variable} must be true or false." >&2
              exit 1
            fi
          done

          {
            printf 'checkout_ref=%s\n' "$checkout_ref"
            printf 'image_repository=%s\n' "$image_repository"
            printf 'should_build=%s\n' "$should_build"
            printf 'deploy_image_reference=%s\n' "$deploy_image_reference"
          } >> "$GITHUB_OUTPUT"

      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${LAUNCHPLANE_DOKPLOY_TARGET_TYPE:?Missing LAUNCHPLANE_DOKPLOY_TARGET_TYPE variable}"
          : "${LAUNCHPLANE_DOKPLOY_TARGET_ID:?Missing LAUNCHPLANE_DOKPLOY_TARGET_ID variable}"
          : "${LAUNCHPLANE_DEPLOY_HEALTH_URLS:?Missing LAUNCHPLANE_DEPLOY_HEALTH_URLS variable}"
          if [ -z "${LAUNCHPLANE_MANAGER_PREVIEW_GITHUB_WEBHOOK_SECRET:-}" ]; then
            echo "Missing LAUNCHPLANE_MANAGER_PREVIEW_GITHUB_WEBHOOK_SECRET secret." >&2
            exit 1
          fi
          if [ "$LAUNCHPLANE_DOKPLOY_TARGET_TYPE" = "compose" ]; then
            : "${LAUNCHPLANE_COMPOSE_EXTERNAL_NETWORK:?Missing LAUNCHPLANE_COMPOSE_EXTERNAL_NETWORK variable}"
          fi

      - name: Resolve Launchplane service endpoint
        id: service
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw_urls = [value.strip() for value in os.environ["LAUNCHPLANE_DEPLOY_HEALTH_URLS"].split(",") if value.strip()]
          if not raw_urls:
              raise SystemExit("Missing Launchplane deploy health URL.")
          parsed = urlsplit(raw_urls[0])
          if not parsed.scheme or not parsed.netloc or not parsed.hostname:
              raise SystemExit(f"Could not derive Launchplane service endpoint from {raw_urls[0]!r}.")
          service_url = f"{parsed.scheme}://{parsed.netloc}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"service_url={service_url}\n")
              handle.write(f"service_audience={parsed.hostname}\n")
          PY

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prep.outputs.checkout_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install 3.13

      - name: Set up Docker Buildx
        if: steps.prep.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.prep.outputs.should_build == 'true'
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEFAULT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          registry_username="${GHCR_USERNAME:-${GITHUB_ACTOR}}"
          registry_password="${GHCR_TOKEN:-${DEFAULT_GITHUB_TOKEN}}"

          if [ -z "$registry_password" ]; then
            echo "Missing GHCR_TOKEN secret and GitHub token fallback." >&2
            exit 1
          fi

          printf '%s' "$registry_password" | docker login ghcr.io --username "$registry_username" --password-stdin

      - name: Build and push Launchplane image
        if: steps.prep.outputs.should_build == 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ${{ steps.prep.outputs.image_repository }}:main
            ${{ steps.prep.outputs.image_repository }}:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.image_repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.prep.outputs.image_repository }}:buildcache,mode=max

      - name: Resolve image reference
        id: image
        shell: bash
        env:
          BUILT_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DEPLOY_IMAGE_REFERENCE: ${{ steps.prep.outputs.deploy_image_reference }}
          IMAGE_REPOSITORY: ${{ steps.prep.outputs.image_repository }}
        run: |
          set -euo pipefail
          image_reference="$DEPLOY_IMAGE_REFERENCE"
          if [ -z "$image_reference" ]; then
            image_reference="${IMAGE_REPOSITORY}@${BUILT_IMAGE_DIGEST}"
          fi
          printf 'image_reference=%s\n' "$image_reference" >> "$GITHUB_OUTPUT"

      - name: Read previous Launchplane runtime
        id: previous_runtime
        continue-on-error: true
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/service/runtime
          method: GET
          expected-status: "200"
          timeout-ms: "30000"
          response-output-file: ${{ runner.temp }}/launchplane-previous-runtime.json
          log-response-body: "false"

      - name: Render Launchplane self deploy request
        id: self_deploy
        shell: bash
        env:
          DEPLOY_IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}
          IMAGE_REPOSITORY: ${{ steps.prep.outputs.image_repository }}
          PREVIOUS_RUNTIME_RESPONSE_FILE: ${{ runner.temp }}/launchplane-previous-runtime.json
        run: |
          set -euo pipefail

          previous_image_reference="$(jq -r '.runtime.docker_image_reference // empty' "$PREVIOUS_RUNTIME_RESPONSE_FILE" 2>/dev/null || true)"
          if [[ "$previous_image_reference" =~ [[:cntrl:]] ]]; then
            echo "Previous Launchplane image reference must not contain control characters." >&2
            exit 1
          fi
          if [ -n "$previous_image_reference" ]; then
            expected_image_prefix="${IMAGE_REPOSITORY}@sha256:"
            image_digest="${previous_image_reference#"$expected_image_prefix"}"
            if [[ "$previous_image_reference" != "$expected_image_prefix"* ]] ||
              [[ ! "$image_digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Previous Launchplane image reference must use the configured repository and an immutable sha256 digest." >&2
              exit 1
            fi
          fi
          printf 'previous_image_reference=%s\n' "$previous_image_reference" >> "$GITHUB_OUTPUT"

          service_env_json="$({
            jq -n \
              --arg github_client_id "${LAUNCHPLANE_GITHUB_CLIENT_ID:-}" \
              --arg github_client_secret "${LAUNCHPLANE_GITHUB_CLIENT_SECRET:-}" \
              --arg public_url "${LAUNCHPLANE_PUBLIC_URL:-}" \
              --arg session_secret "${LAUNCHPLANE_SESSION_SECRET:-}" \
              --arg cookie_secure "${LAUNCHPLANE_COOKIE_SECURE:-}" \
              --arg bootstrap_admin_emails "${LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS:-}" \
              --arg work_graph_project_owner "${LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER:-}" \
              --arg work_graph_project_number "${LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER:-}" \
              --arg work_graph_project_limit "${LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT:-}" \
              --arg work_graph_project_signal_limit "${LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT:-}" \
              --arg work_graph_issue_inbox_repositories "${LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_REPOSITORIES:-}" \
              --arg work_graph_issue_inbox_limit "${LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_LIMIT:-}" \
              --arg work_graph_gh_binary "${LAUNCHPLANE_WORK_GRAPH_GH_BINARY:-}" \
              --arg work_graph_gh_token "${LAUNCHPLANE_WORK_GRAPH_GH_TOKEN:-}" \
              --arg public_ingress_github_token "${LAUNCHPLANE_PUBLIC_INGRESS_GITHUB_TOKEN:-}" \
              --arg enable_every_code_runtime_secrets "${LAUNCHPLANE_ENABLE_EVERY_CODE_RUNTIME_SECRETS:-}" \
              --arg every_code_worker_token "${LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN:-}" \
              --arg every_code_webhook_secret "${LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET:-}" \
              --arg manager_preview_webhook_secret "${LAUNCHPLANE_MANAGER_PREVIEW_GITHUB_WEBHOOK_SECRET:-}" \
              --arg every_code_github_token "${LAUNCHPLANE_EVERY_CODE_GITHUB_TOKEN:-}" \
              --arg every_code_github_actor "${LAUNCHPLANE_EVERY_CODE_GITHUB_ACTOR:-}" \
              --arg terminal_agent_read_token "${LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN:-}" \
              --arg terminal_agent_subject "${LAUNCHPLANE_TERMINAL_AGENT_SUBJECT:-}" \
              --arg terminal_agent_token_label "${LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL:-}" \
              --arg local_operator_token "${LAUNCHPLANE_LOCAL_OPERATOR_TOKEN:-}" \
              --arg local_operator_subject "${LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT:-}" \
              --arg local_operator_token_label "${LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL:-}" \
              --arg local_admin_token "${LAUNCHPLANE_LOCAL_ADMIN_TOKEN:-}" \
              --arg local_admin_subject "${LAUNCHPLANE_LOCAL_ADMIN_SUBJECT:-}" \
              --arg local_admin_token_label "${LAUNCHPLANE_LOCAL_ADMIN_TOKEN_LABEL:-}" \
              --arg compose_external_network "${LAUNCHPLANE_COMPOSE_EXTERNAL_NETWORK:-}" \
              --arg npmplus_base_url "${LAUNCHPLANE_NPMPLUS_BASE_URL:-}" \
              --arg npmplus_identity "${LAUNCHPLANE_NPMPLUS_IDENTITY:-}" \
              --arg npmplus_secret "${LAUNCHPLANE_NPMPLUS_SECRET:-}" \
              --argjson omit_every_code_env "$OMIT_EVERY_CODE_ENV" \
              --argjson omit_terminal_agent_env "$OMIT_TERMINAL_AGENT_ENV" \
              --argjson omit_owner_agent_env "$OMIT_OWNER_AGENT_ENV" \
              --argjson omit_npmplus_env "$OMIT_NPMPLUS_ENV" \
              '(
                {
                LAUNCHPLANE_GITHUB_CLIENT_ID: $github_client_id,
                LAUNCHPLANE_GITHUB_CLIENT_SECRET: $github_client_secret,
                LAUNCHPLANE_PUBLIC_URL: $public_url,
                LAUNCHPLANE_SESSION_SECRET: $session_secret,
                LAUNCHPLANE_COOKIE_SECURE: $cookie_secure,
                LAUNCHPLANE_BOOTSTRAP_ADMIN_EMAILS: $bootstrap_admin_emails,
                LAUNCHPLANE_MANAGER_PREVIEW_GITHUB_WEBHOOK_SECRET: $manager_preview_webhook_secret
                }
                + (
                  if ($omit_terminal_agent_env | not) then
                    {
                      LAUNCHPLANE_TERMINAL_AGENT_READ_TOKEN: $terminal_agent_read_token,
                      LAUNCHPLANE_TERMINAL_AGENT_SUBJECT: $terminal_agent_subject,
                      LAUNCHPLANE_TERMINAL_AGENT_TOKEN_LABEL: $terminal_agent_token_label
                    }
                  else
                    {}
                  end
                )
                + (
                  if ($omit_owner_agent_env | not) then
                    {
                      LAUNCHPLANE_LOCAL_OPERATOR_TOKEN: $local_operator_token,
                      LAUNCHPLANE_LOCAL_OPERATOR_SUBJECT: $local_operator_subject,
                      LAUNCHPLANE_LOCAL_OPERATOR_TOKEN_LABEL: $local_operator_token_label,
                      LAUNCHPLANE_LOCAL_ADMIN_TOKEN: $local_admin_token,
                      LAUNCHPLANE_LOCAL_ADMIN_SUBJECT: $local_admin_subject,
                      LAUNCHPLANE_LOCAL_ADMIN_TOKEN_LABEL: $local_admin_token_label
                    }
                  else
                    {}
                  end
                )
                + (
                  if (($omit_every_code_env | not)
                    and (($enable_every_code_runtime_secrets | ascii_downcase) == "true")) then
                    {
                      LAUNCHPLANE_EVERY_CODE_WORKER_TOKEN: $every_code_worker_token,
                      LAUNCHPLANE_EVERY_CODE_GITHUB_WEBHOOK_SECRET: $every_code_webhook_secret,
                      LAUNCHPLANE_EVERY_CODE_GITHUB_TOKEN: $every_code_github_token,
                      LAUNCHPLANE_EVERY_CODE_GITHUB_ACTOR: $every_code_github_actor
                    }
                  else
                    {}
                  end
                )
                + (
                  if $compose_external_network != "" then
                    {LAUNCHPLANE_COMPOSE_EXTERNAL_NETWORK: $compose_external_network}
                  else
                    {}
                  end
                )
                + (
                  if (($omit_npmplus_env | not) and $npmplus_base_url != "") then
                    {LAUNCHPLANE_NPMPLUS_BASE_URL: $npmplus_base_url}
                  else
                    {}
                  end
                )
                + (
                  if (($omit_npmplus_env | not) and $npmplus_identity != "") then
                    {LAUNCHPLANE_NPMPLUS_IDENTITY: $npmplus_identity}
                  else
                    {}
                  end
                )
                + (
                  if (($omit_npmplus_env | not) and $npmplus_secret != "") then
                    {LAUNCHPLANE_NPMPLUS_SECRET: $npmplus_secret}
                  else
                    {}
                  end
                )
                + (
                  if $public_ingress_github_token != "" then
                    {LAUNCHPLANE_PUBLIC_INGRESS_GITHUB_TOKEN: $public_ingress_github_token}
                  else
                    {}
                  end
                )
                + (
                  if $work_graph_gh_token != "" then
                    {
                      LAUNCHPLANE_WORK_GRAPH_PROJECT_OWNER: $work_graph_project_owner,
                      LAUNCHPLANE_WORK_GRAPH_PROJECT_NUMBER: $work_graph_project_number,
                      LAUNCHPLANE_WORK_GRAPH_PROJECT_LIMIT: $work_graph_project_limit,
                      LAUNCHPLANE_WORK_GRAPH_PROJECT_SIGNAL_LIMIT: $work_graph_project_signal_limit,
                      LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_REPOSITORIES: $work_graph_issue_inbox_repositories,
                      LAUNCHPLANE_WORK_GRAPH_ISSUE_INBOX_LIMIT: $work_graph_issue_inbox_limit,
                      LAUNCHPLANE_WORK_GRAPH_GH_BINARY: $work_graph_gh_binary,
                      GH_TOKEN: $work_graph_gh_token
                    }
                  else
                    {}
                  end
                )
              ) | with_entries(select(.value != ""))'
          })"
          service_env_removals_json="$({
            jq -n \
              --arg public_ingress_github_token "${LAUNCHPLANE_PUBLIC_INGRESS_GITHUB_TOKEN:-}" \
              --argjson omit_npmplus_env "$OMIT_NPMPLUS_ENV" \
              '(
                if $omit_npmplus_env then
                  [
                    "LAUNCHPLANE_NPMPLUS_BASE_URL",
                    "LAUNCHPLANE_NPMPLUS_IDENTITY",
                    "LAUNCHPLANE_NPMPLUS_SECRET"
                  ]
                else
                  []
                end
              )
              + (
                if $public_ingress_github_token == "" then
                  ["LAUNCHPLANE_PUBLIC_INGRESS_GITHUB_TOKEN"]
                else
                  []
                end
              )'
          })"
          request_payload="$({
            jq -n \
              --arg target_type "$LAUNCHPLANE_DOKPLOY_TARGET_TYPE" \
              --arg target_id "$LAUNCHPLANE_DOKPLOY_TARGET_ID" \
              --arg image_reference "$DEPLOY_IMAGE_REFERENCE" \
              --argjson service_env "$service_env_json" \
              --argjson service_env_removals "$service_env_removals_json" \
              '{schema_version: 1, product: "launchplane", deploy: ({target_type: $target_type, target_id: $target_id, image_reference: $image_reference} + (if ($service_env | length) > 0 then {oauth_env: $service_env} else {} end) + (if ($service_env_removals | length) > 0 then {oauth_env_removals: $service_env_removals} else {} end))}'
          })"

          request_payload_file="$RUNNER_TEMP/launchplane-self-deploy-payload.json"
          printf '%s\n' "$request_payload" > "$request_payload_file"
          echo "payload_file=$request_payload_file" >> "$GITHUB_OUTPUT"

      - name: Request Launchplane self deploy
        id: self_deploy_request
        continue-on-error: true
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/drivers/launchplane/self-deploy
          payload-file: ${{ steps.self_deploy.outputs.payload_file }}
          idempotency-key: launchplane-self-deploy:${{ steps.image.outputs.image_reference }}:${{ github.run_id }}:${{ github.run_attempt }}:db-authz
          expected-status: "200,202"
          fail-result-paths: ""
          timeout-ms: "30000"
          response-output-file: ${{ runner.temp }}/launchplane-self-deploy-response.json
          log-response-body: "false"

      - name: Check Launchplane self deploy request
        shell: bash
        env:
          SELF_DEPLOY_RESPONSE_FILE: ${{ runner.temp }}/launchplane-self-deploy-response.json
          SELF_DEPLOY_STATUS: ${{ steps.self_deploy_request.outputs.status-code }}
          SELF_DEPLOY_OUTCOME: ${{ steps.self_deploy_request.outcome }}
        run: |
          set -euo pipefail

          status_code="$SELF_DEPLOY_STATUS"
          if [ -z "$status_code" ]; then
            status_code="action_failed"
          fi
          if [ "${SELF_DEPLOY_OUTCOME:-failure}" != "success" ] \
            || { [ "$status_code" != "200" ] && [ "$status_code" != "202" ]; }; then
            if [ -s "$SELF_DEPLOY_RESPONSE_FILE" ]; then
              cat "$SELF_DEPLOY_RESPONSE_FILE" >&2
            fi
            echo "Launchplane self deploy request failed with HTTP ${status_code}." >&2
            exit 1
          fi

      - name: Resolve Launchplane deploy wait timeout
        id: deploy_wait_timeout
        shell: bash
        run: |
          set -euo pipefail

          wait_timeout_seconds=$((${LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS:-600} + ${LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS:-180}))
          {
            echo "timeout_seconds=$wait_timeout_seconds"
            echo "timeout_ms=$((wait_timeout_seconds * 1000))"
            echo "deadline_epoch=$(($(date +%s) + wait_timeout_seconds))"
          } >>"$GITHUB_OUTPUT"

      - name: Wait for deployed Launchplane runtime image
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/service/runtime
          method: GET
          expected-status: "200"
          timeout-ms: "30000"
          poll-until-path: runtime.docker_image_reference
          poll-until-value: ${{ steps.image.outputs.image_reference }}
          poll-retry-on-request-error: "true"
          poll-retry-on-unexpected-status: "true"
          poll-interval-ms: "5000"
          poll-timeout-ms: ${{ steps.deploy_wait_timeout.outputs.timeout_ms }}
          response-output-file: ${{ runner.temp }}/launchplane-deployed-runtime-wait.json
          log-response-body: "false"

      - name: Wait for deployed Launchplane health URLs
        id: deployed_health
        shell: bash
        env:
          WAIT_DEADLINE_EPOCH: ${{ steps.deploy_wait_timeout.outputs.deadline_epoch }}
        run: |
          set -euo pipefail

          deadline_epoch="${WAIT_DEADLINE_EPOCH:?}"
          last_report_seconds=0
          while [ "$(date +%s)" -lt "$deadline_epoch" ]; do
            all_healthy=1
            health_report=""
            while IFS= read -r raw_url; do
              health_url="$(printf '%s' "$raw_url" | xargs)"
              if [ -z "$health_url" ]; then
                continue
              fi
              health_response_file="$(mktemp)"
              health_status_code="$(curl -sSL -o "$health_response_file" -w '%{http_code}' "$health_url" 2>/dev/null || true)"
              health_status_value="$(jq -r '.status // empty' "$health_response_file" 2>/dev/null || true)"
              if [ -z "$health_report" ]; then
                health_report="${health_url}=${health_status_code:-curl_failed}:${health_status_value:-unknown}"
              else
                health_report="$health_report,${health_url}=${health_status_code:-curl_failed}:${health_status_value:-unknown}"
              fi
              if [ "$health_status_code" != "200" ] || [ "$health_status_value" != "ok" ]; then
                all_healthy=0
                rm -f "$health_response_file"
                break
              fi
              rm -f "$health_response_file"
            done < <(printf '%s\n' "$LAUNCHPLANE_DEPLOY_HEALTH_URLS" | tr ',' '\n')

            if [ "$all_healthy" -eq 1 ]; then
              remaining_seconds=$((deadline_epoch - $(date +%s)))
              if [ "$remaining_seconds" -lt 0 ]; then
                remaining_seconds=0
              fi
              remaining_timeout_ms=$((remaining_seconds * 1000))
              if [ "$remaining_timeout_ms" -lt 1 ]; then
                remaining_timeout_ms=1
              fi
              echo "remaining_timeout_ms=$remaining_timeout_ms" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$((SECONDS - last_report_seconds))" -ge 30 ]; then
              echo "Waiting for Launchplane health URLs. health=${health_report:-none}"
              last_report_seconds=$SECONDS
            fi
            sleep 5
          done

          echo "Timed out waiting for Launchplane health URLs to become healthy." >&2
          exit 1

      - name: Verify deployed Launchplane runtime image after health
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/service/runtime
          method: GET
          expected-status: "200"
          timeout-ms: "30000"
          poll-until-path: runtime.docker_image_reference
          poll-until-value: ${{ steps.image.outputs.image_reference }}
          poll-interval-ms: "1000"
          poll-timeout-ms: ${{ steps.deployed_health.outputs.remaining_timeout_ms }}
          response-output-file: ${{ runner.temp }}/launchplane-deployed-runtime-final.json
          log-response-body: "false"

      - name: Render Launchplane rollback request
        if: failure() && steps.self_deploy.outputs.previous_image_reference != ''
        id: rollback_request
        shell: bash
        env:
          DEPLOYED_IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}
          PREVIOUS_IMAGE_REFERENCE: ${{ steps.self_deploy.outputs.previous_image_reference }}
        run: |
          set -euo pipefail

          previous_image_reference="$PREVIOUS_IMAGE_REFERENCE"
          if [ -z "$previous_image_reference" ] || [ "$previous_image_reference" = "$DEPLOYED_IMAGE_REFERENCE" ]; then
            echo "No distinct previous Launchplane image reference is available for rollback."
            exit 0
          fi

          rollback_payload="$({
            jq -n \
              --arg target_type "$LAUNCHPLANE_DOKPLOY_TARGET_TYPE" \
              --arg target_id "$LAUNCHPLANE_DOKPLOY_TARGET_ID" \
              --arg image_reference "$previous_image_reference" \
              '{schema_version: 1, product: "launchplane", deploy: {target_type: $target_type, target_id: $target_id, image_reference: $image_reference, no_cache: true}}'
          })"

          rollback_payload_file="$RUNNER_TEMP/launchplane-self-deploy-rollback-payload.json"
          printf '%s\n' "$rollback_payload" > "$rollback_payload_file"
          printf 'previous_image_reference=%s\n' "$previous_image_reference" >> "$GITHUB_OUTPUT"
          printf 'payload_file=%s\n' "$rollback_payload_file" >> "$GITHUB_OUTPUT"

      - name: Request Launchplane rollback through service
        if: >-
          failure()
          && steps.rollback_request.outputs.payload_file != ''
          && steps.rollback_request.outputs.previous_image_reference != ''
        id: rollback_request_action
        continue-on-error: true
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/drivers/launchplane/self-deploy
          payload-file: ${{ steps.rollback_request.outputs.payload_file }}
          idempotency-key: launchplane-self-deploy-rollback:${{ steps.rollback_request.outputs.previous_image_reference }}:${{ github.run_id }}:${{ github.run_attempt }}
          expected-status: "200,202"
          fail-result-paths: ""
          timeout-ms: "30000"
          response-output-file: ${{ runner.temp }}/launchplane-self-deploy-rollback-response.json
          log-response-body: "false"

      - name: Check Launchplane rollback request
        if: >-
          failure()
          && steps.rollback_request.outputs.payload_file != ''
          && steps.rollback_request.outputs.previous_image_reference != ''
        shell: bash
        env:
          PREVIOUS_IMAGE_REFERENCE: ${{ steps.rollback_request.outputs.previous_image_reference }}
          ROLLBACK_RESPONSE_FILE: ${{ runner.temp }}/launchplane-self-deploy-rollback-response.json
          ROLLBACK_STATUS: ${{ steps.rollback_request_action.outputs.status-code }}
          ROLLBACK_OUTCOME: ${{ steps.rollback_request_action.outcome }}
        run: |
          set -euo pipefail

          rollback_status="$ROLLBACK_STATUS"
          if [ -z "$rollback_status" ]; then
            rollback_status="action_failed"
          fi
          if [ "$rollback_status" != "200" ] && [ "$rollback_status" != "202" ]; then
            if [ -s "$ROLLBACK_RESPONSE_FILE" ]; then
              cat "$ROLLBACK_RESPONSE_FILE" >&2
            fi
            {
              echo "## Launchplane rollback failed"
              echo
              echo "- Service rollback HTTP status: $rollback_status"
              echo "- Rollback action outcome: ${ROLLBACK_OUTCOME:-failure}"
              echo "- Rollback image: $PREVIOUS_IMAGE_REFERENCE"
              echo "- Direct Dokploy mutation is manual break-glass only. Run Deploy Launchplane with the exact break-glass confirmation inputs if service rollback is unavailable."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## Launchplane rollback requested"
            echo
            echo "- Service rollback HTTP status: $rollback_status"
            echo "- Rollback image: $PREVIOUS_IMAGE_REFERENCE"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Resolve Launchplane rollback wait timeout
        if: >-
          failure()
          && steps.rollback_request.outputs.payload_file != ''
          && steps.rollback_request.outputs.previous_image_reference != ''
          && steps.rollback_request_action.outcome == 'success'
        id: rollback_wait_timeout
        shell: bash
        run: |
          set -euo pipefail

          wait_timeout_seconds=$((${LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS:-600} + ${LAUNCHPLANE_DEPLOY_HEALTH_TIMEOUT_SECONDS:-180}))
          {
            echo "timeout_seconds=$wait_timeout_seconds"
            echo "timeout_ms=$((wait_timeout_seconds * 1000))"
            echo "deadline_epoch=$(($(date +%s) + wait_timeout_seconds))"
          } >>"$GITHUB_OUTPUT"

      - name: Wait for Launchplane rollback runtime image
        if: >-
          failure()
          && steps.rollback_request.outputs.payload_file != ''
          && steps.rollback_request.outputs.previous_image_reference != ''
          && steps.rollback_request_action.outcome == 'success'
        id: rollback_runtime
        continue-on-error: true
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/service/runtime
          method: GET
          expected-status: "200"
          timeout-ms: "30000"
          poll-until-path: runtime.docker_image_reference
          poll-until-value: ${{ steps.rollback_request.outputs.previous_image_reference }}
          poll-retry-on-request-error: "true"
          poll-retry-on-unexpected-status: "true"
          poll-interval-ms: "5000"
          poll-timeout-ms: ${{ steps.rollback_wait_timeout.outputs.timeout_ms }}
          response-output-file: ${{ runner.temp }}/launchplane-rollback-runtime-wait.json
          log-response-body: "false"

      - name: Check Launchplane rollback runtime image
        if: >-
          failure()
          && steps.rollback_request.outputs.payload_file != ''
          && steps.rollback_request.outputs.previous_image_reference != ''
          && steps.rollback_request_action.outcome == 'success'
        shell: bash
        env:
          PREVIOUS_IMAGE_REFERENCE: ${{ steps.rollback_request.outputs.previous_image_reference }}
          ROLLBACK_RESPONSE_FILE: ${{ runner.temp }}/launchplane-self-deploy-rollback-response.json
          ROLLBACK_RUNTIME_RESPONSE_FILE: ${{ runner.temp }}/launchplane-rollback-runtime-wait.json
          ROLLBACK_RUNTIME_OUTCOME: ${{ steps.rollback_runtime.outcome }}
          ROLLBACK_STATUS: ${{ steps.rollback_request_action.outputs.status-code }}
        run: |
          set -euo pipefail

          if [ "${ROLLBACK_RUNTIME_OUTCOME:-failure}" = "success" ]; then
            echo "Rolled Launchplane back to $PREVIOUS_IMAGE_REFERENCE."
            exit 0
          fi
          echo "Timed out waiting for Launchplane rollback image '$PREVIOUS_IMAGE_REFERENCE' to become live." >&2
          if [ -s "$ROLLBACK_RUNTIME_RESPONSE_FILE" ]; then
            echo "Rollback runtime response summary:" >&2
            jq '{runtime, error}' "$ROLLBACK_RUNTIME_RESPONSE_FILE" >&2 || cat "$ROLLBACK_RUNTIME_RESPONSE_FILE" >&2 || true
          fi
          if [ -s "$ROLLBACK_RESPONSE_FILE" ]; then
            echo "Rollback request response summary:" >&2
            jq '{status, trace_id, error, result}' "$ROLLBACK_RESPONSE_FILE" >&2 || cat "$ROLLBACK_RESPONSE_FILE" >&2 || true
          fi
          {
            echo "## Launchplane rollback timed out"
            echo
            echo "- Service rollback HTTP status: ${ROLLBACK_STATUS:-unknown}"
            echo "- Rollback image: $PREVIOUS_IMAGE_REFERENCE"
            echo "- Rollback runtime action outcome: ${ROLLBACK_RUNTIME_OUTCOME:-failure}"
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Wait for Launchplane rollback health URLs
        if: >-
          failure()
          && steps.rollback_request.outputs.payload_file != ''
          && steps.rollback_request.outputs.previous_image_reference != ''
          && steps.rollback_request_action.outcome == 'success'
          && steps.rollback_runtime.outcome == 'success'
        id: rollback_health
        shell: bash
        env:
          PREVIOUS_IMAGE_REFERENCE: ${{ steps.rollback_request.outputs.previous_image_reference }}
          ROLLBACK_RESPONSE_FILE: ${{ runner.temp }}/launchplane-self-deploy-rollback-response.json
          ROLLBACK_STATUS: ${{ steps.rollback_request_action.outputs.status-code }}
          WAIT_DEADLINE_EPOCH: ${{ steps.rollback_wait_timeout.outputs.deadline_epoch }}
        run: |
          set -euo pipefail

          deadline_epoch="${WAIT_DEADLINE_EPOCH:?}"
          last_report_seconds=0
          while [ "$(date +%s)" -lt "$deadline_epoch" ]; do
            all_healthy=1
            health_report=""
            while IFS= read -r raw_url; do
              health_url="$(printf '%s' "$raw_url" | xargs)"
              if [ -z "$health_url" ]; then
                continue
              fi
              health_response_file="$(mktemp)"
              health_status_code="$(curl -sSL -o "$health_response_file" -w '%{http_code}' "$health_url" 2>/dev/null || true)"
              health_status_value="$(jq -r '.status // empty' "$health_response_file" 2>/dev/null || true)"
              if [ -z "$health_report" ]; then
                health_report="${health_url}=${health_status_code:-curl_failed}:${health_status_value:-unknown}"
              else
                health_report="$health_report,${health_url}=${health_status_code:-curl_failed}:${health_status_value:-unknown}"
              fi
              if [ "$health_status_code" != "200" ] || [ "$health_status_value" != "ok" ]; then
                all_healthy=0
                rm -f "$health_response_file"
                break
              fi
              rm -f "$health_response_file"
            done < <(printf '%s\n' "$LAUNCHPLANE_DEPLOY_HEALTH_URLS" | tr ',' '\n')

            if [ "$all_healthy" -eq 1 ]; then
              remaining_seconds=$((deadline_epoch - $(date +%s)))
              if [ "$remaining_seconds" -lt 0 ]; then
                remaining_seconds=0
              fi
              remaining_timeout_ms=$((remaining_seconds * 1000))
              if [ "$remaining_timeout_ms" -lt 1 ]; then
                remaining_timeout_ms=1
              fi
              echo "remaining_timeout_ms=$remaining_timeout_ms" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$((SECONDS - last_report_seconds))" -ge 30 ]; then
              echo "Waiting for Launchplane rollback health URLs. health=${health_report:-none}"
              last_report_seconds=$SECONDS
            fi
            sleep 5
          done

          echo "Timed out waiting for Launchplane rollback health URLs to become healthy." >&2
          if [ -s "$ROLLBACK_RESPONSE_FILE" ]; then
            echo "Rollback request response summary:" >&2
            jq '{status, trace_id, error, result}' "$ROLLBACK_RESPONSE_FILE" >&2 || cat "$ROLLBACK_RESPONSE_FILE" >&2 || true
          fi
          {
            echo "## Launchplane rollback timed out"
            echo
            echo "- Service rollback HTTP status: ${ROLLBACK_STATUS:-unknown}"
            echo "- Rollback image: $PREVIOUS_IMAGE_REFERENCE"
            echo "- Rollback request response file: $ROLLBACK_RESPONSE_FILE"
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify Launchplane rollback runtime image after health
        if: >-
          failure()
          && steps.rollback_request.outputs.payload_file != ''
          && steps.rollback_request.outputs.previous_image_reference != ''
          && steps.rollback_request_action.outcome == 'success'
          && steps.rollback_runtime.outcome == 'success'
          && steps.rollback_health.outcome == 'success'
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/service/runtime
          method: GET
          expected-status: "200"
          timeout-ms: "30000"
          poll-until-path: runtime.docker_image_reference
          poll-until-value: ${{ steps.rollback_request.outputs.previous_image_reference }}
          poll-interval-ms: "1000"
          poll-timeout-ms: ${{ steps.rollback_health.outputs.remaining_timeout_ms }}
          response-output-file: ${{ runner.temp }}/launchplane-rollback-runtime-final.json
          log-response-body: "false"

      - name: Render runtime key-safety policy
        id: runtime_key_safety
        shell: bash
        env:
          LAUNCHPLANE_RUNTIME_KEY_SAFETY_RULES_JSON: >-
            ${{ vars.LAUNCHPLANE_RUNTIME_KEY_SAFETY_RULES_JSON }}
        run: bash scripts/deploy/render-runtime-key-safety-policy.sh

      - name: Ensure runtime key-safety policy
        if: steps.runtime_key_safety.outputs.has_runtime_key_safety_policy == 'true'
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/runtime-key-safety/policies/apply
          payload-file: ${{ steps.runtime_key_safety.outputs.runtime_key_safety_policy_file }}
          idempotency-key: ${{ steps.runtime_key_safety.outputs.runtime_key_safety_idempotency_key }}
          response-output-file: ${{ runner.temp }}/launchplane-runtime-key-safety/runtime-key-safety-policy-response.json
          log-response-body: "false"

      - name: Read deployed Launchplane runtime
        id: deployed_runtime
        continue-on-error: true
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ steps.service.outputs.service_url }}
          audience: ${{ steps.service.outputs.service_audience }}
          route-path: /v1/service/runtime
          method: GET
          expected-status: "200"
          timeout-ms: "30000"
          response-output-file: ${{ runner.temp }}/launchplane-runtime-smoke.json
          log-response-body: "false"

      - name: Capture v2 deployed smoke evidence
        shell: bash
        env:
          DEPLOYED_IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}
          LAUNCHPLANE_SERVICE_URL: ${{ steps.service.outputs.service_url }}
          RUNTIME_RESPONSE_FILE: ${{ runner.temp }}/launchplane-runtime-smoke.json
          RUNTIME_STATUS_CODE: ${{ steps.deployed_runtime.outputs.status-code }}
          RUNTIME_OUTCOME: ${{ steps.deployed_runtime.outcome }}
        run: |
          set -euo pipefail

          results_file="launchplane-v2-deployed-smoke.jsonl"
          : > "$results_file"

          append_result() {
            local route_path="$1"
            local method="$2"
            local caller="$3"
            local status_code="$4"
            local classification="$5"
            local trace_id="$6"
            local expected="$7"
            local ok="$8"
            jq -cn \
              --arg route_path "$route_path" \
              --arg method "$method" \
              --arg caller "$caller" \
              --arg status_code "$status_code" \
              --arg classification "$classification" \
              --arg trace_id "$trace_id" \
              --arg expected "$expected" \
              --arg ok "$ok" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg sha "$GITHUB_SHA" \
              --arg image_reference "$DEPLOYED_IMAGE_REFERENCE" \
              '{
                route_path: $route_path,
                method: $method,
                caller: $caller,
                http_status: $status_code,
                classification: $classification,
                trace_id: $trace_id,
                expected: $expected,
                ok: ($ok == "true"),
                run_id: $run_id,
                run_attempt: $run_attempt,
                sha: $sha,
                image_reference: $image_reference
              }' >> "$results_file"
          }

          health_response_file="$(mktemp)"
          health_status_code="$(curl -sS \
            -o "$health_response_file" \
            -w '%{http_code}' \
            "${LAUNCHPLANE_SERVICE_URL}/v1/health")"
          health_status_value="$(jq -r '.status // empty' "$health_response_file" 2>/dev/null || true)"
          health_trace_id="$(jq -r '.trace_id // empty' "$health_response_file" 2>/dev/null || true)"
          append_result \
            "/v1/health" \
            "GET" \
            "public" \
            "$health_status_code" \
            "health" \
            "$health_trace_id" \
            "200 ok" \
            "$([ "$health_status_code" = "200" ] && [ "$health_status_value" = "ok" ] && echo true || echo false)"
          if [ "$health_status_code" != "200" ] || [ "$health_status_value" != "ok" ]; then
            cat "$health_response_file" >&2
            echo "Launchplane health smoke failed." >&2
            exit 1
          fi
          rm -f "$health_response_file"

          runtime_status_code="$RUNTIME_STATUS_CODE"
          if [ -z "$runtime_status_code" ]; then
            runtime_status_code="action_failed"
          fi
          actual_image_reference="$(jq -r '.runtime.docker_image_reference // empty' "$RUNTIME_RESPONSE_FILE" 2>/dev/null || true)"
          database_schema_revision="$(jq -r '.runtime.database_schema_revision // empty' "$RUNTIME_RESPONSE_FILE" 2>/dev/null || true)"
          schema_migration_target_revision="$(jq -r '.runtime.schema_migration_target_revision // empty' "$RUNTIME_RESPONSE_FILE" 2>/dev/null || true)"
          schema_revision_is_compatible="$(jq -r \
            --arg revision "$database_schema_revision" \
            '(.runtime.compatible_database_schema_revisions // []) | index($revision) != null' \
            "$RUNTIME_RESPONSE_FILE" 2>/dev/null || echo false)"
          runtime_trace_id="$(jq -r '.trace_id // empty' "$RUNTIME_RESPONSE_FILE" 2>/dev/null || true)"
          append_result \
            "/v1/service/runtime" \
            "GET" \
            "github-actions-oidc" \
            "$runtime_status_code" \
            "runtime-image" \
            "$runtime_trace_id" \
            "200 matching image" \
            "$([ "$runtime_status_code" = "200" ] && [ "$actual_image_reference" = "$DEPLOYED_IMAGE_REFERENCE" ] && echo true || echo false)"
          append_result \
            "/v1/service/runtime" \
            "GET" \
            "github-actions-oidc" \
            "$runtime_status_code" \
            "schema-migration-compatibility" \
            "$runtime_trace_id" \
            "compatible database revision ${database_schema_revision}; image target ${schema_migration_target_revision}" \
            "$([ "$runtime_status_code" = "200" ] && [ -n "$database_schema_revision" ] && [ -n "$schema_migration_target_revision" ] && [ "$schema_revision_is_compatible" = "true" ] && echo true || echo false)"
          if [ "${RUNTIME_OUTCOME:-failure}" != "success" ] \
            || [ "$runtime_status_code" != "200" ] \
            || [ "$actual_image_reference" != "$DEPLOYED_IMAGE_REFERENCE" ] \
            || [ -z "$database_schema_revision" ] \
            || [ -z "$schema_migration_target_revision" ] \
            || [ "$schema_revision_is_compatible" != "true" ]; then
            jq '{status, trace_id, error, runtime: {docker_image_reference: .runtime.docker_image_reference, compatible_database_schema_revisions: .runtime.compatible_database_schema_revisions, database_schema_revision: .runtime.database_schema_revision, schema_migration_target_revision: .runtime.schema_migration_target_revision}}' "$RUNTIME_RESPONSE_FILE" >&2 || cat "$RUNTIME_RESPONSE_FILE" >&2 || true
            echo "Launchplane runtime smoke failed." >&2
            exit 1
          fi

          openapi_response_file="$(mktemp)"
          openapi_status_code="$(curl -sS \
            -o "$openapi_response_file" \
            -w '%{http_code}' \
            "${LAUNCHPLANE_SERVICE_URL}/openapi.json")"
          openapi_ok="true"
          if [ "$openapi_status_code" != "200" ]; then
            openapi_ok="false"
          else
            for route_path in \
              /v1/health \
              /v1/service/runtime \
              /v1/drivers/launchplane/self-deploy \
              /v1/drivers/odoo/artifact-publish-inputs \
              /v1/drivers/odoo/preview-apply-inputs \
              /v1/drivers/odoo/preview-apply \
              /v1/previews/pr-feedback \
              /v1/work-graph/snapshot; do
              if ! jq -e --arg route_path "$route_path" '.paths[$route_path]' \
                "$openapi_response_file" >/dev/null; then
                openapi_ok="false"
                break
              fi
            done
          fi
          append_result \
            "/openapi.json" \
            "GET" \
            "public" \
            "$openapi_status_code" \
            "openapi-route-coverage" \
            "" \
            "200 with representative native route paths" \
            "$openapi_ok"
          if [ "$openapi_ok" != "true" ]; then
            jq '{openapi: .openapi, info: .info, paths: (.paths | keys)}' \
              "$openapi_response_file" >&2 || cat "$openapi_response_file" >&2
            echo "Launchplane OpenAPI smoke failed." >&2
            exit 1
          fi
          rm -f "$openapi_response_file"

          jq -s '{status: "ok", results: .}' "$results_file" \
            > launchplane-v2-deployed-smoke.json
          jq . launchplane-v2-deployed-smoke.json

      - name: Upload v2 deployed smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launchplane-v2-deployed-smoke
          path: |
            launchplane-v2-deployed-smoke.json
            launchplane-v2-deployed-smoke.jsonl
          if-no-files-found: error

      - name: Summarize v2 deployed smoke evidence
        if: always()
        shell: bash
        env:
          DEPLOYED_IMAGE_REFERENCE: ${{ steps.image.outputs.image_reference }}
        run: |
          set -euo pipefail
          if [ ! -f launchplane-v2-deployed-smoke.json ]; then
            {
              echo "## Launchplane v2 deployed smoke"
              echo
              echo "- Evidence artifact: unavailable"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Launchplane v2 deployed smoke"
            echo
            echo "- Image: $DEPLOYED_IMAGE_REFERENCE"
            echo "- Evidence artifact: launchplane-v2-deployed-smoke"
            echo
            jq -r '.results[] | "- \(.method) \(.route_path): HTTP \(.http_status) ok=\(.ok) classification=\(.classification) trace=\(.trace_id)"' \
              launchplane-v2-deployed-smoke.json
          } >> "$GITHUB_STEP_SUMMARY"

  emergency-dokploy-rollback:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.break_glass_confirm == 'ROLL BACK LAUNCHPLANE THROUGH DIRECT DOKPLOY'
    environment: launchplane-break-glass
    permissions:
      contents: read
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      LAUNCHPLANE_DOKPLOY_TARGET_ID: ${{ vars.LAUNCHPLANE_DOKPLOY_TARGET_ID }}
      LAUNCHPLANE_DOKPLOY_TARGET_TYPE: ${{ vars.LAUNCHPLANE_DOKPLOY_TARGET_TYPE }}
      LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS: ${{ vars.LAUNCHPLANE_DOKPLOY_DEPLOY_TIMEOUT_SECONDS }}
      LAUNCHPLANE_IMAGE_REPOSITORY: ${{ vars.LAUNCHPLANE_IMAGE_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Validate manual break-glass request
        shell: bash
        env:
          BREAK_GLASS_IMAGE_REFERENCE: ${{ inputs.break_glass_image_reference }}
          BREAK_GLASS_REASON: ${{ inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          : "${LAUNCHPLANE_DOKPLOY_TARGET_TYPE:?Missing LAUNCHPLANE_DOKPLOY_TARGET_TYPE variable}"
          : "${LAUNCHPLANE_DOKPLOY_TARGET_ID:?Missing LAUNCHPLANE_DOKPLOY_TARGET_ID variable}"
          if [ -z "$BREAK_GLASS_IMAGE_REFERENCE" ]; then
            echo "break_glass_image_reference is required for direct Dokploy rollback." >&2
            exit 1
          fi
          if [ -z "$BREAK_GLASS_REASON" ]; then
            echo "break_glass_reason is required for direct Dokploy rollback." >&2
            exit 1
          fi

          image_repository="${LAUNCHPLANE_IMAGE_REPOSITORY:-}"
          if [ -z "$image_repository" ]; then
            image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          if [[ "$image_repository" =~ [[:cntrl:]] ]]; then
            echo "Launchplane image repository must not contain control characters." >&2
            exit 1
          fi

          expected_image_prefix="${image_repository}@sha256:"
          if [[ "$BREAK_GLASS_IMAGE_REFERENCE" != "$expected_image_prefix"* ]]; then
            echo "break_glass_image_reference must use the configured Launchplane image repository and an immutable sha256 digest." >&2
            exit 1
          fi
          image_digest="${BREAK_GLASS_IMAGE_REFERENCE#"$expected_image_prefix"}"
          if [[ ! "$image_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "break_glass_image_reference must end with a lowercase sha256 digest." >&2
            exit 1
          fi

          if [ "${#BREAK_GLASS_REASON}" -lt 8 ] || [ "${#BREAK_GLASS_REASON}" -gt 500 ]; then
            echo "break_glass_reason must be between 8 and 500 printable characters." >&2
            exit 1
          fi
          if [[ "$BREAK_GLASS_REASON" =~ [[:cntrl:]] ]] || [[ ! "$BREAK_GLASS_REASON" =~ [^[:space:]] ]]; then
            echo "break_glass_reason must be single-line, printable, and contain non-whitespace text." >&2
            exit 1
          fi

      - name: Run manual direct Dokploy rollback
        shell: bash
        env:
          LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST: ${{ secrets.LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST }}
          LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN: ${{ secrets.LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN }}
          LAUNCHPLANE_ROLLBACK_IMAGE_REFERENCE: ${{ inputs.break_glass_image_reference }}
          LAUNCHPLANE_ROLLBACK_REASON: ${{ inputs.break_glass_reason }}
        run: |
          set -euo pipefail
          : "${LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST:?Missing LAUNCHPLANE_EMERGENCY_DOKPLOY_HOST secret}"
          : "${LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN:?Missing LAUNCHPLANE_EMERGENCY_DOKPLOY_TOKEN secret}"
          evidence_file="$RUNNER_TEMP/launchplane-break-glass-rollback.json"
          LAUNCHPLANE_ALLOW_DIRECT_DOKPLOY_FALLBACK=true \
            LAUNCHPLANE_ROLLBACK_REQUEST_STATUS="manual-break-glass" \
            uv run python scripts/deploy/emergency-dokploy-rollback.py | tee "$evidence_file"

          {
            printf '%s\n' "## Launchplane break-glass rollback"
            printf '\n'
            printf '%s\n' "- Fallback: direct Dokploy"
            printf -- "- Reason: %s\n" "$LAUNCHPLANE_ROLLBACK_REASON"
            printf -- "- Target type: %s\n" "$LAUNCHPLANE_DOKPLOY_TARGET_TYPE"
            printf -- "- Target id: %s\n" "$LAUNCHPLANE_DOKPLOY_TARGET_ID"
            printf -- "- Rollback image: %s\n" "$LAUNCHPLANE_ROLLBACK_IMAGE_REFERENCE"
            printf '%s\n' "- Evidence artifact: launchplane-break-glass-rollback"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload break-glass rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launchplane-break-glass-rollback
          path: ${{ runner.temp }}/launchplane-break-glass-rollback.json
          if-no-files-found: ignore
