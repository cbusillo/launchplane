---
name: Product Onboarding Manifest (Advanced)

"on":
  workflow_dispatch:
    inputs:
      manifest_base64:
        description: Base64-encoded product onboarding JSON manifest.
        required: true
        type: string
      confirmation:
        description: Type APPLY PRODUCT ONBOARDING to apply records.
        required: true
        type: string
      reason:
        description: Operator reason for applying onboarding records.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: product-onboarding
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Validate apply guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY PRODUCT ONBOARDING" ]; then
            echo "Exact confirmation text is required." >&2
            exit 1
          fi
          if [ -z "$(printf '%s' "$REASON" | xargs)" ]; then
            echo "reason is required." >&2
            exit 1
          fi

      - name: Build onboarding request
        id: onboarding
        shell: bash
        run: |
          set -euo pipefail
          : "${MANIFEST_BASE64:?Missing manifest_base64 input}"
          manifest_file="${RUNNER_TEMP}/product-onboarding-manifest.json"
          request_file="${RUNNER_TEMP}/product-onboarding-request.json"
          python3 - <<'PY' > "$manifest_file"
          import base64
          import binascii
          import os
          import sys

          try:
              sys.stdout.buffer.write(
                  base64.b64decode(
                      os.environ["MANIFEST_BASE64"].encode("ascii"), validate=True
                  )
              )
          except (binascii.Error, UnicodeEncodeError) as error:
              raise SystemExit(f"manifest_base64 must be valid base64: {error}")
          PY
          jq -e 'type == "object"' "$manifest_file" >/dev/null
          product="$(jq -r '.product // empty' "$manifest_file")"
          if [ -z "$product" ]; then
            echo "Product onboarding manifest requires product." >&2
            exit 1
          fi
          jq -n \
            --slurpfile manifest "$manifest_file" \
            '{schema_version: 1, product: "launchplane", manifest: $manifest[0]}' \
            > "$request_file"
          {
            echo "request_file=$request_file"
            echo "product=$product"
            echo "idempotency_key=product-onboarding:${product}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Request product onboarding apply
        id: onboarding_request
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/product-onboarding/apply
          payload-file: ${{ steps.onboarding.outputs.request_file }}
          idempotency-key: ${{ steps.onboarding.outputs.idempotency_key }}
          fail-result-paths: ""
          response-output-file: product-onboarding.json

      - name: Check product onboarding response
        shell: bash
        env:
          STATUS_CODE: ${{ steps.onboarding_request.outputs.status-code }}
        run: |
          set -euo pipefail
          if [ "$STATUS_CODE" != "202" ]; then
            cat product-onboarding.json >&2
            echo "Product onboarding failed with HTTP ${STATUS_CODE}." >&2
            exit 1
          fi
          jq . product-onboarding.json

      - name: Upload onboarding evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-onboarding-result
          path: product-onboarding.json
          if-no-files-found: warn

      - name: Summarize onboarding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Product onboarding"
            echo
            echo "- Product: ${{ steps.onboarding.outputs.product }}"
            echo "- Evidence artifact: product-onboarding-result"
            if [ -f product-onboarding.json ]; then
              echo "- Status: $(jq -r '.status // "unknown"' product-onboarding.json)"
              echo "- Trace: $(jq -r '.trace_id // ""' product-onboarding.json)"
              echo "- Product profile: $(jq -r '.records.product_profile // ""' product-onboarding.json)"
              echo "- Provider targets: $(jq -r '.records.provider_target_count // "0"' product-onboarding.json)"
              echo "- Provider target IDs: $(jq -r '.records.provider_target_id_count // "0"' product-onboarding.json)"
              echo "- Runtime environments: $(jq -r '.records.runtime_environment_record_count // "0"' product-onboarding.json)"
              echo "- Secret bindings: $(jq -r '.records.secret_binding_count // "0"' product-onboarding.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
