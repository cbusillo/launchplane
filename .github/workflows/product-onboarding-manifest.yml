---
name: Product Onboarding Manifest (Advanced)

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: Advanced onboarding operation to run.
        required: true
        default: stable-lane-repair
        type: choice
        options:
          - manifest-apply
          - stable-lane-repair
      mode:
        description: Review or apply the stable-lane repair operation.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      manifest_base64:
        description: Base64 product onboarding JSON; required for manifest-apply.
        required: false
        default: ""
        type: string
      product:
        description: Product profile key for stable-lane-repair.
        required: false
        default: ""
        type: string
      context:
        description: Existing stable context for stable-lane-repair.
        required: false
        default: ""
        type: string
      instance:
        description: Missing stable lane instance for stable-lane-repair.
        required: false
        default: ""
        type: string
      base_url:
        description: HTTPS origin selected from tracked target domains.
        required: false
        default: ""
        type: string
      reviewed_plan_sha256:
        description: Reviewed stable-lane dry-run plan SHA-256; required for apply.
        required: false
        default: ""
        type: string
      confirmation:
        description: Exact confirmation required for apply operations.
        required: false
        default: ""
        type: string
      reason:
        description: Operator reason recorded with the request.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: product-onboarding
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: launchplane-authz-admin
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      OPERATION: ${{ inputs.operation }}
      MODE: ${{ inputs.mode }}
      MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
      PRODUCT: ${{ inputs.product }}
      CONTEXT: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      BASE_URL: ${{ inputs.base_url }}
      REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Validate advanced onboarding request
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${REASON//[[:space:]]/}" ]]; then
            echo "reason is required." >&2
            exit 1
          fi
          case "$OPERATION" in
            manifest-apply)
              if [ "$MODE" != "apply" ]; then
                echo "manifest-apply supports apply mode only." >&2
                exit 1
              fi
              if [ "$CONFIRMATION" != "APPLY PRODUCT ONBOARDING" ]; then
                echo "Type APPLY PRODUCT ONBOARDING for manifest-apply." >&2
                exit 1
              fi
              : "${MANIFEST_BASE64:?manifest_base64 is required for manifest-apply}"
              ;;
            stable-lane-repair)
              for required in PRODUCT CONTEXT INSTANCE BASE_URL; do
                if [[ -z "${!required//[[:space:]]/}" ]]; then
                  echo "${required} is required for stable-lane-repair." >&2
                  exit 1
                fi
              done
              case "$MODE" in
                dry-run)
                  if [[ -n "${REVIEWED_PLAN_SHA256//[[:space:]]/}" ]]; then
                    echo "reviewed_plan_sha256 must be empty for dry-run." >&2
                    exit 1
                  fi
                  ;;
                apply)
                  if [ "$CONFIRMATION" != "APPLY PRODUCT STABLE LANE REPAIR" ]; then
                    echo "Type APPLY PRODUCT STABLE LANE REPAIR for apply mode." >&2
                    exit 1
                  fi
                  if ! [[ "$REVIEWED_PLAN_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
                    echo "apply requires the reviewed dry-run plan SHA-256." >&2
                    exit 1
                  fi
                  ;;
                *)
                  echo "mode must be dry-run or apply." >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 1
              ;;
          esac

      - name: Build advanced onboarding request
        id: onboarding
        shell: bash
        run: |
          set -euo pipefail
          request_file="${RUNNER_TEMP}/advanced-product-onboarding-request.json"
          response_file="product-onboarding.json"
          if [ "$OPERATION" = "manifest-apply" ]; then
            manifest_file="${RUNNER_TEMP}/product-onboarding-manifest.json"
            python3 - <<'PY' > "$manifest_file"
          import base64
          import binascii
          import os
          import sys

          try:
              sys.stdout.buffer.write(
                  base64.b64decode(
                      os.environ["MANIFEST_BASE64"].encode("ascii"), validate=True
                  )
              )
          except (binascii.Error, UnicodeEncodeError) as error:
              raise SystemExit(f"manifest_base64 must be valid base64: {error}")
          PY
            jq -e 'type == "object"' "$manifest_file" >/dev/null
            product="$(jq -r '.product // empty' "$manifest_file")"
            if [ -z "$product" ]; then
              echo "Product onboarding manifest requires product." >&2
              exit 1
            fi
            jq -n \
              --slurpfile manifest "$manifest_file" \
              '{schema_version: 1, product: "launchplane", manifest: $manifest[0]}' \
              > "$request_file"
            route_path="/v1/product-onboarding/apply"
            idempotency_key="product-onboarding:${product}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          else
            product="$PRODUCT"
            jq -n \
              --arg product "$PRODUCT" \
              --arg context "$CONTEXT" \
              --arg instance "$INSTANCE" \
              --arg base_url "$BASE_URL" \
              --arg mode "$MODE" \
              --arg reason "$REASON" \
              --arg reviewed_plan_sha256 "$REVIEWED_PLAN_SHA256" \
              '{
                schema_version: 1,
                product: $product,
                context: $context,
                instance: $instance,
                base_url: $base_url,
                mode: $mode,
                reason: $reason,
                reviewed_plan_sha256: $reviewed_plan_sha256
              }' > "$request_file"
            route_path="/v1/product-profiles/stable-lane-repair/apply"
            idempotency_key=""
            if [ "$MODE" = "apply" ]; then
              idempotency_key="product-stable-lane-repair:${PRODUCT}:${CONTEXT}:${INSTANCE}:${REVIEWED_PLAN_SHA256}"
            fi
          fi
          {
            echo "idempotency_key=$idempotency_key"
            echo "product=$product"
            echo "request_file=$request_file"
            echo "response_file=$response_file"
            echo "route_path=$route_path"
          } >> "$GITHUB_OUTPUT"

      - name: Request advanced onboarding operation
        id: onboarding_request
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: ${{ steps.onboarding.outputs.route_path }}
          payload-file: ${{ steps.onboarding.outputs.request_file }}
          idempotency-key: ${{ steps.onboarding.outputs.idempotency_key }}
          fail-result-paths: ""
          response-output-file: ${{ steps.onboarding.outputs.response_file }}
          log-response-body: "false"

      - name: Check advanced onboarding response
        shell: bash
        env:
          STATUS_CODE: ${{ steps.onboarding_request.outputs.status-code }}
          RESPONSE_FILE: ${{ steps.onboarding.outputs.response_file }}
        run: |
          set -euo pipefail
          if [ "$STATUS_CODE" != "202" ]; then
            jq '{status, trace_id, error}' "$RESPONSE_FILE" >&2 || true
            echo "Advanced onboarding operation failed with HTTP ${STATUS_CODE}." >&2
            exit 1
          fi
          jq . "$RESPONSE_FILE"

      - name: Upload advanced onboarding evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-onboarding-result
          path: product-onboarding.json
          if-no-files-found: warn

      - name: Summarize advanced onboarding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Product onboarding manifest (advanced)"
            echo
            echo "- Operation: ${OPERATION}"
            echo "- Mode: ${MODE}"
            echo "- Product: ${{ steps.onboarding.outputs.product }}"
            echo "- Evidence artifact: product-onboarding-result"
            if [ -f product-onboarding.json ]; then
              echo "- Status: $(jq -r '.status // "unknown"' product-onboarding.json)"
              echo "- Trace: $(jq -r '.trace_id // ""' product-onboarding.json)"
              echo "- Changed: $(jq -r '.result.changed // false' product-onboarding.json)"
              echo "- Applied: $(jq -r '.result.applied // false' product-onboarding.json)"
              echo "- Plan SHA-256: $(jq -r '.result.plan_sha256 // ""' product-onboarding.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
