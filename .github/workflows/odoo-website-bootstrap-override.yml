---
name: Odoo Website Bootstrap Override

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      instance:
        description: Stable Odoo instance to update.
        required: true
        type: choice
        options:
          - testing
          - prod
      website_bootstrap_payload:
        description: Website bootstrap JSON object rendered from tenant bootstrap settings; homepage and route URLs must be local Odoo route paths.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  write:
    uses: cbusillo/launchplane/.github/workflows/reusable-odoo-website-bootstrap-override.yml@b62941a9219f69a2575c1bce1a8d7fcb8c605f3c # main
    permissions:
      contents: read
      id-token: write
    with:
      product: ${{ inputs.product }}
      context: ${{ inputs.context }}
      instance: ${{ inputs.instance }}
      website_bootstrap_payload: ${{ inputs.website_bootstrap_payload }}
