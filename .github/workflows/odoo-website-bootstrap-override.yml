---
name: Odoo Website Bootstrap Override

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      instance:
        description: Stable Odoo instance to update.
        required: true
        type: choice
        options:
          - testing
          - prod
      website_bootstrap_payload:
        description: Website bootstrap JSON object with local Odoo route paths, or null to withdraw.
        required: true
        type: string
      mode:
        description: Plan without effects, or persist the intent.
        default: apply
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read
  id-token: write

jobs:
  write:
    uses: cbusillo/launchplane/.github/workflows/reusable-odoo-website-bootstrap-override.yml@27e580240f0eb693d8dab33a62ede406267c9be4 # main
    permissions:
      contents: read
      id-token: write
    with:
      product: ${{ inputs.product }}
      context: ${{ inputs.context }}
      instance: ${{ inputs.instance }}
      website_bootstrap_payload: ${{ inputs.website_bootstrap_payload }}
      # noinspection UndefinedParamsPresent
      mode: ${{ inputs.mode }}
