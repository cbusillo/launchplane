---
name: Runner Host Hygiene

"on":
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      audit_record_key:
        description: Launchplane audit record key
        required: true
        type: string
      action:
        description: Approved hygiene action
        required: true
        default: prune_docker_cache
        type: choice
        options:
          - prune_docker_cache
          - remove_buildkit_state_volumes
      mutate:
        description: Execute the approved hygiene action
        required: true
        default: false
        type: boolean
      target_buildkit_state_volumes:
        description: >-
          One zero-link BuildKit state volume for removal
        required: false
        default: ""
        type: string
      minimum_free_disk_bytes:
        description: Minimum free disk bytes required in pre/post evidence
        required: false
        default: "0"
        type: string
      prune_until:
        description: Docker builder prune age filter
        required: false
        default: 168h
        type: string
      timeout_seconds:
        description: Timeout for each local host evidence or prune command
        required: false
        default: "300"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: runner-host-hygiene-${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_HOST }}
  cancel-in-progress: false

jobs:
  runner-host-hygiene:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_EXECUTION_LANE }}
    env:
      LAUNCHPLANE_SERVICE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      RUNNER_HOST_NAME: ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_HOST }}
      RUNNER_EXECUTION_LANE: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_EXECUTION_LANE }}
      RUNNER_SERVICE_USER: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_SERVICE_USER }}
      RUNNER_REPOSITORY_SCOPE: ${{ github.repository }}
      RUNNER_RETAINED_WARM_BUILDERS: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_RETAINED_WARM_BUILDERS }}
      RUNNER_ALLOWED_BUILDKIT_STATE_VOLUMES: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_ALLOWED_BUILDKIT_STATE_VOLUMES
        }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail

          require_env() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "Missing ${name}." >&2
              exit 1
            fi
          }
          require_env RUNNER_HOST_NAME
          require_env RUNNER_EXECUTION_LANE
          require_env RUNNER_SERVICE_USER
          require_env RUNNER_RETAINED_WARM_BUILDERS
          if [ "$(id -un)" != "$RUNNER_SERVICE_USER" ]; then
            echo "Runner must execute as ${RUNNER_SERVICE_USER}." >&2
            exit 1
          fi

      - name: Run approved runner host hygiene executor
        shell: bash
        run: |
          set -euo pipefail

          apply_action="${{ inputs.action }}"
          if [ -z "$apply_action" ]; then
            apply_action="prune_docker_cache"
          fi

          audit_record_key="${{ inputs.audit_record_key }}"
          if [ -z "$audit_record_key" ]; then
            audit_date="$(date -u +%F)"
            audit_record_key="runner-host-hygiene/${audit_date}/"
            audit_record_key+="${RUNNER_HOST_NAME}-scheduled-report-${GITHUB_RUN_ID}"
          fi

          minimum_free_disk_bytes="${{ inputs.minimum_free_disk_bytes }}"
          if [ -z "$minimum_free_disk_bytes" ]; then
            minimum_free_disk_bytes="0"
          fi

          prune_until="${{ inputs.prune_until }}"
          if [ -z "$prune_until" ]; then
            prune_until="168h"
          fi

          timeout_seconds="${{ inputs.timeout_seconds }}"
          if [ -z "$timeout_seconds" ]; then
            timeout_seconds="300"
          fi

          builder_args=()
          IFS=',' read -r -a builders <<< "$RUNNER_RETAINED_WARM_BUILDERS"
          for builder in "${builders[@]}"; do
            trimmed="${builder#"${builder%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -n "$trimmed" ]; then
              builder_args+=(--retained-warm-builder "$trimmed")
            fi
          done
          if [ "${#builder_args[@]}" -eq 0 ]; then
            echo "At least one retained warm builder is required." >&2
            exit 1
          fi

          volume_args=()
          target_volumes="${{ inputs.target_buildkit_state_volumes }}"
          IFS=',' read -r -a volumes <<< "$target_volumes"
          for volume in "${volumes[@]}"; do
            trimmed="${volume#"${volume%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -n "$trimmed" ]; then
              volume_args+=(--target-buildkit-state-volume "$trimmed")
            fi
          done

          if [ "$apply_action" = "remove_buildkit_state_volumes" ]; then
            allowed_volumes="$RUNNER_ALLOWED_BUILDKIT_STATE_VOLUMES"
            IFS=',' read -r -a volumes <<< "$allowed_volumes"
            for volume in "${volumes[@]}"; do
              trimmed="${volume#"${volume%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -n "$trimmed" ]; then
                volume_args+=(--allowed-buildkit-state-volume "$trimmed")
              fi
            done
          fi

          mutate_flag="--dry-run"
          if [ "${{ github.event_name }}" != "schedule" ] &&
            [ "${{ inputs.mutate }}" = "true" ]; then
            mutate_flag="--mutate"
          fi

          uv run launchplane work-graph runner-host-hygiene-executor \
            --action "$apply_action" \
            --host-name "$RUNNER_HOST_NAME" \
            --execution-lane "$RUNNER_EXECUTION_LANE" \
            --service-user "$RUNNER_SERVICE_USER" \
            --repository-scope "$RUNNER_REPOSITORY_SCOPE" \
            --audit-record-key "$audit_record_key" \
            "${builder_args[@]}" \
            "${volume_args[@]}" \
            "$mutate_flag" \
            --minimum-free-disk-bytes "$minimum_free_disk_bytes" \
            --prune-until "$prune_until" \
            --timeout-seconds "$timeout_seconds" \
            --service-url "$LAUNCHPLANE_SERVICE_URL" \
            | tee runner-host-hygiene-result.json

      - name: Upload executor result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-host-hygiene-result
          path: runner-host-hygiene-result.json
          if-no-files-found: error
