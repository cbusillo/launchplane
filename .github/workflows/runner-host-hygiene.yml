---
name: Runner Host Hygiene

"on":
  schedule:
    - cron: "17 10 * * 1-6"
    - cron: "17 10 * * 0"
  workflow_dispatch:
    inputs:
      audit_record_key:
        description: Launchplane audit record key
        required: true
        type: string
      action:
        description: Approved hygiene action
        required: true
        default: prune_docker_cache
        type: choice
        options:
          - prune_docker_cache
          - prune_dangling_images
          - prune_generated_run_cache
          - remove_buildkit_state_volumes
      mutate:
        description: Execute the approved hygiene action
        required: true
        default: false
        type: boolean
      target_buildkit_state_volumes:
        description: >-
          One zero-link BuildKit state volume for removal
        required: false
        default: ""
        type: string
      target_buildkit_builder:
        description: Exact allowlisted Buildx builder whose cache should be bounded
        required: false
        default: ""
        type: string
      target_generated_cache_key:
        description: Exact public generated run-cache key for bounded cleanup
        required: false
        default: ""
        type: string
      minimum_free_disk_bytes:
        description: Minimum free disk bytes required in pre/post evidence
        required: false
        default: "0"
        type: string
      prune_until:
        description: Docker prune age filter in whole hours, minimum 168h
        required: false
        default: 168h
        type: string
      timeout_seconds:
        description: Timeout for each local host evidence or prune command
        required: false
        default: "300"
        type: string
      resolve_action_started:
        description: >-
          Finalize a prior action_started audit as failed without repeating the action
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: runner-host-hygiene-${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_HOST }}
  cancel-in-progress: false

jobs:
  runner-host-hygiene:
    timeout-minutes: 180
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_EXECUTION_LANE }}
    env:
      LAUNCHPLANE_SERVICE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      RUNNER_HOST_NAME: ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_HOST }}
      RUNNER_EXECUTION_LANE: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_EXECUTION_LANE }}
      RUNNER_SERVICE_USER: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_SERVICE_USER }}
      RUNNER_REPOSITORY_SCOPE: ${{ github.repository }}
      RUNNER_RETAINED_WARM_BUILDERS: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_RETAINED_WARM_BUILDERS }}
      RUNNER_WORKDIR_ROOTS: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_RUNNER_WORKDIR_ROOTS }}
      RUNNER_GENERATED_RUN_CACHE_ROOTS: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_GENERATED_RUN_CACHE_ROOTS }}
      RUNNER_ALLOWED_BUILDKIT_STATE_VOLUMES: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_ALLOWED_BUILDKIT_STATE_VOLUMES
        }}
      RUNNER_BUILDKIT_CACHE_BUDGETS: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_BUILDKIT_CACHE_BUDGETS }}
      RUNNER_DEFAULT_CACHE_BUDGET_BYTES: >-
        ${{ vars.LAUNCHPLANE_RUNNER_HOST_HYGIENE_DEFAULT_CACHE_BUDGET_BYTES }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail

          require_env() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "Missing ${name}." >&2
              exit 1
            fi
          }
          require_env RUNNER_HOST_NAME
          require_env RUNNER_EXECUTION_LANE
          require_env RUNNER_SERVICE_USER
          require_env RUNNER_RETAINED_WARM_BUILDERS
          require_env RUNNER_WORKDIR_ROOTS
          require_env RUNNER_GENERATED_RUN_CACHE_ROOTS
          require_env RUNNER_BUILDKIT_CACHE_BUDGETS
          require_env RUNNER_DEFAULT_CACHE_BUDGET_BYTES
          if [[ ! "$RUNNER_DEFAULT_CACHE_BUDGET_BYTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "Default Docker cache budget must be positive bytes." >&2
            exit 1
          fi
          if [ "$(id -un)" != "$RUNNER_SERVICE_USER" ]; then
            echo "Runner must execute as ${RUNNER_SERVICE_USER}." >&2
            exit 1
          fi

      - name: Run approved runner host hygiene executor
        id: executor
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_AUDIT_RECORD_KEY: ${{ inputs.audit_record_key }}
          INPUT_MINIMUM_FREE_DISK_BYTES: ${{ inputs.minimum_free_disk_bytes }}
          INPUT_MUTATE: ${{ inputs.mutate }}
          INPUT_PRUNE_UNTIL: ${{ inputs.prune_until }}
          INPUT_RESOLVE_ACTION_STARTED: ${{ inputs.resolve_action_started }}
          INPUT_TARGET_BUILDKIT_BUILDER: ${{ inputs.target_buildkit_builder }}
          INPUT_TARGET_GENERATED_CACHE_KEY: >-
            ${{ inputs.target_generated_cache_key }}
          INPUT_TARGET_BUILDKIT_STATE_VOLUMES: >-
            ${{ inputs.target_buildkit_state_volumes }}
          INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          GH_TOKEN: >-
            ${{ secrets.LAUNCHPLANE_RUNNER_HOST_HYGIENE_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail

          apply_action="$INPUT_ACTION"
          if [ -z "$apply_action" ]; then
            apply_action="prune_docker_cache"
          fi

          minimum_free_disk_bytes="$INPUT_MINIMUM_FREE_DISK_BYTES"
          if [ -z "$minimum_free_disk_bytes" ]; then
            minimum_free_disk_bytes="0"
          fi

          prune_until="$INPUT_PRUNE_UNTIL"
          if [ -z "$prune_until" ]; then
            prune_until="168h"
          fi

          timeout_seconds="$INPUT_TIMEOUT_SECONDS"
          if [ -z "$timeout_seconds" ]; then
            timeout_seconds="300"
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            timeout_seconds="900"
          fi

          builder_args=()
          IFS=',' read -r -a builders <<< "$RUNNER_RETAINED_WARM_BUILDERS"
          for builder in "${builders[@]}"; do
            trimmed="${builder#"${builder%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -n "$trimmed" ]; then
              builder_args+=(--retained-warm-builder "$trimmed")
            fi
          done
          if [ "${#builder_args[@]}" -eq 0 ]; then
            echo "At least one retained warm builder is required." >&2
            exit 1
          fi

          runner_root_args=()
          IFS=',' read -r -a runner_roots <<< "$RUNNER_WORKDIR_ROOTS"
          for runner_root in "${runner_roots[@]}"; do
            trimmed="${runner_root#"${runner_root%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -n "$trimmed" ]; then
              runner_root_args+=(--runner-workdir-root "$trimmed")
            fi
          done
          if [ "${#runner_root_args[@]}" -eq 0 ]; then
            echo "At least one runner workdir root is required." >&2
            exit 1
          fi

          generated_cache_args=()
          generated_cache_keys=()
          declare -A seen_generated_cache_keys=()
          IFS=',' read -r -a generated_cache_roots <<< "$RUNNER_GENERATED_RUN_CACHE_ROOTS"
          for generated_cache_root in "${generated_cache_roots[@]}"; do
            trimmed="${generated_cache_root#"${generated_cache_root%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -z "$trimmed" ]; then
              continue
            fi
            cache_key="${trimmed%%=*}"
            if [[ ! "$cache_key" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
              echo "Generated cache key must be public-safe." >&2
              exit 1
            fi
            if [ -n "${seen_generated_cache_keys[$cache_key]:-}" ]; then
              echo "Generated cache keys must be unique." >&2
              exit 1
            fi
            seen_generated_cache_keys[$cache_key]=1
            generated_cache_keys+=("$cache_key")
            generated_cache_args+=(--generated-run-cache-root "$trimmed")
          done
          if [ "${#generated_cache_args[@]}" -eq 0 ]; then
            echo "At least one generated run cache root is required." >&2
            exit 1
          fi

          allowed_builder_args=()
          buildkit_builder_names=()
          buildkit_builder_budgets=()
          declare -A seen_buildkit_builder_names=()
          IFS=',' read -r -a builder_budgets <<< "$RUNNER_BUILDKIT_CACHE_BUDGETS"
          for builder_budget in "${builder_budgets[@]}"; do
            trimmed="${builder_budget#"${builder_budget%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -z "$trimmed" ] || [[ "$trimmed" != *=* ]]; then
              echo "BuildKit cache budgets must use builder=bytes." >&2
              exit 1
            fi
            builder_name="${trimmed%%=*}"
            budget_bytes="${trimmed#*=}"
            builder_name="${builder_name#"${builder_name%%[![:space:]]*}"}"
            builder_name="${builder_name%"${builder_name##*[![:space:]]}"}"
            builder_name="${builder_name,,}"
            budget_bytes="${budget_bytes#"${budget_bytes%%[![:space:]]*}"}"
            budget_bytes="${budget_bytes%"${budget_bytes##*[![:space:]]}"}"
            if [[ ! "$builder_name" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]] ||
              [[ ! "$budget_bytes" =~ ^[1-9][0-9]*$ ]]; then
              echo "BuildKit cache budgets require a safe builder and positive bytes." >&2
              exit 1
            fi
            if [ -n "${seen_buildkit_builder_names[$builder_name]:-}" ]; then
              echo "BuildKit cache budgets must not repeat a builder." >&2
              exit 1
            fi
            seen_buildkit_builder_names["$builder_name"]=1
            buildkit_builder_names+=("$builder_name")
            buildkit_builder_budgets+=("$budget_bytes")
            allowed_builder_args+=(--allowed-buildkit-builder "$builder_name")
          done
          if [ "${#buildkit_builder_names[@]}" -eq 0 ]; then
            echo "At least one BuildKit cache budget is required." >&2
            exit 1
          fi

          volume_args=()
          target_volumes="$INPUT_TARGET_BUILDKIT_STATE_VOLUMES"
          IFS=',' read -r -a volumes <<< "$target_volumes"
          for volume in "${volumes[@]}"; do
            trimmed="${volume#"${volume%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            if [ -n "$trimmed" ]; then
              volume_args+=(--target-buildkit-state-volume "$trimmed")
            fi
          done

          if [ "$apply_action" = "remove_buildkit_state_volumes" ]; then
            allowed_volumes="$RUNNER_ALLOWED_BUILDKIT_STATE_VOLUMES"
            IFS=',' read -r -a volumes <<< "$allowed_volumes"
            for volume in "${volumes[@]}"; do
              trimmed="${volume#"${volume%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              if [ -n "$trimmed" ]; then
                volume_args+=(--allowed-buildkit-state-volume "$trimmed")
              fi
            done
          fi

          resolve_flag="--no-resolve-action-started"
          if [ "$EVENT_NAME" != "schedule" ] &&
            [ "$INPUT_RESOLVE_ACTION_STARTED" = "true" ]; then
            resolve_flag="--resolve-action-started"
          fi

          audit_spool_root="${XDG_STATE_HOME:-$HOME/.local/state}/"
          audit_spool_root+="launchplane/runner-host-hygiene-audits"

          run_hygiene() {
            local action="$1"
            local audit_key="$2"
            local age="$3"
            local mutation_flag="$4"
            local artifact_suffix="$5"
            shift 5
            local audit_artifact_file
            audit_artifact_file="$RUNNER_TEMP/"
            audit_artifact_file+="runner-host-hygiene-audit-evidence-${artifact_suffix}.json"

            uv run launchplane work-graph runner-host-hygiene-executor \
              --action "$action" \
              --host-name "$RUNNER_HOST_NAME" \
              --execution-lane "$RUNNER_EXECUTION_LANE" \
              --service-user "$RUNNER_SERVICE_USER" \
              --repository-scope "$RUNNER_REPOSITORY_SCOPE" \
              --audit-record-key "$audit_key" \
              "${builder_args[@]}" \
              "${runner_root_args[@]}" \
              "${generated_cache_args[@]}" \
              "$@" \
              "$mutation_flag" \
              "$resolve_flag" \
              --minimum-free-disk-bytes "$minimum_free_disk_bytes" \
              --prune-until "$age" \
              --timeout-seconds "$timeout_seconds" \
              --service-url "$LAUNCHPLANE_SERVICE_URL" \
              --audit-spool-root "$audit_spool_root" \
              --audit-artifact-file "$audit_artifact_file" \
              | tee "runner-host-hygiene-result-${artifact_suffix}.json"
          }

          if [ "$EVENT_NAME" = "schedule" ]; then
            audit_date="$(date -u +%F)"
            audit_prefix="runner-host-hygiene/${audit_date}/${RUNNER_HOST_NAME}"
            if [ "$SCHEDULE_EXPRESSION" = "17 10 * * 0" ]; then
              maintenance_failures=0
              if ! run_hygiene \
                prune_docker_cache \
                "${audit_prefix}-scheduled-default-cache-${GITHUB_RUN_ID}" \
                720h \
                --mutate \
                default-cache \
                --max-used-space-bytes "$RUNNER_DEFAULT_CACHE_BUDGET_BYTES"; then
                maintenance_failures=$((maintenance_failures + 1))
              fi
              if ! run_hygiene \
                prune_dangling_images \
                "${audit_prefix}-scheduled-dangling-images-${GITHUB_RUN_ID}" \
                168h \
                --mutate \
                dangling-images; then
                maintenance_failures=$((maintenance_failures + 1))
              fi
              for index in "${!buildkit_builder_names[@]}"; do
                builder_name="${buildkit_builder_names[$index]}"
                budget_bytes="${buildkit_builder_budgets[$index]}"
                if ! run_hygiene \
                  prune_docker_cache \
                  "${audit_prefix}-scheduled-builder-${builder_name}-${GITHUB_RUN_ID}" \
                  168h \
                  --mutate \
                  "builder-${builder_name}" \
                  "${allowed_builder_args[@]}" \
                  --target-buildkit-builder "$builder_name" \
                  --max-used-space-bytes "$budget_bytes"; then
                  maintenance_failures=$((maintenance_failures + 1))
                fi
              done
              for generated_cache_key in "${generated_cache_keys[@]}"; do
                if ! run_hygiene \
                  prune_generated_run_cache \
                  "${audit_prefix}-scheduled-generated-${generated_cache_key}-${GITHUB_RUN_ID}" \
                  168h \
                  --mutate \
                  "generated-${generated_cache_key}" \
                  --target-generated-cache-key "$generated_cache_key"; then
                  maintenance_failures=$((maintenance_failures + 1))
                fi
              done
              if ((maintenance_failures > 0)); then
                echo "${maintenance_failures} scheduled hygiene action(s) failed." >&2
                exit 1
              fi
            else
              run_hygiene \
                prune_docker_cache \
                "${audit_prefix}-scheduled-report-${GITHUB_RUN_ID}" \
                720h \
                --dry-run \
                report \
                --max-used-space-bytes "$RUNNER_DEFAULT_CACHE_BUDGET_BYTES"
            fi
            exit 0
          fi

          audit_record_key="$INPUT_AUDIT_RECORD_KEY"
          mutate_flag="--dry-run"
          if [ "$INPUT_MUTATE" = "true" ]; then
            mutate_flag="--mutate"
          fi

          target_builder_args=()
          target_generated_cache_args=()
          target_generated_cache_key="$INPUT_TARGET_GENERATED_CACHE_KEY"
          target_generated_cache_key="${target_generated_cache_key#"${target_generated_cache_key%%[![:space:]]*}"}"
          target_generated_cache_key="${target_generated_cache_key%"${target_generated_cache_key##*[![:space:]]}"}"
          target_generated_cache_key="${target_generated_cache_key,,}"
          if [ "$apply_action" = "prune_generated_run_cache" ]; then
            if [ -z "$target_generated_cache_key" ] ||
              [ -z "${seen_generated_cache_keys[$target_generated_cache_key]:-}" ]; then
              echo "Target generated cache key is not configured." >&2
              exit 1
            fi
            target_generated_cache_args=(
              --target-generated-cache-key "$target_generated_cache_key"
            )
          elif [ -n "$target_generated_cache_key" ]; then
            echo "Target generated cache key requires prune_generated_run_cache." >&2
            exit 1
          fi
          target_builder="$INPUT_TARGET_BUILDKIT_BUILDER"
          target_builder="${target_builder#"${target_builder%%[![:space:]]*}"}"
          target_builder="${target_builder%"${target_builder##*[![:space:]]}"}"
          target_builder="${target_builder,,}"
          if [ -n "$target_builder" ]; then
            matched_budget=""
            for index in "${!buildkit_builder_names[@]}"; do
              if [ "${buildkit_builder_names[$index]}" = "$target_builder" ]; then
                matched_budget="${buildkit_builder_budgets[$index]}"
                break
              fi
            done
            if [ -z "$matched_budget" ]; then
              echo "Target BuildKit builder is not configured." >&2
              exit 1
            fi
            target_builder_args=(
              "${allowed_builder_args[@]}"
              --target-buildkit-builder "$target_builder"
              --max-used-space-bytes "$matched_budget"
            )
          elif [ "$apply_action" = "prune_docker_cache" ]; then
            target_builder_args=(
              --max-used-space-bytes "$RUNNER_DEFAULT_CACHE_BUDGET_BYTES"
            )
          fi

          run_hygiene \
            "$apply_action" \
            "$audit_record_key" \
            "$prune_until" \
            "$mutate_flag" \
            manual \
            "${volume_args[@]}" \
            "${target_builder_args[@]}" \
            "${target_generated_cache_args[@]}"

      - name: Upload executor result
        if: always() && steps.executor.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-host-hygiene-result
          path: |
            runner-host-hygiene-result-*.json
            ${{ runner.temp }}/runner-host-hygiene-audit-evidence-*.json
          if-no-files-found: error
