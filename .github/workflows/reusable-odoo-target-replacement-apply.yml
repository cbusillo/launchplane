---
name: Reusable Odoo Target Replacement Apply

"on":
  workflow_call:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      instance:
        description: Stable Odoo instance to recreate in place.
        required: true
        type: string
      strategy:
        description: Replacement strategy to apply.
        required: true
        type: string
      artifact_id:
        description: >-
          Optional stored Launchplane artifact ID to deploy instead of the
          current inventory artifact.
        required: false
        default: ""
        type: string
      source_git_ref:
        description: >-
          Required when artifact_id is set; must match the stored artifact
          manifest source commit.
        required: false
        default: ""
        type: string
      allow_empty_data:
        description: Allow missing volume env keys for intentionally empty targets.
        required: true
        type: boolean
      data_source_mode:
        description: Prelaunch rebuild data authority for resettable targets.
        required: true
        type: string
      confirmation:
        description: Confirmation phrase for lane prelaunch rebuild policy.
        required: false
        default: ""
        type: string
      verify_health:
        description: Verify the Odoo health endpoint after deploy.
        required: true
        type: boolean
      verify_canonical:
        description: Verify the stable URL canonical page after deploy.
        required: true
        type: boolean
      verify_logo:
        description: Verify the Odoo logo route after deploy.
        required: true
        type: boolean
      no_cache:
        description: Ask Dokploy to rebuild without cache.
        required: true
        type: boolean
      timeout_seconds:
        description: Optional Dokploy deploy timeout override in seconds.
        required: false
        default: ""
        type: string
      health_timeout_seconds:
        description: Optional health verification timeout override in seconds.
        required: false
        default: ""
        type: string
      launchplane_url:
        description: Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: Optional GitHub OIDC audience.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  apply:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ inputs.product }}
      INSTANCE: ${{ inputs.instance }}
      STRATEGY: ${{ inputs.strategy }}
      REQUESTED_ARTIFACT_ID: ${{ inputs.artifact_id }}
      REQUESTED_SOURCE_GIT_REF: ${{ inputs.source_git_ref }}
      ALLOW_EMPTY_DATA: ${{ inputs.allow_empty_data }}
      DATA_SOURCE_MODE: ${{ inputs.data_source_mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      VERIFY_HEALTH: ${{ inputs.verify_health }}
      VERIFY_CANONICAL: ${{ inputs.verify_canonical }}
      VERIFY_LOGO: ${{ inputs.verify_logo }}
      NO_CACHE: ${{ inputs.no_cache }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      HEALTH_TIMEOUT_SECONDS: ${{ inputs.health_timeout_seconds }}
    steps:
      - name: Validate runtime inputs
        id: environment_request
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${INSTANCE:?Missing instance input}"
          : "${STRATEGY:?Missing strategy input}"
          if [ "$STRATEGY" != "recreate-in-place" ]; then
            echo 'Only recreate-in-place is currently supported.' >&2
            exit 1
          fi
          case "$DATA_SOURCE_MODE" in
            existing | empty | upstream_restore)
              ;;
            *)
              echo 'Unsupported data_source_mode input.' >&2
              exit 1
              ;;
          esac
          for value in \
            "$ALLOW_EMPTY_DATA" \
            "$VERIFY_HEALTH" \
            "$VERIFY_CANONICAL" \
            "$VERIFY_LOGO" \
            "$NO_CACHE"; do
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "Boolean input resolved to invalid value: ${value}" >&2
              exit 1
            fi
          done
          for scalar in \
            PRODUCT \
            INSTANCE \
            STRATEGY \
            REQUESTED_ARTIFACT_ID \
            REQUESTED_SOURCE_GIT_REF \
            DATA_SOURCE_MODE \
            CONFIRMATION \
            TIMEOUT_SECONDS \
            HEALTH_TIMEOUT_SECONDS; do
            case "${!scalar}" in
              *$'\n'* | *$'\r'*)
                echo "${scalar} must be a single-line value." >&2
                exit 1
                ;;
            esac
          done
          if [ -n "$REQUESTED_ARTIFACT_ID" ] && \
            [ -z "$REQUESTED_SOURCE_GIT_REF" ]; then
            echo 'source_git_ref is required when artifact_id is set.' >&2
            exit 1
          fi
          if [ -z "$REQUESTED_ARTIFACT_ID" ] && \
            [ -n "$REQUESTED_SOURCE_GIT_REF" ]; then
            echo 'artifact_id is required when source_git_ref is set.' >&2
            exit 1
          fi
          for numeric in TIMEOUT_SECONDS HEALTH_TIMEOUT_SECONDS; do
            if [ -n "${!numeric}" ]; then
              case "${!numeric}" in
                *[!0-9]*)
                  echo "${numeric} must be a positive integer." >&2
                  exit 1
                  ;;
              esac
              if [ "${!numeric}" -lt 1 ]; then
                echo "${numeric} must be a positive integer." >&2
                exit 1
              fi
            fi
          done
          mkdir -p .launchplane
          encoded_product="$(jq -rn --arg value "$PRODUCT" '$value | @uri')"
          encoded_instance="$(jq -rn --arg value "$INSTANCE" '$value | @uri')"
          printf 'route_path=/v1/products/%s/environments/%s\n' \
            "$encoded_product" "$encoded_instance" >>"$GITHUB_OUTPUT"

      - name: Read product environment authority
        id: environment
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: >-
            ${{ inputs.launchplane_audience || vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          method: GET
          route-path: ${{ steps.environment_request.outputs.route_path }}
          expected-status: "200"
          fail-result-paths: ""
          log-response-body: "false"
          response-output-file: .launchplane/product-environment.json

      - name: Summarize product environment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          environment_file=.launchplane/product-environment.json
          evidence_file=.launchplane/product-environment-evidence.json
          if [ ! -f "$environment_file" ]; then
            exit 0
          fi
          jq '
            (.environment.target.artifact_manifest // null) as $artifact |
            {
              trace_id: (.trace_id // ""),
              environment: {
                product: (.environment.product // ""),
                environment: (.environment.environment // ""),
                context: (.environment.context // ""),
                trust_state: (.environment.trust_state // "missing"),
                target: {
                  artifact_manifest: (
                    if $artifact == null then null else {
                      artifact_id: ($artifact.artifact_id // ""),
                      source_commit: ($artifact.source_commit // "")
                    } end
                  ),
                  trust_state: (.environment.target.trust_state // "missing")
                },
                public_ingress: {
                  status: (.environment.public_ingress.status // "missing"),
                  trust_state: (
                    .environment.public_ingress.trust_state // "missing"
                  )
                },
                topology: {
                  trust_state: (.environment.topology.trust_state // "missing")
                }
              }
            }
          ' "$environment_file" >"$evidence_file"

      - name: Resolve readiness request from records
        id: authority
        env:
          ENVIRONMENT_STATUS_CODE: ${{ steps.environment.outputs.status-code }}
        shell: bash
        run: |
          set -euo pipefail
          environment_file=.launchplane/product-environment.json
          if [ "$ENVIRONMENT_STATUS_CODE" != "200" ]; then
            echo "Product environment read failed with HTTP ${ENVIRONMENT_STATUS_CODE}." >&2
            exit 1
          fi
          resolved_product="$(jq -er '.environment.product | strings | select(length > 0)' "$environment_file")"
          resolved_instance="$(jq -er '.environment.environment | strings | select(length > 0)' "$environment_file")"
          resolved_context="$(jq -er '.environment.context | strings | select(length > 0)' "$environment_file")"
          current_artifact_id="$(
            jq -r \
              '.environment.target.artifact_manifest.artifact_id // "" | strings' \
              "$environment_file"
          )"
          current_source_git_ref="$(
            jq -r \
              '.environment.target.artifact_manifest.source_commit // "" | strings' \
              "$environment_file"
          )"
          if [ "$resolved_product" != "$PRODUCT" ] || [ "$resolved_instance" != "$INSTANCE" ]; then
            echo 'Launchplane returned a different product environment than requested.' >&2
            exit 1
          fi
          artifact_id="${REQUESTED_ARTIFACT_ID:-$current_artifact_id}"
          source_git_ref="${REQUESTED_SOURCE_GIT_REF:-$current_source_git_ref}"
          if [ -z "$current_artifact_id" ]; then
            echo 'The lane is missing an exact current artifact identity.' >&2
            exit 1
          fi
          if [ -z "$artifact_id" ] || [ -z "$source_git_ref" ]; then
            echo 'The selected artifact is missing immutable identity evidence.' >&2
            exit 1
          fi
          for value in "$resolved_context" "$artifact_id" "$source_git_ref"; do
            case "$value" in
              *$'\n'* | *$'\r'*)
                echo 'Launchplane environment authority must use single-line values.' >&2
                exit 1
                ;;
            esac
          done
          encoded_product="$(jq -rn --arg value "$resolved_product" '$value | @uri')"
          encoded_context="$(jq -rn --arg value "$resolved_context" '$value | @uri')"
          encoded_instance="$(jq -rn --arg value "$resolved_instance" '$value | @uri')"
          encoded_action="$(jq -rn --arg value 'odoo_target_replacement_apply.execute' '$value | @uri')"
          encoded_artifact="$(jq -rn --arg value "$artifact_id" '$value | @uri')"
          encoded_current_artifact="$(jq -rn --arg value "$current_artifact_id" '$value | @uri')"
          route_path="/v1/products/${encoded_product}/contexts/${encoded_context}/instances/${encoded_instance}/operational-readiness?action=${encoded_action}&artifact_id=${encoded_artifact}&expected_current_artifact_id=${encoded_current_artifact}"
          {
            printf 'artifact_id=%s\n' "$artifact_id"
            printf 'context=%s\n' "$resolved_context"
            printf 'current_artifact_id=%s\n' "$current_artifact_id"
            printf 'readiness_route_path=%s\n' "$route_path"
            printf 'source_git_ref=%s\n' "$source_git_ref"
          } >>"$GITHUB_OUTPUT"

      - name: Read target replacement readiness
        id: readiness
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: >-
            ${{ inputs.launchplane_audience || vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          method: GET
          route-path: ${{ steps.authority.outputs.readiness_route_path }}
          expected-status: "200"
          fail-result-paths: ""
          log-response-body: "false"
          response-output-path: readiness
          response-output-file: .launchplane/operational-readiness.json

      - name: Enforce target replacement readiness
        env:
          ARTIFACT_ID: ${{ steps.authority.outputs.artifact_id }}
          CONTEXT: ${{ steps.authority.outputs.context }}
          READINESS_STATUS_CODE: ${{ steps.readiness.outputs.status-code }}
        shell: bash
        run: |
          set -euo pipefail
          readiness_file=.launchplane/operational-readiness.json
          if [ "$READINESS_STATUS_CODE" != "200" ]; then
            echo "Operational readiness failed with HTTP ${READINESS_STATUS_CODE}." >&2
            exit 1
          fi
          if ! jq -e \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT" \
            --arg instance "$INSTANCE" \
            --arg artifact_id "$ARTIFACT_ID" \
            '
              .product == $product and
              .context == $context and
              .instance == $instance and
              .action.requested_action == "odoo_target_replacement_apply.execute" and
              .action.route_path == "/v1/drivers/odoo/target-replacement-apply" and
              .action.supported == true and
              .state == "ready" and
              .ready == true and
              (.non_ready_dimensions | length) == 0 and
              ([
                .dimensions[] |
                select(.dimension == "artifact" and .state == "ready") |
                .evidence[]? |
                select(
                  .record_type == "artifact_manifest" and
                  .record_id == $artifact_id
                )
              ] | length) == 1
            ' \
            "$readiness_file" >/dev/null; then
            echo 'Launchplane did not report exact target replacement apply readiness.' >&2
            jq -c \
              '{
                state,
                ready,
                non_ready_dimensions,
                dimensions: [
                  .dimensions[] |
                  select(.state != "ready") |
                  {
                    dimension,
                    state,
                    summary,
                    details: (.details[:10]),
                    remediation
                  }
                ]
              }' \
              "$readiness_file" >&2
            exit 1
          fi
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odoo-target-replacement-apply-readiness
          path: |
            .launchplane/product-environment-evidence.json
            .launchplane/operational-readiness.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write replacement request payload
        id: request
        env:
          ARTIFACT_ID: ${{ steps.authority.outputs.artifact_id }}
          CURRENT_ARTIFACT_ID: ${{ steps.authority.outputs.current_artifact_id }}
          SOURCE_GIT_REF: ${{ steps.authority.outputs.source_git_ref }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg product "$PRODUCT" \
            --arg instance "$INSTANCE" \
            --arg strategy "$STRATEGY" \
            --arg artifact_id "$ARTIFACT_ID" \
            --arg source_git_ref "$SOURCE_GIT_REF" \
            --arg data_source_mode "$DATA_SOURCE_MODE" \
            --arg confirmation "$CONFIRMATION" \
            --arg expected_current_artifact_id "$CURRENT_ARTIFACT_ID" \
            --argjson allow_empty_data "$ALLOW_EMPTY_DATA" \
            --argjson verify_health "$VERIFY_HEALTH" \
            --argjson verify_canonical "$VERIFY_CANONICAL" \
            --argjson verify_logo "$VERIFY_LOGO" \
            --argjson no_cache "$NO_CACHE" \
            '{
              schema_version: 1,
              product: $product,
              replacement: {
                schema_version: 1,
                product: $product,
                instance: $instance,
                strategy: $strategy,
                artifact_id: $artifact_id,
                source_git_ref: $source_git_ref,
                allow_empty_data: $allow_empty_data,
                data_source_mode: $data_source_mode,
                confirmation: $confirmation,
                expected_current_artifact_id: $expected_current_artifact_id,
                verify_health: $verify_health,
                verify_canonical: $verify_canonical,
                verify_logo: $verify_logo,
                no_cache: $no_cache
              }
            }' > .launchplane/odoo-target-replacement-apply-payload.json
          if [ -n "${TIMEOUT_SECONDS:-}" ]; then
            tmp_payload="$(mktemp)"
            jq \
              --argjson timeout_seconds "$TIMEOUT_SECONDS" \
              '.replacement.timeout_seconds = $timeout_seconds' \
              .launchplane/odoo-target-replacement-apply-payload.json \
              >"$tmp_payload"
            mv "$tmp_payload" \
              .launchplane/odoo-target-replacement-apply-payload.json
          fi
          if [ -n "${HEALTH_TIMEOUT_SECONDS:-}" ]; then
            tmp_payload="$(mktemp)"
            jq \
              --argjson health_timeout_seconds "$HEALTH_TIMEOUT_SECONDS" \
              '.replacement.health_timeout_seconds = $health_timeout_seconds' \
              .launchplane/odoo-target-replacement-apply-payload.json \
              >"$tmp_payload"
            mv "$tmp_payload" \
              .launchplane/odoo-target-replacement-apply-payload.json
          fi
          printf 'idempotency_key=%s\n' \
            "odoo-target-replacement-apply:${PRODUCT}:${INSTANCE}:${STRATEGY}:${ARTIFACT_ID}:${CURRENT_ARTIFACT_ID}:${SOURCE_GIT_REF}:${ALLOW_EMPTY_DATA}:${DATA_SOURCE_MODE}:${CONFIRMATION}:${VERIFY_HEALTH}:${VERIFY_CANONICAL}:${VERIFY_LOGO}:${NO_CACHE}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            >>"$GITHUB_OUTPUT"

      - name: Create replacement operation
        id: create_replacement
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: >-
            ${{ inputs.launchplane_audience || vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/drivers/odoo/target-replacement-apply
          payload-file: .launchplane/odoo-target-replacement-apply-payload.json
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          output-paths: >-
            poll_url=result.poll_url,operation_id=result.operation_id
          response-output-file: odoo-target-replacement-apply-create.json

      - name: Verify replacement operation create response
        env:
          CREATE_STATUS_CODE: ${{ steps.create_replacement.outputs.status-code }}
          REPLACEMENT_OPERATION_ID: >-
            ${{ steps.create_replacement.outputs.operation_id }}
          REPLACEMENT_POLL_URL: ${{ steps.create_replacement.outputs.poll_url }}
        shell: bash
        run: |
          set -euo pipefail
          jq . odoo-target-replacement-apply-create.json
          if [ "$CREATE_STATUS_CODE" != "202" ]; then
            echo 'Odoo target replacement operation create failed' \
              "with HTTP ${CREATE_STATUS_CODE}." >&2
            exit 1
          fi
          if [ "$(jq -r '.status' odoo-target-replacement-apply-create.json)" != "accepted" ]; then
            echo 'Odoo target replacement operation was not accepted.' >&2
            exit 1
          fi
          if [ -z "$REPLACEMENT_POLL_URL" ] || \
            [ -z "$REPLACEMENT_OPERATION_ID" ]; then
            echo 'Odoo target replacement response missing poll metadata.' >&2
            jq . odoo-target-replacement-apply-create.json >&2
            exit 1
          fi
          if [[ "$REPLACEMENT_POLL_URL" == *\\* ]]; then
            echo 'Odoo target replacement poll URL must be a local route path.' >&2
            exit 1
          fi
          case "$REPLACEMENT_POLL_URL" in
            *$'\n'* | *$'\r'* | *://* | //* | *'//'* | *'?'* | *'#'* | *'%'*)
              echo 'Odoo target replacement poll URL must be a local route path.' >&2
              exit 1
              ;;
            /v1/drivers/odoo/target-replacement/operations/*)
              ;;
            *)
              echo 'Odoo target replacement poll URL used an unexpected path.' >&2
              exit 1
              ;;
          esac
          operation_path_id="${REPLACEMENT_POLL_URL#/v1/drivers/odoo/target-replacement/operations/}"
          case "$operation_path_id" in
            "" | */* | *.*)
              echo 'Odoo target replacement operation ID must be one path segment.' >&2
              exit 1
              ;;
          esac

      - name: Poll replacement operation
        id: poll_replacement
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: >-
            ${{ inputs.launchplane_audience || vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          method: GET
          route-path: ${{ steps.create_replacement.outputs.poll_url }}
          poll-result-path: operation.status
          poll-result-statuses: pending,running
          poll-interval-ms: 15000
          poll-timeout-ms: 3600000
          fail-result-paths: ""
          response-output-file: odoo-target-replacement-apply.json

      - name: Verify replacement operation result
        env:
          POLL_STATUS_CODE: ${{ steps.poll_replacement.outputs.status-code }}
        shell: bash
        run: |
          set -euo pipefail
          jq . odoo-target-replacement-apply.json
          if [ "$POLL_STATUS_CODE" != "200" ]; then
            echo 'Odoo target replacement operation poll failed' \
              "with HTTP ${POLL_STATUS_CODE}." >&2
            exit 1
          fi
          operation_status="$(
            jq -r '.operation.status // ""' odoo-target-replacement-apply.json
          )"
          deploy_status="$(
            jq -r \
              '.operation.result.deploy_status //
               .result.deploy_status //
               ""' \
              odoo-target-replacement-apply.json
          )"
          post_deploy_status="$(
            jq -r \
              '.operation.result.post_deploy_status //
               .result.post_deploy_status //
               ""' \
              odoo-target-replacement-apply.json
          )"
          if [ "$operation_status" != "pass" ]; then
            echo 'Odoo target replacement operation did not pass:' \
              "status=${operation_status}." >&2
            jq -r \
              '.operation.error_message // .result.error_message // ""' \
              odoo-target-replacement-apply.json >&2
            exit 1
          fi
          if [ "$deploy_status" != "pass" ] || \
            [ "$post_deploy_status" != "pass" ]; then
            echo 'Odoo target replacement apply did not pass:' \
              "deploy=${deploy_status}" \
              "post_deploy=${post_deploy_status}." >&2
            jq -r \
              '.operation.result.error_message //
               .result.error_message //
               ""' \
              odoo-target-replacement-apply.json >&2
            exit 1
          fi

      - name: Upload replacement apply result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odoo-target-replacement-apply
          path: |
            odoo-target-replacement-apply-create.json
            odoo-target-replacement-apply.json
          if-no-files-found: ignore
