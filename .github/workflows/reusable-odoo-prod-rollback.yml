---
name: Reusable Odoo Prod Rollback

"on":
  workflow_call:
    inputs:
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      artifact_id:
        description: Explicit Launchplane artifact ID to deploy back to prod.
        required: true
        type: string
      promotion_record_id:
        description: Optional current prod promotion record ID.
        required: false
        default: ""
        type: string
      reason:
        description: Rollback reason stored in Launchplane evidence.
        required: true
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "1800000"
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  prod-rollback:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    steps:
      - name: Request Launchplane Odoo prod rollback
        id: lp
        uses: cbusillo/launchplane/.github/actions/launchplane-request@main
        with:
          launchplane-url: ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: /v1/drivers/odoo/prod-rollback
          payload: >-
            {"schema_version":1,"product":"odoo","rollback":{"schema_version":1,"instance":"prod","source_channel":"testing"}}
          payload-fields: |-
            rollback.context=${{ inputs.context }}
            rollback.promotion_record_id=${{ inputs.promotion_record_id }}
            rollback.artifact_id=${{ inputs.artifact_id }}
            rollback.reason=${{ inputs.reason }}
          idempotency-key: >-
            opr:${{ inputs.context }}:${{ github.run_id }}:${{ github.run_attempt }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: result.rollback_status,result.rollback_health_status
          output-paths: >-
            promotion_record_id=result.promotion_record_id,
            deployment_record_id=result.deployment_record_id,
            release_tuple_id=result.release_tuple_id,
            rollback_status=result.rollback_status,
            rollback_health_status=result.rollback_health_status,
            post_deploy_status=result.post_deploy_status,
            error_message=result.error_message

      - name: Report result
        env:
          DEPLOYMENT_RECORD_ID: ${{ steps.lp.outputs.deployment_record_id }}
          PROMOTION_RECORD_ID: ${{ steps.lp.outputs.promotion_record_id }}
          RELEASE_TUPLE_ID: ${{ steps.lp.outputs.release_tuple_id }}
          ROLLBACK_HEALTH_STATUS: >-
            ${{ steps.lp.outputs.rollback_health_status }}
          ROLLBACK_STATUS: ${{ steps.lp.outputs.rollback_status }}
        run: |
          echo "promotion_record_id=$PROMOTION_RECORD_ID"
          echo "deployment_record_id=$DEPLOYMENT_RECORD_ID"
          echo "release_tuple_id=$RELEASE_TUPLE_ID"
          echo "rollback_status=$ROLLBACK_STATUS"
          echo "rollback_health_status=$ROLLBACK_HEALTH_STATUS"
