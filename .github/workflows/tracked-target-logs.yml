---
name: Tracked Target Logs

"on":
  workflow_dispatch:
    inputs:
      context:
        description: Launchplane runtime context.
        required: true
        type: string
      instance:
        description: Launchplane runtime instance.
        required: true
        type: string
      lines:
        description: Number of log lines to request.
        required: true
        default: "200"
        type: string
      source:
        description: Read current runtime logs or the latest deployment logs.
        required: true
        default: runtime
        type: choice
        options:
          - runtime
          - deployment
      since:
        description: Runtime log window; deployment mode always uses all.
        required: true
        default: 1h
        type: string
      search:
        description: Optional Dokploy log search text.
        required: false
        default: ""
        type: string
      service:
        description: Optional exact Dokploy Compose service for runtime logs.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  read:
    uses: cbusillo/launchplane/.github/workflows/reusable-tracked-target-logs.yml@b62941a9219f69a2575c1bce1a8d7fcb8c605f3c # main
    permissions:
      contents: read
      id-token: write
    with:
      context: ${{ inputs.context }}
      instance: ${{ inputs.instance }}
      lines: ${{ inputs.lines }}
      source: ${{ inputs.source }}
      since: ${{ inputs.since }}
      search: ${{ inputs.search }}
      service: ${{ inputs.service }}
