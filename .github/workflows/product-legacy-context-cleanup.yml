---
name: Product Legacy Context Cleanup

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Product profile key to clean up.
        required: true
        type: string
      source_context:
        description: Legacy context to clean up after cutover.
        required: true
        type: string
      target_context:
        description: >-
          Canonical product context that must already hold replacement records.
        required: true
        type: string
      dry_run:
        description: >-
          Plan only when true; clean mutable legacy records when false.
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: launchplane-product-legacy-context-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      PRODUCT: ${{ inputs.product }}
      SOURCE_CONTEXT: ${{ inputs.source_context }}
      TARGET_CONTEXT: ${{ inputs.target_context }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Request legacy context cleanup
        id: request
        shell: bash
        run: |
          set -euo pipefail
          : "${LAUNCHPLANE_URL:?Missing LAUNCHPLANE_PUBLIC_URL variable}"
          : "${PRODUCT:?Missing product input}"
          : "${SOURCE_CONTEXT:?Missing source_context input}"
          : "${TARGET_CONTEXT:?Missing target_context input}"

          mode="apply"
          if [ "$DRY_RUN" = "true" ]; then
            mode="dry-run"
          fi

          actor="github-actions:${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}"
          jq -n \
            --arg product "$PRODUCT" \
            --arg source_context "$SOURCE_CONTEXT" \
            --arg target_context "$TARGET_CONTEXT" \
            --arg mode "$mode" \
            --arg actor "$actor" \
            '{
              product: $product,
              source_context: $source_context,
              target_context: $target_context,
              mode: $mode,
              actor: $actor,
              source_label: "workflow:product-legacy-context-cleanup"
            }' > launchplane-product-legacy-context-cleanup-payload.json
          idempotency_key="$({
            printf 'product-legacy-context-cleanup:%s:%s:%s:%s:%s' \
              "$PRODUCT" \
              "$SOURCE_CONTEXT" \
              "$TARGET_CONTEXT" \
              "$mode" \
              "$GITHUB_RUN_ID"
          })"
          printf 'idempotency_key=%s\n' "$idempotency_key" >> "$GITHUB_OUTPUT"

      - name: Request Launchplane legacy context cleanup
        id: cleanup_request
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          route-path: /v1/product-profiles/legacy-context-cleanup/apply
          payload-file: launchplane-product-legacy-context-cleanup-payload.json
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          response-output-file: launchplane-product-legacy-context-cleanup.json

      - name: Check cleanup response
        shell: bash
        env:
          CLEANUP_STATUS_CODE: ${{ steps.cleanup_request.outputs.status-code }}
        run: |
          set -euo pipefail
          response_file="launchplane-product-legacy-context-cleanup.json"
          if [ "$CLEANUP_STATUS_CODE" != "202" ]; then
            cat "$response_file" >&2
            echo "Cleanup failed with HTTP ${CLEANUP_STATUS_CODE}." >&2
            exit 1
          fi
          jq . "$response_file"

      - name: Upload cleanup artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launchplane-product-legacy-context-cleanup-${{ inputs.product }}
          path: launchplane-product-legacy-context-cleanup.json
          if-no-files-found: error

      - name: Summarize cleanup
        shell: bash
        run: |
          set -euo pipefail
          result_file="launchplane-product-legacy-context-cleanup.json"
          blocked="$(jq -r '.result.blocked' "$result_file")"
          runtime_counts="$({
            jq -c '.result.counts.runtime_environment_records' "$result_file"
          })"
          secret_counts="$({
            jq -c '.result.counts.managed_secret_records' "$result_file"
          })"
          target_counts="$({
            jq -c '.result.counts.provider_targets' "$result_file"
          })"
          target_id_counts="$({
            jq -c '.result.counts.provider_target_ids' "$result_file"
          })"
          preserved="$(jq -c '.result.preserved_records' "$result_file")"
          {
            echo '## Launchplane product legacy context cleanup'
            echo
            echo "- Product: ${PRODUCT}"
            echo "- Source context: ${SOURCE_CONTEXT}"
            echo "- Target context: ${TARGET_CONTEXT}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Blocked: ${blocked}"
            echo "- Runtime records: ${runtime_counts}"
            echo "- Managed secrets: ${secret_counts}"
            echo "- Provider targets: ${target_counts}"
            echo "- Provider target IDs: ${target_id_counts}"
            echo "- Preserved records: ${preserved}"
          } >> "$GITHUB_STEP_SUMMARY"
