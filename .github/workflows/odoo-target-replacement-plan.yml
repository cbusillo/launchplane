---
name: Odoo Target Replacement Plan

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      instance:
        description: Stable Odoo instance to inspect.
        required: true
        type: string
      strategy:
        description: Future replacement strategy to plan around.
        required: true
        type: choice
        options:
          - recreate-in-place
          - replace-and-cutover
      artifact_id:
        description: Optional stored artifact ID to plan instead of the current inventory artifact.
        required: false
        default: ""
        type: string
      source_git_ref:
        description: Required when artifact_id is set; must match the stored artifact manifest.
        required: false
        default: ""
        type: string
      allow_empty_data:
        description: Allow missing Odoo volume env keys.
        required: true
        default: false
        type: boolean
      data_source_mode:
        description: Prelaunch rebuild data authority for resettable targets.
        required: true
        type: choice
        options:
          - existing
          - empty
          - upstream_restore
      confirmation:
        description: Confirmation phrase for lane prelaunch rebuild policy.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    odoo-target-replacement-plan-${{ inputs.product }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  plan:
    uses: cbusillo/launchplane/.github/workflows/reusable-odoo-target-replacement-plan.yml@480c9280b1ae3610f05547192783da2230dc7ff5 # main
    permissions:
      contents: read
      id-token: write
    with:
      product: ${{ inputs.product }}
      instance: ${{ inputs.instance }}
      strategy: ${{ inputs.strategy }}
      artifact_id: ${{ inputs.artifact_id }}
      source_git_ref: ${{ inputs.source_git_ref }}
      allow_empty_data: ${{ inputs.allow_empty_data }}
      data_source_mode: ${{ inputs.data_source_mode }}
      confirmation: ${{ inputs.confirmation }}
      launchplane_url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      launchplane_audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
