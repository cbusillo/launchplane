---
name: Odoo Target Replacement Plan

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        default: odoo-tenant-cm
        type: string
      instance:
        description: Stable Odoo instance to inspect.
        required: true
        default: testing
        type: choice
        options:
          - testing
          - prod
      strategy:
        description: Future replacement strategy to plan around.
        required: true
        default: recreate-in-place
        type: choice
        options:
          - recreate-in-place
          - replace-and-cutover
      allow_empty_data:
        description: Allow missing Odoo volume env keys.
        required: true
        default: false
        type: boolean
      data_source_mode:
        description: Prelaunch rebuild data authority for resettable targets.
        required: true
        default: existing
        type: choice
        options:
          - existing
          - empty
          - upstream_restore
      confirmation:
        description: Confirmation phrase for lane prelaunch rebuild policy.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    odoo-target-replacement-plan-${{ inputs.product }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      PRODUCT: ${{ inputs.product }}
      INSTANCE: ${{ inputs.instance }}
      STRATEGY: ${{ inputs.strategy }}
      ALLOW_EMPTY_DATA: ${{ inputs.allow_empty_data }}
      DATA_SOURCE_MODE: ${{ inputs.data_source_mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      LAUNCHPLANE_SERVICE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_SERVICE_AUDIENCE: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
    steps:
      - name: Validate runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${INSTANCE:?Missing instance input}"
          : "${STRATEGY:?Missing strategy input}"
          if [ -z "${LAUNCHPLANE_SERVICE_URL:-}" ]; then
            echo \
              'Missing Launchplane service URL variable.' \
              >&2
            exit 1
          fi
          if [ -z "${LAUNCHPLANE_SERVICE_AUDIENCE:-}" ]; then
            LAUNCHPLANE_SERVICE_AUDIENCE="$({
              python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["LAUNCHPLANE_SERVICE_URL"].strip())
          if not parsed.hostname:
              raise SystemExit("LAUNCHPLANE_SERVICE_URL must include a hostname.")
          print(parsed.hostname)
          PY
            })"
          fi
          echo "LAUNCHPLANE_SERVICE_AUDIENCE=${LAUNCHPLANE_SERVICE_AUDIENCE}" >>"$GITHUB_ENV"

      - name: Build replacement plan
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$({
            token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${token_url}&audience=${LAUNCHPLANE_SERVICE_AUDIENCE}" \
            | jq -r '.value'
          })"
          payload="$({
            jq -n \
              --arg product "$PRODUCT" \
              --arg instance "$INSTANCE" \
              --arg strategy "$STRATEGY" \
              --arg data_source_mode "$DATA_SOURCE_MODE" \
              --arg confirmation "$CONFIRMATION" \
              --argjson allow_empty_data "$ALLOW_EMPTY_DATA" \
              '{
                schema_version: 1,
                product: $product,
                replacement: {
                  schema_version: 1,
                  product: $product,
                  instance: $instance,
                  strategy: $strategy,
                  allow_empty_data: $allow_empty_data,
                  data_source_mode: $data_source_mode,
                  confirmation: $confirmation
                }
              }'
          })"
          idempotency_key="$({
            printf '%s' \
              "odoo-target-replacement-plan:${PRODUCT}:${INSTANCE}:" \
              "${STRATEGY}:${ALLOW_EMPTY_DATA}:${DATA_SOURCE_MODE}:" \
              "${CONFIRMATION}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          })"
          route="${LAUNCHPLANE_SERVICE_URL}/v1/drivers/odoo"
          status_code="$({
            curl -sS \
              -o odoo-target-replacement-plan.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: ${idempotency_key}" \
              --data "$payload" \
              "${route}/target-replacement-plan"
          })"
          jq . odoo-target-replacement-plan.json
          if [ "$status_code" != "202" ]; then
            echo \
              "Odoo replacement plan failed: ${status_code}." \
              >&2
            exit 1
          fi

      - name: Upload replacement plan
        uses: actions/upload-artifact@v7
        with:
          name: odoo-target-replacement-plan
          path: odoo-target-replacement-plan.json
