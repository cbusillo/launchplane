---
name: Security

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow_lint:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12 \
            -config-file .github/actionlint.yaml

  workflow_lint_fork:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12 \
            -config-file .github/actionlint.yaml

  secret_scan:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan current tree for committed secrets
        run: |
          scan_path="${RUNNER_TEMP}/gitleaks-source"
          rm -rf "${scan_path}"
          mkdir -p "${scan_path}"
          git ls-files -z | rsync -a --files-from=- --from0 ./ "${scan_path}/"

          docker run --rm \
            -v "${scan_path}:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect \
            --source . \
            --no-git \
            --redact \
            --verbose

  secret_scan_fork:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan current tree for committed secrets
        run: |
          scan_path="${RUNNER_TEMP}/gitleaks-source"
          rm -rf "${scan_path}"
          mkdir -p "${scan_path}"
          git ls-files -z | rsync -a --files-from=- --from0 ./ "${scan_path}/"

          docker run --rm \
            -v "${scan_path}:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 detect \
            --source . \
            --no-git \
            --redact \
            --verbose

  security_gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - workflow_lint
      - workflow_lint_fork
      - secret_scan
      - secret_scan_fork
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Require successful security path
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow_lint.result }}
          WORKFLOW_LINT_FORK_RESULT: ${{ needs.workflow_lint_fork.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
          SECRET_SCAN_FORK_RESULT: ${{ needs.secret_scan_fork.result }}
        run: |
          set -euo pipefail
          require_success() {
            check_name="$1"
            check_result="$2"
            if [ "${check_result}" != "success" ]; then
              echo "${check_name} concluded with: ${check_result}" >&2
              exit 1
            fi
          }

          if [ "${HEAD_REPOSITORY}" = "${BASE_REPOSITORY}" ]; then
            require_success workflow_lint "${WORKFLOW_LINT_RESULT}"
            require_success secret_scan "${SECRET_SCAN_RESULT}"
          else
            require_success workflow_lint_fork "${WORKFLOW_LINT_FORK_RESULT}"
            require_success secret_scan_fork "${SECRET_SCAN_FORK_RESULT}"
          fi
