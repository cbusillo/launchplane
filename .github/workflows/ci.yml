---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  static_checks:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Run Ruff
        run: uv run --extra dev ruff check .

      - name: Run mypy
        run: uv run --extra dev mypy control_plane tests

      - name: Audit Python dependencies
        run: |
          # PyJWT is only used for GitHub OIDC RS256 verification; this
          # disputed advisory has no fixed release and concerns app-chosen
          # weak symmetric keys.
          uv run --with pip-audit pip-audit --ignore-vuln PYSEC-2025-183

  static_checks_fork:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Run Ruff
        run: uv run --extra dev ruff check .

      - name: Run mypy
        run: uv run --extra dev mypy control_plane tests

      - name: Audit Python dependencies
        run: |
          # PyJWT is only used for GitHub OIDC RS256 verification; this
          # disputed advisory has no fixed release and concerns app-chosen
          # weak symmetric keys.
          uv run --with pip-audit pip-audit --ignore-vuln PYSEC-2025-183

  container_scan:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    permissions:
      contents: read
      packages: read
    env:
      LAUNCHPLANE_CI_IMAGE_TAG: >-
        launchplane-ci:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: launchplane-ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Log in to GHCR for build cache
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          load: true
          tags: ${{ env.LAUNCHPLANE_CI_IMAGE_TAG }}
          cache-from: >-
            type=gha,scope=launchplane-ci
          cache-to: >-
            type=gha,scope=launchplane-ci,mode=max

      - name: Restore Trivy cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Scan runtime image
        env:
          LAUNCHPLANE_TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          mkdir -p "$LAUNCHPLANE_TRIVY_CACHE_DIR"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${LAUNCHPLANE_TRIVY_CACHE_DIR}:/root/.cache" \
            ghcr.io/aquasecurity/trivy:0.70.0 \
            image \
            --scanners vulnerability \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$LAUNCHPLANE_CI_IMAGE_TAG"

      - name: Remove scanned runtime image
        if: always()
        run: docker image rm "$LAUNCHPLANE_CI_IMAGE_TAG" || true

  frontend_validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: >-
            ${{ runner.os }}-node-22-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-22-pnpm-

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Validate frontend
        run: pnpm --dir frontend validate

  frontend_validate_fork:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: >-
            ${{ runner.os }}-node-22-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-22-pnpm-

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Validate frontend
        run: pnpm --dir frontend validate

  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Run unit tests
        run: uv run python -m unittest

  test_fork:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Run unit tests
        run: uv run python -m unittest
