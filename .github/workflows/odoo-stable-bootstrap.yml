---
name: Odoo Stable Bootstrap

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        type: string
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      instance:
        description: Stable Odoo instance to bootstrap.
        required: true
        type: string
      confirmation:
        description: Type the lane policy confirmation to confirm destructive bootstrap.
        required: true
        type: string
      verify_health:
        description: Verify the Odoo health endpoint after bootstrap.
        required: true
        default: true
        type: boolean
      verify_canonical:
        description: Verify the stable URL canonical page after bootstrap.
        required: true
        default: true
        type: boolean
      verify_logo:
        description: Verify the Odoo logo route after bootstrap.
        required: true
        default: true
        type: boolean
      timeout_seconds:
        description: Optional Dokploy bootstrap timeout override in seconds.
        required: false
        default: ""
        type: string
      health_timeout_seconds:
        description: Optional health/canonical/logo timeout override in seconds.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: odoo-stable-bootstrap-${{ inputs.product }}-${{ inputs.context }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ inputs.product }}
      CONTEXT: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      CONFIRMATION: ${{ inputs.confirmation }}
      VERIFY_HEALTH: ${{ inputs.verify_health }}
      VERIFY_CANONICAL: ${{ inputs.verify_canonical }}
      VERIFY_LOGO: ${{ inputs.verify_logo }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      HEALTH_TIMEOUT_SECONDS: ${{ inputs.health_timeout_seconds }}
    steps:
      - name: Validate runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${CONTEXT:?Missing context input}"
          : "${INSTANCE:?Missing instance input}"
          : "${CONFIRMATION:?Missing confirmation input}"
          for value in "$VERIFY_HEALTH" "$VERIFY_CANONICAL" "$VERIFY_LOGO"; do
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "Boolean input resolved to invalid value: ${value}" >&2
              exit 1
            fi
          done
          for scalar in PRODUCT CONTEXT INSTANCE CONFIRMATION TIMEOUT_SECONDS HEALTH_TIMEOUT_SECONDS; do
            case "${!scalar}" in
              *$'\n'*)
                echo "${scalar} must be a single-line value." >&2
                exit 1
                ;;
            esac
          done
          for numeric in TIMEOUT_SECONDS HEALTH_TIMEOUT_SECONDS; do
            if [ -n "${!numeric}" ]; then
              case "${!numeric}" in
                *[!0-9]*)
                  echo "${numeric} must be a positive integer." >&2
                  exit 1
                  ;;
              esac
              if [ "${!numeric}" -lt 1 ]; then
                echo "${numeric} must be a positive integer." >&2
                exit 1
              fi
            fi
          done

      - name: Write bootstrap request payload
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .launchplane
          jq -n \
            --arg product "$PRODUCT" \
            --arg context "$CONTEXT" \
            --arg instance "$INSTANCE" \
            --arg confirmation "$CONFIRMATION" \
            --argjson verify_health "$VERIFY_HEALTH" \
            --argjson verify_canonical "$VERIFY_CANONICAL" \
            --argjson verify_logo "$VERIFY_LOGO" \
            '{
              schema_version: 1,
              product: $product,
              bootstrap: {
                schema_version: 1,
                product: $product,
                context: $context,
                instance: $instance,
                confirmation: $confirmation,
                verify_health: $verify_health,
                verify_canonical: $verify_canonical,
                verify_logo: $verify_logo
              }
            }' > .launchplane/odoo-stable-bootstrap-payload.json
          if [ -n "${TIMEOUT_SECONDS:-}" ]; then
            tmp_payload="$(mktemp)"
            jq \
              --argjson timeout_seconds "$TIMEOUT_SECONDS" \
              '.bootstrap.timeout_seconds = $timeout_seconds' \
              .launchplane/odoo-stable-bootstrap-payload.json > "$tmp_payload"
            mv "$tmp_payload" .launchplane/odoo-stable-bootstrap-payload.json
          fi
          if [ -n "${HEALTH_TIMEOUT_SECONDS:-}" ]; then
            tmp_payload="$(mktemp)"
            jq \
              --argjson health_timeout_seconds "$HEALTH_TIMEOUT_SECONDS" \
              '.bootstrap.health_timeout_seconds = $health_timeout_seconds' \
              .launchplane/odoo-stable-bootstrap-payload.json > "$tmp_payload"
            mv "$tmp_payload" .launchplane/odoo-stable-bootstrap-payload.json
          fi
          printf 'idempotency_key=%s\n' \
            "odoo-stable-bootstrap:${PRODUCT}:${CONTEXT}:${INSTANCE}:${VERIFY_HEALTH}:${VERIFY_CANONICAL}:${VERIFY_LOGO}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            >>"$GITHUB_OUTPUT"

      - name: Create bootstrap operation
        id: create_bootstrap
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/drivers/odoo/stable-bootstrap
          payload-file: .launchplane/odoo-stable-bootstrap-payload.json
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          output-paths: >-
            poll_url=result.poll_url,operation_id=result.operation_id
          response-output-file: odoo-stable-bootstrap-create.json

      - name: Verify bootstrap operation create response
        env:
          BOOTSTRAP_OPERATION_ID: ${{ steps.create_bootstrap.outputs.operation_id }}
          BOOTSTRAP_POLL_URL: ${{ steps.create_bootstrap.outputs.poll_url }}
        shell: bash
        run: |
          set -euo pipefail
          jq . odoo-stable-bootstrap-create.json
          if [ "${{ steps.create_bootstrap.outputs.status-code }}" != "202" ]; then
            echo 'Launchplane Odoo stable bootstrap operation create failed' \
              "with HTTP ${{ steps.create_bootstrap.outputs.status-code }}." >&2
            exit 1
          fi
          if [ "$(jq -r '.status' odoo-stable-bootstrap-create.json)" != "accepted" ]; then
            echo 'Launchplane Odoo stable bootstrap operation was not accepted.' >&2
            exit 1
          fi
          if [ -z "$BOOTSTRAP_POLL_URL" ] || [ -z "$BOOTSTRAP_OPERATION_ID" ]; then
            echo 'Odoo bootstrap response missing poll metadata.' >&2
            jq . odoo-stable-bootstrap-create.json >&2
            exit 1
          fi
          case "$BOOTSTRAP_POLL_URL" in
            *$'\n'* | *://* | //* | *'//'*)
              echo 'Odoo bootstrap poll URL must be a local Launchplane route path.' >&2
              jq . odoo-stable-bootstrap-create.json >&2
              exit 1
              ;;
            /v1/drivers/odoo/stable-bootstrap/operations/*)
              ;;
            *)
              echo 'Odoo bootstrap poll URL used an unexpected route path.' >&2
              jq . odoo-stable-bootstrap-create.json >&2
              exit 1
              ;;
          esac

      - name: Poll bootstrap operation
        id: poll_bootstrap
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          method: GET
          route-path: ${{ steps.create_bootstrap.outputs.poll_url }}
          poll-result-path: operation.status
          poll-result-statuses: pending,running
          poll-interval-ms: 15000
          poll-timeout-ms: 3600000
          fail-result-paths: ""
          response-output-file: odoo-stable-bootstrap.json

      - name: Verify bootstrap operation result
        shell: bash
        run: |
          set -euo pipefail
          jq . odoo-stable-bootstrap.json
          if [ "${{ steps.poll_bootstrap.outputs.status-code }}" != "200" ]; then
            echo 'Launchplane Odoo stable bootstrap operation poll failed' \
              "with HTTP ${{ steps.poll_bootstrap.outputs.status-code }}." >&2
            exit 1
          fi
          operation_status="$(
            jq -r '.operation.status // ""' odoo-stable-bootstrap.json
          )"
          bootstrap_status="$(
            jq -r \
              '.operation.result.bootstrap_status //
               .result.bootstrap_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          post_deploy_status="$(
            jq -r \
              '.operation.result.post_deploy_status //
               .result.post_deploy_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          health_status="$(
            jq -r \
              '.operation.result.health_status //
               .result.health_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          canonical_status="$(
            jq -r \
              '.operation.result.canonical_status //
               .result.canonical_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          logo_status="$(
            jq -r \
              '.operation.result.logo_status //
               .result.logo_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          if [ "$operation_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap operation did not pass:' \
              "${operation_status}." >&2
            jq -r \
              '.operation.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi
          if [ "$bootstrap_status" != "pass" ] || \
            [ "$post_deploy_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap did not pass:' >&2
            echo "bootstrap=${bootstrap_status}" \
              "post_deploy=${post_deploy_status}." >&2
            jq -r \
              '.operation.result.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi
          if [ "$VERIFY_HEALTH" = "true" ] && \
            [ "$health_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap health verification' \
              "did not pass: ${health_status}." >&2
            jq -r \
              '.operation.result.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi
          if [ "$VERIFY_CANONICAL" = "true" ] && \
            [ "$canonical_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap canonical verification' \
              "did not pass: ${canonical_status}." >&2
            jq -r \
              '.operation.result.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi
          if [ "$VERIFY_LOGO" = "true" ] && [ "$logo_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap logo verification' \
              "did not pass: ${logo_status}." >&2
            jq -r \
              '.operation.result.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi

      - name: Upload bootstrap result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odoo-stable-bootstrap-result
          path: |
            odoo-stable-bootstrap-create.json
            odoo-stable-bootstrap.json
          if-no-files-found: ignore
