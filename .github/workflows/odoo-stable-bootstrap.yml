---
name: Odoo Stable Bootstrap

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Odoo product profile key.
        required: true
        default: odoo-tenant-cm
        type: string
      context:
        description: Launchplane Odoo context.
        required: true
        default: cm
        type: string
      instance:
        description: Stable Odoo instance to bootstrap.
        required: true
        default: testing
        type: string
      confirmation:
        description: Type the lane policy confirmation to confirm destructive bootstrap.
        required: true
        type: string
      verify_health:
        description: Verify the Odoo health endpoint after bootstrap.
        required: true
        default: true
        type: boolean
      verify_canonical:
        description: Verify the stable URL canonical page after bootstrap.
        required: true
        default: true
        type: boolean
      verify_logo:
        description: Verify the Odoo logo route after bootstrap.
        required: true
        default: true
        type: boolean
      timeout_seconds:
        description: Optional Dokploy bootstrap timeout override in seconds.
        required: false
        default: ""
        type: string
      health_timeout_seconds:
        description: Optional health/canonical/logo timeout override in seconds.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: odoo-stable-bootstrap-${{ inputs.product }}-${{ inputs.context }}-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on:
      - self-hosted
      - ${{ vars.LAUNCHPLANE_RUNNER_LABEL }}
    env:
      PRODUCT: ${{ inputs.product }}
      CONTEXT: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      CONFIRMATION: ${{ inputs.confirmation }}
      VERIFY_HEALTH: ${{ inputs.verify_health }}
      VERIFY_CANONICAL: ${{ inputs.verify_canonical }}
      VERIFY_LOGO: ${{ inputs.verify_logo }}
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      HEALTH_TIMEOUT_SECONDS: ${{ inputs.health_timeout_seconds }}
      LAUNCHPLANE_SERVICE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      LAUNCHPLANE_SERVICE_AUDIENCE: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
      POLL_INTERVAL_SECONDS: "15"
      POLL_TIMEOUT_SECONDS: "3600"
    steps:
      - name: Validate runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          : "${CONTEXT:?Missing context input}"
          : "${INSTANCE:?Missing instance input}"
          : "${CONFIRMATION:?Missing confirmation input}"
          for value in "$VERIFY_HEALTH" "$VERIFY_CANONICAL" "$VERIFY_LOGO"; do
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "Boolean input resolved to invalid value: ${value}" >&2
              exit 1
            fi
          done
          if [ -z "${LAUNCHPLANE_SERVICE_URL:-}" ]; then
            echo 'Missing Launchplane service URL repository variable.' >&2
            exit 1
          fi
          if [ -z "${LAUNCHPLANE_SERVICE_AUDIENCE:-}" ]; then
            LAUNCHPLANE_SERVICE_AUDIENCE="$({
              python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["LAUNCHPLANE_SERVICE_URL"].strip())
          if not parsed.hostname:
              raise SystemExit("LAUNCHPLANE_SERVICE_URL must include a hostname.")
          print(parsed.hostname)
          PY
            })"
          fi
          echo "LAUNCHPLANE_SERVICE_AUDIENCE=${LAUNCHPLANE_SERVICE_AUDIENCE}" >>"$GITHUB_ENV"

      - name: Create and poll bootstrap operation
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$({
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${LAUNCHPLANE_SERVICE_AUDIENCE}" \
            | jq -r '.value'
          })"
          payload="$({
            jq -n \
              --arg product "$PRODUCT" \
              --arg context "$CONTEXT" \
              --arg instance "$INSTANCE" \
              --arg confirmation "$CONFIRMATION" \
              --argjson verify_health "$VERIFY_HEALTH" \
              --argjson verify_canonical "$VERIFY_CANONICAL" \
              --argjson verify_logo "$VERIFY_LOGO" \
              '{
                schema_version: 1,
                product: $product,
                bootstrap: {
                  schema_version: 1,
                  product: $product,
                  context: $context,
                  instance: $instance,
                  confirmation: $confirmation,
                  verify_health: $verify_health,
                  verify_canonical: $verify_canonical,
                  verify_logo: $verify_logo
                }
              }'
          })"
          if [ -n "${TIMEOUT_SECONDS:-}" ]; then
            payload="$(
              jq \
                --argjson timeout_seconds "$TIMEOUT_SECONDS" \
                '.bootstrap.timeout_seconds = $timeout_seconds' \
                <<<"$payload"
            )"
          fi
          if [ -n "${HEALTH_TIMEOUT_SECONDS:-}" ]; then
            payload="$(
              jq \
                --argjson health_timeout_seconds "$HEALTH_TIMEOUT_SECONDS" \
                '.bootstrap.health_timeout_seconds = $health_timeout_seconds' \
                <<<"$payload"
            )"
          fi
          idempotency_key="$({
            printf '%s' \
              "odoo-stable-bootstrap:${PRODUCT}:${CONTEXT}:${INSTANCE}:" \
              "${VERIFY_HEALTH}:${VERIFY_CANONICAL}:${VERIFY_LOGO}:" \
              "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          })"
          status_code="$({
            curl -sS \
              -o odoo-stable-bootstrap.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: ${idempotency_key}" \
              --data "$payload" \
              "${LAUNCHPLANE_SERVICE_URL}/v1/drivers/odoo/stable-bootstrap"
          })"
          if [ "$status_code" != "202" ]; then
            echo 'Launchplane Odoo stable bootstrap operation create failed' \
              "with HTTP ${status_code}." >&2
            cat odoo-stable-bootstrap.json >&2
            exit 1
          fi
          poll_url="$(
            jq -r '.result.poll_url // empty' odoo-stable-bootstrap.json
          )"
          operation_id="$({
            jq -r \
              '.records.odoo_stable_bootstrap_operation_id //
               .result.operation_id //
               empty' \
              odoo-stable-bootstrap.json
          })"
          if [ -z "$poll_url" ] || [ -z "$operation_id" ]; then
            echo 'Odoo bootstrap response missing poll metadata.' >&2
            jq . odoo-stable-bootstrap.json >&2
            exit 1
          fi
          deadline=$((SECONDS + POLL_TIMEOUT_SECONDS))
          while true; do
            status_code="$({
              curl -sS \
                -o odoo-stable-bootstrap.json \
                -w '%{http_code}' \
                -H "Authorization: Bearer ${oidc_token}" \
                "${LAUNCHPLANE_SERVICE_URL}${poll_url}"
            })"
            if [ "$status_code" != "200" ]; then
              echo 'Launchplane Odoo stable bootstrap operation poll failed' \
                "with HTTP ${status_code}." >&2
              cat odoo-stable-bootstrap.json >&2
              exit 1
            fi
            operation_status="$(
              jq -r '.operation.status // empty' odoo-stable-bootstrap.json
            )"
            operation_phase="$(
              jq -r '.operation.phase // empty' odoo-stable-bootstrap.json
            )"
            echo 'Odoo stable bootstrap operation:' \
              "status=${operation_status} phase=${operation_phase}"
            if [ "$operation_status" = "pass" ] || \
              [ "$operation_status" = "fail" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'Launchplane Odoo stable bootstrap operation' \
                "${operation_id} timed out while polling." >&2
              jq . odoo-stable-bootstrap.json >&2
              exit 1
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
          jq . odoo-stable-bootstrap.json
          operation_status="$(
            jq -r '.operation.status // ""' odoo-stable-bootstrap.json
          )"
          bootstrap_status="$(
            jq -r \
              '.operation.result.bootstrap_status //
               .result.bootstrap_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          post_deploy_status="$(
            jq -r \
              '.operation.result.post_deploy_status //
               .result.post_deploy_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          health_status="$(
            jq -r \
              '.operation.result.health_status //
               .result.health_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          canonical_status="$(
            jq -r \
              '.operation.result.canonical_status //
               .result.canonical_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          logo_status="$(
            jq -r \
              '.operation.result.logo_status //
               .result.logo_status //
               ""' \
              odoo-stable-bootstrap.json
          )"
          if [ "$operation_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap operation did not pass:' \
              "${operation_status}." >&2
            jq -r \
              '.operation.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi
          if [ "$bootstrap_status" != "pass" ] || \
            [ "$post_deploy_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap did not pass:' >&2
            echo "bootstrap=${bootstrap_status}" \
              "post_deploy=${post_deploy_status}." >&2
            jq -r \
              '.operation.result.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi
          if [ "$VERIFY_HEALTH" = "true" ] && \
            [ "$health_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap health verification' \
              "did not pass: ${health_status}." >&2
            jq -r \
              '.operation.result.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi
          if [ "$VERIFY_CANONICAL" = "true" ] && \
            [ "$canonical_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap canonical verification' \
              "did not pass: ${canonical_status}." >&2
            jq -r \
              '.operation.result.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi
          if [ "$VERIFY_LOGO" = "true" ] && [ "$logo_status" != "pass" ]; then
            echo 'Launchplane Odoo stable bootstrap logo verification' \
              "did not pass: ${logo_status}." >&2
            jq -r \
              '.operation.result.error_message // .result.error_message // ""' \
              odoo-stable-bootstrap.json >&2
            exit 1
          fi

      - name: Upload bootstrap result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-stable-bootstrap-result
          path: odoo-stable-bootstrap.json
          if-no-files-found: ignore
