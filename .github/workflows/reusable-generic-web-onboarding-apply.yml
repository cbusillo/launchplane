---
name: Reusable Generic Web Onboarding Apply

"on":
  workflow_call:
    inputs:
      allocation_control:
        description: >-
          Closed allocation JSON: mode (readback or apply), optional original
          idempotency_key, retain_allocation, expected_allocation_custody_sha256.
          Including mode selects recovery without product-record apply.
        required: false
        default: ""
        type: string
      product:
        description: Product key from the reviewed plan.
        required: true
        type: string
      testing_context:
        description: Testing context from the reviewed plan.
        required: true
        type: string
      onboarding_plan_sha256:
        description: Product-record plan digest from the planning job.
        required: false
        default: ""
        type: string
      target_plan_sha256:
        description: Provider-target request digest from the planning job.
        required: true
        type: string
      reason:
        description: Operator reason from the reviewed dispatch.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: launchplane-authz-admin
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      ALLOCATION_CONTROL: ${{ inputs.allocation_control }}
      PRODUCT: ${{ inputs.product }}
      REASON: ${{ inputs.reason }}
      ONBOARDING_PLAN_SHA256: ${{ inputs.onboarding_plan_sha256 }}
      TARGET_PLAN_SHA256: ${{ inputs.target_plan_sha256 }}
      TESTING_CONTEXT: ${{ inputs.testing_context }}
    steps:
      - name: Download reviewed onboarding plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: generic-web-onboarding-plan
          path: .

      - name: Render apply requests
        id: requests
        shell: bash
        run: |
          set -euo pipefail
          idempotency_key="generic-web-onboarding:target:${PRODUCT}:${TESTING_CONTEXT}:v1"
          if ! jq -en --arg key "$idempotency_key" '$key | length > 0 and all(explode[]; . >= 32 and . != 127)' >/dev/null; then
            echo "Invalid original onboarding allocation key." >&2
            exit 1
          fi
          recovery=false
          mode=apply
          retain=false
          custody=""
          if [ -n "$ALLOCATION_CONTROL" ]; then
            jq -e '
              type == "object"
              and (keys - ["mode", "idempotency_key", "retain_allocation", "expected_allocation_custody_sha256"] | length == 0)
              and ((has("mode") | not) or .mode == "readback" or .mode == "apply")
              and (if has("idempotency_key") then (.idempotency_key | type == "string" and length > 0 and all(explode[]; . >= 32 and . != 127)) else true end)
              and (if has("retain_allocation") then (.retain_allocation | type == "boolean") else true end)
              and (if has("expected_allocation_custody_sha256") then (.expected_allocation_custody_sha256 | type == "string") else true end)
            ' <<< "$ALLOCATION_CONTROL" >/dev/null
            recovery="$(jq -r 'has("mode")' <<< "$ALLOCATION_CONTROL")"
            mode="$(jq -r '.mode // "apply"' <<< "$ALLOCATION_CONTROL")"
            idempotency_key="$(jq -r --arg key "$idempotency_key" '.idempotency_key // $key' <<< "$ALLOCATION_CONTROL")"
            retain="$(jq -r '.retain_allocation // false' <<< "$ALLOCATION_CONTROL")"
            custody="$(jq -r '.expected_allocation_custody_sha256 // ""' <<< "$ALLOCATION_CONTROL")"
          fi
          if [ "$retain" = true ]; then
            if [ "$recovery" != true ] || [ "$mode" != apply ] || ! [[ "$custody" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Retention requires apply and the reviewed custody digest." >&2
              exit 1
            fi
          elif [ -n "$custody" ]; then
            echo "A custody digest requires retain_allocation." >&2
            exit 1
          fi
          artifact_target_plan_sha256="$(sha256sum target-plan-request.json | awk '{print $1}')"
          if [ "$artifact_target_plan_sha256" != "$TARGET_PLAN_SHA256" ]; then
            echo "Reviewed provider plan digest does not match its artifact." >&2
            exit 1
          fi
          if [ "$recovery" = true ]; then
            jq -e --arg context "$TESTING_CONTEXT" '
              .operation == "create-application" and .instance == "testing"
              and .context == $context and ((.state_volume_path // "") == "")
            ' target-plan-request.json >/dev/null
          fi
          jq --arg mode "$mode" --arg reason "$REASON" \
            --argjson retain "$retain" --arg custody "$custody" '
            .mode=$mode | .confirmation=(if $mode == "apply" then "APPLY DOKPLOY TARGET SETUP" else "" end)
            | .reason=$reason
            | if $retain then .retain_allocation=true | .expected_allocation_custody_sha256=$custody else . end
          ' target-plan-request.json > target-apply-request.json
          printf 'idempotency_key=%s\nrecovery=%s\n' "$idempotency_key" "$recovery" >> "$GITHUB_OUTPUT"
          if [ "$recovery" = true ]; then
            exit 0
          fi
          artifact_onboarding_plan_sha256="$(jq -r '.result.plan_sha256 // empty' onboarding-plan.json)"
          if [ "$artifact_onboarding_plan_sha256" != "$ONBOARDING_PLAN_SHA256" ]; then
            echo "Reviewed onboarding plan digest does not match its artifact." >&2
            exit 1
          fi

      - name: Create Dokploy application target
        id: target-apply
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dc9fb481d20c6e9a6ccf62b20f5416b237d46191 # launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/dokploy-targets/setup
          payload-file: target-apply-request.json
          idempotency-key: ${{ steps.requests.outputs.idempotency_key }}
          expected-status: "202"
          fail-result-paths: ""
          response-output-file: target-apply.json

      - name: Render product records apply request
        if: steps.requests.outputs.recovery != 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_id="$(jq -r '.result.setup.target_id_record.target_id // empty' target-apply.json)"
          if [ -z "$target_id" ]; then
            echo "Dokploy target apply did not return target_id." >&2
            exit 1
          fi
          jq -n \
            --slurpfile intent generic-web-intent.json \
            --arg reviewed "$ONBOARDING_PLAN_SHA256" \
            --arg target_id "$target_id" \
            '{schema_version:1, product:"launchplane", mode:"apply",
              reviewed_plan_sha256:$reviewed, resolved_target_id:$target_id,
              generic_web:$intent[0]}' \
            > onboarding-apply-request.json

      - name: Apply product records
        if: steps.requests.outputs.recovery != 'true'
        id: onboarding-apply
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dc9fb481d20c6e9a6ccf62b20f5416b237d46191 # launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/product-onboarding/apply
          payload-file: onboarding-apply-request.json
          idempotency-key: >-
            ${{ format('generic-web-onboarding:records:{0}:{1}',
              inputs.product, inputs.onboarding_plan_sha256) }}
          expected-status: "202"
          fail-result-paths: ""
          response-output-file: onboarding-apply.json

      - name: Summarize applied onboarding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Generic-web onboarding apply"
            echo
            echo "- Product: $PRODUCT"
            echo "- Testing context: $TESTING_CONTEXT"
            echo "- Product plan: \`$ONBOARDING_PLAN_SHA256\`"
            echo "- Provider plan: \`$TARGET_PLAN_SHA256\`"
            if [ -f target-apply.json ]; then
              echo "- Provider target: $(jq -r '.result.setup.target_record.target_name // ""' target-apply.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload onboarding apply evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generic-web-onboarding-apply
          path: |
            target-apply.json
            onboarding-apply.json
          if-no-files-found: warn
          retention-days: 14
