---
name: Reusable Odoo Artifact Publish

"on":
  workflow_call:
    inputs:
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      instance:
        description: Odoo instance whose artifact should be published.
        required: true
        type: string
      product:
        description: Launchplane product profile key.
        required: true
        type: string
      product_repository:
        description: >-
          Optional expected source repository. Launchplane remains authoritative.
        required: false
        default: ""
        type: string
      source_git_ref:
        description: >-
          Source ref attached to the artifact. Defaults to the caller SHA.
        required: false
        default: ""
        type: string
      confirmation:
        description: Optional dispatch confirmation, unused by workflow callers.
        required: false
        default: ""
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "600000"
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
    secrets:
      ODOO_GHCR_PUBLISH_TOKEN:
        description: Token allowed to publish the tenant image to GHCR.
        required: true
      ODOO_SOURCE_GITHUB_TOKEN:
        description: Token allowed to fetch private Odoo source inputs.
        required: true
    outputs:
      artifact_id:
        description: Launchplane artifact ID recorded for the published image.
        value: ${{ jobs.artifact-publish.outputs.artifact_id }}
      image_digest:
        description: Immutable image digest recorded by Launchplane.
        value: ${{ jobs.artifact-publish.outputs.image_digest }}
      source_commit:
        description: Source commit recorded in the artifact manifest.
        value: ${{ jobs.artifact-publish.outputs.source_commit }}
  workflow_dispatch:
    inputs:
      product:
        description: Launchplane product profile key.
        required: true
        type: string
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      instance:
        description: Odoo instance whose artifact should be published.
        required: true
        type: string
      product_repository:
        description: Expected product source repository, formatted as owner/name.
        required: true
        type: string
      source_git_ref:
        description: Source ref or commit SHA attached to the artifact.
        required: true
        type: string
      confirmation:
        description: Type PUBLISH LAUNCHPLANE ODOO ARTIFACT to confirm.
        required: true
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "600000"
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  artifact-publish:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.launchplane.outputs.artifact_id }}
      image_digest: ${{ steps.launchplane.outputs.image_digest }}
      source_commit: ${{ steps.launchplane.outputs.source_commit }}
    steps:
      - name: Resolve artifact source
        id: source
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_SOURCE_GIT_REF: ${{ inputs.source_git_ref }}
          DEFAULT_SOURCE_GIT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_git_ref="$INPUT_SOURCE_GIT_REF"
          if [ -z "$source_git_ref" ]; then
            source_git_ref="$DEFAULT_SOURCE_GIT_REF"
          fi
          if [ -n "$CONFIRMATION" ]; then
            if [ "$CONFIRMATION" != "PUBLISH LAUNCHPLANE ODOO ARTIFACT" ]; then
              echo "confirmation must be PUBLISH LAUNCHPLANE ODOO ARTIFACT" >&2
              exit 1
            fi
            if [ -z "$INPUT_SOURCE_GIT_REF" ]; then
              echo "source_git_ref is required for Launchplane dispatch." >&2
              exit 1
            fi
          fi
          if [ -z "${source_git_ref// }" ]; then
            echo "source_git_ref is required." >&2
            exit 1
          fi
          echo "source_git_ref=$source_git_ref" >>"$GITHUB_OUTPUT"

      - name: Resolve Launchplane product
        id: product
        env:
          INPUT_PRODUCT: ${{ inputs.product }}
          CONTEXT_NAME: ${{ inputs.context }}
          INSTANCE_NAME: ${{ inputs.instance }}
        run: |
          set -euo pipefail
          product="$INPUT_PRODUCT"
          if [ -z "$product" ]; then
            echo "product is required." >&2
            exit 1
          fi
          publish_scope="${product}:${CONTEXT_NAME}:${INSTANCE_NAME}"
          run_scope="run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "product=$product" >>"$GITHUB_OUTPUT"
          {
            printf '%s=%s:%s:%s\n' \
              publish_inputs_idempotency_key \
              odoo-artifact-publish-inputs \
              "$publish_scope" \
              "$run_scope"
            printf '%s=%s:%s:%s\n' \
              publish_idempotency_key \
              odoo-artifact-publish \
              "$publish_scope" \
              "$run_scope"
          } >>"$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.ODOO_GHCR_PUBLISH_TOKEN }}

      - name: Resolve Launchplane publish inputs
        id: publish_inputs
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: /v1/drivers/odoo/artifact-publish-inputs
          payload: >-
            {"schema_version":1,"inputs":{"schema_version":1}}
          payload-fields: |-
            product=${{ steps.product.outputs.product }}
            inputs.context=${{ inputs.context }}
            inputs.instance=${{ inputs.instance }}
            inputs.source_git_ref=${{ steps.source.outputs.source_git_ref }}
          idempotency-key: >-
            ${{ steps.product.outputs.publish_inputs_idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: result.input_status
          response-output-file: >-
            ${{ runner.temp }}/${{ inputs.context }}-publish-inputs.json
          response-output-path: result
          output-paths: >-
            repository=result.repository,
            image_repository=result.image_repository,
            image_tag=result.image_tag,
            preview_slug=result.preview_slug,
            devkit_repository=result.devkit_repository,
            shared_addons_repository=result.shared_addons_repository

      - name: Validate Launchplane publish inputs
        env:
          EXPECTED_PRODUCT_REPOSITORY: ${{ inputs.product_repository }}
          RESOLVED_PRODUCT_REPOSITORY: ${{ steps.publish_inputs.outputs.repository }}
          RESOLVED_IMAGE_REPOSITORY: >-
            ${{ steps.publish_inputs.outputs.image_repository }}
          RESOLVED_IMAGE_TAG: ${{ steps.publish_inputs.outputs.image_tag }}
          RESOLVED_DEVKIT_REPOSITORY: >-
            ${{ steps.publish_inputs.outputs.devkit_repository }}
          RESOLVED_SHARED_ADDONS_REPOSITORY: >-
            ${{ steps.publish_inputs.outputs.shared_addons_repository }}
        run: |
          set -euo pipefail
          if ! [[ "$RESOLVED_PRODUCT_REPOSITORY" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "Launchplane publish inputs missing valid repository." >&2
            exit 1
          fi
          if [ -n "$EXPECTED_PRODUCT_REPOSITORY" ] \
            && [ "$EXPECTED_PRODUCT_REPOSITORY" != "$RESOLVED_PRODUCT_REPOSITORY" ]; then
            echo "product_repository does not match Launchplane product authority." >&2
            exit 1
          fi
          if [ -z "$RESOLVED_IMAGE_REPOSITORY" ]; then
            echo "Launchplane publish inputs missing image_repository." >&2
            exit 1
          fi
          if [ -z "$RESOLVED_IMAGE_TAG" ]; then
            echo "Launchplane publish inputs missing image_tag." >&2
            exit 1
          fi
          if ! [[ "$RESOLVED_DEVKIT_REPOSITORY" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "Launchplane publish inputs missing valid devkit_repository." >&2
            exit 1
          fi
          if ! [[ "$RESOLVED_SHARED_ADDONS_REPOSITORY" =~ ^[^/[:space:]]+/[^/[:space:]]+$ ]]; then
            echo "Launchplane publish inputs missing valid shared_addons_repository." >&2
            exit 1
          fi

      - name: Checkout tenant repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.publish_inputs.outputs.repository }}
          ref: ${{ steps.source.outputs.source_git_ref }}
          path: tenant
          token: ${{ secrets.ODOO_SOURCE_GITHUB_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout devkit repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.publish_inputs.outputs.devkit_repository }}
          path: odoo-devkit
          token: ${{ secrets.ODOO_SOURCE_GITHUB_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout shared addons repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.publish_inputs.outputs.shared_addons_repository }}
          path: odoo-shared-addons
          token: ${{ secrets.ODOO_SOURCE_GITHUB_TOKEN || github.token }}
          persist-credentials: false

      - name: Locate publish inputs file
        id: publish_inputs_file
        env:
          CONTEXT_NAME: ${{ inputs.context }}
        run: |
          inputs_file="$RUNNER_TEMP/${CONTEXT_NAME}-publish-inputs.json"
          echo "inputs_file=$inputs_file" >>"$GITHUB_OUTPUT"

      - name: Publish Odoo artifact image
        id: publish
        working-directory: tenant
        env:
          INSTANCE: ${{ inputs.instance }}
          RESOLVED_IMAGE_REPOSITORY: >-
            ${{ steps.publish_inputs.outputs.image_repository }}
          RESOLVED_IMAGE_TAG: ${{ steps.publish_inputs.outputs.image_tag }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.ODOO_GHCR_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ODOO_SOURCE_GITHUB_TOKEN: >-
            ${{ secrets.ODOO_SOURCE_GITHUB_TOKEN || github.token }}
          CONTEXT_NAME: ${{ inputs.context }}
          PUBLISH_INPUTS_FILE: >-
            ${{ steps.publish_inputs_file.outputs.inputs_file }}
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const path = process.env.PUBLISH_INPUTS_FILE;
            const payload = JSON.parse(fs.readFileSync(path, "utf8"));
            payload.environment = payload.environment || {};
            payload.environment.GITHUB_TOKEN =
              process.env.ODOO_SOURCE_GITHUB_TOKEN;
            fs.writeFileSync(path, `${JSON.stringify(payload)}\n`, "utf8");
          '
          export ODOO_DEVKIT_RUNTIME_ENVIRONMENT_JSON
          ODOO_DEVKIT_RUNTIME_ENVIRONMENT_JSON="$(cat "$PUBLISH_INPUTS_FILE")"
          output_file="$RUNNER_TEMP/${CONTEXT_NAME}-artifact.json"
          manifest_path="$PWD/workspace.toml"
          uv --directory ../odoo-devkit run platform runtime publish \
            --manifest "$manifest_path" \
            --instance "$INSTANCE" \
            --image-repository "$RESOLVED_IMAGE_REPOSITORY" \
            --image-tag "$RESOLVED_IMAGE_TAG" \
            --platform linux/amd64 \
            --output-file "$output_file"
          echo "manifest_file=$output_file" >>"$GITHUB_OUTPUT"

      - name: Record artifact in Launchplane
        id: launchplane
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: /v1/drivers/odoo/artifact-publish
          payload: >-
            {"schema_version":2,"publish":{"schema_version":2}}
          payload-fields: |-
            product=${{ steps.product.outputs.product }}
            publish.context=${{ inputs.context }}
            publish.instance=${{ inputs.instance }}
          payload-json-files: |-
            publish.manifest=${{ steps.publish.outputs.manifest_file }}
          idempotency-key: >-
            ${{ steps.product.outputs.publish_idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: result.status,result.publish_status
          output-paths: >-
            publish_status=result.status,
            artifact_id=result.artifact_id,
            image_repository=result.image_repository,
            image_digest=result.image_digest,
            source_commit=result.source_commit,
            error_message=result.error_message

      - name: Report result
        env:
          ARTIFACT_ID: ${{ steps.launchplane.outputs.artifact_id }}
          IMAGE_DIGEST: ${{ steps.launchplane.outputs.image_digest }}
          SOURCE_COMMIT: ${{ steps.launchplane.outputs.source_commit }}
        run: |
          echo "artifact_id=$ARTIFACT_ID"
          echo "image_digest=$IMAGE_DIGEST"
          echo "source_commit=$SOURCE_COMMIT"
