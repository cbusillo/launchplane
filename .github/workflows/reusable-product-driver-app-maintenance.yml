---
name: Reusable Product Driver App Maintenance

"on":
  workflow_call:
    inputs:
      product:
        description: Launchplane product key. Defaults to the caller repository name.
        required: false
        default: ""
        type: string
      driver:
        description: Product driver id. Defaults to verireel for backward compatibility.
        required: false
        default: verireel
        type: string
      context:
        description: Runtime context. Defaults to the product key.
        required: false
        default: ""
        type: string
      instance:
        description: Runtime instance for the maintenance action. Defaults to testing.
        required: false
        default: testing
        type: string
      action:
        description: Product driver maintenance action.
        required: true
        type: string
      intent:
        description: Product driver maintenance intent.
        required: true
        type: string
      email:
        description: Optional user email for user-scoped maintenance actions.
        required: false
        default: ""
        type: string
      application_name:
        description: Optional application name for preview maintenance actions.
        required: false
        default: ""
        type: string
      preview_slug:
        description: Optional preview slug for preview maintenance actions.
        required: false
        default: ""
        type: string
      idempotency_scope:
        description: Optional deployment or operation id appended to the request key.
        required: false
        default: ""
        type: string
      timeout-seconds:
        description: Maintenance action timeout in seconds.
        required: false
        default: "300"
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "1800000"
        type: string
      launchplane_url:
        description: Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string
    outputs:
      maintenance_status:
        description: Product driver maintenance status.
        value: ${{ jobs.app-maintenance.outputs.maintenance_status }}
      application_name:
        description: Application name used by the maintenance action.
        value: ${{ jobs.app-maintenance.outputs.application_name }}
      application_id:
        description: Application id used by the maintenance action.
        value: ${{ jobs.app-maintenance.outputs.application_id }}
      schedule_name:
        description: Schedule name used by the maintenance action.
        value: ${{ jobs.app-maintenance.outputs.schedule_name }}
      post_deploy_status:
        description: Odoo post-deploy status, when returned by the selected driver.
        value: ${{ jobs.app-maintenance.outputs.post_deploy_status }}
      override_status:
        description: Odoo override apply status, when returned by the selected driver.
        value: ${{ jobs.app-maintenance.outputs.override_status }}
      override_record_found:
        description: Whether an Odoo override record existed, when returned.
        value: ${{ jobs.app-maintenance.outputs.override_record_found }}
      override_payload_rendered:
        description: Whether an Odoo override payload was rendered, when returned.
        value: ${{ jobs.app-maintenance.outputs.override_payload_rendered }}
      website_bootstrap_included:
        description: Whether Odoo website bootstrap was included, when returned.
        value: ${{ jobs.app-maintenance.outputs.website_bootstrap_included }}
      applied_at:
        description: Odoo override apply timestamp, when returned.
        value: ${{ jobs.app-maintenance.outputs.applied_at }}
      error_message:
        description: Maintenance error message, when present.
        value: ${{ jobs.app-maintenance.outputs.error_message }}
      trace_id:
        description: Launchplane trace id for request debugging.
        value: ${{ jobs.app-maintenance.outputs.trace_id }}

permissions:
  contents: read
  id-token: write

jobs:
  app-maintenance:
    outputs:
      maintenance_status: ${{ steps.lp.outputs.maintenance_status }}
      application_name: ${{ steps.lp.outputs.application_name }}
      application_id: ${{ steps.lp.outputs.application_id }}
      schedule_name: ${{ steps.lp.outputs.schedule_name }}
      post_deploy_status: ${{ steps.lp.outputs.post_deploy_status }}
      override_status: ${{ steps.lp.outputs.override_status }}
      override_record_found: ${{ steps.lp.outputs.override_record_found }}
      override_payload_rendered: ${{ steps.lp.outputs.override_payload_rendered }}
      website_bootstrap_included: ${{ steps.lp.outputs.website_bootstrap_included }}
      applied_at: ${{ steps.lp.outputs.applied_at }}
      error_message: ${{ steps.lp.outputs.error_message }}
      trace_id: ${{ steps.lp.outputs.trace_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Launchplane app maintenance request
        id: request
        env:
          ACTION: ${{ inputs.action }}
          APPLICATION_NAME: ${{ inputs.application_name }}
          CONTEXT: ${{ inputs.context }}
          DRIVER: ${{ inputs.driver }}
          EMAIL: ${{ inputs.email }}
          IDEMPOTENCY_SCOPE: ${{ inputs.idempotency_scope }}
          INSTANCE: ${{ inputs.instance }}
          INTENT: ${{ inputs.intent }}
          PREVIEW_SLUG: ${{ inputs.preview_slug }}
          PRODUCT: ${{ inputs.product }}
          TIMEOUT_SECONDS: ${{ inputs['timeout-seconds'] }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCT" ]; then
            PRODUCT="${GITHUB_REPOSITORY#*/}"
          fi
          if [ -z "$CONTEXT" ]; then
            CONTEXT="$PRODUCT"
          fi
          case "$DRIVER" in
            verireel) route_path="/v1/drivers/verireel/app-maintenance" ;;
            odoo) route_path="/v1/drivers/odoo/app-maintenance" ;;
            *) echo "Unsupported product driver for app maintenance: $DRIVER" >&2; exit 1 ;;
          esac
          for required in DRIVER PRODUCT CONTEXT INSTANCE ACTION INTENT TIMEOUT_SECONDS; do
            if [ -z "${!required}" ]; then
              echo "${required} is required." >&2
              exit 1
            fi
          done
          case "$TIMEOUT_SECONDS" in
            ''|*[!0-9]*) echo "timeout-seconds must be a positive integer." >&2; exit 1 ;;
          esac
          if [ "$TIMEOUT_SECONDS" -lt 1 ]; then
            echo "timeout-seconds must be a positive integer." >&2
            exit 1
          fi
          if [ -n "$IDEMPOTENCY_SCOPE" ] && ! [[ "$IDEMPOTENCY_SCOPE" =~ ^[A-Za-z0-9._-]{1,200}$ ]]; then
            echo "idempotency_scope must use 1-200 letters, digits, dots, underscores, or hyphens." >&2
            exit 1
          fi
          idempotency_key="$(printf '%s:%s:%s:%s:%s:%s:%s:%s:%s:%s' \
            product-driver-app-maintenance \
            "$DRIVER" \
            "$PRODUCT" \
            "$CONTEXT" \
            "$INSTANCE" \
            "$ACTION" \
            "$INTENT" \
            "$EMAIL" \
            "$APPLICATION_NAME" \
            "$PREVIEW_SLUG")"
          if [ -n "$IDEMPOTENCY_SCOPE" ]; then
            idempotency_key="${idempotency_key}:${IDEMPOTENCY_SCOPE}"
          fi
          {
            echo "context=$CONTEXT"
            echo "idempotency_key=$idempotency_key"
            echo "instance=$INSTANCE"
            echo "product=$PRODUCT"
            echo "route_path=$route_path"
          } >>"$GITHUB_OUTPUT"

      - name: Request Launchplane app maintenance
        id: lp
        uses: cbusillo/launchplane/.github/actions/launchplane-request@adcf937c6aef14e02478724040852d1d2a82a850 # main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: ${{ steps.request.outputs.route_path }}
          payload: |-
            {
              "schema_version": 1,
              "maintenance": {
                "schema_version": 1
              }
            }
          payload-fields: |-
            product=${{ steps.request.outputs.product }}
            maintenance.context=${{ steps.request.outputs.context }}
            maintenance.instance=${{ steps.request.outputs.instance }}
            maintenance.action=${{ inputs.action }}
            maintenance.intent=${{ inputs.intent }}
            maintenance.email=${{ inputs.email }}
            maintenance.application_name=${{ inputs.application_name }}
            maintenance.preview_slug=${{ inputs.preview_slug }}
            maintenance.timeout_seconds=${{ inputs['timeout-seconds'] }}
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: result.maintenance_status
          output-paths: >-
            trace_id=trace_id,
            maintenance_status=result.maintenance_status,
            application_name=result.application_name,
            application_id=result.application_id,
            schedule_name=result.schedule_name,
            post_deploy_status=result.post_deploy_status,
            override_status=result.override_status,
            override_record_found=result.override_record_found,
            override_payload_rendered=result.override_payload_rendered,
            website_bootstrap_included=result.website_bootstrap_included,
            applied_at=result.applied_at,
            error_message=result.error_message
