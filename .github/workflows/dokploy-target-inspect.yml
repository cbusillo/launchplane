---
name: Dokploy Target Inspect

"on":
  workflow_dispatch:
    inputs:
      context:
        description: Launchplane target context for tracked target inspect.
        required: false
        default: ""
        type: string
      instance:
        description: Launchplane target instance for tracked target inspect.
        required: false
        default: ""
        type: string
      target_type:
        description: Explicit Dokploy target type when not inspecting a tracked route.
        required: false
        default: ""
        type: string
      target_id:
        description: Explicit Dokploy target id when not inspecting a tracked route.
        required: false
        default: ""
        type: string
      service:
        description: Optional exact compose service for bounded runtime evidence.
        required: false
        default: ""
        type: string
      event:
        description: Optional structured event name that must be observed for runtime proof.
        required: false
        default: ""
        type: string
      expected_image:
        description: Expected immutable image reference for runtime proof.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dokploy-target-inspect-${{ inputs.context }}-${{ inputs.instance }}-${{ inputs.target_type }}-${{ inputs.target_id }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CONTEXT: ${{ inputs.context }}
      INSTANCE: ${{ inputs.instance }}
      TARGET_TYPE: ${{ inputs.target_type }}
      TARGET_ID: ${{ inputs.target_id }}
      SERVICE: ${{ inputs.service }}
      EVENT: ${{ inputs.event }}
      EXPECTED_IMAGE: ${{ inputs.expected_image }}
    steps:
      - name: Validate inspect inputs
        shell: bash
        run: |
          set -euo pipefail
          has_route=false
          has_target=false
          if [ -n "$(printf '%s' "$CONTEXT$INSTANCE" | xargs)" ]; then
            has_route=true
          fi
          if [ -n "$(printf '%s' "$TARGET_TYPE$TARGET_ID" | xargs)" ]; then
            has_target=true
          fi
          if [ "$has_route" = true ] && [ "$has_target" = true ]; then
            echo "Use context/instance or target_type/target_id, not both." >&2
            exit 1
          fi
          if [ "$has_route" = true ]; then
            if [ -z "$(printf '%s' "$CONTEXT" | xargs)" ] \
              || [ -z "$(printf '%s' "$INSTANCE" | xargs)" ]; then
              echo "context and instance are both required for tracked inspect." >&2
              exit 1
            fi
          elif [ "$has_target" = true ]; then
            if [ -z "$(printf '%s' "$TARGET_TYPE" | xargs)" ] \
              || [ -z "$(printf '%s' "$TARGET_ID" | xargs)" ]; then
              echo "target_type and target_id are both required for explicit inspect." >&2
              exit 1
            fi
          else
            echo "context/instance or target_type/target_id is required." >&2
            exit 1
          fi
          if [ -n "$(printf '%s' "$EVENT" | xargs)" ] \
            && [ -z "$(printf '%s' "$SERVICE" | xargs)" ]; then
            echo "event requires an exact compose service." >&2
            exit 1
          fi
          if [ -n "$(printf '%s' "$SERVICE" | xargs)" ] \
            && [ -z "$(printf '%s' "$EXPECTED_IMAGE" | xargs)" ]; then
            echo "runtime proof requires the expected immutable image." >&2
            exit 1
          fi
          if [ -n "$(printf '%s' "$SERVICE" | xargs)" ] \
            && [ -z "$(printf '%s' "$EVENT" | xargs)" ]; then
            echo "runtime proof requires the structured event name." >&2
            exit 1
          fi

      - name: Build inspect request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          query="$(jq -rn \
            --arg context "$CONTEXT" \
            --arg instance "$INSTANCE" \
            --arg target_type "$TARGET_TYPE" \
            --arg target_id "$TARGET_ID" \
            --arg service "$SERVICE" \
            --arg event "$EVENT" \
            --arg expected_image "$EXPECTED_IMAGE" \
            'def encpair($key; $value):
              select(($value | length) > 0) | "\($key)=\($value | @uri)";
            [
              encpair("context"; $context),
              encpair("instance"; $instance),
              encpair("target_type"; $target_type),
              encpair("target_id"; $target_id),
              encpair("service"; $service),
              encpair("event"; $event),
              encpair("expected_image"; $expected_image)
            ] | join("&")')"
          echo "route_path=/v1/dokploy-targets/inspect?${query}" >> "$GITHUB_OUTPUT"

      - name: Inspect target
        id: inspect_request
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          method: GET
          route-path: ${{ steps.request.outputs.route_path }}
          fail-result-paths: ""
          response-output-file: dokploy-target-inspect-response.json

      - name: Check inspect response
        shell: bash
        env:
          STATUS_CODE: ${{ steps.inspect_request.outputs.status-code }}
        run: |
          set -euo pipefail
          response_file="dokploy-target-inspect-response.json"
          jq . "$response_file"
          if [ "$STATUS_CODE" != "200" ]; then
            echo "Dokploy target inspect failed with HTTP ${STATUS_CODE}." >&2
            exit 1
          fi
          if [ -n "$(printf '%s' "$SERVICE" | xargs)" ] \
            && [ "$(jq -r '.inspect.runtime_evidence.proof_ready // false' "$response_file")" != "true" ]; then
            echo "Dokploy target runtime evidence is not proof-ready." >&2
            exit 1
          fi

      - name: Upload inspect evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dokploy-target-inspect
          path: dokploy-target-inspect-response.json
          if-no-files-found: warn

      - name: Summarize inspect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Dokploy target inspect"
            echo
            if [ -f dokploy-target-inspect-response.json ]; then
              jq '{
                status,
                trace_id,
                target: .inspect.tracked_target,
                provider_target_record: .inspect.provider_target_record,
                provider: .inspect.provider,
                runtime_evidence: .inspect.runtime_evidence
              }' dokploy-target-inspect-response.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
