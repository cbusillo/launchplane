---
name: Product Preview TLS

"on":
  workflow_dispatch:
    inputs:
      product:
        description: Existing Launchplane product profile key to update.
        required: true
        type: string
      mode:
        description: Plan the change or apply a reviewed plan.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      domain_certificate_type:
        description: Provider certificate policy for preview domains.
        required: true
        default: none
        type: choice
        options:
          - none
          - letsencrypt
      reviewed_plan_sha256:
        description: Plan SHA-256 from the reviewed dry run; required for apply.
        required: false
        default: ""
        type: string
      confirmation:
        description: Type APPLY PRODUCT PREVIEW TLS when mode is apply.
        required: false
        default: ""
        type: string
      reason:
        description: Operator reason recorded with the request.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: product-preview-tls-${{ inputs.product }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      LAUNCHPLANE_URL: ${{ vars.LAUNCHPLANE_PUBLIC_URL }}
      PRODUCT: ${{ inputs.product }}
      MODE: ${{ inputs.mode }}
      DOMAIN_CERTIFICATE_TYPE: ${{ inputs.domain_certificate_type }}
      REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCT:?Missing product input}"
          if [[ -z "${REASON//[[:space:]]/}" ]]; then
            echo "reason is required." >&2
            exit 1
          fi
          if [ "$MODE" = "dry-run" ]; then
            if [[ -n "${REVIEWED_PLAN_SHA256//[[:space:]]/}" ]]; then
              echo "reviewed_plan_sha256 must be empty for dry-run." >&2
              exit 1
            fi
            exit 0
          fi
          if [ "$CONFIRMATION" != "APPLY PRODUCT PREVIEW TLS" ]; then
            echo "Exact confirmation text is required for apply." >&2
            exit 1
          fi
          if ! [[ "$REVIEWED_PLAN_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "apply requires the reviewed dry-run plan SHA-256." >&2
            exit 1
          fi

      - name: Build preview TLS request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file="${RUNNER_TEMP}/product-preview-tls-request.json"
          jq -n \
            --arg product "$PRODUCT" \
            --arg mode "$MODE" \
            --arg domain_certificate_type "$DOMAIN_CERTIFICATE_TYPE" \
            --arg reviewed_plan_sha256 "$REVIEWED_PLAN_SHA256" \
            --arg reason "$REASON" \
            '{
              schema_version: 1,
              product: $product,
              mode: $mode,
              domain_certificate_type: $domain_certificate_type,
              reviewed_plan_sha256: $reviewed_plan_sha256,
              reason: $reason
            }' > "$request_file"
          idempotency_key=""
          if [ "$MODE" = "apply" ]; then
            idempotency_key="product-preview-tls:${PRODUCT}:apply:${GITHUB_RUN_ID}"
          fi
          {
            echo "request_file=$request_file"
            echo "idempotency_key=$idempotency_key"
          } >> "$GITHUB_OUTPUT"

      - name: Request product preview TLS operation
        id: preview_tls_request
        uses: cbusillo/launchplane/.github/actions/launchplane-request@dcfe6fb13cdd5f7c66428ce9ef108ebbe215fff5 # launchplane-request
        with:
          launchplane-url: ${{ env.LAUNCHPLANE_URL }}
          audience: ${{ vars.LAUNCHPLANE_SERVICE_AUDIENCE }}
          route-path: /v1/product-profiles/preview-tls/apply
          payload-file: ${{ steps.request.outputs.request_file }}
          idempotency-key: ${{ steps.request.outputs.idempotency_key }}
          fail-result-paths: ""
          response-output-file: product-preview-tls.json

      - name: Check product preview TLS response
        shell: bash
        env:
          STATUS_CODE: ${{ steps.preview_tls_request.outputs.status-code }}
        run: |
          set -euo pipefail
          if [ "$STATUS_CODE" != "202" ]; then
            jq '{status, trace_id, error}' product-preview-tls.json >&2 || true
            echo "Product preview TLS request failed with HTTP ${STATUS_CODE}." >&2
            exit 1
          fi
          jq . product-preview-tls.json

      - name: Upload product preview TLS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-preview-tls-result
          path: product-preview-tls.json
          if-no-files-found: warn

      - name: Summarize product preview TLS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Product preview TLS"
            echo
            echo "- Product: ${PRODUCT}"
            echo "- Mode: ${MODE}"
            echo "- Requested certificate type: ${DOMAIN_CERTIFICATE_TYPE}"
            echo "- Evidence artifact: product-preview-tls-result"
            if [ -f product-preview-tls.json ]; then
              echo "- Status: $(jq -r '.status // "unknown"' product-preview-tls.json)"
              echo "- Trace: $(jq -r '.trace_id // ""' product-preview-tls.json)"
              echo "- Current certificate type: $(jq -r '.result.current_value // ""' product-preview-tls.json)"
              echo "- Changed: $(jq -r '.result.changed // false' product-preview-tls.json)"
              echo "- Applied: $(jq -r '.result.applied // false' product-preview-tls.json)"
              echo "- Profile updated before: $(jq -r '.result.profile_updated_at_before // ""' product-preview-tls.json)"
              echo "- Profile updated after: $(jq -r '.result.profile_updated_at_after // ""' product-preview-tls.json)"
              echo "- Plan SHA-256: $(jq -r '.result.plan_sha256 // ""' product-preview-tls.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
