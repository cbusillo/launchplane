---
name: Reusable Product Repo Config Authority

"on":
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run the audit and parse the product's supported syntax.
        required: false
        default: "3.13"
        type: string
      fail-on-findings:
        description: Exit non-zero when the product-repo gate rejects findings.
        required: false
        default: true
        type: boolean
      launchplane-revision:
        description: Immutable Launchplane commit that contains this reusable workflow.
        required: true
        type: string
      runs_on:
        description: JSON encoded GitHub Actions runner selector.
        required: false
        default: '"ubuntu-latest"'
        type: string

permissions:
  contents: read

jobs:
  launchplane-config-authority:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Check out product repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product-repo
          fetch-depth: 0

      - name: Validate Launchplane audit tool revision
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          LAUNCHPLANE_REVISION: ${{ inputs.launchplane-revision }}
        run: |
          if [[ ! "${LAUNCHPLANE_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "launchplane-revision must be a 40-character commit SHA" >&2
            exit 1
          fi
          if ! workflow_sha="$(
            jq -er \
              '.workflow_sha | select(type == "string" and length == 40 and test("^[0-9a-f]+$"))' \
              <<< "${JOB_CONTEXT_JSON}"
          )"; then
            echo "GitHub job context did not provide the called workflow commit SHA" >&2
            exit 1
          fi
          if [[ "${LAUNCHPLANE_REVISION}" != "${workflow_sha}" ]]; then
            echo "launchplane-revision must match the called workflow commit SHA" >&2
            exit 1
          fi

      - name: Check out Launchplane audit tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cbusillo/launchplane
          ref: ${{ inputs.launchplane-revision }}
          path: launchplane
          fetch-depth: 1

      # uv provides Python so the gate also runs on self-hosted runners whose
      # OS actions/setup-python has no build for.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: Run Launchplane config authority gate
        working-directory: launchplane
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          AUDIT_PYTHON_VERSION: ${{ inputs.python-version }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|merge_group|push) ;;
            *) echo "No explicit commit-pair mapping for ${EVENT_NAME}; use the CLI with an explicit pair or full-audit." >&2; exit 1 ;;
          esac
          if [[ "$EVENT_NAME" = push ]]; then
            default_branch="${DEFAULT_BRANCH:-}"
            event_ref="${EVENT_REF:-}"
            repository="$(printf '%s' "${GITHUB_REPOSITORY:-}" | tr '[:upper:]' '[:lower:]')"
            train_prefix="refs/heads/launchplane/train/${repository}/${default_branch//\//-}/"
          fi
          if [[ "$EVENT_NAME" = push && ( "$BASE_SHA" = 0000000000000000000000000000000000000000 || "$event_ref" = refs/heads/launchplane/train/* ) ]]; then
            if [[ -z "$default_branch" || -z "$repository" || "$event_ref" != "$train_prefix"* || "$event_ref" = "$train_prefix" || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ || "$HEAD_SHA" =~ ^0+$ ]]; then
              echo "Train comparison requires a default-branch train candidate and a nonzero head SHA." >&2
              exit 1
            fi
            if ! git -C ../product-repo cat-file -e "${HEAD_SHA}^{commit}"; then
              git -C ../product-repo fetch --no-tags origin "$HEAD_SHA"
            fi
            git -C ../product-repo fetch --no-tags origin "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
            if [[ "$(git -C ../product-repo rev-parse --is-shallow-repository)" != false ]]; then
              echo "Train comparison requires complete commit history." >&2
              exit 1
            fi
            comparison_dir="$(mktemp -d)"
            trap 'rm -rf "$comparison_dir"' EXIT
            # Intersect first-parent histories, preserving candidate order. A
            # normal merge-base can select a PR head after another landing;
            # HEAD^1 would omit earlier entries in a multi-PR candidate.
            # Updates must also recover the original base: the previous
            # candidate can have the same tree as its reconstructed successor.
            git -C ../product-repo rev-list --first-parent "refs/remotes/origin/${default_branch}" > "$comparison_dir/base"
            git -C ../product-repo rev-list --first-parent "$HEAD_SHA" > "$comparison_dir/head"
            BASE_SHA="$(awk 'NR == FNR { base[$0] = 1; next } ($0 in base) && !found { print; found = 1 }' "$comparison_dir/base" "$comparison_dir/head")"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" = "$HEAD_SHA" ]]; then
              echo "Train candidate has no distinct verified first-parent base." >&2
              exit 1
            fi
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ || "$HEAD_SHA" =~ ^0+$ ]]; then
            echo "Comparison requires two full, nonzero commit SHAs." >&2
            exit 1
          fi
          for revision in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git -C ../product-repo cat-file -e "${revision}^{commit}"; then
              git -C ../product-repo fetch --no-tags origin "$revision"
            fi
          done
          args=(
            uv run --python "$AUDIT_PYTHON_VERSION" launchplane service audit-config-authority
            --control-plane-root ../product-repo
            --mode changed-files-gate
            --base-sha "$BASE_SHA"
            --head-sha "$HEAD_SHA"
            --gate-profile product-repo
          )
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then
            args+=(--fail-on-findings)
          fi
          "${args[@]}"
