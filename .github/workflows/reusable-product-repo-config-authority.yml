---
name: Reusable Product Repo Config Authority

"on":
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run the Launchplane audit tool.
        required: false
        default: "3.13"
        type: string
      fail-on-findings:
        description: Exit non-zero when the product-repo gate rejects findings.
        required: false
        default: true
        type: boolean
      launchplane-revision:
        description: Immutable Launchplane commit that contains this reusable workflow.
        required: true
        type: string
      runs_on:
        description: JSON encoded GitHub Actions runner selector.
        required: false
        default: '"ubuntu-latest"'
        type: string

permissions:
  contents: read

jobs:
  launchplane-config-authority:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Check out product repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product-repo
          fetch-depth: 0

      - name: Validate Launchplane audit tool revision
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          LAUNCHPLANE_REVISION: ${{ inputs.launchplane-revision }}
        run: |
          if [[ ! "${LAUNCHPLANE_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "launchplane-revision must be a 40-character commit SHA" >&2
            exit 1
          fi
          if ! workflow_sha="$(
            jq -er \
              '.workflow_sha | select(type == "string" and length == 40 and test("^[0-9a-f]+$"))' \
              <<< "${JOB_CONTEXT_JSON}"
          )"; then
            echo "GitHub job context did not provide the called workflow commit SHA" >&2
            exit 1
          fi
          if [[ "${LAUNCHPLANE_REVISION}" != "${workflow_sha}" ]]; then
            echo "launchplane-revision must match the called workflow commit SHA" >&2
            exit 1
          fi

      - name: Check out Launchplane audit tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cbusillo/launchplane
          ref: ${{ inputs.launchplane-revision }}
          path: launchplane
          fetch-depth: 1

      # uv provides Python so the gate also runs on self-hosted runners whose
      # OS actions/setup-python has no build for.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: Run Launchplane config authority gate
        working-directory: launchplane
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Changed-files authority gate applies only to pull-request commit pairs; skipping ${EVENT_NAME}."
            exit 0
          fi
          args=(
            uv run launchplane service audit-config-authority
            --control-plane-root ../product-repo
            --mode changed-files-gate
            --base-sha "$BASE_SHA"
            --head-sha "$HEAD_SHA"
            --gate-profile product-repo
          )
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then
            args+=(--fail-on-findings)
          fi
          "${args[@]}"
