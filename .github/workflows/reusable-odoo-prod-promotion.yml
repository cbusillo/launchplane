---
name: Reusable Odoo Prod Promotion

"on":
  workflow_call:
    inputs:
      context:
        description: Launchplane Odoo context.
        required: true
        type: string
      product:
        description: Launchplane product key.
        required: true
        type: string
      timeout-ms:
        description: Launchplane request timeout in milliseconds.
        required: false
        default: "2700000"
        type: string
      launchplane_url:
        description: >-
          Launchplane service URL. Defaults to LAUNCHPLANE_PUBLIC_URL.
        required: false
        default: ""
        type: string
      launchplane_audience:
        description: >-
          Optional GitHub OIDC audience. Defaults to the service URL host.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  prod-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Launchplane product
        id: product
        env:
          CONTEXT_NAME: ${{ inputs.context }}
          PRODUCT_INPUT: ${{ inputs.product }}
        run: |
          set -euo pipefail
          product="$PRODUCT_INPUT"
          if [ -z "$product" ]; then
            echo "product is required." >&2
            exit 1
          fi
          {
            echo "product=$product"
            printf '%s=%s:%s:%s\n' \
              idempotency_key \
              opp \
              "$CONTEXT_NAME" \
              "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          } >>"$GITHUB_OUTPUT"

      - name: Request Launchplane Odoo prod promotion
        id: lp
        uses: cbusillo/launchplane/.github/actions/launchplane-request@main
        with:
          launchplane-url: >-
            ${{ inputs.launchplane_url || vars.LAUNCHPLANE_PUBLIC_URL }}
          audience: ${{ inputs.launchplane_audience }}
          route-path: /v1/drivers/odoo/prod-promotion-run
          payload: >-
            {"schema_version":1,"run":{"schema_version":1}}
          payload-fields: |-
            product=${{ steps.product.outputs.product }}
            run.context=${{ inputs.context }}
            run.request_id=${{ github.run_id }}-${{ github.run_attempt }}
          idempotency-key: >-
            ${{ steps.product.outputs.idempotency_key }}
          timeout-ms: ${{ inputs['timeout-ms'] }}
          fail-result-paths: >-
            result.run_status,result.promotion_status,
            result.deployment_status,result.post_deploy_status,
            result.destination_health_status
          output-paths: >-
            trace_id=trace_id,
            backup_record_id=result.backup_record_id,
            backup_status=result.backup_status,
            promotion_record_id=result.promotion_record_id,
            deployment_record_id=result.deployment_record_id,
            release_tuple_id=result.release_tuple_id,
            promotion_status=result.promotion_status,
            deployment_status=result.deployment_status,
            post_deploy_status=result.post_deploy_status,
            destination_health_status=result.destination_health_status,
            error_message=result.error_message

      - name: Report result
        env:
          BACKUP_RECORD_ID: ${{ steps.lp.outputs.backup_record_id }}
          BACKUP_STATUS: ${{ steps.lp.outputs.backup_status }}
          DEPLOYMENT_RECORD_ID: ${{ steps.lp.outputs.deployment_record_id }}
          DESTINATION_HEALTH_STATUS: >-
            ${{ steps.lp.outputs.destination_health_status }}
          PROMOTION_RECORD_ID: ${{ steps.lp.outputs.promotion_record_id }}
          PROMOTION_STATUS: ${{ steps.lp.outputs.promotion_status }}
          RELEASE_TUPLE_ID: ${{ steps.lp.outputs.release_tuple_id }}
        run: |
          echo "backup_record_id=$BACKUP_RECORD_ID"
          echo "backup_status=$BACKUP_STATUS"
          echo "promotion_record_id=$PROMOTION_RECORD_ID"
          echo "deployment_record_id=$DEPLOYMENT_RECORD_ID"
          echo "release_tuple_id=$RELEASE_TUPLE_ID"
          echo "promotion_status=$PROMOTION_STATUS"
          echo "destination_health_status=$DESTINATION_HEALTH_STATUS"
