---
name: Launchplane request
description: Send an OIDC-authenticated JSON request to Launchplane.

inputs:
  launchplane-url:
    description: Base URL for the Launchplane service.
    required: true
  route-path:
    description: >-
      Absolute Launchplane API route path, such as
      /v1/drivers/generic-web/deploy.
    required: true
  payload:
    description: Inline JSON request payload.
    required: false
    default: ""
  payload-file:
    description: >-
      Path to a JSON request payload file. Used when payload is empty.
    required: false
    default: ""
  payload-list-file:
    description: >-
      Path to a JSON array of request payload objects to send sequentially.
      Used for bounded fan-out operations such as PR feedback.
    required: false
    default: ""
  payload-fields:
    description: >-
      Newline-separated JSON path assignments to overlay onto the payload after
      reading payload or payload-file. Values are treated as strings unless they
      are valid JSON literals or objects. Example: request.reason=manual.
    required: false
    default: ""
  payload-json-files:
    description: >-
      Newline-separated JSON path assignments to overlay onto the payload after
      payload-fields. Assignment values are local file paths whose parsed JSON
      contents are written at the target path. Example:
      publish.manifest=artifact.json.
    required: false
    default: ""
  method:
    description: HTTP method to use.
    required: false
    default: POST
  audience:
    description: GitHub OIDC audience. Defaults to the Launchplane URL host.
    required: false
    default: ""
  idempotency-key:
    description: Stable idempotency key for mutation requests.
    required: false
    default: ""
  idempotency-key-prefix:
    description: >-
      Stable prefix for payload-list-file requests. The action appends each
      payload digest to create per-request idempotency keys.
    required: false
    default: ""
  timeout-ms:
    description: >-
      Launchplane request timeout in milliseconds. Use 0 to disable.
    required: false
    default: "0"
  oidc-timeout-ms:
    description: >-
      GitHub OIDC token request timeout in milliseconds. Use 0 to disable.
    required: false
    default: "30000"
  retry-attempts:
    description: >-
      Number of network retry attempts for OIDC and Launchplane calls.
    required: false
    default: "3"
  retry-delay-ms:
    description: Base retry delay in milliseconds.
    required: false
    default: "250"
  expected-status:
    description: >-
      Comma-separated HTTP status codes that should be accepted for the
      Launchplane request. Defaults to any 2xx status.
    required: false
    default: ""
  poll-result-path:
    description: >-
      JSON path to inspect after each Launchplane response. When set, the action
      repeats the request while the value matches poll-result-statuses.
    required: false
    default: ""
  poll-result-statuses:
    description: >-
      Comma-separated result status values that should keep polling.
    required: false
    default: pending
  poll-until-path:
    description: >-
      JSON path to inspect after each Launchplane response. When set, the action
      repeats the request until the value equals poll-until-value.
    required: false
    default: ""
  poll-until-value:
    description: Expected string value for poll-until-path.
    required: false
    default: ""
  poll-retry-on-request-error:
    description: >-
      When true, continue polling through Launchplane request network errors
      until poll-timeout-ms expires.
    required: false
    default: "false"
  poll-retry-on-unexpected-status:
    description: >-
      When true with poll-until-path, continue polling through non-2xx
      Launchplane responses until poll-timeout-ms expires.
    required: false
    default: "false"
  poll-interval-ms:
    description: Delay between polling requests in milliseconds.
    required: false
    default: "30000"
  poll-timeout-ms:
    description: Maximum polling duration in milliseconds.
    required: false
    default: "600000"
  fail-result-statuses:
    description: >-
      Comma-separated result status values that should fail the action.
    required: false
    default: fail,blocked
  fail-result-paths:
    description: >-
      Comma-separated JSON paths to inspect for fail-result-statuses.
    required: false
    default: >-
      result.refresh_status,result.deploy_status,result.rollout_status,
      result.migration_status,result.health_status
  output-paths:
    description: >-
      Comma-separated output=json.path mappings to expose as action outputs.
    required: false
    default: ""
  response-output-file:
    description: >-
      Optional file path where a response JSON value should be written.
    required: false
    default: ""
  response-output-path:
    description: >-
      JSON path to write to response-output-file. Defaults to the full response.
    required: false
    default: ""
  log-response-body:
    description: Write the Launchplane response body to stdout.
    required: false
    default: "true"

outputs:
  launchplane-url:
    description: Fully resolved Launchplane request URL.
  route-path:
    description: Launchplane route path called by the action.
  audience:
    description: GitHub OIDC audience used for the request.
  status-code:
    description: HTTP status code returned by Launchplane.
  response-body:
    description: Raw Launchplane response body.
  applied_at:
    description: Dynamic output exposed by output-paths.
  artifact_id:
    description: Dynamic output exposed by output-paths.
  backup_record_id:
    description: Dynamic output exposed by output-paths.
  backup_status:
    description: Dynamic output exposed by output-paths.
  deployment_record_id:
    description: Dynamic output exposed by output-paths.
  deployment_health_status:
    description: Dynamic output exposed by output-paths.
  deployment_status:
    description: Dynamic output exposed by output-paths.
  deploy_status:
    description: Dynamic output exposed by output-paths.
  destination_health_status:
    description: Dynamic output exposed by output-paths.
  error_message:
    description: Dynamic output exposed by output-paths.
  authz_policy_schema_version:
    description: Dynamic output exposed by output-paths.
  authz_policy_sha256:
    description: Dynamic output exposed by output-paths.
  image_digest:
    description: Dynamic output exposed by output-paths.
  image_repository:
    description: Dynamic output exposed by output-paths.
  image_tag:
    description: Dynamic output exposed by output-paths.
  inventory_record_id:
    description: Dynamic output exposed by output-paths.
  generic_web_rollback_plan_id:
    description: Dynamic output exposed by output-paths.
  operation_id:
    description: Dynamic output exposed by output-paths.
  override_payload_rendered:
    description: Dynamic output exposed by output-paths.
  override_record_found:
    description: Dynamic output exposed by output-paths.
  override_status:
    description: Dynamic output exposed by output-paths.
  poll_url:
    description: Dynamic output exposed by output-paths.
  post_deploy_status:
    description: Dynamic output exposed by output-paths.
  preview_slug:
    description: Dynamic output exposed by output-paths.
  promotion_record_id:
    description: Dynamic output exposed by output-paths.
  promotion_health_status:
    description: Dynamic output exposed by output-paths.
  promotion_status:
    description: Dynamic output exposed by output-paths.
  publish_status:
    description: Dynamic output exposed by output-paths.
  release_tuple_id:
    description: Dynamic output exposed by output-paths.
  rollback_health_status:
    description: Dynamic output exposed by output-paths.
  rollback_status:
    description: Dynamic output exposed by output-paths.
  source_commit:
    description: Dynamic output exposed by output-paths.
  source_repository:
    description: Dynamic output exposed by output-paths.
  trace_id:
    description: Dynamic output exposed by output-paths.
  website_bootstrap_included:
    description: Dynamic output exposed by output-paths.

runs:
  using: node24
  main: dist/index.js
