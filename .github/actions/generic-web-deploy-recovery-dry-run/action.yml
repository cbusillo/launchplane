---
name: Generic-web deploy recovery
description: Inspect or apply one exact generic-web deploy recovery through Launchplane.

inputs:
  launchplane-url:
    description: >-
      Optional base URL for the Launchplane service. When omitted, request-json
      must include launchplane_url.
    required: false
    default: ""
  request-json:
    description: >-
      Optional exact original deploy coordinates and operator reason as JSON
      for dry-run or provider-evidence mode only. When omitted, the action
      downloads and validates the approved digest-bound apply artifact for the
      current workflow_run event.
    required: false
    default: ""
  mode:
    description: >-
      Empty for dry-run or digest-bound apply; provider-evidence for the
      advisory exact provider evidence read.
    required: false
    default: ""
  expected-product:
    description: Expected Launchplane product for artifact-backed apply mode.
    required: false
    default: ""
  expected-instance:
    description: Expected Launchplane instance for artifact-backed apply mode.
    required: false
    default: ""
  workflow-run-id:
    description: Source workflow run containing the approved apply request artifact.
    required: false
    default: ${{ github.event.workflow_run.id }}
  github-token:
    description: GitHub token used only to download the source workflow artifact.
    required: false
    default: ${{ github.token }}
  audience:
    description: Optional GitHub OIDC audience. Defaults to the service URL host.
    required: false
    default: ""
  timeout-ms:
    description: Launchplane request timeout in milliseconds.
    required: false
    default: "120000"

outputs:
  status:
    description: Apply request status when a reviewed digest is supplied.
  mode:
    description: Recovery response mode.
  trace_id:
    description: Launchplane trace identifier for apply.
  recovery_digest:
    description: Canonical digest binding the observed recovery plan.
  proposed_action:
    description: Recovery action proposed by Launchplane.
  reservation_state:
    description: Current durable reservation state.
  reservation_attempt:
    description: Existing reservation attempt for apply.
  recovery_action:
    description: Applied recovery action.
  provider_outcome:
    description: Bounded provider inspection outcome.
  provider_status:
    description: Bounded provider status.
  retry_safe:
    description: Whether retrying the original operation is safe.
  observed_at:
    description: Timestamp for the dry-run observation.
  provider_evidence:
    description: Bounded provider evidence classification in provider-evidence mode.
  provider_read_error_class:
    description: Bounded provider read error class in provider-evidence mode.

runs:
  using: node24
  main: dist/index.mjs
