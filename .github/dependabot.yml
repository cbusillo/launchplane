---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    groups:
      routine-version-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
    labels:
      - dependencies
      - python:uv
    groups:
      routine-version-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
