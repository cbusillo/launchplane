---
version: 2

updates:
  - package-ecosystem: github-actions
    # Covers third-party Actions. Same-repository first-party action pins are
    # enforced and updated through `launchplane action-pins` instead.
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    groups:
      routine-version-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
    labels:
      - dependencies
      - python:uv
    groups:
      ruff-version-updates:
        patterns:
          - ruff
        update-types:
          - minor
          - patch
      mypy-version-updates:
        patterns:
          - mypy
        update-types:
          - minor
          - patch
      routine-version-updates:
        patterns:
          - "*"
        exclude-patterns:
          - ruff
          - mypy
        update-types:
          - minor
          - patch
